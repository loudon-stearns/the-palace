 stroke-width="1.4"/><text x="696.0" y="170.0" font-size="13" fill="#1a1916" text-anchor="middle" font-weight="700" >VCF</text><circle cx="662" cy="202" r="8" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><text x="676.0" y="206.0" font-size="11" fill="#3a3a35" text-anchor="start" font-weight="400" >IN</text><circle cx="662" cy="278" r="8" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><text x="676.0" y="282.0" font-size="11" fill="#3a3a35" text-anchor="start" font-weight="400" >CUTOFF</text><circle cx="730" cy="240" r="8" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><text x="716.0" y="244.0" font-size="11" fill="#3a3a35" text-anchor="end" font-weight="400" >OUT</text><rect x="798" y="146" width="104" height="156" fill="#dcd9ca" stroke="#1a1916" stroke-width="1.4"/><text x="850.0" y="170.0" font-size="13" fill="#1a1916" text-anchor="middle" font-weight="700" >VCA</text><circle cx="816" cy="202" r="8" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><text x="830.0" y="206.0" font-size="11" fill="#3a3a35" text-anchor="start" font-weight="400" >IN</text><circle cx="816" cy="240" r="8" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><text x="830.0" y="244.0" font-size="11" fill="#3a3a35" text-anchor="start" font-weight="400" >CV</text><circle cx="884" cy="278" r="8" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><text x="870.0" y="282.0" font-size="11" fill="#3a3a35" text-anchor="end" font-weight="400" >OUT</text><path d="M576,202 C619.0,232 619.0,232 662,202" fill="none" stroke="#1a1916" stroke-width="3.4" stroke-linecap="round"/><circle cx="576" cy="202" r="4" fill="#1a1916"/><circle cx="662" cy="202" r="4" fill="#1a1916"/><path d="M730,240 C773.0,270 773.0,232 816,202" fill="none" stroke="#1a1916" stroke-width="3.4" stroke-linecap="round"/><circle cx="730" cy="240" r="4" fill="#1a1916"/><circle cx="816" cy="202" r="4" fill="#1a1916"/><text x="40.0" y="100.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">WITHOUT A REGISTRY</text><text x="40.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >the patch loads; its cables name ports that do not exist</text><text x="490.0" y="100.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">WITH ONE</text><text x="490.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >only what exists can be written</text><line x1="470" y1="84" x2="470" y2="360" stroke="#b8b09a"/><text x="40.0" y="392.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >Without a registry, a model writing a patch “will invent port names, module slugs, and parameter IDs that don't</text><text x="40.0" y="410.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >exist. The patch loads — but cables point nowhere.”</text><text x="40.0" y="433.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >The modules, their ports and the two invented names are my examples. The page lists none.</text></svg>