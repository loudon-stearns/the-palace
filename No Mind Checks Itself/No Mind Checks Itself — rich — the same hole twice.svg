<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 452" width="920" height="452" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">THE SAME HOLE TWICE</text><text x="40.0" y="100.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">CHECKING YOUR OWN WORK</text><text x="40.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >one mind: the same hole every time</text><rect x="110" y="130" width="26" height="190" fill="#dcd9ca" stroke="#1a1916" stroke-width="1.3"/><rect x="109" y="202" width="28" height="26" fill="#f0eee5" stroke="#1a1916" stroke-width="1.3"/><rect x="200" y="130" width="26" height="190" fill="#dcd9ca" stroke="#1a1916" stroke-width="1.3"/><rect x="199" y="202" width="28" height="26" fill="#f0eee5" stroke="#1a1916" stroke-width="1.3"/><rect x="290" y="130" width="26" height="190" fill="#dcd9ca" stroke="#1a1916" stroke-width="1.3"/><rect x="289" y="202" width="28" height="26" fill="#f0eee5" stroke="#1a1916" stroke-width="1.3"/><line x1="50.0" y1="215.0" x2="361.0" y2="215.0" stroke="#c8261a" stroke-width="2" /><polygon points="370.0,215.0 361.0,219.0 361.0,211.0" fill="#c8261a"/><text x="123.0" y="344.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >make</text><text x="213.0" y="344.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >review</text><text x="303.0" y="344.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >review again</text><text x="40.0" y="200.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="400" >an error</text><text x="444.0" y="240.0" font-size="12" fill="#c8261a" text-anchor="end" font-weight="400" >gets through</text><text x="500.0" y="100.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">A CHECKER FROM OUTSIDE</text><text x="500.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >a different mind, different holes</text><rect x="590" y="130" width="26" height="190" fill="#dcd9ca" stroke="#1a1916" stroke-width="1.3"/><rect x="589" y="202" width="28" height="26" fill="#f0eee5" stroke="#1a1916" stroke-width="1.3"/><rect x="680" y="130" width="26" height="190" fill="#dcd9ca" stroke="#1a1916" stroke-width="1.3"/><rect x="679" y="152" width="28" height="26" fill="#f0eee5" stroke="#1a1916" stroke-width="1.3"/><line x1="530.0" y1="215.0" x2="667.0" y2="215.0" stroke="#c8261a" stroke-width="2" /><polygon points="676.0,215.0 667.0,219.0 667.0,211.0" fill="#c8261a"/><path d="M674,206 l14,18 M688,206 l-14,18" stroke="#c8261a" stroke-width="2.4"/><text x="603.0" y="344.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >make</text><text x="693.0" y="344.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >someone else</text><text x="520.0" y="200.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="400" >an error</text><text x="724.0" y="212.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="400" >caught</text><text x="724.0" y="230.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >likely, not certain</text><line x1="470" y1="84" x2="470" y2="350" stroke="#b8b09a"/><text x="40.0" y="380.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >Three passes by one mind are one layer drawn three times, so the holes line up. In the page's words, “the same blind</text><text x="40.0" y="398.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >spot signs off on itself”.</text><text x="40.0" y="421.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >One slice repeated is my turn on the Swiss cheese model that Latent Error holds, where layers differ and fail when</text><text x="40.0" y="439.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >their holes align. The page calls its own claim “a strongly-recurring pattern, not a proven law”.</text></svg>