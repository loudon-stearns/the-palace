const CP = (() => {

    { name: 'D dorian · Fux', notes: [50, 53, 52, 50, 55, 53, 57, 55, 53, 52, 50], lo: 57, hi: 77, lead: 61 },
    { name: 'C major', notes: [48, 52, 50, 53, 52, 55, 57, 55, 53, 52, 50, 48], lo: 55, hi: 76, lead: 59 }
  ];
  const SCALE = [0, 2, 4, 5, 7, 9, 11];          // the white notes: D dorian and C major share them
  const CONS = new Set([0, 3, 4, 7, 8, 9]);       // consonances above the lower voice, mod 12

  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

  const strongs = (line) => line.filter((_, i) => i % 2 === 0);
  const below = (cf, i) => cf.notes[Math.floor(i / 2)];
  // the melodic rules, shared by every line this piece writes, interlocked or not
  function melodicOk(line, i, cf) {
    const m = line[i], p = line[i - 1];
    if (i === 0) return true;
    const d = m - p, a = Math.abs(d);
    if (a === 0 || a === 6 || a === 10 || a === 11 || a > 12) return false;   // no repeat, tritone, seventh, beyond the octave
    if (d === -8 || d === -9) return false;                                      // a sixth only upward, and then only a minor one
    if (d === 9) return false;
    if (i >= 2) { const d0 = p - line[i - 2]; if (Math.abs(d0) >= 5 && !(Math.abs(d) <= 2 && sgn(d) === -sgn(d0))) return false; } // a leap past a third turns back by step
    let lo = Infinity, hi = -Infinity; for (let k = 0; k <= i; k++) { lo = Math.min(lo, line[k]); hi = Math.max(hi, line[k]); }

  function verticalOk(line, i, cf) {
    const m = line[i], c = below(cf, i), iv = m - c, last = 2 * (cf.notes.length - 1);
    if (iv <= 0) return false;                                                   // above, never crossing or on a unison
    if (i === 0) return PERF.has(iv % 12);                                       // begin on a fifth or an octave

      return iv % 12 === 0 && !((ps - pc) % 12 === 0 && sgn(m - ps) === sgn(c - pc)); }
    if (i === last - 1) return iv % 12 === 9;                                    // the leading tone, a major sixth above
    if (i % 2 === 0) {                                                           // strong beat: a consonance
      if (!CONS.has(iv % 12)) return false;
      const ps = line[i - 2], pc = below(cf, i - 2), piv = ps - pc;                // no parallel fifths or octaves, beat to beat
      if (PERF.has(iv % 12) && (piv % 12) === (iv % 12) && sgn(m - ps) === sgn(c - pc)) return false;
      const pw = line[i - 1], wiv = pw - pc;                                       // nor from the weak beat before
      if (PERF.has(iv % 12) && CONS.has(wiv % 12) && (wiv % 12) === (iv % 12)) return false;

  }

  function stepCost(el) {
    if (!S.ex) return writing(el, stepCost); const ex = S.ex, cf = ex.cf, line = ex[S.arm];
    const rowFor = (k) => { const H = CP.harmony(ex[k], cf), R = CP.recover(ex[k], cf), E = ENS[k];
      return `<tr ${k === S.arm ? 'style="background:var(--accent-soft)"' : ''}><td>${ARM[k]}</td><td class="n">${pct(H.narrows)} <span class="hint">(${pct(E.narrows)})</span></td><td class="n">${pct(H.contradicts)} <span class="hint">(${pct(E.contradicts)})</span></td><td class="n">${pct(Math.max(R.shift, R.mirror))} <span class="hint">(${pct(Math.max(E.shiftMax, E.mirrorMax))} at most)</span></td><td class="n">${R.direction.toFixed(2)} <span class="hint">(${E.direction.toFixed(2)})</span></td></tr>`; };
    el.innerHTML = `<div class="say"><p>“Incomplete” can mean two things, and they come apart. One is harmonic: the pair names chords that one voice can't, so removing a voice loses them. The other is about what's left: the line that remains can't rebuild the one removed. Hold the same cantus and change only its partner. Five partners: the line written for it; parallel tenths; the cantus doubled at the octave; the written line's own notes, reordered so they no longer fit (at least four strong beats moved), with its leaps, range and contrary motion kept; and a line written by the same rules for another cantus in the same mode, then laid on this one, a tail board cut for another drawer.</p></div>
      <div class="row">${Object.keys(ARM).map((k) => `<button class="b ${k === S.arm ? 'on' : ''}" data-arm="${k}">${ARM[k]}</button>`).join('')}</div>
      <canvas id="cv"></canvas>
      <div class="row">${playBtn('Play the pair')}<button class="b ${S.muteC ? 'off' : ''}" id="mC">cantus</button><button class="b ${S.muteU ? 'off' : ''}" id="mU">${ARM[S.arm]}</button></div>
      <div class="eq"><div class="s">narrows = (1/n) · #{ j : 1 ≤ chords(cⱼ, uⱼ) &lt; chords(cⱼ) }</div><div class="w">the share of strong beats where the two voices together fit fewer of the mode's chords than the cantus note alone, and still fit at least one; a beat that fits none is a contradiction</div></div>
      <div class="eq"><div class="s">rebuild = max over k of (1/n) · #{ j : uⱼ = cⱼ + k  or  uⱼ = k − cⱼ }</div><div class="w">the most of the upper line's strong-beat notes you get back from the cantus by sliding it a fixed number of scale steps, or by mirroring it about a fixed note, the way a pin board is marked from its tails</div></div>
      <table><tr><th>partner</th><th>narrows the chord</th><th>contradicts</th><th>rebuilt from the cantus</th><th>direction ±1</th></tr>${Object.keys(ARM).map(rowFor).join('')}</table>
      <p class="hint">This pair first; in brackets the mean over ${ENS.n} pairs the check wrote, 60 seeds per cantus (for rebuilt, the most any pair reached). Direction is +1 when the line always moves with the cantus, −1 when always against it. The parallel lines move note against note, held a bar each; the other three move two against one.</p>
      <div class="card"><div class="eyebrow">stated before the numbers were run · on these canti, none of it could have failed</div>
      <p class="hint">If the harmonic reading is what marks co-design, the line written for it should narrow more strong beats than parallel tenths do. If the line left behind could rebuild the one removed — 80% of strong beats or more, by slide or mirror — removal would cost nothing you couldn't work out again. And if the line not written for it contradicted the cantus no more often than the written one, the vertical rules would be doing no work a melody does by itself.</p>
      <p class="hint">Added on the second make, before its numbers were run: if a line written by the same rules for another cantus contradicted this one no more often than the line written for it, writing for this partner would add nothing to writing well.</p>
      <p class="verdict">What came out: parallel tenths narrow ${pct(ENS.tenths.narrows)} of strong beats, the written line ${pct(ENS.written.narrows)}. So the harmonic reading does not single out co-design: a voice that only runs parallel a tenth above names chords as well or better, and octave doubling names none. The written line never contradicts its partner and can't be rebuilt from it, at most ${pct(Math.max(ENS.written.shiftMax, ENS.written.mirrorMax))} of it coming back from the cantus, and both facts are the rules' doing, not a finding: they are what it was written under. Parallel: no contradictions, and all of it comes back. The other partners contradict: its notes reordered on ${pct(ENS.notwritten.contradicts)} of strong beats, and a good line written for another cantus, the wrong partner, on ${pct(ENS.other.contradicts)}.</p>
      <p class="hint">Five numbers here can't fail, and say so. The written line's 0% contradictions is the rule it was searched under. The parallel lines' 100% rebuild is how they were made: a control, showing the measure finds a line that can be rebuilt. The tenths' ${pct(ENS.tenths.narrows)} narrowing is arithmetic, not measurement: a third or a sixth always leaves fewer chords than one note does, so the first rule above could never have come out the other way. The written line's rebuild is held under 80% by its own rules: sliding by the demand that at least 60% of its moves go against the cantus, mirroring by the opening and cadence formula, which is Fux's, not the page's Part 2. The challenger counted at most 8 of 11 strong beats on Fux's cantus and 8 of 12 on the C major one for any line that keeps these rules, where 80% needs 9 and 10. And the two lines not written for this cantus were bound to contradict it on more than 0: a line with no vertical rule lands seconds and sevenths on the white keys, and random white-note lines contradict on 28%. So step 3 sorts five partners by two readings of “incomplete”; it doesn't test them. The reordered line's contrary motion is matched to the written line's in count, so the direction column shows the same ${ENS.written.direction.toFixed(2)} for both: contrary motion alone doesn't make a line written for its partner.</p></div>`;
    draw($('#cv'), cf, line, { marks: true, muteC: S.muteC, muteU: S.muteU });
    el.querySelectorAll('[data-arm]').forEach((b) => b.onclick = () => { stop(); S.arm = b.dataset.arm; S.muteC = S.muteU = false; stepCost(el); });
    const tog = (k) => { if (k === 0) S.muteC = !S.muteC; else S.muteU = !S.muteU; setMute(k, k === 0 ? S.muteC : S.muteU); $(k === 0 ? '#mC' : '#mU').classList.toggle('off'); draw($('#cv'), cf, line, { marks: true, muteC: S.muteC, muteU: S.muteU }); };
    $('#mC').onclick = () => tog(0); $('#mU').onclick = () => tog(1);
    wirePlay(el, () => playVoices(cf, ['cantus', line], [S.muteC, S.muteU], () => stop()));
  }

  // ── the blind test ──
  const B = { block: 'together', i: 0, list: null, answers: [], making: false };
  function seed32() { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }
  function makeTrials(done) { B.list = []; B.making = true; const step = () => { if (B.list.length === 8) { B.making = false; done(); return; } const t = CP.trial(seed32()); if (t) B.list.push(t); $('#mk') && ($('#mk').textContent = `writing trial ${B.list.length + 1} of 8…`); setTimeout(step, 0); }; setTimeout(step, 0); }
  function stepBlind(el) {
    el.innerHTML = `<div class="say"><p>Last, with the score hidden. Each trial is a fresh cantus, made by Fux's rules for a cantus in D dorian or C major, and two upper lines, A and B. One was written for this cantus by the rules of step 2. The other was written by the same rules for a second fresh cantus, made the same way with the same opening and cadence, then laid on this one: a good line, cut for another board. Both come from the same rules and the same kind of partner, so nothing in either line alone tells them apart. Which one was written for the cantus you hear?</p></div>
      <div class="card"><div class="eyebrow">the rule, fixed before the first trial</div>
      <p class="hint">Eight trials a block. The written line is A or B by a fresh coin each trial, not balanced, so counting can't help. Guessing gets each trial right 1 time in 2. Seven or eight of eight is “heard”; guessing does that 9 times in 256 (3.5%). Six or fewer is “not shown”, which is not the same as “not there”. None of eight is not a pass. Both positions are scored: answering A every time gets about four of eight, and the tally shows it.</p>
      <p class="hint"><b>Together</b> is the control: each pair whole, and you may remove either voice. Laid on this cantus, the line written for another lands ${LEAK.dis.mean.toFixed(2)} dissonant strong beats on average (${pct(LEAK.dis.share)} of them), and reading those alone picks the written line ${pct(row('pair · fewer strong-beat'))} of the time. So anyone who hears a clash on a downbeat should pass: it checks the page's Part 2 guideline, “on strong beats, use consonances”, not the row.</p>
      <p class="hint"><b>Apart</b> is the block that speaks to the row: the cantus alone, then each upper line alone, never with the cantus — the page's “remove one voice” taken at its word. Does a lone line carry the mark of the partner it was written for? What it can't say: both lines were written for a partner, so it can't tell whether a lone line sounds incomplete, only whether it carries which partner it was cut for.</p>
      <p class="hint">Every clip is turned to the same RMS level on its own (before that, a pair's two clips differed by ${LEVEL.lo} to ${LEVEL.hi} dB over ${LEVEL.n} trials); one tone for every voice; the same register limits for both lines; the same length. The guess written before any trial, by an agent that can't hear: together, a trained ear passes; apart, near chance.</p></div>
      <div class="row"><span class="eyebrow">block</span><button class="b ${B.block === 'together' ? 'on' : ''}" data-bl="together">together</button><button class="b ${B.block === 'apart' ? 'on' : ''}" data-bl="apart">apart</button><button class="b" id="start">Start eight trials</button><span class="hint" id="mk"></span></div>
      <div id="trial"></div>
      <details class="card"><summary class="hint">what a reader who doesn't listen could do</summary>
      <table><tr><th>pick the line with…</th><th>right, of ${LEAK.n} simulated trials</th></tr>${LEAK.rows.map(([k, v]) => `<tr><td>${k}</td><td class="n">${pct(v)}</td></tr>`).join('')}</table>
      <p class="hint">A rule that reads one line alone and scores past 65% is a leak: it would pass “apart” without the partner. The rows marked <i>pair</i> read the cantus and the line at once. In “together” that is the thing under test; in “apart” only an ear that holds the cantus in memory can use them. The page's own rule, contrary motion, is one of them: it picks the written line ${pct(row('pair · more contrary'))} of the time, and strong-beat dissonance ${pct(row('pair · fewer strong-beat'))}. So passing “together” says you heard a clash on a downbeat, or the voices moving together where they should part; step 3 is where motion is held equal in count and the dissonance still tells.</p>
      <p class="hint">This test's first make leaked, twice. Its second line was written by the same melodic rules without any cantus and matched to the first in leaps, passing tones, range, average pitch and contrary motion. A reader that learned, from half the trials, which notes each kind of line favours picked the written line ${pct(LEAK0.pc)} of the time from one line alone. Given the written line's own notes in another order, it fell to a coin, and a reader that learned melodic intervals then scored ${pct(LEAK0.iv)}, note-to-note moves ${pct(LEAK0.moves)}: a line rearranged to miss its partner moves unlike a line written for one. So the second line is now written for a partner too, just not this one.</p></details>`;
    el.querySelectorAll('[data-bl]').forEach((b) => b.onclick = () => { stop(); B.block = b.dataset.bl; B.list = null; stepBlind(el); });
    $('#start').onclick = () => { stop(); B.i = 0; B.answers = []; $('#start').disabled = true; makeTrials(() => { $('#mk').textContent = ''; $('#start').disabled = false; $('#start').textContent = 'Start again'; showTrial(); }); };
    if (B.list && !B.making) showTrial();
  }
  function showTrial() {
    const box = $('#trial'); if (!box) return;
    if (B.i >= B.list.length) return showResult(box);
    const t = B.list[B.i], cf = t.cf, mute = { A: [false, false], B: [false, false] };
    const together = B.block === 'together';
    box.innerHTML = `<div class="card"><div class="eyebrow">trial ${B.i + 1} of 8 · ${cf.name} · ${B.block}</div>
      <div class="row">${together ? `${playBtn('Play A')}${playBtn('Play B')}<span class="hint">remove a voice from the one playing:</span><button class="b" id="rc">cantus</button><button class="b" id="ru">upper line</button>` : `${playBtn('Play the cantus')}${playBtn('Play A alone')}${playBtn('Play B alone')}`}</div>
      <div class="row"><span class="hint">written for the cantus:</span><button class="b" data-ans="A">A</button><button class="b" data-ans="B">B</button></div></div>`;
    let cur = null;
    box.querySelectorAll('[data-play]').forEach((b) => b.onclick = () => { if (playing) { stop(); return; } const lbl = b.dataset.play;
      if (lbl === 'Play the cantus') playClip(cf, ['cantus'], stop);
      else { const which = lbl.includes(' A') ? 'A' : 'B', line = t[which]; cur = which;
        if (together) { playVoices(cf, ['cantus', line], [false, false], stop); }
        else playClip(cf, [line], stop); }
      b.textContent = 'Stop'; });
    if (together) { let mc = false, mu = false; $('#rc').onclick = () => { mc = !mc; $('#rc').classList.toggle('off'); setMute(0, mc); }; $('#ru').onclick = () => { mu = !mu; $('#ru').classList.toggle('off'); setMute(1, mu); }; }
    box.querySelectorAll('[data-ans]').forEach((b) => b.onclick = () => { stop(); B.answers.push({ said: b.dataset.ans, answer: t.answer }); B.i++; showTrial(); });
  }
  function showResult(box) {
    const right = B.answers.filter((a) => a.said === a.answer).length, inA = B.answers.filter((a) => a.answer === 'A'), inB = B.answers.filter((a) => a.answer === 'B');
    const rA = inA.filter((a) => a.said === 'A').length, rB = inB.filter((a) => a.said === 'B').length, saidA = B.answers.filter((a) => a.said === 'A').length;
    const tail = (k) => { let s = 0; const C = (n, r) => { let c = 1; for (let i = 0; i < r; i++) c = c * (n - i) / (i + 1); return c; }; for (let j = k; j <= 8; j++) s += C(8, j); return s; };
    const heard = right >= 7;
    box.innerHTML = `<div class="card"><div class="eyebrow">${B.block} · the result</div>
      <p class="verdict">${right} of 8. ${heard ? '<span class="good">Heard</span>, by the rule set before the first trial.' : 'Not shown, by the rule set before the first trial. That is not the same as not there.'}</p>
      <p class="hint">Guessing gets ${right} or more of 8 in ${tail(right)} of 256 rounds (${(100 * tail(right) / 256).toFixed(1)}%). When the written line was A: ${rA} of ${inA.length} right. When it was B: ${rB} of ${inB.length}. You answered A ${saidA} times of 8. One ear, one sitting, one pair of speakers: it says what you heard, not what every ear hears.</p>
      <p class="hint">${B.block === 'together' ? 'Now try the same eight kinds of pair apart, with the voices never sounding together.' : 'If “apart” fell near four while “together” passed, the incompleteness is in the pair, not in the lone line: a line removed from its partner carries no mark you can hear of whom it was written for.'}</p></div>`;
  }
  go(0);
})();
</script>
</body>
</html>
