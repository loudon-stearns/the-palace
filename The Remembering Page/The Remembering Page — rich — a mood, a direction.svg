<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 458" width="920" height="458" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">A MOOD, A DIRECTION</text><text x="60.0" y="100.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">ONE DIALOGUE</text><text x="60.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >a mood: the forward vector stays</text><line x1="150.0" y1="300.0" x2="186.5" y2="163.8" stroke="#1a1916" stroke-width="4" /><polygon points="188.8,155.1 190.4,164.8 182.6,162.8" fill="#1a1916"/><circle cx="150" cy="300" r="7" fill="#1a1916"/><text x="150.0" y="328.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >the page</text><text x="204.0" y="158.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="400" >its forward vector</text><line x1="250.0" y1="290.0" x2="344.9" y2="255.5" stroke="#6a6862" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="353.4,252.4 346.3,259.2 343.5,251.7" fill="#6a6862"/><text x="250.0" y="312.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >one pull, once</text><text x="500.0" y="100.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">SEVERAL THAT AGREE</text><text x="500.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >a direction: the page proposes a turn</text><line x1="570.0" y1="300.0" x2="606.5" y2="163.8" stroke="#b8b09a" stroke-width="3" stroke-dasharray="6 5"/><polygon points="608.8,155.1 610.4,164.8 602.6,162.8" fill="#b8b09a"/><text x="604.0" y="142.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >where it pointed</text><path d="M591.6,233.4 A70,70 0 0 1 618.6,249.6" fill="none" stroke="#c8261a" stroke-width="1.4"/><line x1="570.0" y1="300.0" x2="674.8" y2="205.7" stroke="#c8261a" stroke-width="4" /><polygon points="681.5,199.6 677.5,208.6 672.1,202.7" fill="#c8261a"/><circle cx="570" cy="300" r="7" fill="#1a1916"/><text x="570.0" y="328.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >the page</text><text x="690.0" y="190.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="400" >the turn it proposes</text><line x1="704.0" y1="310.0" x2="798.9" y2="275.5" stroke="#6a6862" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="807.4,272.4 800.3,279.2 797.5,271.7" fill="#6a6862"/><line x1="704.0" y1="274.0" x2="794.8" y2="229.7" stroke="#6a6862" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="802.9,225.8 796.5,233.3 793.0,226.1" fill="#6a6862"/><line x1="704.0" y1="238.0" x2="801.6" y2="211.9" stroke="#6a6862" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="810.3,209.5 802.6,215.7 800.5,208.0" fill="#6a6862"/><text x="704.0" y="334.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >the same pull, three times</text><line x1="440" y1="84" x2="440" y2="336" stroke="#b8b09a"/><text x="40.0" y="372.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >“One dialogue is a mood; three consistent ones are a direction.” A page proposes a change to its forward vector,</text><text x="40.0" y="390.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >and it is applied only when the same change shows up across several remembered encounters.</text><text x="40.0" y="413.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >“The human decides when the molt is real”, and the page says how many encounters count “isn't known yet”. The</text><text x="40.0" y="431.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >arrows and their angles are mine and measure nothing.</text></svg>