  s += show(B.mirror + 1, cap(866, 44, 290, [SAY[B.mirror + 1], 'Eight organs. The last tile of its floor is the one under your feet.']).svg + cap(866, 600, 290, 'The measured plate of this body is further down the page, under Anatomy.', { size: 13.5, fill: C.black, ink: C.paper, stroke: C.dim }).svg, 'bf-new2');
  return s;
}
function pageCore() {
  const L = coreLayout(120, 44, 300, 2.12, 7, weeks);
  let s = `<rect x="0" y="0" width="${W}" height="${H}" fill="${C.paper}"/>` + panel(20, 20, 1160, 720, C.paper);
  s += tile(270, 38, 150, 12, C.paper, C.ink) + child(270, 38, 9, C.ink, C.ink);
  s += drawCore(L);
  // month ticks, on each band that opens a month
  let seen = '';
  for (const r of L.rows) { if (!r.wk) continue; const m = r.wk.last.slice(0, 7); if (m !== seen) { seen = m; s += `<path d="M108 ${r.y.toFixed(1)} H120" stroke="${C.ink}" stroke-width="1"/><text x="102" y="${(r.y + 10).toFixed(1)}" font-size="11" text-anchor="end" fill="${C.dim}" letter-spacing="1">${MONTHS[+m.slice(5) - 1]}</text>`; } }
  const gy = L.bottom + 4, gh = 716 - gy;
  s += show(B.core + 5, `<rect x="120" y="${gy}" width="300" height="${gh}" fill="none" stroke="${C.ink}" stroke-width=".9" stroke-dasharray="3 3"/>` + grains(120, gy, 300, gh, 104));
  // six captions, each beside the band it speaks of, with a leader
  const gap = L.rows.filter(r => r.gap).sort((a, b) => b.gap - a.gap)[0];
  const targets = [rowOf(L, newest.week), rowOf(L, thick.week), gap, rowOf(L, firstSteward.week), rowOf(L, weeks[0].week), { y: gy, h: gh }];
  const hs = targets.map((t, i) => cap(0, 0, 680, SAY[B.core + i]).h + (i === 3 ? 34 : 0));
  const ys = []; let cy = 40;
  targets.forEach((t, i) => { const y = Math.max(cy, t.y + t.h / 2 - hs[i] / 2); ys.push(y); cy = y + hs[i] + 12; });
  let lim = 720; for (let i = 5; i >= 0; i--) { ys[i] = Math.min(ys[i], lim - hs[i]); lim = ys[i] - 12; }
  for (let i = 0; i < 6; i++) {
    const k = B.core + i; if (n < k) break;
    const c = cap(480, ys[i], 680, SAY[k]); let g = c.svg;
    if (i === 3) {
      const ly = ys[i] + c.h;
      g += `<rect x="480" y="${ly - 1.5}" width="680" height="35" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.5"/>`;
      KINDS.slice(0, 6).forEach((kd, j) => { g += `<rect x="${493 + j * 110}" y="${ly + 8}" width="20" height="16" fill="url(#k-${kd})" stroke="${C.ink}" stroke-width="1"/><text x="${518 + j * 110}" y="${ly + 21}" font-size="12.5" fill="${C.ink}">${KIND_WORDS[kd]}</text>`; });
    }
    const t = targets[i], ty = t.y + t.h / 2, my = Math.max(ys[i] + 14, Math.min(ys[i] + hs[i] - 14, ty));
    g += `<path d="M480 ${my.toFixed(1)} H452 L436 ${ty.toFixed(1)} H424" fill="none" stroke="${C.ink}" stroke-width="1.3"/><path d="M420 ${ty.toFixed(1)} l9 -4.5 v9 Z" fill="${C.ink}"/>`;
    s += `<g class="${N1(k)}">${g}</g>`;

}
function elapsed() {
  const ms = stamps[Math.min(B.red, stamps.length - 1)] - stamps[0]; const sec = Math.round(ms / 1000);
  return sec >= 60 ? `${Math.floor(sec / 60)} min ${sec % 60} s` : `${sec} s`;
}
function pageName() {
  let s = `<rect width="${W}" height="${H}" fill="${C.paper}"/>`;
  // the word, cut as a section
  s += panel(20, 20, 560, 400, C.paper);
  s += `<text x="300" y="150" text-anchor="middle" font-size="92" font-weight="700" letter-spacing="6" fill="${C.ink}">SUB</text>`;
  s += `<path d="M60 172 H540" stroke="${C.ink}" stroke-width="2.5"/>`;
  s += `<rect x="60" y="175" width="480" height="96" fill="url(#k-edit)"/><text x="300" y="254" text-anchor="middle" font-size="92" font-weight="700" letter-spacing="6" fill="${C.ink}" stroke="${C.paper}" stroke-width="7" paint-order="stroke">STRATE</text>`;
  s += `<path d="M60 272 H540" stroke="${C.ink}" stroke-width="1"/>`;
  s += cap(40, 292, 520, SAY[B.name], { size: 15.5 }).svg;
  // the zoom on the top of the core, and the reader's own band
  if (n >= B.red) {
    const top3 = weeks.slice(-3); const L = coreLayout(640, 150, 440, 2.6, 7, top3);
    let g = panel(600, 20, 580, 400, C.paper) + drawCore(L);
    L.rows.forEach(r => { if (r.wk) g += `<text x="1090" y="${(r.y + Math.min(r.h / 2 + 4, 16)).toFixed(1)}" font-size="11.5" fill="${C.dim}">${fmt(r.wk.commits)}</text>`; });
    // the red band: one tick per step, spaced by the reader's real pauses
    const t = stamps.slice(0, B.red + 1), t0 = t[0], span = Math.max(1, t[t.length - 1] - t0);
    g += `<rect x="640" y="136" width="440" height="14" fill="${C.red}" opacity=".16"/><path d="M640 136 H1080 M640 150 H1080" stroke="${C.red}" stroke-width="1.6"/>`;
    t.forEach(v => { const x = 640 + 440 * (v - t0) / span; g += `<path d="M${x.toFixed(1)} 132 V154" stroke="${C.red}" stroke-width="2.4"/>`; });
    g += child(1080, 134, 13, C.red, C.red);
    g += `<text x="640" y="122" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="${C.red}">YOUR ${t.length - 1} STEPS · ${elapsed().toUpperCase()}</text>`;
    g += cap(620, 304, 540, `Your ${t.length - 1} steps brought you here, and each left a mark. This band is drawn only: nothing on this page writes to the palace. A real mark is a commit, and a child’s reaches the house through an elder.`, { size: 13.5 }).svg;
    s += `<g class="${N1(B.red)}">${g}</g>`;
  }
  if (n >= B.last) {
    let g = panel(20, 440, 1160, 300, C.black);
    for (let i = 5; i >= 1; i--) g += `<path d="M70 ${686 + i * 8} L500 ${495 + i * 8}" stroke="${C.paper}" stroke-width="1" opacity="${.55 - i * .08}"/>`;
    g += `<path d="M70 686 L500 495" stroke="${C.red}" stroke-width="2.6"/>`;
    g += litPath(120, 634, 54, -24, 34, 12, { at: 0, fs: 11 });
    g += cap(600, 470, 400, SAY[B.last], { size: 22, weight: 600 }).svg;
    g += `<g class="bf-new2">${cap(600, 560, 540, 'How does it feel to stand on it?', { size: 19, fill: C.black, ink: C.paper, stroke: C.paper }).svg}<text x="602" y="650" font-size="12.5" fill="${C.paper}" opacity=".6">Only you can answer. The review notes on this page will take it.</text></g>`;
    s += `<g class="${N1(B.last)}">${g}</g>`;
  }
  return s;
}

// fill the two captions that depend on the data
(() => {
  const L = coreLayout(0, 0, 1, 1, 1, weeks); const g = L.rows.filter(r => r.gap).sort((a, b) => b.gap - a.gap)[0];
  SAY[B.core + 2] = `Between ${niceDay(g.after)} and ${niceDay(g.before)}, nothing. ${['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'][g.gap] || g.gap} weeks with no layer. A geologist calls a missing stretch like this an unconformity. The record keeps the gap.`;
  SAY[B.core + 3] = `It did not grow one way. The oldest bands are mostly ceremony. Machinery fills the middle. In the week of ${niceDay(firstSteward.first)} the first stewards appear: pages that work while no one is in the room.`;
  SAY[B.red] = `Your steps, laid on top in red.`;
})();

const PAGES = [[0, 3, pageBorn], [4, 4, pageJewel], [5, 9, pageWorld], [10, 12, pageBeyond], [13, 14, pageMirror], [15, 16, pageTurn], [17, 22, pageCore], [23, 25, pageName]];
const stage = document.getElementById('stage'), live = document.getElementById('bf-live');
function render() {
  const pg = PAGES.find(p => n >= p[0] && n <= p[1]);
  const turned = fwd && n === pg[0] && n > 0;
  stage.innerHTML = DEFS + `<g class="${turned ? 'bf-new' : ''}">` + pg[2]() + '</g>';
  document.getElementById('back').disabled = n === 0;
  const go = document.getElementById('next'); go.textContent = n === N - 1 ? 'be born again' : 'step';
  document.getElementById('count').textContent = `frame ${n + 1} of ${N}`;
  document.getElementById('hint').style.visibility = n === 0 ? 'visible' : 'hidden';
  live.textContent = n === B.name ? SAY[B.name] + ' ' + quote15 : SAY[n];
}
const quote15 = `Git signs ${fmt(signedLoudon)} of these ${fmt(total)} layers with Loudon’s name. It cannot say which of the two in the room laid each one.`;
function step(d) {
  if (d > 0 && n === N - 1) { n = 0; fwd = true; stamps.length = 0; stamps.push(performance.now()); render(); return; }
  const m = Math.max(0, Math.min(N - 1, n + d)); if (m === n) return;
  fwd = d > 0; n = m; if (fwd && stamps.length <= n) stamps[n] = performance.now(); render(); if (fwd) cueFor(n);
}
stage.addEventListener('click', () => step(1));
document.getElementById('next').addEventListener('click', () => step(1));
document.getElementById('back').addEventListener('click', () => step(-1));
document.getElementById('snd').addEventListener('click', (e) => {
  if (player.on) soundOff(); else soundOn();
  e.currentTarget.setAttribute('aria-pressed', player.on); e.currentTarget.textContent = player.on ? 'sound: on' : 'sound: off';
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
});
document.getElementById('foot').innerHTML =
  `The core is real: ${fmt(total)} commits in ${weeks.length} weeks, mined ${S.mined} at <code>${S.head}</code> with <code>${esc(S.command)}</code>, ` +
  `grouped by the word each commit subject opens with (<code>SUBSTRATE/workshop/strata.mjs</code>). Band thickness is the square root of the week’s commits, so a one-commit week still shows. ` +
  `${quote15} The loose ground is 104 circles for the 104 conversations in SUBSTRATE — Context § Palace Genesis. Sound is off until you turn it on; all of it is synthesized in this file, in the block named SOUND.`;
window.__bf = { step, get n() { return n; }, N, player };
render();
</script>
