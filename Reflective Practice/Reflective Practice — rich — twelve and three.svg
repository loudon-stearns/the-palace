<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 508" width="920" height="508" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">TWELVE, THREE, AND ONE ON THE BORDER</text><path d="M436,372 L460,126 L484,372 Z" fill="#1a1916"/><line x1="198" y1="163" x2="722" y2="89" stroke="#1a1916" stroke-width="5"/><rect x="454" y="110" width="12" height="16" fill="#1a1916"/><rect x="379" y="88" width="162" height="22" fill="#f0eee5" stroke="#1a1916" stroke-width="1"/><text x="460.0" y="103.0" font-size="11" fill="#1a1916" text-anchor="middle" font-weight="700" >Audition Gate</text><text x="369.0" y="102.0" font-size="12" fill="#6a6862" text-anchor="end" font-weight="400" >“sits on the border”</text><path d="M31,209 L198,163 L364,209" fill="none" stroke="#1a1916" stroke-width="1.4"/><path d="M31,209 L31,362 L364,362 L364,209" fill="none" stroke="#1a1916" stroke-width="2.4"/><circle cx="198" cy="163" r="4" fill="#1a1916"/><rect x="34" y="212" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="115.1" y="226.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Closing Well</text><rect x="199" y="212" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="280.1" y="226.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Weave</text><rect x="34" y="237" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="115.1" y="251.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Return</text><rect x="199" y="237" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="280.1" y="251.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Spore Check</text><rect x="34" y="262" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="115.1" y="276.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Revival</text><rect x="199" y="262" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="280.1" y="276.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Harvest</text><rect x="34" y="287" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="115.1" y="301.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Review Layer</text><rect x="199" y="287" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="280.1" y="301.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >forward_vector revision</text><rect x="34" y="312" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="115.1" y="326.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Debrief Reel</text><rect x="199" y="312" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="280.1" y="326.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Walk</text><rect x="34" y="337" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="115.1" y="351.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Drift and Consolidation</text><rect x="199" y="337" width="162" height="22" fill="#1a1916" stroke="#1a1916" stroke-width="1"/><text x="280.1" y="351.9" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Concierge's curator</text><text x="197.6" y="385.9" font-size="13" fill="#1a1916" text-anchor="middle" font-weight="700" letter-spacing="2">ON ACTION</text><text x="197.6" y="403.9" font-size="12" fill="#6a6862" text-anchor="middle" font-weight="400" >twelve: looking back once the work is done</text><path d="M638,135 L722,89 L806,135" fill="none" stroke="#1a1916" stroke-width="1.4"/><path d="M638,135 L638,213 L806,213 L806,135" fill="none" stroke="#1a1916" stroke-width="2.4"/><circle cx="722" cy="89" r="4" fill="#1a1916"/><rect x="641" y="138" width="162" height="22" fill="#c8261a" stroke="#1a1916" stroke-width="1"/><text x="722.4" y="153.1" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Dialectic</text><rect x="641" y="163" width="162" height="22" fill="#c8261a" stroke="#1a1916" stroke-width="1"/><text x="722.4" y="178.1" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Concierge's scout</text><rect x="641" y="188" width="162" height="22" fill="#c8261a" stroke="#1a1916" stroke-width="1"/><text x="722.4" y="203.1" font-size="11" fill="#f0eee5" text-anchor="middle" font-weight="700" >Oblique Portrait</text><text x="722.4" y="237.1" font-size="13" fill="#c8261a" text-anchor="middle" font-weight="700" letter-spacing="2">IN ACTION</text><text x="722.4" y="255.1" font-size="12" fill="#6a6862" text-anchor="middle" font-weight="400" >three: while the work can still change</text><text x="40.0" y="442.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >“Sort the palace's own machinery by Schön's two modes and it leans hard to one side.” Names and sort are the page's.</text><text x="40.0" y="465.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >The page says the sort was made in one session and has not been re-audited. The balance is my picture: it gives every</text><text x="40.0" y="483.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >mechanism the same weight, and the page weighs none of them.</text></svg>