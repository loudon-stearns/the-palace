<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 430" width="920" height="430" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">THE FLOOR MOVED</text><text x="60.0" y="100.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">ONE SHARED FLOOR</text><text x="60.0" y="118.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >two sessions in the same checkout</text><rect x="60" y="140" width="360" height="180" fill="none" stroke="#b8b09a"/><line x1="180" y1="190" x2="390" y2="190" stroke="#1a1916" stroke-width="2.4"/><text x="172.0" y="194.0" font-size="10" fill="#1a1916" text-anchor="end" font-weight="400" >branch A</text><circle cx="210" cy="190" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="254" cy="190" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="298" cy="190" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><line x1="180" y1="250" x2="390" y2="250" stroke="#1a1916" stroke-width="2.4"/><text x="172.0" y="254.0" font-size="10" fill="#1a1916" text-anchor="end" font-weight="400" >branch B</text><circle cx="210" cy="250" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="254" cy="250" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="298" cy="250" r="6" fill="#c8261a"/><circle cx="96" cy="166" r="7" fill="#1a1916"/><path d="M86,190 q10,-24 20,0 Z" fill="#1a1916"/><text x="96.0" y="206.0" font-size="10" fill="#1a1916" text-anchor="middle" font-weight="400" >session 1</text><circle cx="96" cy="256" r="7" fill="#1a1916"/><path d="M86,280 q10,-24 20,0 Z" fill="#1a1916"/><text x="96.0" y="296.0" font-size="10" fill="#1a1916" text-anchor="middle" font-weight="400" >session 2</text><path d="M110,270 C140,262 150,256 172,252" fill="none" stroke="#6a6862" stroke-dasharray="3 3"/><text x="150.0" y="296.0" font-size="10" fill="#6a6862" text-anchor="start" font-weight="400" >switches the checkout to B</text><path d="M110,182 C200,150 320,205 298,243" fill="none" stroke="#c8261a" stroke-width="1.6"/><text x="300.0" y="168.0" font-size="10" fill="#c8261a" text-anchor="start" font-weight="400" >1's commit lands on B</text><text x="520.0" y="100.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">A FLOOR EACH</text><text x="520.0" y="118.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >one worktree per session</text><rect x="520" y="150" width="340" height="74" fill="none" stroke="#b8b09a"/><circle cx="552" cy="172" r="7" fill="#1a1916"/><path d="M542,196 q10,-24 20,0 Z" fill="#1a1916"/><text x="552.0" y="212.0" font-size="10" fill="#1a1916" text-anchor="middle" font-weight="400" >session 1</text><line x1="650" y1="188" x2="860" y2="188" stroke="#1a1916" stroke-width="2.4"/><text x="642.0" y="192.0" font-size="10" fill="#1a1916" text-anchor="end" font-weight="400" >branch A</text><circle cx="680" cy="188" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="724" cy="188" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="768" cy="188" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="812" cy="188" r="6" fill="#1a1916"/><rect x="520" y="242" width="340" height="74" fill="none" stroke="#b8b09a"/><circle cx="552" cy="264" r="7" fill="#1a1916"/><path d="M542,288 q10,-24 20,0 Z" fill="#1a1916"/><text x="552.0" y="304.0" font-size="10" fill="#1a1916" text-anchor="middle" font-weight="400" >session 2</text><line x1="650" y1="280" x2="860" y2="280" stroke="#1a1916" stroke-width="2.4"/><text x="642.0" y="284.0" font-size="10" fill="#1a1916" text-anchor="end" font-weight="400" >branch B</text><circle cx="680" cy="280" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="724" cy="280" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="768" cy="280" r="5" fill="#f0eee5" stroke="#1a1916" stroke-width="1.6"/><circle cx="812" cy="280" r="6" fill="#1a1916"/><line x1="470" y1="84" x2="470" y2="340" stroke="#b8b09a"/><text x="40.0" y="366.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >Born 2026-06-16, the page says, after one agent switched the shared checkout's branch out from under another and a commit</text><text x="40.0" y="383.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >landed on the wrong branch.</text><text x="40.0" y="400.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >The fix is a floor each. A schematic of that one failure, not a record of the commits involved.</text></svg>