<script id="ai-voice">
// The voice box: one small formant synthesizer, the same in all four of this section's pieces, byte for byte.
// A glottal pulse (Rosenberg's shape) at a gliding pitch goes through five resonators in series, each a
// two-pole filter (Klatt's form) whose centre frequency and bandwidth move with the syllable; a burst of
// noise through its own resonator marks a stop's release; the output is differenced, as a mouth radiates.
// Plain functions, rendered offline into a buffer, so the picture, the sound and the headless check share one source.
const VB = (() => {
  const SR = 44100;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  // Piecewise-linear lookup in keyframes [[t, v], …], held flat past either end.
  function at(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return v0 + (v1 - v0) * (t - t0) / Math.max(t1 - t0, 1e-9); }
    return keys[keys.length - 1][1];
  }
  // Klatt's resonator: y[n] = A·x[n] + B·y[n−1] + C·y[n−2], unity gain at 0 Hz.
  function coef(F, BW) { const T = 1 / SR, C = -Math.exp(-2 * Math.PI * BW * T), B = 2 * Math.exp(-Math.PI * BW * T) * Math.cos(2 * Math.PI * F * T); return [1 - B - C, B, C]; }
  const DEF = { F4: [[0, 3300]], F5: [[0, 3850]], B1: [[0, 70]], B2: [[0, 90]], B3: [[0, 150]], B4: [[0, 250]], B5: [[0, 300]], AH: [[0, 0]] };
  // spec: { dur (s), F0, F1…F5, B1…B5, AV (voicing 0–1), AH (aspiration 0–1): keyframe lists; bursts: [{ t, dur, amp, f, bw }] }
  function render(spec, seed = 1) {
    const n = Math.round(spec.dur * SR), out = new Float64Array(n), r = rng(seed), S = Object.assign({}, DEF, spec);
    const y1 = new Float64Array(5), y2 = new Float64Array(5); let cf = [], ph = 0, prev = 0, nz = 0;
    const bursts = (spec.bursts || []).map((b) => ({ ...b, c: coef(b.f, b.bw), y1: 0, y2: 0 }));
    let F0 = 100, AV = 0, AH = 0;
    for (let i = 0; i < n; i++) {
      const t = i / SR;
      if (i % 16 === 0) {
        F0 = at(S.F0, t); AV = at(S.AV, t); AH = at(S.AH, t);
        cf = [1, 2, 3, 4, 5].map((k) => coef(at(S['F' + k], t), at(S['B' + k], t)));
      }
      ph += F0 / SR; if (ph >= 1) ph -= 1;
      const g = ph < 0.4 ? 0.5 * (1 - Math.cos(Math.PI * ph / 0.4)) : ph < 0.56 ? Math.cos(Math.PI * (ph - 0.4) / 0.32) : 0;
      nz = 0.6 * nz + 0.4 * (r() * 2 - 1);
      let x = AV * g + AH * nz * 0.5;
      for (let k = 0; k < 5; k++) { const [A, B, C] = cf[k]; const y = A * x + B * y1[k] + C * y2[k]; y2[k] = y1[k]; y1[k] = y; x = y; }
      for (const b of bursts) if (t >= b.t && t < b.t + b.dur * 4) {
        const e = b.amp * Math.exp(-(t - b.t) / b.dur) * (r() * 2 - 1);
        const y = b.c[0] * e + b.c[1] * b.y1 + b.c[2] * b.y2; b.y2 = b.y1; b.y1 = y; x += y;
      }
      out[i] = x - prev; prev = x;
    }
    return out;
  }
  // ── the syllables ──
  // ba · da · ga on one dial, c from 0 (ba) through 0.5 (da) to 1 (ga): the second and third formants start at the
  // lips' (low), the tongue tip's (F2 high) or the tongue body's (F2 and F3 pinched together) place and glide to "ah".
  const PL = { ba: { F2: 900, F3: 2100, bf: 900, bbw: 1600, ba: 0.18 }, da: { F2: 1700, F3: 2750, bf: 3900, bbw: 1600, ba: 0.069 }, ga: { F2: 1950, F3: 2150, bf: 2000, bbw: 450, ba: 0.1 } };
  function place(c) { const a = c <= 0.5 ? PL.ba : PL.da, b = c <= 0.5 ? PL.da : PL.ga, u = c <= 0.5 ? c / 0.5 : (c - 0.5) / 0.5, m = {}; for (const k in a) m[k] = a[k] + (b[k] - a[k]) * u; return m; }
  const REL = 0.06; // the release, in seconds from the buffer's start: the burst, and the instant the lips (or tongue) let go
  function syllable(c = 0) {
    const p = place(c), R = REL;
    return { dur: 0.46, F0: [[0, 128], [R + 0.1, 122], [0.42, 96]],
      F1: [[0, 250], [R, 250], [R + 0.04, 730]], F2: [[0, p.F2], [R, p.F2], [R + 0.045, 1220]], F3: [[0, p.F3], [R, p.F3], [R + 0.045, 2560]],
      B1: [[0, 60], [R + 0.04, 90]], AV: [[0, 0], [R + 0.006, 0], [R + 0.02, 1], [0.34, 1], [0.42, 0]], AH: [[0, 0], [R, 0.25], [R + 0.012, 0]],
      bursts: [{ t: R, dur: 0.004, amp: p.ba, f: p.bf, bw: p.bbw }] };
  }
  // Two names, one on each side of a crossover: "Laurel" lives low (its F1 and F2 under 1.6 kHz), "Yanny" lives high
  // (its F2 and F3 glides above it). Their syllables are timed to land together.
  function laurel() {

  UI.onStop(() => { S.playing = false; chain = null; });
  function setEar(f, v) { if (v === 'phone') { f.type = 'highpass'; f.frequency.value = 500; f.Q.value = 0.707; } else if (v === 'dull') { f.type = 'lowpass'; f.frequency.value = 2000; f.Q.value = 0.707; } else { f.type = 'allpass'; f.frequency.value = 1000; } }
  function setTilt(T, now) { S.T = Math.max(-SW.MAX, Math.min(SW.MAX, T)); if (chain) { const t = UI.ctx().currentTime; chain.lo.gain.setTargetAtTime(-S.T / 2, t, now ? 0.001 : 0.03); chain.hi.gain.setTargetAtTime(S.T / 2, t, now ? 0.001 : 0.03); chain.mk.gain.setTargetAtTime(Math.pow(10, SW.makeup(MK, S.T) / 20), t, now ? 0.001 : 0.03); } meter(); }

  // ── the encounter ──
  $('start').onclick = () => (S.playing ? UI.stop() : sound(S.step === 2 ? S.half : 'both'));
  document.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => { if (!S.playing && !S.trail.length) return; S.last = b.dataset.w; S.trail.push({ T: S.T, a: b.dataset.w }); paint(); note(); }));
  $('level').onclick = () => setTilt(0);
  function paint() { document.querySelectorAll('[data-w]').forEach((b) => b.classList.toggle('picked', b.dataset.w === S.last)); $('start').textContent = S.playing ? 'Stop' : S.trail.length ? 'Play' : 'Start: say the name'; }
  function note() {
    if (S.step !== 0) { $('note').innerHTML = ''; return; }
    if (!S.trail.length) { $('note').innerHTML = ''; return; }
    const y = S.trail.filter((t) => t.a === 'yanny'), l = S.trail.filter((t) => t.a === 'laurel');
    $('note').innerHTML = S.trail.length === 1 ? 'Now slide the weight along the beam and answer again when the name changes, or doesn’t.'
      : y.length && l.length ? `<span style="color:var(--red)">Both names, from one sound.</span> Your Laurels sit at ${(l.reduce((s, t) => s + t.T, 0) / l.length).toFixed(0)} dB on average, your Yannys at ${(y.reduce((s, t) => s + t.T, 0) / y.length).toFixed(0)} dB. Nothing moved but the weight.`
      : `So far, only ${y.length ? 'Yanny' : l.length ? 'Laurel' : 'neither'}. Slide the weight all the way to the other end.`;
  }
  // dragging the weight
  let drag = false;
  const toT = (e) => { const r = $('stage').getBoundingClientRect(), x = e.clientX - r.left, w = r.width, half = Math.min(w * 0.42, 360); return ((x - w / 2) / half) * SW.MAX; };
  $('stage').addEventListener('pointerdown', (e) => { if (STEPS[S.step].key === 'test') return; drag = true; $('stage').setPointerCapture(e.pointerId); setTilt(toT(e)); });
  $('stage').addEventListener('pointermove', (e) => { if (drag) setTilt(toT(e)); });
  $('stage').addEventListener('pointerup', () => { drag = false; });
  $('stage').addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') setTilt(S.T - 1); if (e.key === 'ArrowRight') setTilt(S.T + 1); });
  $('stage').tabIndex = 0;

  function seg(id, cb) { document.querySelectorAll(`#${id} button`).forEach((b) => (b.onclick = () => { document.querySelectorAll(`#${id} button`).forEach((x) => x.setAttribute('aria-pressed', x === b)); cb(b.dataset.v); })); }
  seg('segHalf', (v) => { S.half = v; sound(v); paint(); });
  seg('segEar', (v) => { S.ear = v; if (chain) setEar(chain.ear, v); else sound('both'); paint(); meter(); });

  // ── the test ──
  function newTest() { S.test = { A: SW.stair(SW.STARTS[0]), B: SW.stair(SW.STARTS[1]), n: 0, cur: null, played: false, done: false }; pick(); }
  function pick() { const T = S.test, a = T.A.track.length < SW.PER, b = T.B.track.length < SW.PER; T.cur = a && b ? (Math.random() < 0.5 ? 'A' : 'B') : a ? 'A' : b ? 'B' : null; if (!T.cur) T.done = true; }
  function buildTest() {
    const T = S.test; $('tLabel').textContent = T.done ? 'all twenty answered' : `trial ${T.n + 1} of ${2 * SW.PER}`; $('tPlay').disabled = T.done;
    document.querySelectorAll('[data-t]').forEach((b) => (b.disabled = T.done || !T.played));
    $('tResult').innerHTML = T.done ? verdict() : `<p class="hint" style="margin-top:10px">${T.n} answered. Your flip point shows after the twentieth.</p>`;
  }
  $('tPlay').onclick = async () => { const T = S.test, st = T[T.cur]; S.ear = 'flat'; S.T = st.T; await sound('both', false); setTilt(st.T, true); T.played = true; buildTest(); };
  document.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { const T = S.test; if (T.done || !T.played) return; UI.stop(); SW.answer(T[T.cur], b.dataset.t); T.n++; T.played = false; pick(); buildTest(); }));
  $('tAgain').onclick = () => { UI.stop(); newTest(); buildTest(); };
  function verdict() {
    const T = S.test, v = SW.verdict(T.A, T.B), f = (x) => (x == null ? '—' : (x >= 0 ? '+' : '') + x.toFixed(1) + ' dB');
    // both tracks, drawn: tilt against trial, your answers in red
    const W = 520, H = 150, X = (k) => 30 + k * (W - 40) / (SW.PER - 1), Y = (t) => H / 2 - t / SW.MAX * (H / 2 - 12);
    const track = (st, dash) => `<polyline fill="none" stroke="#141414" stroke-width="1" ${dash ? 'stroke-dasharray="4 3"' : ''} points="${st.track.map((x, k) => X(k) + ',' + Y(x.T)).join(' ')}"/>` + st.track.map((x, k) => `<text x="${X(k)}" y="${Y(x.T) - 5}" font-size="11" text-anchor="middle" fill="#d1301c" font-family="Cormorant Garamond, serif" font-style="italic">${x.a === 'yanny' ? 'Y' : x.a === 'laurel' ? 'L' : '·'}</text>`).join('');
    const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block;margin-top:10px"><line x1="30" x2="${W - 10}" y1="${Y(0)}" y2="${Y(0)}" stroke="#c9c6bd"/>${[-18, 18].map((t) => `<text x="0" y="${Y(t) + 4}" font-size="9" fill="#7a7a7a" font-family="JetBrains Mono, monospace">${t > 0 ? '+' : ''}${t}</text>`).join('')}${v.flip != null ? `<line x1="30" x2="${W - 10}" y1="${Y(v.flip)}" y2="${Y(v.flip)}" stroke="#d1301c" stroke-dasharray="2 3"/>` : ''}${track(T.A, false)}${track(T.B, true)}</svg>`;
    const say = {
      found: `Your flip point: <b>${f(v.flip)}</b> (from below ${f(v.a)}, from above ${f(v.b)}). ${v.flip < -1 ? 'You hear Yanny even with the top of the sound turned down: you weight the high frequencies, the page’s Yanny listener.' : v.flip > 1 ? 'You need the top turned up before Yanny comes: you weight the low frequencies, the page’s Laurel listener.' : 'You flip near a level beam: your weighting sits in the middle.'} The direction is the page’s: your Yannys sat ${v.gap.toFixed(1)} dB higher than your Laurels. With the brightness caveat above.`,
      names: `“Neither” ${v.neither} times in 20. For your ear these synthetic names are not names, and this says nothing about the mechanism. That is this synthesizer failing, and worth knowing.`,
      one: `Only one name, across everything the staircases played. Either the tilt never moved your reading within ±24 dB, or this sound holds one name better than the other for you.`,
      reversed: `Your answers ran against the page: your Yannys sat ${(-v.gap).toFixed(1)} dB lower on the beam than your Laurels. For you, on this sound, the Yanny cue did not sit in the high frequencies.`,
      noflip: `No flip point: ${v.a == null ? 'the staircase from below' : 'the staircase from above'} turned round fewer than three times, so it ran to an end of the beam. Your flip, if there is one, is beyond ±24 dB, or the answers never settled.`,
      unsettled: `The two staircases settled ${Math.abs(v.a - v.b).toFixed(1)} dB apart (from below ${f(v.a)}, from above ${f(v.b)}): more than 6 dB, so where you flip depends on where you came from. No single flip point.`,
    }[v.kind];
    return `${svg}<p class="hint">solid: the staircase from −18 · dashed: from +18 · red: what you heard${v.flip != null ? ', and your flip point' : ''}</p><p class="verdict">${say}</p>`;
  }

  // ── the walk ──
  function show(i, s) {
    S.step = i; const k = s.key;
    $('sEye').textContent = `Step ${i + 1} of ${STEPS.length}`; $('sTitle').textContent = s.title; $('sSay').textContent = s.say;
    $('lead').textContent = 'A name, said over and over, balanced on a beam.';
    $('hearRow').hidden = k === 'test'; $('halfRow').hidden = k !== 'halves'; $('earRow').hidden = k !== 'ears'; $('testBox').hidden = k !== 'test';
    $('spec').hidden = k === 'hear' || k === 'test';
    if (k === 'test') { if (!S.test) newTest(); buildTest(); }
    if (k !== 'ears') { S.ear = 'flat'; document.querySelectorAll('#segEar button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === 'flat')); }
    if (k === 'ears') setTilt(0);
    for (const [a, b] of [['eq1', 0], ['eq1w', 1]]) $(a).textContent = (s.eq || ['', ''])[b];
    for (const [a, b] of [['eq2', 0], ['eq2w', 1]]) $(a).textContent = (s.eq2 || ['', ''])[b];
    paint(); note(); meter();
  }

  // ── what each layer holds: spectra averaged over the voiced part, on a log axis, for drawing and the meter ──
  function avgSpec(x) { const N = 4096, P = new Float64Array(N / 2); let n = 0; for (let s = 0; s + N <= x.length + N; s += 1024) { const re = new Float64Array(N), im = new Float64Array(N); for (let i = 0; i < N; i++) { const j = s + i - N / 2; re[i] = (j >= 0 && j < x.length ? x[j] : 0) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / N)); } VB.fft(re, im); for (let k = 0; k < N / 2; k++) P[k] += re[k] * re[k] + im[k] * im[k]; n++; } return { P, df: SR / N }; }
  const SPEC = { laurel: avgSpec(NM.laurel), yanny: avgSpec(NM.yanny) };
  function bandDb(T) { // high side minus low side, in dB, of the mix through the tilt (and the ear model)
    const c = SW.shelves(T), ear = S.ear === 'phone' ? VB.biquad('highpass', 500, 0.707) : S.ear === 'dull' ? VB.biquad('lowpass', 2000, 0.707) : null; let lo = 0, hi = 0;
    for (const L of ['laurel', 'yanny']) { const { P, df } = SPEC[L]; for (let k = 2; k < P.length; k++) { const f = k * df; if (f > 8000) break; const gdb = VB.gainAt(c.low, f) + VB.gainAt(c.high, f) + (ear ? VB.gainAt(ear, f) : 0); const e = P[k] * Math.pow(10, gdb / 10); if (f < VB.XO) lo += e; else hi += e; } }
    return 10 * Math.log10(hi / lo);
  }
  function meter() {
    const k = STEPS[S.step].key; if (k === 'test') { $('meter').innerHTML = ''; return; }
    $('meter').innerHTML = `tilt <b>${S.T >= 0 ? '+' : ''}${S.T.toFixed(1)} dB</b> · makeup <b>${SW.makeup(MK, S.T) >= 0 ? '+' : ''}${SW.makeup(MK, S.T).toFixed(1)} dB</b>, loudness held · energy above 1.6 kHz against below it: <b>${bandDb(S.T).toFixed(1)} dB</b>${S.ear !== 'flat' ? ` · through ${S.ear === 'phone' ? 'the thinned-lows path' : 'the fading-highs path'}` : ''}`;
  }

  // ── drawing ──
  const INK = '#141414', PAPER = '#f4f2ec', RED = '#d1301c', RULE = '#c9c6bd', INK3 = '#7a7a7a';
  function seesaw(g, w, h) {
    g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h * 0.5, half = Math.min(w * 0.42, 360), hidden = STEPS[S.step].key === 'test';
    if (hidden) { g.strokeStyle = 'rgba(20,20,20,0.16)'; for (let x = -h; x < w; x += 9) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + h, 0); g.stroke(); } g.fillStyle = INK; g.font = 'italic 22px "Cormorant Garamond", serif'; g.textAlign = 'center'; g.fillText('the beam is hidden', cx, cy); return; }
    const ang = (S.T / SW.MAX) * 0.33;
    // the fulcrum, in parallel lines
    g.strokeStyle = INK; g.lineWidth = 1.2;
    for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(cx - 34 + k * 3, cy + 66); g.lineTo(cx, cy + 6 + k * 5); g.lineTo(cx + 34 - k * 3, cy + 66); g.stroke(); }
    g.beginPath(); g.moveTo(cx - 70, cy + 66); g.lineTo(cx + 70, cy + 66); g.stroke();
    // the beam, seven parallel lines that bend nowhere
    g.save(); g.translate(cx, cy); g.rotate(ang);
    for (let k = 0; k < 7; k++) { g.lineWidth = k === 3 ? 1.8 : 1; g.strokeStyle = k === 3 ? INK : 'rgba(20,20,20,0.5)'; g.beginPath(); g.moveTo(-half, -9 + k * 3); g.lineTo(half, -9 + k * 3); g.stroke(); }
    g.font = '10px "JetBrains Mono", monospace'; g.fillStyle = INK3; g.textAlign = 'left'; g.fillText('LOW', -half, 24); g.textAlign = 'right'; g.fillText('HIGH', half, 24);
    for (let d = -24; d <= 24; d += 6) { const x = d / SW.MAX * half; g.strokeStyle = RULE; g.beginPath(); g.moveTo(x, 12); g.lineTo(x, 17); g.stroke(); }
    // your answers, where you gave them
    S.trail.forEach((t, i) => { const x = t.T / SW.MAX * half; g.fillStyle = RED; g.font = 'italic 15px "Cormorant Garamond", serif'; g.textAlign = 'center'; g.fillText(t.a === 'yanny' ? 'Y' : t.a === 'laurel' ? 'L' : '·', x, -20 - (i % 4) * 13); });
    // the weight
    const bx = S.T / SW.MAX * half; g.fillStyle = INK; g.beginPath(); g.arc(bx, -24, 15, 0, 2 * Math.PI); g.fill();
    g.strokeStyle = PAPER; g.lineWidth = 1; for (let r = 4; r < 15; r += 4) { g.beginPath(); g.arc(bx, -24, r, 0, 2 * Math.PI); g.stroke(); }
    g.restore();
    // the name you hear, in red
    g.font = 'italic 40px "Cormorant Garamond", serif'; g.textAlign = 'center';
    if (S.last) { g.fillStyle = RED; g.fillText(S.last === 'neither' ? '…' : S.last[0].toUpperCase() + S.last.slice(1), cx, 52); }
    else { g.fillStyle = 'rgba(20,20,20,0.25)'; g.fillText('?', cx, 52); }
    g.font = '11px "JetBrains Mono", monospace'; g.fillStyle = INK3; g.fillText(`${S.T >= 0 ? '+' : ''}${S.T.toFixed(0)} dB`, cx, h - 12);
  }
  function specDraw(g, w, h) {
    g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
    const x0 = 44, ww = w - 60, top = 10, bot = h - 26, F0 = 100, F1 = 8000, X = (f) => x0 + Math.log(f / F0) / Math.log(F1 / F0) * ww, Y = (db) => top + (-db / 60) * (bot - top);
    g.strokeStyle = RULE; g.fillStyle = INK3; g.font = '10px "JetBrains Mono", monospace'; g.textAlign = 'center'; g.lineWidth = 1;
    for (const f of [100, 250, 500, 1000, 2000, 4000, 8000]) { g.beginPath(); g.moveTo(X(f), top); g.lineTo(X(f), bot); g.stroke(); g.fillText(f >= 1000 ? f / 1000 + 'k' : String(f), X(f), h - 10); }
    const c = SW.shelves(S.T), ear = S.ear === 'phone' ? VB.biquad('highpass', 500, 0.707) : S.ear === 'dull' ? VB.biquad('lowpass', 2000, 0.707) : null;
    const gain = (f) => VB.gainAt(c.low, f) + VB.gainAt(c.high, f) + (ear ? VB.gainAt(ear, f) : 0);
    let mx = 0; for (const L of ['laurel', 'yanny']) for (const v of SPEC[L].P) mx = Math.max(mx, v);
    const show = S.step === 2 ? S.half : 'both';
    for (const L of ['laurel', 'yanny']) {
      if ((show === 'low' && L === 'yanny') || (show === 'high' && L === 'laurel')) continue;
      const { P, df } = SPEC[L]; g.beginPath(); g.moveTo(X(F0), bot);
      for (let px = 0; px <= ww; px += 2) { const f = F0 * Math.pow(F1 / F0, px / ww), k = Math.round(f / df); let m = 0; for (let j = Math.max(1, k - 2); j <= k + 2 && j < P.length; j++) m = Math.max(m, P[j]); const db = Math.max(-60, 10 * Math.log10(m / mx + 1e-12) + gain(f)); g.lineTo(x0 + px, Y(Math.min(0, db))); }
      g.lineTo(X(F1), bot); g.closePath(); g.fillStyle = L === 'laurel' ? 'rgba(20,20,20,0.55)' : 'rgba(20,20,20,0.22)'; g.fill();
    }
    // the filter itself
    g.strokeStyle = INK; g.lineWidth = 1.5; g.beginPath(); for (let px = 0; px <= ww; px += 2) { const f = F0 * Math.pow(F1 / F0, px / ww), y = Y(-30 + gain(f)); px ? g.lineTo(x0 + px, y) : g.moveTo(x0 + px, y); } g.stroke();
    g.setLineDash([3, 3]); g.strokeStyle = INK3; g.beginPath(); g.moveTo(X(VB.XO), top); g.lineTo(X(VB.XO), bot); g.stroke(); g.setLineDash([]);
    g.fillStyle = INK; g.textAlign = 'left'; g.fillText('dark: the “Laurel” layer · light: the “Yanny” layer · line: the filter (0 dB at the middle)', x0, top + 8);
  }
  function draw(ts) {
    requestAnimationFrame(draw); UI.frameTick(ts);
    const st = UI.fit($('stage')); seesaw(st.g, st.w, st.h);
    if (!$('spec').hidden) { const sp = UI.fit($('spec')); specDraw(sp.g, sp.w, sp.h); }
  }
  const W = UI.walk(STEPS, show);
  UI.sigil(); W.go(0); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
