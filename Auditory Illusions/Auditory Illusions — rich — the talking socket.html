<script id="ai-voice">
// The voice box: one small formant synthesizer, the same in all four of this section's pieces, byte for byte.
// A glottal pulse (Rosenberg's shape) at a gliding pitch goes through five resonators in series, each a
// two-pole filter (Klatt's form) whose centre frequency and bandwidth move with the syllable; a burst of
// noise through its own resonator marks a stop's release; the output is differenced, as a mouth radiates.
// Plain functions, rendered offline into a buffer, so the picture, the sound and the headless check share one source.
const VB = (() => {
  const SR = 44100;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  // Piecewise-linear lookup in keyframes [[t, v], …], held flat past either end.
  function at(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return v0 + (v1 - v0) * (t - t0) / Math.max(t1 - t0, 1e-9); }
    return keys[keys.length - 1][1];
  }
  // Klatt's resonator: y[n] = A·x[n] + B·y[n−1] + C·y[n−2], unity gain at 0 Hz.
  function coef(F, BW) { const T = 1 / SR, C = -Math.exp(-2 * Math.PI * BW * T), B = 2 * Math.exp(-Math.PI * BW * T) * Math.cos(2 * Math.PI * F * T); return [1 - B - C, B, C]; }
  const DEF = { F4: [[0, 3300]], F5: [[0, 3850]], B1: [[0, 70]], B2: [[0, 90]], B3: [[0, 150]], B4: [[0, 250]], B5: [[0, 300]], AH: [[0, 0]] };
  // spec: { dur (s), F0, F1…F5, B1…B5, AV (voicing 0–1), AH (aspiration 0–1): keyframe lists; bursts: [{ t, dur, amp, f, bw }] }
  function render(spec, seed = 1) {
    const n = Math.round(spec.dur * SR), out = new Float64Array(n), r = rng(seed), S = Object.assign({}, DEF, spec);
    const y1 = new Float64Array(5), y2 = new Float64Array(5); let cf = [], ph = 0, prev = 0, nz = 0;
    const bursts = (spec.bursts || []).map((b) => ({ ...b, c: coef(b.f, b.bw), y1: 0, y2: 0 }));
    let F0 = 100, AV = 0, AH = 0;
    for (let i = 0; i < n; i++) {
      const t = i / SR;
      if (i % 16 === 0) {
        F0 = at(S.F0, t); AV = at(S.AV, t); AH = at(S.AH, t);
        cf = [1, 2, 3, 4, 5].map((k) => coef(at(S['F' + k], t), at(S['B' + k], t)));
      }
      ph += F0 / SR; if (ph >= 1) ph -= 1;
      const g = ph < 0.4 ? 0.5 * (1 - Math.cos(Math.PI * ph / 0.4)) : ph < 0.56 ? Math.cos(Math.PI * (ph - 0.4) / 0.32) : 0;
      nz = 0.6 * nz + 0.4 * (r() * 2 - 1);
      let x = AV * g + AH * nz * 0.5;
      for (let k = 0; k < 5; k++) { const [A, B, C] = cf[k]; const y = A * x + B * y1[k] + C * y2[k]; y2[k] = y1[k]; y1[k] = y; x = y; }
      for (const b of bursts) if (t >= b.t && t < b.t + b.dur * 4) {
        const e = b.amp * Math.exp(-(t - b.t) / b.dur) * (r() * 2 - 1);
        const y = b.c[0] * e + b.c[1] * b.y1 + b.c[2] * b.y2; b.y2 = b.y1; b.y1 = y; x += y;
      }
      out[i] = x - prev; prev = x;
    }
    return out;
  }
  // ── the syllables ──
  // ba · da · ga on one dial, c from 0 (ba) through 0.5 (da) to 1 (ga): the second and third formants start at the
  // lips' (low), the tongue tip's (F2 high) or the tongue body's (F2 and F3 pinched together) place and glide to "ah".
  const PL = { ba: { F2: 900, F3: 2100, bf: 900, bbw: 1600, ba: 0.18 }, da: { F2: 1700, F3: 2750, bf: 3900, bbw: 1600, ba: 0.069 }, ga: { F2: 1950, F3: 2150, bf: 2000, bbw: 450, ba: 0.1 } };
  function place(c) { const a = c <= 0.5 ? PL.ba : PL.da, b = c <= 0.5 ? PL.da : PL.ga, u = c <= 0.5 ? c / 0.5 : (c - 0.5) / 0.5, m = {}; for (const k in a) m[k] = a[k] + (b[k] - a[k]) * u; return m; }
  const REL = 0.06; // the release, in seconds from the buffer's start: the burst, and the instant the lips (or tongue) let go
  function syllable(c = 0) {
    const p = place(c), R = REL;
    return { dur: 0.46, F0: [[0, 128], [R + 0.1, 122], [0.42, 96]],
      F1: [[0, 250], [R, 250], [R + 0.04, 730]], F2: [[0, p.F2], [R, p.F2], [R + 0.045, 1220]], F3: [[0, p.F3], [R, p.F3], [R + 0.045, 2560]],
      B1: [[0, 60], [R + 0.04, 90]], AV: [[0, 0], [R + 0.006, 0], [R + 0.02, 1], [0.34, 1], [0.42, 0]], AH: [[0, 0], [R, 0.25], [R + 0.012, 0]],
      bursts: [{ t: R, dur: 0.004, amp: p.ba, f: p.bf, bw: p.bbw }] };
  }
  // Two names, one on each side of a crossover: "Laurel" lives low (its F1 and F2 under 1.6 kHz), "Yanny" lives high
  // (its F2 and F3 glides above it). Their syllables are timed to land together.
  function laurel() {

    const loops = Math.max(1, S.start ? Math.round((performance.now() - S.start) / 600) : 1);
    const extra = [...new Set(S.notes.filter((x) => !PW.said(x.w)).map((x) => x.w.toLowerCase()))];
    $('reveal').innerHTML = `The wall said two words, “no” and “way”, ${loops === 1 ? 'once' : loops + ' times'} each so far, and nothing else. ${extra.length ? `<span style="color:var(--red)">${extra.map((w) => '“' + w + '”').join(', ')}</span>: you supplied ${extra.length === 1 ? 'that' : 'those'}.` : 'So far you have written only what it said; give it longer.'} Step 2 shows the loop.`;
  }
  // the socket
  const plate = (w, h) => { const s = Math.min(78, h * 0.24), face = STEPS[S.step] && STEPS[S.step].key === 'face'; return { cx: w / 2, cy: face ? 150 : h * 0.48, s }; };
  $('face').onclick = () => { if (S.faced) return; S.faced = PW.named(S.feats); $('faceT').textContent = `after ${((performance.now() - S.shownAt) / 1000).toFixed(0)} s on the wall. The plate never changed.`; };

  // step 2 controls
  function seg(id, cb) { document.querySelectorAll(`#${id} button`).forEach((b) => (b.onclick = () => { document.querySelectorAll(`#${id} button`).forEach((x) => x.setAttribute('aria-pressed', x === b)); cb(b.dataset.v); })); }
  seg('segVoice', (v) => { S.voice = v; UI.stop(); paint(); $('ttsNote').textContent = v === 'tts' ? 'one utterance at a time, from the middle: no offset, no sides' : ''; $('off').disabled = v === 'tts'; });
  $('off').oninput = () => { S.off = +$('off').value; $('offV').textContent = S.off + ' ms'; if (loopRun) startLoop(S.off); meter(); };
  $('offV').textContent = '300 ms';

  // the test: two runs of 60 s
  function newTest() { const order = UI.shuffled(['two', 'one']); S.test = { order, k: 0, running: null, words: { two: [], one: [] }, done: false, until: 0 }; }
  function buildTest() {
    const T = S.test; const name = (r) => (r === 'two' ? 'two sides, one word apart' : 'one place, both sides in line');
    $('tLabel').textContent = T.done ? 'both runs done' : `run ${T.k + 1} of 2: ${name(T.order[T.k])}`;
    $('tPlay').disabled = T.done || !!T.running;
    if (T.done) {
      const nw = (r) => [...new Set(T.words[r].filter((w) => !PW.said(w)).map((w) => w.toLowerCase()))];
      const a = nw('two'), b = nw('one');
      const v = a.length > b.length ? `Two sides gave you ${a.length} new word${a.length === 1 ? '' : 's'}, one place gave ${b.length}. For you, today, the second side added words, as the page’s setup implies.` : a.length === b.length ? `${a.length} new words from each. The second side made no difference you could count.` : `One place gave you more new words (${b.length}) than two sides did (${a.length}). The second speaker wasn’t needed for you: the repetition did it alone.`;
      $('tResult').innerHTML = `<table class="marks"><tr><th>run</th><th>new words</th><th>you wrote</th></tr><tr><td>two sides</td><td>${a.length}</td><td class="r">${a.join(' · ')}</td></tr><tr><td>one place</td><td>${b.length}</td><td class="r">${b.join(' · ')}</td></tr></table><p class="verdict">${v} The page says phantom words come from two words overlapped from two speakers; if one place gives as many new words as two, the second speaker wasn’t needed, and what was heard is the older effect of a word repeated. The run that came first had a fresher ear; play the test again for the other order.</p>`;
    } else $('tResult').innerHTML = '<p class="hint" style="margin-top:10px">Write in the notebook above as the run plays. The tally shows after both runs.</p>';
  }
  $('tPlay').onclick = async () => { const T = S.test; const r = T.order[T.k]; T.running = r; await startLoop(r === 'two' ? 300 : 0); T.until = performance.now() + 60000; buildTest(); };
  setInterval(() => {
    const T = S.test; if (!T || !T.running) { $('tClock').textContent = ''; return; }
    const left = Math.ceil((T.until - performance.now()) / 1000); $('tClock').textContent = left > 0 ? `${left} s left` : '';
    if (left <= 0 || !S.playing) { UI.stop(); T.running = null; T.k++; if (T.k >= 2) T.done = true; buildTest(); paint(); }
  }, 250);

  // ── the walk ──
  function show(i, s) {
    S.step = i; const k = s.key;
    $('sEye').textContent = `Step ${i + 1} of ${STEPS.length}`; $('sTitle').textContent = s.title; $('sSay').textContent = s.say;
    $('lead').textContent = 'A quiet wall, two speakers, a socket. Listen for a while.';
    $('listenRow').hidden = k === 'face' || k === 'why' ? false : false;
    $('start').hidden = k === 'test' || k === 'face'; $('faceRow').hidden = !(k === 'wall' || k === 'face');
    $('loopCtl').hidden = k !== 'loop'; $('testBox').hidden = k !== 'test'; $('lanes').hidden = !(k === 'loop' || k === 'why');
    $('stereo').hidden = !(k === 'wall' || k === 'test');
    $('stage').style.height = (k === 'face' ? 420 : 340) + 'px';
    if (k === 'test') { if (!S.test) newTest(); if (S.test.running) { S.test.running = null; } buildTest(); }
    $('eq1').textContent = (s.eq || ['', ''])[0]; $('eq1w').textContent = (s.eq || ['', ''])[1];
    reveal(); paint(); meter();
  }
  function meter() {
    const k = STEPS[S.step].key;
    $('meter').innerHTML = k === 'loop' ? `one loop <b>${PW.PERIOD * 1000} ms</b> · each word <b>${PW.WORD * 1000} ms</b> · the right side <b>${S.off} ms</b> behind the left${S.off === 0 ? ': one sound, from the middle' : S.off === 300 ? ': one word behind' : ''}` : '';
  }

  // ── drawing ──
  const INK = '#141414', PAPER = '#f4f2ec', RED = '#d1301c', RULE = '#c9c6bd', INK3 = '#7a7a7a';
  const envOf = (x) => { const h = 441, e = []; for (let i = 0; i < x.length; i += h) { let s = 0; for (let j = i; j < Math.min(x.length, i + h); j++) s += x[j] * x[j]; e.push(Math.sqrt(s / h)); } const m = Math.max(...e); return e.map((v) => v / m); };
  const ENV = { no: envOf(W2.no), way: envOf(W2.way) };
  // what each side is saying now: [word, level 0–1] for left and right
  function nowSaying() {
    if (!loopRun || !UI.ctx()) return null;
    const t = UI.ctx().currentTime - loopRun.at; if (t < 0) return null;
    const side = (tt) => { const p = ((tt % PW.PERIOD) + PW.PERIOD) % PW.PERIOD, w = p < PW.WORD ? 'no' : 'way', k = Math.floor((p % PW.WORD) * 100); return [w, ENV[w][k] || 0]; };
    return [side(t), side(t - loopRun.d / 1000)];
  }
  function grille(g, x, y, r, lev) { g.strokeStyle = INK; for (let k = 0; k < 7; k++) { g.lineWidth = 1; g.beginPath(); g.arc(x, y, r * (0.25 + k * 0.12) * (1 + lev * 0.05 * (7 - k)), 0, 2 * Math.PI); g.stroke(); } g.fillStyle = INK; g.beginPath(); g.arc(x, y, r * 0.18, 0, 2 * Math.PI); g.fill(); }
  function wall(g, w, h) {
    g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(20,20,20,0.07)'; g.lineWidth = 1; for (let y = 6; y < h; y += 6) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    const ns = nowSaying(), R = Math.min(52, w * 0.09);
    const still = UI.reduced(); grille(g, R + 24, h * 0.42, R, ns && !still ? ns[0][1] : 0); grille(g, w - R - 24, h * 0.42, R, ns && !still ? ns[1][1] : 0);
    g.font = '10px "JetBrains Mono", monospace'; g.fillStyle = INK3; g.textAlign = 'center'; g.fillText('LEFT', R + 24, h * 0.42 + R + 20); g.fillText('RIGHT', w - R - 24, h * 0.42 + R + 20);
    // the plate
    const { cx, cy, s } = plate(w, h);
    g.fillStyle = '#ebe8e0'; g.strokeStyle = INK; g.lineWidth = 1.5; const pw = s * 1.15, ph = s * 1.5;
    g.beginPath(); g.roundRect ? g.roundRect(cx - pw, cy - ph, pw * 2, ph * 2, 10) : g.rect(cx - pw, cy - ph, pw * 2, ph * 2); g.fill(); g.stroke();
    g.beginPath(); g.arc(cx, cy + ph * 0.86, 3, 0, 2 * Math.PI); g.stroke();
    S.feats.forEach((f, i) => {
      const x = cx + f.x * s, y = cy + f.y * s; g.save(); g.translate(x, y); g.rotate(f.a); g.fillStyle = INK;
      if (f.k === 'slot') g.fillRect(-4, -15, 8, 30); else { g.beginPath(); g.arc(0, -2, 9, Math.PI, 0); g.lineTo(9, 8); g.lineTo(-9, 8); g.closePath(); g.fill(); }
      g.restore();
      if (S.faced) { g.fillStyle = RED; g.font = 'italic 16px "Cormorant Garamond", serif'; g.textAlign = 'center'; g.fillText(S.faced[i], x, y + (S.faced[i] === 'mouth' ? 32 : -22)); }
    });
    // the notebook, around the wall
    const ws = S.notes.slice(-10);
    ws.forEach((n, i) => { const col = i % 2, row = Math.floor(i / 2); const x = col ? w * 0.68 : w * 0.32, y = 28 + row * 26; g.fillStyle = PW.said(n.w) ? INK : RED; g.font = 'italic 20px "Cormorant Garamond", serif'; g.textAlign = 'center'; g.fillText(n.w, x, y); });
    if (STEPS[S.step].key === 'face') gallery(g, w, h);
  }
  // three real sockets, small, along the bottom: US type B, UK type G, Australian type I
  function gallery(g, w, h) {
    const y = h - 46, xs = [w * 0.2, w * 0.5, w * 0.8]; g.font = '10px "JetBrains Mono", monospace'; g.textAlign = 'center';
    xs.forEach((x, i) => {
      g.strokeStyle = INK; g.lineWidth = 1; g.strokeRect(x - 26, y - 30, 52, 60); g.fillStyle = INK;
      if (i === 0) { g.fillRect(x - 14, y - 16, 4, 14); g.fillRect(x + 10, y - 16, 4, 14); g.beginPath(); g.arc(x, y + 12, 5, Math.PI, 0); g.lineTo(x + 5, y + 16); g.lineTo(x - 5, y + 16); g.fill(); }
      if (i === 1) { g.fillRect(x - 3, y - 20, 6, 12); g.fillRect(x - 18, y + 6, 12, 5); g.fillRect(x + 6, y + 6, 12, 5); }
      if (i === 2) { g.save(); g.translate(x - 11, y - 8); g.rotate(-0.55); g.fillRect(-2, -8, 4, 16); g.restore(); g.save(); g.translate(x + 11, y - 8); g.rotate(0.55); g.fillRect(-2, -8, 4, 16); g.restore(); g.fillRect(x - 2, y + 6, 4, 13); }
      g.fillStyle = INK3; g.fillText(['US, type B', 'UK, type G', 'Australia, type I'][i], x, y + 44);
    });
  }
  function lanes(g, w, h) {
    g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
    const x0 = 60, ww = w - 76, span = 2.4, d = (loopRun ? loopRun.d : S.off) / 1000, now = loopRun && UI.ctx() ? UI.ctx().currentTime - loopRun.at : 0;
    const X = (t) => x0 + (t / span) * ww;
    g.font = '10px "JetBrains Mono", monospace'; g.textAlign = 'right'; g.fillStyle = INK3; g.fillText('LEFT', x0 - 8, 36); g.fillText('RIGHT', x0 - 8, 80);
    for (const [row, off] of [[22, 0], [66, d]]) {
      for (let k = -1; k < span / PW.WORD + 2; k++) { const t0 = k * PW.WORD + off, word = (((k % 2) + 2) % 2) === 0 ? 'no' : 'way'; if (X(t0) > x0 + ww) break; const a = Math.max(x0, X(t0)), b = Math.min(x0 + ww, X(t0 + PW.WORD) - 2); if (b <= a) continue; g.strokeStyle = INK; g.lineWidth = 1; g.strokeRect(a, row, b - a, 22); g.fillStyle = INK; g.textAlign = 'center'; g.font = 'italic 15px "Cormorant Garamond", serif'; g.fillText(word, (a + b) / 2, row + 16); }
    }
    if (loopRun) { const p = x0 + ((now % span) / span) * ww; g.strokeStyle = INK; g.lineWidth = 1.5; g.beginPath(); g.moveTo(p, 14); g.lineTo(p, 96); g.stroke(); }
    g.font = '10px "JetBrains Mono", monospace'; g.fillStyle = INK3; g.textAlign = 'center'; for (let t = 0; t <= span + 1e-9; t += 0.6) g.fillText((t * 1000).toFixed(0) + ' ms', X(t), h - 8);
  }
  function draw(ts) {
    requestAnimationFrame(draw); UI.frameTick(ts);
    const st = UI.fit($('stage')); wall(st.g, st.w, st.h);
    if (!$('lanes').hidden) { const l = UI.fit($('lanes')); lanes(l.g, l.w, l.h); }
  }
  const W = UI.walk(STEPS, show);
  UI.sigil(); W.go(0); requestAnimationFrame(draw);
})();
</script>
</body>
