<script id="pc-core">
// The engine: pure, no DOM, no sound. The check script runs this text in Node.
const MF = (function () {
  const F0 = 100;                 // Hz, the period the three share
  const NS = [2, 3, 4];           // harmonic numbers played: 200, 300, 400 Hz
  const A = 0.1;                  // each partial's amplitude (peak of the sum 0.3, -10.5 dBFS)
  const SR = 48000;
  // The partials, shifted by the same Hz, or stretched (f = F0 * n^(1+s)), or with some switched off.
  function partials(o) {
    o = o || {};
    const shift = o.shift || 0, stretch = o.stretch || 0, on = o.on || [1, 1, 1];
    return NS.map((n, i) => ({ n: n, f: F0 * Math.pow(n, 1 + stretch) + shift, a: on[i] ? A : 0 })).filter(p => p.a > 0);
  }
  // What each partial says the period is, if it is harmonic n.
  function implied(ps) { return ps.map(p => p.f / p.n); }
  // Least-squares fundamental for the harmonic numbers played: the pattern-matching guess.
  function fit(ps) { let a = 0, b = 0; ps.forEach(p => { a += p.f * p.n; b += p.n * p.n; }); return b ? a / b : 0; }
  function spreadCents(ps) { const v = implied(ps); return v.length < 2 ? 0 : 1200 * Math.log2(Math.max.apply(null, v) / Math.min.apply(null, v)); }
  // The largest f0 >= lo for which every partial sits within tolCents of a whole multiple (n <= nmax): the shared period.
  function shared(fs, lo, tolCents, nmax) {
    lo = lo || 20; tolCents = tolCents || 3; nmax = nmax || 24;
    if (!fs.length) return null;
    const fmin = Math.min.apply(null, fs);
    for (let k = 1; k <= nmax; k++) {
      const f0 = fmin / k; if (f0 < lo) break;
      const ns = fs.map(f => Math.round(f / f0));
      if (ns.every((n, i) => n >= 1 && n <= nmax && Math.abs(1200 * Math.log2(fs[i] / (n * f0))) < tolCents)) return { f0: f0, ns: ns, ms: 1000 / f0 };
    }
    return null;
  }
  // The sum, sampled: for drawing and for the check.
  function wave(ps, t) { let s = 0; ps.forEach(p => { s += p.a * Math.sin(2 * Math.PI * p.f * t); }); return s; }
  // The chimes the reader matches against: harmonics 1..5, amplitudes 1/n, a bell-like decay.
  const CHIMES = [100, 200, 300, 400];
  function chimeParts(f0) { return [1, 2, 3, 4, 5].map(n => ({ f: f0 * n, a: 0.09 / n })); }
  // The low voice: a sawtooth (all harmonics, 1/n) on 100 Hz, through three vowel formants ("ah").
  const VOICE = { f0: 100, intonation: 10, intonationHz: 0.45, vibrato: 0.8, vibratoHz: 5.2,
    formants: [{ f: 700, q: 5, g: 1 }, { f: 1220, q: 8, g: 0.6 }, { f: 2600, q: 10, g: 0.35 }] };
  // The phone line: three highpass stages at 300 Hz and two lowpass stages at 3400 Hz, each a 2-pole Butterworth (Q 0.7071).
  const PHONE = { hp: 300, hpStages: 3, lp: 3400, lpStages: 2, q: Math.SQRT1_2 };
  // Magnitude of Web Audio's biquad (the RBJ cookbook forms it uses), at frequency f. q is linear here; the graph hands
  // a lowpass or highpass node 20·log10(q), since Web Audio reads their Q in dB (a bandpass Q it reads as linear).
  function biquadMag(type, fc, q, f, sr) {
    sr = sr || SR;
    const w0 = 2 * Math.PI * fc / sr, al = Math.sin(w0) / (2 * q), cw = Math.cos(w0);
    let b0, b1, b2; const a0 = 1 + al, a1 = -2 * cw, a2 = 1 - al;
    if (type === 'highpass') { b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2; }
    else if (type === 'lowpass') { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2; }
    else { b0 = al; b1 = 0; b2 = -al; } // bandpass, constant 0 dB peak
    const w = 2 * Math.PI * f / sr;
    const re = (c0, c1, c2) => c0 + c1 * Math.cos(-w) + c2 * Math.cos(-2 * w), im = (c0, c1, c2) => c1 * Math.sin(-w) + c2 * Math.sin(-2 * w);
    const nr = re(b0, b1, b2), ni = im(b0, b1, b2), dr = re(a0, a1, a2), di = im(a0, a1, a2);
    return Math.sqrt((nr * nr + ni * ni) / (dr * dr + di * di));
  }
  function phoneMag(f, sr) {
    let m = 1;
    for (let i = 0; i < PHONE.hpStages; i++) m *= biquadMag('highpass', PHONE.hp, PHONE.q, f, sr);
    for (let i = 0; i < PHONE.lpStages; i++) m *= biquadMag('lowpass', PHONE.lp, PHONE.q, f, sr);
    return m;
  }
  function formantMag(f, sr) { return VOICE.formants.reduce((s, F) => s + F.g * biquadMag('bandpass', F.f, F.q, f, sr), 0); }
  // The voice's harmonic n at f0: its level in, and after the phone line.
  function voiceHarm(n, f0, phone, sr) { const f = n * f0; return (1 / n) * formantMag(f, sr) * (phone ? phoneMag(f, sr) : 1); }
  return { F0, NS, A, SR, partials, implied, fit, spreadCents, shared, wave, CHIMES, chimeParts, VOICE, PHONE, biquadMag, phoneMag, formantMag, voiceHarm };
})();

<script>
// ───────────────────────── state ─────────────────────────
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = { step: 1, on: [0, 0, 0], awake: false, chosen: null, heardChimes: new Set(),
  fund: false, fundDb: 0, abFund: false, noise: false,
  shift: 0, stretch: 0, match: false, refF0: 110, matchLog: [],
  phone: false, voice: false };

// ───────────────────────── sound: nothing exists until the first click ─────────────────────────
// One graph builder for the live context and for the offline render the check script asks for.
function makeGraph(ctx) {
  const G = { ctx };
  G.comp = ctx.createDynamicsCompressor();
  G.comp.threshold.value = -3; G.comp.knee.value = 3; G.comp.ratio.value = 4; G.comp.attack.value = 0.01; G.comp.release.value = 0.25;
  G.master = ctx.createGain(); G.master.gain.value = 0;
  G.master.connect(G.comp); G.comp.connect(ctx.destination);
  G.an = ctx.createAnalyser(); G.an.fftSize = 16384; G.an.minDecibels = -110; G.an.maxDecibels = -10; G.an.smoothingTimeConstant = 0.5;
  G.comp.connect(G.an);
  const osc = (f, type) => { const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = f; const g = ctx.createGain(); g.gain.value = 0; o.connect(g); o.start(); return { o, g }; };
  // the three partials and the real fundamental
  G.p = MF.NS.map(n => { const v = osc(MF.F0 * n); v.g.connect(G.master); return v; });
  G.fund = osc(MF.F0); G.fund.g.connect(G.master);
  // the reference tone for matching: harmonics 1..5 at 1/n, sustained
  G.ref = [1, 2, 3, 4, 5].map(n => { const v = osc(110 * n); v.g.connect(G.master); v.n = n; return v; });
  // noise covering the bottom: white noise through two lowpass stages at 160 Hz
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), nd = nb.getChannelData(0);
  let seed = 12345; for (let i = 0; i < nd.length; i++) { seed = (seed * 1664525 + 1013904223) >>> 0; nd[i] = seed / 2147483648 - 1; }
  const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
  // Web Audio reads a lowpass or highpass Q in dB: 20·log10(0.7071) = -3.01 dB is the linear 0.7071 of a Butterworth stage.
  const qdB = q => 20 * Math.log10(q);
  const l1 = ctx.createBiquadFilter(), l2 = ctx.createBiquadFilter(); [l1, l2].forEach(f => { f.type = 'lowpass'; f.frequency.value = 160; f.Q.value = qdB(Math.SQRT1_2); });
  G.noiseG = ctx.createGain(); G.noiseG.gain.value = 0;
  ns.connect(l1).connect(l2).connect(G.noiseG).connect(G.master); ns.start();
  // the low voice: a sawtooth on 100 Hz with slow intonation and a little vibrato, through three formants
  const V = MF.VOICE;
  G.vsrc = ctx.createOscillator(); G.vsrc.type = 'sawtooth'; G.vsrc.frequency.value = V.f0;
  const lfo1 = ctx.createOscillator(), lg1 = ctx.createGain(); lfo1.frequency.value = V.intonationHz; lg1.gain.value = V.intonation; lfo1.connect(lg1).connect(G.vsrc.frequency); lfo1.start();
  const lfo2 = ctx.createOscillator(), lg2 = ctx.createGain(); lfo2.frequency.value = V.vibratoHz; lg2.gain.value = V.f0 * V.vibrato / 100; lfo2.connect(lg2).connect(G.vsrc.frequency); lfo2.start();
  const vsum = ctx.createGain(); vsum.gain.value = 0.35;
  V.formants.forEach(F => { const b = ctx.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = F.f; b.Q.value = F.q; const g = ctx.createGain(); g.gain.value = F.g; G.vsrc.connect(b).connect(g).connect(vsum); });
  G.vsrc.start();
  G.vDirect = ctx.createGain(); G.vDirect.gain.value = 0;
  G.vPhone = ctx.createGain(); G.vPhone.gain.value = 0;
  vsum.connect(G.vDirect).connect(G.master);
  let node = vsum;
  for (let i = 0; i < MF.PHONE.hpStages; i++) { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = MF.PHONE.hp; f.Q.value = qdB(MF.PHONE.q); node.connect(f); node = f; }
  for (let i = 0; i < MF.PHONE.lpStages; i++) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = MF.PHONE.lp; f.Q.value = qdB(MF.PHONE.q); node.connect(f); node = f; }
  node.connect(G.vPhone).connect(G.master);
  return G;
}
// Set every gain and frequency from the state. which: 'test' | 'ref' (the matcher and A/B alternate it).
function apply(G, st, instant, which) {
  const t = G.ctx.currentTime, tc = instant ? 0.004 : 0.03;
  const set = (param, v) => param.setTargetAtTime(v, t, tc);
  const testOn = which !== 'ref';

      el('button', { 'aria-pressed': 'false', onclick: async (e) => { S.abFund = !S.abFund; e.target.setAttribute('aria-pressed', String(S.abFund)); if (S.abFund) { S.fund = true; } if (!playing) await start(); if (S.abFund) startAB(1000); else stopAB(); refresh(); } }, 'A/B every second')),
    slider('the real 100 Hz, against each partial', -30, 0, 1, () => S.fundDb, v => { S.fundDb = v; }, v => (v === 0 ? '0' : v) + ' dB'),
    el('p', { class: 'pc-teach' }, 'An old objection: the inner ear distorts (this page’s combination tones), so two loud partials 100 Hz apart can make a real 100 Hz difference tone inside the cochlea, and that could be what you hear. The classic control is to bury the bottom in noise. Cover the band below about 160 Hz and listen: a difference tone in the ear is covered with it; a pitch read from the period is not. In the band round 100 Hz the noise sits about 10 dB under one partial’s power (the check script measures it in what this page plays), enough to cover a faint difference tone. Whether it covers the one in your ear at your volume, only your ear can say.'),
    el('div', { class: 'pc-row' }, toggle('Cover the bottom with noise', () => S.noise, v => { S.noise = v; })),
    el('div', { class: 'pc-read', id: 'live' }),
  ] },
  { n: 5, name: 'break the period', fig: 'the discs', right: 'the live spectrum', build: () => [
    el('p', { class: 'pc-teach' }, 'The second test. ', el('b', {}, 'Shift'), ' slides all three up by the same number of hertz: the gaps between them stay 100 Hz, but they stop being multiples of anything near 100. If pitch were the gap (the difference tone), it would stay at 100. If it is the period they share, it should move, and blur. ', el('b', {}, 'Stretch'), ' pulls them apart unevenly, so no period fits at all.'),
    slider('shift all three by', 0, 60, 1, () => S.shift, v => { S.shift = v; }, v => '+' + v + ' Hz'),
    slider('stretch (f = 100 · n^(1 + s))', 0, 0.25, 0.01, () => S.stretch, v => { S.stretch = v; }, v => 's = ' + v.toFixed(2)),
    el('p', { class: 'pc-teach' }, 'Then measure your own ear. ', el('b', {}, 'Match'), ' alternates the test tone with a plain reference tone (harmonics 1 to 5, the fundamental included). Slide the reference until the two sound like the same note, and press ', el('b', {}, 'Keep my match'), '. The readout keeps every match beside the two predictions: the gap, and the best common fit.'),
    el('div', { class: 'pc-row' },
      el('button', { 'aria-pressed': 'false', onclick: async (e) => { S.match = !S.match; e.target.setAttribute('aria-pressed', String(S.match)); if (!playing) await start(); if (S.match) startAB(900); else stopAB(); refresh(); } }, 'Match: alternate with the reference'),
      el('button', { onclick: () => { S.matchLog.push({ ref: S.refF0, shift: S.shift, stretch: S.stretch }); readout(); } }, 'Keep my match'),
      el('button', { onclick: () => { S.shift = 0; S.stretch = 0; go(5); } }, 'Back to unbroken')),
    slider('reference tone', 70, 160, 0.5, () => S.refF0, v => { S.refF0 = v; }, v => v.toFixed(1) + ' Hz'),
    eq('f̂₀ = Σ n·fₙ ⁄ Σ n²', 'The best common fit: the one fundamental that sits closest to all three partials, if they are harmonics 2, 3 and 4. It is the pattern-matching guess, one of the accounts; shifted by Δ, it moves by about 9Δ⁄29, roughly a third of the shift. The gap moves by nothing.'),
  ] },
  { n: 6, name: 'the phone line', fig: 'the discs, resting', right: 'the live spectrum', build: () => [
    el('p', { class: 'pc-teach' }, 'The last test is the page’s own example. A low voice, synthesized here (a buzzing source on 100 Hz with a slow rise and fall, through three vowel resonances: an “ah”, not a recording), and a phone line that cuts everything below about 300 Hz: three filter stages at 300 Hz, and two more above 3.4 kHz. Switch the line in. The spectrum empties below 300 Hz; the voice’s 100 Hz and most of its 200 Hz are gone. Does the voice get higher, or only thinner?'),
    el('div', { class: 'pc-row' }, toggle('Phone line, 300 Hz to 3.4 kHz', () => S.phone, v => { S.phone = v; })),
    el('div', { class: 'pc-read', id: 'live' }),
    eq('|H(100 Hz)| ≈ −57 dB,   |H(200 Hz)| ≈ −23 dB,   |H(1 kHz)| ≈ 0 dB', 'How much the line takes, at the voice’s first two harmonics and in the middle of the band: the check script computes these from the filters’ own formulas. Small speakers do the same to bass, and the same reading puts the low note back.'),
  ] },
];

const host = document.getElementById('steps'), tabs = document.getElementById('tabs'), playBtn = document.getElementById('play');
function go(n, force) {
  if (n < 1 || n > STEPS.length) return;
  if ((n !== S.step || force) && playing) stop();
  stopAB(); S.match = false; S.abFund = false;
  S.step = n; S.voice = n === 6;
  if (n >= 2) { S.on = n === 6 ? [0, 0, 0] : [1, 1, 1]; [0, 1, 2].forEach(i => { rot[i] = S.on[i] ? 0 : 180; }); }
  if (n !== 4) { S.fund = false; S.noise = false; }
  if (n !== 5) { S.shift = 0; S.stretch = 0; }
  if (n !== 6) S.phone = false;
  const st = STEPS[n - 1];
  host.replaceChildren(el('section', { class: 'pc-step', 'aria-label': 'step ' + n },
    el('div', { class: 'pc-stephead' }, el('span', {}, n + ' · ' + st.name), el('span', {}, 'step ' + n + ' of ' + STEPS.length)), st.build()));
  document.getElementById('figLabel').textContent = st.fig;
  document.getElementById('figPanel').classList.toggle('pc-hidden', n >= 4);
  document.querySelector('.pc-stage').classList.toggle('pc-one', n >= 4);
  document.getElementById('figNote').textContent = n <= 3 ? 'tap a disc to turn it' : '';
  document.getElementById('rightLabel').textContent = st.right;
  right.innerHTML = '';
  if (n === 1) { showForks(S.awake); cv = null; }
  else { cv = el('canvas', {}); right.append(cv); }
  tabs.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(i + 1 === n)));
  document.getElementById('back').disabled = n === 1;
  document.getElementById('next').disabled = n === STEPS.length;
  if (n === 2) says(S.chosen ? 'You kept the fork at ' + S.chosen + ' Hz. Here is what is actually playing.' : 'Here is what is actually playing.');
  else if (n === 3) says('Three waves, one period.');
  else if (n === 4) says('Bring the real one in. Take it away.');
  else if (n === 5) says('Make them disagree.');
  else if (n === 6) says('A low voice down a phone line.');
  else says(S.awake ? 'The discs are awake. Tap one to turn it.' : 'Silent until you press. Headphones or good speakers help.');
  syncPlay(); draw();
}
STEPS.forEach(s => tabs.append(el('button', { onclick: () => go(s.n) }, s.n + ' · ' + s.name)));
playBtn.addEventListener('click', () => {
  if (playing) { stop(); draw(); return; }
  const p = (S.step === 1 && !S.awake) ? wake() : start();
  p.catch(e => says('Sound could not start: ' + e.message));
});
document.getElementById('back').addEventListener('click', () => go(S.step - 1));
document.getElementById('next').addEventListener('click', () => go(S.step + 1));
window.addEventListener('resize', () => draw());
(function sigil() { let d = ''; for (let i = 0; i <= 400; i++) { const t = i / 400 * Math.PI * 2; d += (i ? 'L' : 'M') + (9 * Math.sin(3 * t + Math.PI / 2)).toFixed(2) + ' ' + (9 * Math.sin(2 * t)).toFixed(2); } document.getElementById('sigil').setAttribute('d', d); })();

// For the check script: render this page's own graph offline and measure it. Makes no sound and no live context.
window.PC_RENDER = async function (opts) {
  opts = opts || {};
  const sr = 48000, secs = opts.secs || 2, ctx = new OfflineAudioContext(1, sr * secs, sr);
  const g = makeGraph(ctx);
  const st = Object.assign({}, S, { on: [1, 1, 1], fund: false, fundDb: 0, abFund: false, noise: false, shift: 0, stretch: 0, phone: false, voice: false }, opts.state || {});
  apply(g, st, true, 'test'); g.master.gain.value = 1;
  const buf = await ctx.startRendering(), x = buf.getChannelData(0);
  const from = Math.floor(sr * 0.5), N = x.length - from;   // skip the first half second
  const mag = f => { let re = 0, im = 0; for (let i = 0; i < N; i++) { const w = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)); re += w * x[from + i] * Math.cos(2 * Math.PI * f * i / sr); im -= w * x[from + i] * Math.sin(2 * Math.PI * f * i / sr); } return 2 * Math.sqrt(re * re + im * im) / (N / 2); };
  let peak = 0; for (let i = from; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
  // band power, one-sided, from a Hann-windowed DFT stepped one bin (sr / N) at a time: P = 16 Σ|X|² / (3 N²)
  const band = (f1, f2) => { let P = 0; const df = sr / N; for (let f = f1; f <= f2; f += df) { let re = 0, im = 0; for (let i = 0; i < N; i++) { const w = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)); re += w * x[from + i] * Math.cos(2 * Math.PI * f * i / sr); im -= w * x[from + i] * Math.sin(2 * Math.PI * f * i / sr); } P += re * re + im * im; } return 16 * P / (3 * N * N); };
  const out = { peak, at: {}, bands: {} }; (opts.freqs || [100, 200, 300, 400]).forEach(f => { out.at[f] = mag(f); });
  (opts.bands || []).forEach(([f1, f2]) => { out.bands[f1 + '-' + f2] = band(f1, f2); });
  return out;
};
go(1);
