  .on('click', function (ev, n) { window.open(ROOT + n.path, '_blank'); });
gT.append('text').attr('x', 0).attr('y', -18).attr('text-anchor', 'middle').attr('font-size', 13).attr('font-weight', 700).attr('fill', '#1a1916').text('the door');

function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function trim(s, n) { s = s || ''; return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + ' …' : s; }

function show(key) {
  var R = ROUTES[key];
  document.querySelectorAll('.route').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.r === key ? 'true' : 'false'); });
  var lit = {}; R.pages.forEach(function (p) { lit[p] = true; });
  var near = {};
  links.forEach(function (l) { if (lit[l.source.id]) near[l.target.id] = true; if (lit[l.target.id]) near[l.source.id] = true; });
  dotSel.transition().duration(500).attr('opacity', function (n) {
    if (n === door || lit[n.id]) return 1;
    if (R.lightType && n.type === R.lightType) return 0.85;
    if (key === 'shape') return 0.8;
    return near[n.id] ? Math.max(0.28, R.reveal) : R.reveal;
  }).attr('r', function (n) { return lit[n.id] ? rad(n) + 4 : rad(n); });
  lineSel.transition().duration(500).attr('opacity', function (l) {
    if (key === 'shape') return 0.07;
    return (lit[l.source.id] || lit[l.target.id]) ? 0.22 : 0;
  });
  var paths = R.pages.map(function (p) { return byId[p]; }).filter(Boolean);
  var w = gW.selectAll('path').data(paths, function (n) { return n.id; });
  w.exit().remove();
  w.enter().append('path').attr('fill', 'none').attr('stroke', '#c8261a').attr('stroke-width', 1.6)
    .merge(w).attr('d', function (n) { var mx = n.x / 2 - n.y * 0.18, my = n.y / 2 + n.x * 0.18; return 'M0,0 Q' + mx + ',' + my + ' ' + n.x + ',' + n.y; })
    .attr('stroke-dasharray', function () { return this.getTotalLength ? this.getTotalLength() : 0; })
    .attr('stroke-dashoffset', function () { return this.getTotalLength ? this.getTotalLength() : 0; })
    .transition().duration(700).attr('stroke-dashoffset', 0);
  var lab = gT.selectAll('text.lab').data(paths, function (n) { return n.id; });
  lab.exit().remove();
  lab.enter().append('text').attr('class', 'lab').attr('font-size', 12).attr('fill', '#1a1916').attr('paint-order', 'stroke')
    .attr('stroke', '#f0eee5').attr('stroke-width', 3)
    .merge(lab).attr('x', function (n) { return n.x + (n.x > 0 ? 10 : -10); }).attr('y', function (n) { return n.y + 4; })
    .attr('text-anchor', function (n) { return n.x > 0 ? 'start' : 'end'; }).text(function (n) { return n.id === 'FOUR PILLARS' ? 'Four Pillars' : n.id; });
  var legend = document.getElementById('legend');
  if (key === 'shape') {
    legend.style.display = 'block';
    legend.innerHTML = Object.keys(TYPE_INK).filter(function (t) { return nodes.some(function (n) { return n.type === t; }); })
      .map(function (t) { return '<span><i style="background:' + TYPE_INK[t] + '"></i>' + t + '</span>'; }).join('');
  } else legend.style.display = 'none';
  var html = '<h2>' + esc(R.title) + '</h2>';
  paths.forEach(function (n) {
    html += '<div class="pg"><a href="' + esc(ROOT + n.path) + '" target="_blank">' + esc(n.id === 'FOUR PILLARS' ? 'Four Pillars' : n.id) + '</a>' +
      (DATA.fv[n.id] ? '<div class="fv">' + esc(trim(DATA.fv[n.id], 220)) + '</div>' : '') + '</div>';
  });
  html += '<p class="sub">' + esc(R.note) + '</p>';
  document.getElementById('card').innerHTML = html;
}
document.querySelectorAll('.route').forEach(function (b) { b.onclick = function () { show(b.dataset.r); }; });
</script>
</body>
</html>
