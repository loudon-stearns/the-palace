<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 476" width="920" height="476" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">THE SAWTOOTH</text><text x="60.0" y="100.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">THE SHAPE</text><text x="60.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >the gap between log and entry</text><line x1="60" y1="320" x2="450" y2="320" stroke="#b8b09a"/><line x1="198" y1="240" x2="450" y2="240" stroke="#b8b09a" stroke-dasharray="2 4"/><path d="M60.0,320.0 L157.5,240.0 L157.5,314.0 L255.0,240.0 L255.0,314.0 L352.5,240.0 L352.5,314.0 L450.0,240.0 L450.0,314.0" fill="none" stroke="#1a1916" stroke-width="2.4"/><line x1="157.5" y1="240.0" x2="270.0" y2="147.7" stroke="#c8261a" stroke-width="2" stroke-dasharray="6 5"/><polygon points="276.9,142.0 272.5,150.8 267.4,144.6" fill="#c8261a"/><text x="288.9" y="150.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="400" >untracked: it only climbs</text><text x="450.0" y="231.0" font-size="12" fill="#3a3a35" text-anchor="end" font-weight="400" >folded: it stays in a band</text><text x="108.8" y="340.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >drift</text><line x1="255.0" y1="323" x2="255.0" y2="329" stroke="#3a3a35"/><text x="255.0" y="344.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >consolidate</text><text x="450.0" y="340.0" font-size="12" fill="#6a6862" text-anchor="end" font-weight="400" >time</text><text x="540.0" y="100.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">ONE REAL STEWARD</text><text x="540.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >cycles since its entry was last consolidated</text><line x1="566" y1="320" x2="866" y2="320" stroke="#b8b09a"/><text x="556.0" y="324.0" font-size="12" fill="#3a3a35" text-anchor="end" font-weight="400" >0</text><line x1="560" y1="236" x2="866" y2="236" stroke="#b8b09a" stroke-dasharray="2 4"/><text x="556.0" y="240.0" font-size="12" fill="#3a3a35" text-anchor="end" font-weight="400" >6</text><line x1="560" y1="166" x2="866" y2="166" stroke="#b8b09a" stroke-dasharray="2 4"/><text x="556.0" y="170.0" font-size="12" fill="#3a3a35" text-anchor="end" font-weight="400" >11</text><path d="M566.0,320.0 L583.6,306.0 L601.3,292.0 L618.9,278.0 L636.6,264.0 L654.2,250.0 L671.9,236.0 L671.9,320.0 L689.5,306.0 L707.2,292.0 L724.8,278.0 L742.5,264.0 L760.1,250.0 L777.8,236.0 L795.4,222.0 L813.1,208.0 L830.7,194.0 L848.4,180.0 L866.0,166.0" fill="none" stroke="#c8261a" stroke-width="2.2"/><circle cx="566.0" cy="320.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="583.6" cy="306.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="601.3" cy="292.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="618.9" cy="278.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="636.6" cy="264.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="654.2" cy="250.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="671.9" cy="236.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="671.9" cy="320.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="689.5" cy="306.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="707.2" cy="292.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="724.8" cy="278.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle cx="742.5" cy="264.0" r="3" fill="#f0eee5" stroke="#c8261a" stroke-width="1.6"/><circle 