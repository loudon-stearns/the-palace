<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 464" width="920" height="464" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">THE SAME CARD, TWICE</text><text x="40.0" y="92.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">PROTOCOL REGISTER, SHOWN TO A PERSON</text><text x="480.0" y="92.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">NATURAL REGISTER, SAME MESSAGE</text><rect x="40" y="106" width="400" height="184" fill="#f0eee5" stroke="#1a1916" stroke-width="1.4"/><rect x="56" y="122" width="84" height="24" fill="none" stroke="#1a1916" stroke-width="1.2"/><text x="98.0" y="138.0" font-size="12" fill="#1a1916" text-anchor="middle" font-weight="700" >BLOCKING</text><text x="56.0" y="176.0" font-size="12" fill="#3a3a35" text-anchor="start" font-weight="400" >RESOURCE_REQUEST · resource: sensory_audition_gate</text><text x="56.0" y="198.0" font-size="12" fill="#3a3a35" text-anchor="start" font-weight="400" >re: torus-steward-008</text><text x="56.0" y="220.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >blocking · listening gate · steward leans …</text><rect x="56" y="244" width="132" height="30" fill="none" stroke="#1a1916" stroke-width="1.2"/><text x="122.0" y="263.0" font-size="12" fill="#1a1916" text-anchor="middle" font-weight="700" >RESOURCE_GRANT</text><rect x="480" y="106" width="400" height="184" fill="#f0eee5" stroke="#c8261a" stroke-width="1.8"/><rect x="496" y="122" width="206" height="24" fill="none" stroke="#c8261a" stroke-width="1.2"/><text x="599.0" y="138.0" font-size="12" fill="#c8261a" text-anchor="middle" font-weight="700" >STEWARD PAUSED · YOUR EARS</text><rect x="728" y="122" width="136" height="24" rx="12" fill="none" stroke="#1f7f8f" stroke-width="1.2"/><text x="796.0" y="138.0" font-size="11" fill="#1f7f8f" text-anchor="middle" font-weight="400" >torus-steward-008</text><text x="496.0" y="174.0" font-size="13" fill="#1a1916" text-anchor="start" font-weight="700" >did the five rendered audition passes</text><text x="496.0" y="192.0" font-size="13" fill="#1a1916" text-anchor="start" font-weight="700" >survive your ears?</text><text x="496.0" y="216.0" font-size="12" fill="#3a3a35" text-anchor="start" font-weight="400" >the steward stopped working until your ears</text><text x="496.0" y="233.0" font-size="12" fill="#3a3a35" text-anchor="start" font-weight="400" >confirm the smallest engine survives</text><rect x="496" y="246" width="124" height="30" fill="#e0a030" stroke="#1a1916" stroke-width="1"/><text x="558.0" y="266.0" font-size="12" fill="#1a1916" text-anchor="middle" font-weight="700" >▶ FILE LEAN</text><rect x="40" y="310" width="400" height="18" fill="#1a1916"/><text x="40.0" y="348.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="400" >~60 seconds for four cards</text><rect x="480" y="310" width="20" height="18" fill="#c8261a"/><text x="480.0" y="348.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="400" >~3 seconds for four cards</text><text x="40.0" y="384.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >The page: “a four-card session that took ~60 seconds with jargon-laden text collapses to ~3 seconds when the</text><text x="40.0" y="402.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >surface speaks human and the steward's recommended option is one click away.”</text><text x="40.0" y="425.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >Every string on both cards is the page's, from its table and its Origin section. The two layouts are mine;</text><text x="40.0" y="443.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >neither is a screenshot of the real page.</text></svg>