<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◊ preset.oracle ◊</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:ital@0;1&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(45deg, #0a0015, #1a0520, #0f0028);
            color: #fff;
            font-family: 'Courier Prime', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.03) 2px,
                rgba(255, 255, 255, 0.03) 4px
            );
            animation: scanlines 8s linear infinite;
            z-index: 1000;
        }
        
        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }
        
        .title {
            font-family: 'VT323', monospace;
            font-size: 3.5rem;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-shadow: 
                0 0 10px rgba(255, 100, 200, 0.8),
                0 0 20px rgba(100, 200, 255, 0.6),
                2px 2px 0px rgba(255, 0, 100, 0.5),
                -2px -2px 0px rgba(0, 255, 200, 0.5);
            animation: flicker 3s infinite alternate;
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
                letter-spacing: 2px;
            }
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
            51% { opacity: 1; }
            52% { opacity: 0.97; }
            60% { opacity: 1; }
        }
        
        .subtitle {
            font-size: 0.9rem;
            color: #ff64c8;
            letter-spacing: 3px;
            opacity: 0.7;
            font-style: italic;
        }
        
        .oracle-box {
            background: rgba(20, 10, 40, 0.7);
            border: 2px solid #ff64c8;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 
                0 0 30px rgba(255, 100, 200, 0.3),
                inset 0 0 30px rgba(100, 200, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        @media (max-width: 768px) {
            .oracle-box {
                padding: 30px 20px;
            }
        }
        
        @media (max-width: 480px) {
            .oracle-box {
                padding: 20px 15px;
            }
        }
        
        .oracle-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 100, 200, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .challenge-content {
            position: relative;
            z-index: 2;
        }
        
        .preset-name {
            font-family: 'VT323', monospace;
            font-size: 2.5rem;
            color: #64c8ff;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.8);
            letter-spacing: 4px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: none;
            line-height: 1.2;
        }
        
        @media (max-width: 768px) {
            .preset-name {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
        }
        
        @media (max-width: 480px) {
            .preset-name {
                font-size: 1.4rem;
                letter-spacing: 1px;
            }
        }
        
        .section {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #c864ff;
            border-radius: 5px;
        }
        
        .section-title {
            font-size: 0.85rem;
            color: #c864ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .section-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #e0e0ff;
        }
        
        .philosophical-quote {
            font-style: italic;
            color: #ffc864;
            padding: 15px;
            border-left: 3px solid #ffc864;
            margin: 20px 0;
            background: rgba(255, 200, 100, 0.05);
            border-radius: 5px;
        }
        
        .technical-hints {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .hint-tag {
            background: rgba(255, 100, 200, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 100, 200, 0.5);
            color: #ff64c8;
            transition: all 0.3s ease;
        }
        
        .hint-tag:hover {
            background: rgba(255, 100, 200, 0.4);
            transform: scale(1.05);
        }
        
        .button-container {
            text-align: center;
            margin-top: 40px;
        }
        
        .summon-btn {
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ff64c8, #c864ff);
            color: white;
            border: none;
            padding: 20px 50px;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 
                0 0 20px rgba(255, 100, 200, 0.6),
                0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        @media (max-width: 768px) {
            .summon-btn {
                font-size: 1.5rem;
                padding: 18px 40px;
            }
        }
        
        @media (max-width: 480px) {
            .summon-btn {
                font-size: 1.3rem;
                padding: 15px 30px;
                letter-spacing: 2px;
            }
        }
        
        .summon-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .summon-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .summon-btn:hover {
            transform: scale(1.05);
            box-shadow: 
                0 0 40px rgba(255, 100, 200, 0.9),
                0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .summon-btn span {
            position: relative;
            z-index: 1;
        }
        
        .memory-fragment {
            position: fixed;
            font-family: 'VT323', monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            white-space: nowrap;
            animation: float 15s linear;
            z-index: 0;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .glitch-text {
            animation: glitch 5s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            33% { transform: translate(-2px, 2px); }
            66% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <div class="glitch-overlay"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title glitch-text">◊ PRESET.ORACLE ◊</h1>
            <p class="subtitle">~ where waveforms dream of philosophy ~</p>
        </div>
        
        <div class="oracle-box fade-in" id="challengeBox">
            <div class="challenge-content" id="challengeContent">
                <p style="text-align: center; color: #ff64c8; font-style: italic; padding: 40px;">
                    The oracle awaits your invocation...<br>
                    <span style="font-size: 0.8rem; opacity: 0.6;">press the button to receive your synthesis challenge</span>
                </p>
            </div>
        </div>
        
        <div class="button-container">
            <button class="summon-btn" onclick="summonChallenge()">
                <span>SUMMON CHALLENGE</span>
            </button>
        </div>
    </div>

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Initialize or refill the challenge queue
        function refillQueue() {
            // Create indices for all challenges
            const indices = Array.from({length: challenges.length}, (_, i) => i);
            // Shuffle them
            const shuffled = shuffleArray(indices);
            
            // If we have used challenges, make sure the first new challenge isn't the same as the last used one
            if (usedChallenges.length > 0) {
                const lastUsed = usedChallenges[usedChallenges.length - 1];
                const firstNewIndex = shuffled.findIndex(idx => idx === lastUsed);
                if (firstNewIndex === 0 && shuffled.length > 1) {
                    // Swap first with second to avoid immediate repeat
                    [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
                }
            }
            
            return shuffled;
        }

        function summonChallenge() {
            // If queue is empty, refill it
            if (challengeQueue.length === 0) {
                challengeQueue = refillQueue();
            }
            
            // Get next challenge from queue
            const challengeIndex = challengeQueue.shift();
            const challenge = challenges[challengeIndex];
            
            // Track used challenges
            usedChallenges.push(challengeIndex);
            
            // Keep only last 140 in history (one full cycle)
            if (usedChallenges.length > challenges.length) {
                usedChallenges.shift();
            }
            
            currentChallenge = challenge;
            
            const challengeContent = document.getElementById('challengeContent');
            challengeContent.classList.remove('fade-in');
            
            setTimeout(() => {
                challengeContent.innerHTML = `

                    </div>

                        </div>
                    </div>

                        <div class="section-title" style="color: #ffc864;">⚠ Hidden Transmission</div>
                        <div class="section-content" style="color: #ffc864; font-size: 0.95rem;">
                            ${challenge.surprise}

                    </div>
                `;
                
                challengeContent.classList.add('fade-in');
                
                // Spawn memory fragments
                spawnMemoryFragments();
            }, 100);
        }

                    fragment.style.animationDuration = (10 + Math.random() * 10) + 's';
                    document.body.appendChild(fragment);
                    
                    setTimeout(() => {
                        fragment.remove();
                    }, 15000);
                }, i * 2000);
            }
        }
