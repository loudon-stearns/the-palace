<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preset Oracle — encounter sheets for a class</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #1c1814; --dim: #6f6556; --rule: #c9bfae; --glow: #9a6a1f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #2a241d; color: var(--ink); font: 13px/1.45 "Iowan Old Style", Palatino, Georgia, serif; }
  .bar { background: #14110e; color: #e9e0cf; padding: 14px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .bar b { font-weight: normal; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: #d9a85b; margin-right: 8px; }
  .bar input { width: 4em; font: inherit; background: #110e0b; color: #e9e0cf; border: 1px solid #3a3128; padding: 4px 6px; }
  .bar button { font: inherit; color: #d9a85b; background: transparent; border: 1px solid #d9a85b; padding: 5px 12px; cursor: pointer; }
  .bar .note { color: #9a8f7c; font-style: italic; font-size: 13px; }
  .sheet { background: #fbf8f2; width: 8.5in; min-height: 11in; margin: 18px auto; padding: .55in .6in; }
  .head { display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .card { border: 1.5px solid var(--ink); padding: 12px 16px; margin: 8px 0 12px; }
  .card .name { font-size: 21px; line-height: 1.15; margin: 0 0 8px; }
  .card dl { margin: 0; display: grid; grid-template-columns: 6.5em 1fr; gap: 2px 10px; }
  .card dt { color: var(--dim); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding-top: 3px; }
  .card dd { margin: 0; }
  .rule { color: var(--dim); font-style: italic; margin: 0 0 6px; }
  .clock { display: flex; gap: 22px; margin: 4px 0 8px; }
  .clock span { border-bottom: 1px solid var(--ink); display: inline-block; width: 5em; }
  .q { margin-top: 8px; }
  .q .label { font-size: 12px; }
  .q .label i { color: var(--dim); }
  .lines { height: calc(var(--n) * 26px); background: repeating-linear-gradient(transparent 0 25px, var(--rule) 25px 26px); }
  .consent { margin-top: 10px; border-top: 1px solid var(--ink); padding-top: 8px; font-size: 12px; }
  .consent .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; margin-top: 4px; }
  .box { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--ink); margin-right: 6px; vertical-align: -1px; }
  .foot { color: var(--dim); font-size: 10px; margin-top: 8px; }
  @media print {
    @page { size: letter; margin: 0; }
    body { background: none; }
    .bar { display: none; }
    .sheet { margin: 0; height: 11in; overflow: hidden; break-after: page; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>Preset Oracle · sheets for a class</b>
  <label>students <input id="n" type="number" min="1" max="60" value="12"></label>
  <button id="deal">deal the sheets</button>
  <button id="print">print</button>
  <span class="note">Each sheet gets its own card, dealt without repeats until the deck runs out. The deck in use has <span id="deckCount">its</span> cards; the full oracle held 140.</span>
</div>
<div id="sheets"></div>

<script>
// The cards Loudon has cleared for students, poured in from deck/Preset Oracle — deck draft.json
// by deck/tools/build-deck.mjs. Edit the JSON and rebuild; never edit the cards here.
const DECK = (/*DECK*/{"version":"draft-1","cards":[{"id":"spinoza-1","name":"Conatus in a Locked Room","anchor":"Spinoza — each thing strives to persevere in its being","constraint":"Feedback routing only; no filter envelopes","direction":"Something alive that will not stop pushing at the walls"},{"id":"parmenides-1","name":"Parmenides Dying Alone in a Warehouse","anchor":"Parmenides — being does not change; becoming is illusion","constraint":"Feedback routing only; no filter envelopes","direction":"Industrial machinery becoming sentient"},{"id":"merleau-ponty-1","name":"Bioluminescence in Broken Glass","anchor":"Merleau-Ponty — perception is the body's grip on the world","constraint":"Modulate everything via chaos (random, sample-and-hold, or feedback)","direction":"The sound of light bending around a black hole"},{"id":"heidegger-1","name":"The Dwelling Under the Bridge","anchor":"Heidegger — the bridge gathers the land around it; to build is to dwell","constraint":"Modulate everything via chaos","direction":"Industrial machinery becoming sentient"},{"id":"barthes-1","name":"The Pleasure Boat Upside Down","anchor":"Barthes — the pleasure of the text, and the obtuse meaning that won't settle","constraint":"All oscillators must frequency-modulate each other","direction":"A broken music box in an infinite stairwell"},{"id":"deleuze-1","name":"Difference Without a Copy","anchor":"Deleuze — repetition that never repeats the same","constraint":"All oscillators must frequency-modulate each other","direction":"A broken music box in an infinite stairwell"},{"id":"glassblower","name":"A Glassblower Remembering an Argument with Their Teacher","anchor":"Whether glass remembers being a liquid — two answers, both true","constraint":"One timbre heavy enough to be molten; you have until the gather cools","direction":"Present labour and an absent voice, twenty years gone"}]}/*/DECK*/).cards;

document.getElementById("deckCount").textContent = DECK.length;

const Q = [
  ["The instrument", "what synth, what preset or init patch you started from", 1],
  ["The moves", "what you did to the signal, in the order you did it", 4],
  ["The recording", "the file name of the phrase you played", 1],
  ["Your reading", "what the anchor meant to you, not the textbook — and where it is in your patch", 5],
  ["The surprise", "where what you meant and what you heard came apart", 4],
  ["The miss", "anything you tried and threw away (the good failures teach)", 3],
];
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function deal(n) {
  const out = []; let order = [];
  for (let i = 0; i < n; i++) {
    if (!order.length) { // Fisher–Yates, as the oracle does
      order = DECK.map((_, k) => k);
      for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
    }
    const c = DECK[order.pop()];
    out.push(`<section class="sheet">
      <div class="head"><span>Preset Oracle · encounter sheet</span><span>sheet ${i + 1} of ${n}</span></div>
      <div class="card"><p class="name">${esc(c.name)}</p><dl>
        <dt>anchor</dt><dd>${esc(c.anchor)}</dd>
        <dt>constraint</dt><dd>${esc(c.constraint)}</dd>
        <dt>direction</dt><dd>${esc(c.direction)}</dd></dl></div>
      <p class="rule">Thirty to forty-five minutes. Commit to a choice. Stop adjusting. The oracle does not judge whether you are right — only whether you made something.</p>
      <div class="clock">Started at <span></span> Committed at <span></span> Name or initials <span style="width:11em"></span></div>
      ${Q.map(([h, hint, n]) => `<div class="q"><div class="label"><b>${h}</b> — <i>${hint}</i></div><div class="lines" style="--n:${n}"></div></div>`).join("")}
      <div class="consent"><b>May this be kept and quoted?</b> Tick one. Nothing is kept without a tick.
        <div class="opts">
          <span><span class="box"></span>yes, with my name</span>
          <span><span class="box"></span>yes, but anonymously</span>
          <span><span class="box"></span>keep it, but don't quote me</span>
          <span><span class="box"></span>don't keep this</span>
        </div></div>
      <div class="foot">Kept sheets are typed into the encounter journal, one record each, and saved in the Preset Oracle's encounters folder.</div>
    </section>`);
  }
  document.getElementById("sheets").innerHTML = out.join("");
}
document.getElementById("deal").onclick = () => deal(Math.max(1, Math.min(60, +document.getElementById("n").value || 1)));
document.getElementById("print").onclick = () => window.print();
deal(12);
</script>
</body>
</html>
