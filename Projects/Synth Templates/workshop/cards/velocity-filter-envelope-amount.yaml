# Synth Templates — card — Velocity → Filter Envelope Amount
# Velocity scales the filter envelope's depth, not the cutoff itself: a hard note has a brighter attack and the same sustain.
schema: synth-template-card/0.2
id: velocity-filter-envelope-amount
name: Velocity → Filter Envelope Amount
family: Performance Controls
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: moderate}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: short, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: fenv.amount, amount: generous, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,    value: saw}
  - {block: filter1, param: cutoff,  value: mid,            why: "the resting brightness, the same for every note: that is the point"}
  - {block: fenv,    param: sustain, value: zero,           why: "the envelope only touches the attack, so velocity only touches the attack"}
  - {block: fenv,    param: decay,   value: short,          why: "a bite, over before the body is heard"}
  - {block: vel,     param: target,  value: filter envelope amount, why: "velocity goes to the depth of the sweep, not to the cutoff: a hard note bites brighter and then settles to the same tone as a soft one"}
  - {block: aenv,    param: sustain, value: held,           why: "the body holds at one level so the ear can compare the attacks"}
  - {block: mode,    param: voices,  value: poly}

taste:
  - {block: fenv,    param: amount,  range: "little – generous",   default: moderate, why: "the bite a soft note gets"}
  - {block: fenv,    param: vel amount, range: "some – full",      default: generous, why: "how much more a hard note gets"}
  - {block: fenv,    param: decay,   range: "short – medium",      default: short}
  - {block: filter1, param: cutoff,  range: "dark – mid",          default: mid}
  - {block: filter1, param: resonance, range: "little – high",     default: moderate}

listening:
  cue: "Soft and hard notes end up the same colour once they settle. What differs is the first instant: the hard note has a bright 'wah' at the front, the soft one barely a flick."
  ab: "Move velocity from the envelope amount to the cutoff itself: now hard notes stay brighter for their whole length, and the sustain no longer matches. Put it back on the amount and the bodies line up again."

render:
  tempo: 100
  note: [C3, C3, C3, C3]
  velocity: [40, 70, 100, 127]
  pattern: "four quarter notes, each harder than the last, held long enough to hear the body settle"
  length_s: 3.0

mappings: {}
