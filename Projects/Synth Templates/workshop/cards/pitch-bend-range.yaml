# Synth Templates — card 0.2 — Pitch Bend Range
# A lead with one lesson: how far the wheel goes. The slots have no bend input, so the range lives on the keyboard block and the oscillator.
schema: synth-template-card/0.2
id: pitch-bend-range
name: Pitch Bend Range
family: LFO Behaviours
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Pitch bend range"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, bend range: whole step, note: "pitch bend is a performance input the slots do not draw; its range is set here. The voice does not yet play bend"}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: key,  param: bend range, value: whole step, why: "the usual default: a full push is a tone, the size of a guitar bend; most lines are played within it"}
  - {block: key,  param: bend range, value: minor third, why: "the second setting: a blues bend; the same push now reaches a step and a half"}
  - {block: key,  param: bend range, value: octave,     why: "the third: a dive or a scream; the wheel's centre detent is the only safe place"}
  - {block: osc1, param: wave,       value: saw,        why: "a lead with enough harmonics that the bend is heard in the overtones, not only the fundamental"}
  - {block: mode, param: voices,     value: mono,       why: "one line to bend"}
  - {block: aenv, param: sustain,    value: held,       why: "bends happen on held notes"}

taste:
  - {block: osc1,    param: bend range, range: "whole step – octave", default: whole step, why: "the lesson: the same push, three sizes"}
  - {block: filter1, param: cutoff,     range: "mid – bright",        default: mid}
  - {block: osc1,    param: glide,      range: "none – short",        default: none, why: "glide is the other way a pitch moves between notes; keep it off so the bend is alone"}
  - {block: aenv,    param: release,    range: "short – medium",      default: short}

listening:
  cue: "Push the wheel all the way up on a held note and listen where it lands. A tone sits in the key; a minor third pulls at it; an octave leaves it."
  ab: "Set the range to an octave and play a phrase with the small bends you would use for a tone: every one overshoots and the line is out of tune. Back to a whole step and the same hand is in tune again."

render:
  tempo: 100
  note: A3
  velocity: 100
  pattern: "the note held one bar with a full bend up and back, at a whole step; then at a minor third; then at an octave"
  length_s: 8.0

mappings: {}
