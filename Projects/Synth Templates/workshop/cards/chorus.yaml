# Synth Templates — card 0.2 — Chorus
# Delay-family card 6: an ensemble from one voice. Several short delays, each with its own LFO on its time, no feedback,
# spread across the stereo field. One LFO is drawn for the several.
schema: synth-template-card/0.2
id: chorus
name: Chorus
family: Delay-Family Effects
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Delay time LFO modulation"
  - "Chorus: multiple delays, own LFOs, no feedback"
  - "Small detune (≤7 cents) = chorus"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 1, note: "one voice, no unison: the ensemble comes from the effect"}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [chorus], note: "several delay lines of tens of milliseconds, one LFO per line at its own rate and phase, spread left and right; lfo1 stands for all of them"}
    aenv:    {kind: envelope, role: amp, shape: {a: short, d: medium, s: held, r: medium}, category: sustaining}
    lfo1:    {kind: lfo, wave: sine, rate: slow, sync: false, note: "one of several; each delay line has its own"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: lfo1, to: fx.time, amount: little, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode,    param: voices,   value: poly,          why: "chords; a chorus is most itself on a held chord"}
  - {block: osc1,    param: unison,   value: 1 voice,       why: "one oscillator, so the thickness is clearly the delays' doing"}
  - {block: fx,      param: chain,    value: chorus}
  - {block: fx,      param: lines,    value: "several, each with its own LFO", why: "a slowly changing delay is a slowly changing pitch; several of them out of step are several players"}
  - {block: fx,      param: feedback, value: none,          why: "feedback would turn the lines into combs with a pitch; a chorus has none"}
  - {block: fx,      param: stereo,   value: lines spread left and right, why: "different delays per side is width; a mono chorus is only thick"}
  - {block: lfo1,    param: depth,    value: little,        why: "a small time change is a few cents of pitch, the detune of a section; more is seasick"}
  - {block: lfo1,    param: rate,     value: slow,          why: "slow drift; faster is vibrato"}

taste:
  - {block: lfo1,    param: rate,     range: "very slow – medium",   default: slow}
  - {block: lfo1,    param: depth,    range: "none – moderate",      default: little}
  - {block: fx,      param: mix,      range: "a whisper – equal",    default: half}
  - {block: filter1, param: cutoff,   range: "mid – open",           default: bright}
  - {block: aenv,    param: release,  range: "short – long",         default: medium}

listening:
  cue: "One saw becomes a section: the chord shimmers and spreads to the sides, as if several players were holding it and none of them quite in tune with the others. No sweep, no whistle, just a slow shifting thickness."
  ab: "Set the chorus mix to zero: a single thin saw in the middle. Put it back. Then set the LFO depth to none: the lines stop moving and the shimmer collapses to a fixed, slightly hollow doubling."

render:
  tempo: 100
  note: [C3, E3, G3]
  velocity: 90
  pattern: "one triad held two bars, released, tail to silence"
  length_s: 6.0

mappings: {}
