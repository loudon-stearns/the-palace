# Synth Templates — card — Sample and Hold
# Technique demonstration: an LFO that steps instead of waving, on the filter, in time.
schema: synth-template-card/0.2
id: sample-and-hold
name: Sample and Hold
family: Technique Demonstrations
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "LFO → pitch / amplitude / pan / filter"
  - "Tempo sync; triplets"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: moderate}
    amp:     {kind: amplifier, level: under unity}
    lfo1:    {kind: lfo, wave: s&h, rate: medium, sync: true, note: "synced: one new random value every eighth note. The voice has no sample-and-hold shape yet."}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,   value: saw,  why: "harmonics for each new cutoff to land on"}
  - {block: lfo1,    param: wave,   value: s&h,  why: "a random level, held until the next clock: steps, not a wave; the sound of the old sci-fi computer"}
  - {block: lfo1,    param: sync,   value: "on", why: "the steps fall on the grid; free-running they would drift against the beat"}
  - {block: lfo1,    param: division, value: eighth note, why: "one new colour per eighth: fast enough to be a rhythm, slow enough to hear each step"}
  - {block: filter1, param: resonance, value: moderate, why: "the peak marks each step; without it the steps are a vague flicker"}

taste:
  - {block: lfo1,    param: division,  range: "quarter – sixteenth",  default: eighth, why: "or triplets, to keep the sync and lose the stiffness"}
  - {block: lfo1,    param: depth,     range: "some – full",          default: generous}
  - {block: filter1, param: cutoff,    range: "dark – mid",           default: dark}
  - {block: filter1, param: resonance, range: "little – high",        default: moderate}

listening:
  cue: "A held note whose brightness jumps to a new random place on every eighth note and stays there until the next. No glide between steps; the rhythm is exact and the choices are not."
  ab: "Change the LFO wave to triangle: the jumps become a smooth up-and-down and it is an auto-wah. Back to sample-and-hold and the stairs return."

render:
  tempo: 120
  note: C2
  velocity: 90
  pattern: "one note held two bars; the filter steps every eighth"
  length_s: 4.0

mappings: {}
