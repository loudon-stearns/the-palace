# Synth Templates — card 0.2 — Conga
# A hand drum: a sine with the smallest pitch bend, a short decay, and a lowpass to soften it to skin rather than metal.
schema: synth-template-card/0.2
id: conga
name: Conga
family: Drums and Percussion
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Envelope → pitch (attack blip)"
  - "Key → pitch (keytracking)"
  - "Pluck / strike: release = decay; gong vs marimba"
  - "Envelope trigger / one-shot mode"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: sine, octave: 0, retrigger: true}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: little, note: "softens the retrigger edge: a hand, not a stick"}
    amp:     {kind: amplifier, level: full}
    menv:    {kind: envelope, role: pitch, shape: {a: instant, d: fast, s: zero, r: fast}, category: percussive, one_shot: true}
    aenv:    {kind: envelope, role: amp,   shape: {a: instant, d: short, s: zero, r: same as decay}, category: percussive, one_shot: true}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: menv, to: osc1.pitch, amount: a fifth, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: vel,  to: amp.level, amount: some, essential: false}

essentials:
  - {block: osc1,    param: wave,      value: sine,          why: "the head's one note"}
  - {block: menv,    param: amount,    value: a fifth,       why: "the smallest bend on the card: enough to hear the skin give, not enough to hear a sweep"}
  - {block: menv,    param: decay,     value: fast,          why: "the bend is over in the first instant"}
  - {block: filter1, param: type,      value: lowpass 12 dB, why: "gentle; it rounds the hit so it reads as a hand"}
  - {block: filter1, param: cutoff,    value: mid}
  - {block: aenv,    param: decay,     value: short,         why: "a hand drum stops fast; the hand is still on the skin"}
  - {block: aenv,    param: sustain,   value: zero,          why: "struck, then left to decay"}
  - {block: aenv,    param: mode,      value: one-shot}

taste:
  - {block: aenv,    param: decay,     range: "fast – medium",   default: short, why: "slap to open tone"}
  - {block: menv,    param: decay,     range: "instant – short", default: fast}
  - {block: filter1, param: cutoff,    range: "dark – bright",   default: mid}
  - {block: osc1,    param: pitch,     range: "C3 – C4",         default: E3}

listening:
  cue: "A round, pitched pop. The note barely moves at the start: a tom's bend, but small and quick, like a palm on skin."
  ab: "Raise the pitch envelope amount to about an octave: it becomes a tom. Put it back to a fifth. Then set the amount to none: a sine bleep, no hand on it at all."

render:
  tempo: 100
  note: [E3, E3, B2]
  velocity: [90, 90, 110]
  pattern: "two quarters high and one on the low drum, the tumbao's end; the last left to ring"
  length_s: 2.5

mappings: {}
