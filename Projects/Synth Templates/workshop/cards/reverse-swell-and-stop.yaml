# Synth Templates — card 0.2 — Reverse (Swell and Stop)
# Envelope Shapes family. The shape no instrument has: a long attack to the peak, then nothing to hold and no release,
# so the note swells in and stops dead. Reversed percussion; a transition tool.
schema: synth-template-card/0.2
id: reverse-swell-and-stop
name: Reverse (Swell and Stop)
family: Envelope Shapes
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Reverse envelope: swell and stop"
  - "Envelope → amplitude"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "open; the family's fixed chain"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: long, d: short, s: zero, r: instant}, category: reverse}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: aenv, param: attack,  value: long,    why: "nearly all of the note is the climb; the key must be held through it or the swell is cut short"}
  - {block: aenv, param: decay,   value: short,   why: "the peak falls to zero almost at once: that is the stop"}
  - {block: aenv, param: sustain, value: zero,    why: "nothing to hold at; the stop lands on silence"}
  - {block: aenv, param: release, value: instant, why: "letting go early also stops it dead; no tail anywhere"}
  - {block: filter1, param: cutoff, value: open,  why: "the filter stays out of the way"}
  - {block: mode, param: voices,  value: poly,    why: "a chord swelling into a downbeat"}

taste:
  - {block: aenv,    param: attack,  range: "medium – very long", default: long, why: "the length of the swell; time it to the bar"}
  - {block: aenv,    param: decay,   range: "instant – short",    default: short, why: "a hair longer than instant avoids a click at the stop"}
  - {block: osc1,    param: wave,    range: "saw – square",       default: saw}
  - {block: filter1, param: cutoff,  range: "mid – open",         default: open}

listening:
  cue: "A note that grows from nothing and is loudest at the very end, then is simply gone. Played into a downbeat it pulls the ear forward. It sounds like a recording run backwards because no real instrument gets louder and then stops."
  ab: "Swap the times: attack instant, decay long. It is the ordinary strike shape and the sense of pulling forward vanishes. Swap them back and the swell returns. Same two numbers, in the other order."

render:
  tempo: 120
  note: [C3, Eb3, G3]
  velocity: 100
  pattern: "the chord held for a full bar so the swell completes, then silence; twice"
  length_s: 6.0

mappings: {}
