# Synth Templates — card 0.2 — Siren
# Sound Effects, tier 1. An LFO on pitch, far past vibrato: the triangle rides the note up and down by an octave.
schema: synth-template-card/0.2
id: siren
name: Siren
family: Sound Effects
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "LFO → pitch / amplitude / pan / filter"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"
  - "LFO rate range vs oscillator; LFO into audio rate"
  - "Switch envelope (organ); percussive organ"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: square, pw: 0.5, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: short, d: short, s: full, r: medium}, category: sustaining}
    lfo1:    {kind: lfo, wave: triangle, rate: slow, sync: false}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pitch, amount: about an octave, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: wheel, to: lfo1.rate, amount: some, essential: false}

essentials:
  - {block: osc1,    param: wave,    value: square,          why: "hollow and loud; the odd harmonics carry across a street"}
  - {block: lfo1,    param: wave,    value: triangle,        why: "the pitch glides up and down at a steady rate; a sine would linger at the turns"}
  - {block: lfo1,    param: rate,    value: slow,            why: "a sweep every few seconds: vibrato's LFO, a hundred times deeper and ten times slower"}
  - {block: lfo1,    param: target,  value: oscillator pitch, why: "same destination as vibrato; the depth is what makes it a siren"}
  - {block: lfo1,    param: amount,  value: about an octave, why: "under a semitone is vibrato; an octave is a siren"}
  - {block: aenv,    param: sustain, value: full,            why: "a switch: it is on while the key is down"}
  - {block: mode,    param: voices,  value: mono,            why: "one siren"}

taste:
  - {block: lfo1,    param: rate,    range: "very slow – medium",    default: slow, why: "slow is an air raid, medium is a police car"}
  - {block: lfo1,    param: amount,  range: "a fifth – two octaves", default: about an octave}
  - {block: filter1, param: cutoff,  range: "mid – open",            default: bright, why: "takes the edge off the square"}
  - {block: aenv,    param: attack,  range: "short – slow",          default: short}
  - {block: aenv,    param: release, range: "short – slow",          default: medium}

listening:
  cue: "One tone that will not sit still: it climbs an octave and falls back, over and over, at the same pace each way. It only stops when the key does."
  ab: "Turn the LFO amount down to a fifth, then further toward nothing: the siren becomes a wobble, then a vibrato, then a plain square. Back to an octave and it wails."

render:
  tempo: 120
  note: A3
  velocity: 100
  pattern: "one note held four bars"
  length_s: 8.0

mappings: {}
