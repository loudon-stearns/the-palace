# Synth Templates — card — Modulation Template (Init Patch)
# Not a sound: a starting point. Saw into a low-pass, and every standard primary and secondary routing wired at sensible defaults, so each new patch begins already expressive.
schema: synth-template-card/0.2
id: modulation-template-init-patch
name: Modulation Template (Init Patch)
family: Performance Controls
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Modulation template saved as the init patch"
  - "Velocity → amplitude; velocity → filter cutoff"
  - "Key → filter cutoff"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "CC1 → pitch LFO depth"
  - "Aftertouch → filter cutoff"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: false, note: "the vibrato LFO: silent until the wheel"}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: zero, r: medium}, category: percussive}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv,  to: filter1.cutoff, amount: some, essential: true}
    - {from: aenv,  to: amp.level, essential: true}
    - {from: lfo1,  to: osc1.pitch, essential: true}
    - {from: key,   to: osc1.pitch, essential: true}
    - {from: key,   to: filter1.cutoff, amount: half, essential: true}
    - {from: key,   to: fenv.gate, essential: true}
    - {from: key,   to: aenv.gate, essential: true}
    - {from: vel,   to: amp.level, amount: moderate, essential: true}
    - {from: vel,   to: filter1.cutoff, amount: some, essential: true}
    - {from: vel,   to: fenv.amount, amount: some, essential: true}
    - {from: wheel, to: lfo1.depth, amount: moderate, essential: true}
    - {from: at,    to: filter1.cutoff, amount: some, essential: true}

essentials:
  - {block: osc1,    param: wave,   value: saw,       why: "the richest starting wave; subtract from here"}
  - {block: filter1, param: type,   value: lowpass 24 dB, why: "the standard subtractive filter, half open, little resonance: neutral"}
  - {block: filter1, param: cutoff, value: mid}
  - {block: vel,     param: target, value: "amp level, filter cutoff, filter envelope amount", why: "the three velocity routings every patch wants: louder, brighter, bigger bite"}
  - {block: key,     param: target, value: filter cutoff, why: "half keytracking, so the patch is even across the keyboard before you touch it"}
  - {block: wheel,   param: target, value: pitch LFO depth, why: "vibrato by hand, off at rest: the LFO depth can be set high because the wheel gates it"}
  - {block: at,      param: target, value: filter cutoff, why: "pressure opens the tone on a held note"}
  - {block: fenv,    param: amount, value: some,      why: "a small bite on every note, there to be raised or turned off"}
  - {block: aenv,    param: sustain, value: held,     why: "a plain sustaining shape; the sound-specific envelope comes later"}
  - {block: mode,    param: voices, value: poly}

taste:
  - {block: filter1, param: cutoff,  range: "dark – bright",      default: mid}
  - {block: fenv,    param: amount,  range: "none – generous",    default: some}
  - {block: lfo1,    param: rate,    range: "slow – fast",        default: medium, why: "vibrato speed, around five a second"}
  - {block: aenv,    param: release, range: "short – medium",     default: short}
  - {block: lfo1,    param: depth,   range: "little – generous",  default: moderate, why: "the vibrato the wheel can add at full"}

listening:
  cue: "An unremarkable saw that already answers everything you do: harder is louder and brighter with more bite, the top of the keyboard is not dull, the wheel adds vibrato, pressure opens the tone. Nothing is dramatic; everything is wired."
  ab: "Start instead from a bare saw with only key-to-pitch and an amp envelope: the same playing comes out flat and lifeless, and every patch you build on it needs the routings added by hand. Load the template and the hands are already connected."

render:
  tempo: 100
  note: [C3, E3, G3, C4]
  velocity: [60, 90, 120, 90]
  pattern: "four quarter notes at three velocities, the last held with the wheel raised and pressure added"
  length_s: 5.0

mappings: {}
