# Synth Templates — card — Trance Pluck
# A filter pluck played in sixteenths, with a tempo delay that fills the gaps: the delay is part of the rhythm.
schema: synth-template-card/0.2
id: trance-pluck
name: Trance Pluck
family: Leads
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Pluck / strike: release = decay; gong vs marimba"
  - "Delay: time, feedback, mix"
  - "Tempo sync; triplets"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [delay, reverb], note: "delay synced to a dotted eighth"}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: short, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: medium, s: zero, r: same as decay}, category: plucked}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: fenv.amount, amount: some, essential: false}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,     value: saw,            why: "every harmonic there for the filter to open onto"}
  - {block: filter1, param: cutoff,   value: dark,           why: "closed at rest; the envelope is the whole brightness of the note"}
  - {block: fenv,    param: decay,    value: short,          why: "the pluck: open and shut before the next sixteenth"}
  - {block: fenv,    param: sustain,  value: zero,           why: "every note is a sweep down to dark"}
  - {block: fenv,    param: amount,   value: generous,       why: "far enough open that the first instant is bright"}
  - {block: aenv,    param: sustain,  value: zero,           why: "plucked: the note dies whether or not the key is held"}
  - {block: aenv,    param: release,  value: same as decay,  why: "a short sequencer note still plays out the pluck"}
  - {block: fx,      param: chain,    value: delay then reverb, why: "the delay's echoes land between the notes and make the rhythm"}
  - {block: mode,    param: voices,   value: poly,           why: "the tails overlap the next note"}

taste:
  - {block: fenv,    param: decay,     range: "short – medium",        default: short}
  - {block: fenv,    param: amount,    range: "moderate – full",       default: generous}
  - {block: filter1, param: resonance, range: "none – moderate",       default: little, why: "more and the pluck whistles"}
  - {block: aenv,    param: decay,     range: "short – medium",        default: medium}
  - {block: fx,      param: delay,     range: "eighth – dotted eighth", default: dotted eighth, why: "the dotted eighth makes a pattern the notes do not play"}
  - {block: fx,      param: reverb,    range: "small – large",         default: large}

listening:
  cue: "Each note is a short bright flick that darkens at once. The echoes fall between the played notes, so the pattern you hear is busier than the pattern played."
  ab: "Turn the delay off: the same notes with holes between them, and the drive is gone. Put it back. Then raise the filter envelope's sustain to full: the flick becomes a plain held saw."

render:
  tempo: 138
  note: [A4, A4, A4, C5, A4, A4, E5, A4]
  velocity: 100
  pattern: "sixteenths on the offbeats, one bar, each note a sixteenth long; a bar of silence after for the echoes"
  length_s: 4.0

mappings: {}
