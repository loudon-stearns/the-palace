# Synth Templates — card 0.2 — Horns (Low Sustain)
# Envelope Shapes family. The standard sustaining shape with the sustain dropped: the first burst of air is strong
# next to what the player can keep up, so the note starts loud and settles well below its peak.
schema: synth-template-card/0.2
id: horns-low-sustain
name: Horns (Low Sustain)
family: Envelope Shapes
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Standard sustaining envelope; strings and horns variants"
  - "Sustaining vs non-sustaining sounds"
  - "Envelope → amplitude"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "open; the family's fixed chain"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: half, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: aenv, param: attack,  value: fast,  why: "the tongue starts the note at once"}
  - {block: aenv, param: decay,   value: short, why: "the burst settles quickly; this stage is the same as the standard shape"}
  - {block: aenv, param: sustain, value: half,  why: "the lesson: the first burst of air is strong next to the breath the player can keep up, so the held level sits well under the peak"}
  - {block: aenv, param: release, value: short, why: "the bell stops ringing a moment after the breath stops"}
  - {block: filter1, param: cutoff, value: open, why: "the filter stays out of the way"}
  - {block: mode, param: voices,  value: poly,  why: "a section"}

taste:
  - {block: aenv,    param: sustain, range: "low – held",       default: half, why: "the player's breath: lower is a harder blow, higher is a softer one"}
  - {block: aenv,    param: decay,   range: "fast – medium",    default: short, why: "how fast the burst settles"}
  - {block: aenv,    param: attack,  range: "instant – short",  default: fast}
  - {block: aenv,    param: release, range: "fast – medium",    default: short}
  - {block: filter1, param: cutoff,  range: "mid – open",       default: open}

listening:
  cue: "Every note arrives with a punch and then drops back to about half its opening level, where it stays. The punch is the thing: a line of repeated notes stabs, where the standard shape would simply hold."
  ab: "Raise the sustain to held: the drop after the attack shrinks and the punch is gone; it is the standard sustaining shape again. Back to half and the stabs return. Nothing but the sustain level changed."

render:
  tempo: 100
  note: [C3, E3, G3]
  velocity: 110
  pattern: "the chord as four quarter-note stabs, then held a bar"
  length_s: 5.0

mappings: {}
