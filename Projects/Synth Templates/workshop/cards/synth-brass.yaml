# Synth Templates — card — Synth Brass
# The family's first card: the filter envelope's attack is the instrument. A short rise into the blat, then a settle.
schema: synth-template-card/0.2
id: synth-brass
name: Synth Brass
family: Brass and Winds
tier: 1
mode: poly
classics: Prophet / Oberheim / Jupiter
status: drafted
concepts:
  - "Subtractive: rich wave then filter"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Standard sustaining envelope; strings and horns variants"
  - "Small detune (≤7 cents) = chorus"
  - "LFO attack: envelope → LFO depth"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 2, detune: narrow}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: short, d: medium, s: low, r: short}, category: sustaining}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
    menv:    {kind: envelope, role: vibrato, shape: {a: slow, d: short, s: full, r: short}, category: swell, note: "a ramp into the LFO depth: vibrato arrives after the note settles"}
    lfo1:    {kind: lfo, wave: triangle, rate: medium, sync: false}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: menv, to: lfo1.depth, amount: full, essential: true}
    - {from: lfo1, to: osc1.pitch, amount: little, essential: false}
    - {from: vel,  to: fenv.amount, amount: some, essential: false}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: key,  to: menv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw,           why: "every harmonic, so the filter has a full buzz to open onto"}
  - {block: osc1,    param: detune,    value: narrow,        why: "two saws a hair apart: the section is wider than one player, not yet a crowd"}
  - {block: filter1, param: type,      value: lowpass 24 dB, why: "steep, so the envelope's rise is a clear brightening"}
  - {block: fenv,    param: attack,    value: short,         why: "the blat: the filter opens over the first tenth of a second, not instantly"}
  - {block: fenv,    param: decay,     value: medium,        why: "after the blat it settles back toward the resting cutoff"}
  - {block: fenv,    param: sustain,   value: low,           why: "horns: the first burst of air is stronger than what sustains"}
  - {block: aenv,    param: attack,    value: fast,          why: "the amp is already up when the filter opens; the attack you hear is the filter's"}
  - {block: aenv,    param: sustain,   value: held,          why: "sustaining: the note keeps coming while the key is down"}
  - {block: menv,    param: target,    value: LFO depth,     why: "vibrato is absent at the attack and grows as the note holds"}
  - {block: mode,    param: voices,    value: poly,          why: "brass stabs are chords"}

taste:
  - {block: filter1, param: cutoff,    range: "dark – mid",          default: dark,     why: "closed at rest; the envelope does the opening"}
  - {block: fenv,    param: attack,    range: "fast – short",        default: short,    why: "faster is a stab, slower is a swell"}
  - {block: fenv,    param: amount,    range: "some – generous",     default: moderate}
  - {block: filter1, param: resonance, range: "none – moderate",     default: little}
  - {block: osc1,    param: detune,    range: "slight – wide",       default: narrow}
  - {block: lfo1,    param: depth,     range: "none – some",         default: little}
  - {block: aenv,    param: release,   range: "short – medium",      default: short}

listening:
  cue: "Each chord starts dull and brightens in the first instant, then eases back: 'bwah', not 'bah'. Hold the chord and a slow wobble creeps in after a second."
  ab: "Set the filter envelope attack to instant: the blat becomes a plain pluck and the brass is gone. Put it back to short and the 'bwah' returns."

render:
  tempo: 110
  note: [C3, E3, G3]
  velocity: 100
  pattern: "three stabs a beat apart, each a quarter long, then the chord held two bars"
  length_s: 6.0

mappings: {}
