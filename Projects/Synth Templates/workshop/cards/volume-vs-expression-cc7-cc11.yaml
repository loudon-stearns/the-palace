# Synth Templates — card — Volume vs Expression (CC7 / CC11)
# Two controllers on the amplifier. CC7 is set once, for the mix. CC11 is played, as a fraction of it. The wheel stands in for CC11.
schema: synth-template-card/0.2
id: volume-vs-expression-cc7-cc11
name: Volume vs Expression (CC7 / CC11)
family: Performance Controls
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "CC7 volume, CC11 expression, CC72 release, CC73 attack"
  - "Standard sustaining envelope; strings and horns variants"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 3, detune: slight}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity, note: "amp level is CC7, the mix volume, set once; the wheel stands in for CC11, expression, a percentage of it"}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: medium, s: held, r: medium}, category: string}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv,  to: amp.level, essential: true}
    - {from: wheel, to: amp.level, amount: full, essential: true}
    - {from: key,   to: osc1.pitch, essential: true}
    - {from: key,   to: aenv.gate, essential: true}

essentials:
  - {block: amp,   param: level,  value: under unity,  why: "CC7: the volume of this part in the mix. Set it when you balance the track and leave it"}
  - {block: wheel, param: target, value: amp level,    why: "CC11: expression, the phrase dynamics. It scales the CC7 level, never exceeds it, so a swell cannot blow the mix"}
  - {block: osc1,  param: wave,   value: saw,          why: "a string-like tone that invites a swell"}
  - {block: aenv,  param: attack, value: slow,         why: "a string section: the note arrives, and the expression pedal shapes what happens after"}
  - {block: aenv,  param: sustain, value: held,        why: "sustaining, so there is a held tone for expression to move"}
  - {block: mode,  param: voices, value: poly}

taste:
  - {block: amp,     param: cc11 amount, range: "moderate – full", default: full, why: "the expression range: full means the pedal can take the part to silence"}
  - {block: amp,     param: level,  range: "half – unity",     default: under unity, why: "CC7: the mix position"}
  - {block: aenv,    param: attack, range: "medium – slow",    default: slow}
  - {block: aenv,    param: release, range: "short – long",    default: medium}
  - {block: filter1, param: cutoff, range: "mid – bright",     default: mid}

listening:
  cue: "A held chord that breathes: the expression controller swells it up and lets it fall within the phrase, while the ceiling never moves. The part stays where the mix put it."
  ab: "Put the phrase dynamics on CC7 instead: every swell now changes the mix balance, and the part's place in the track jumps around. Put them back on CC11 and the swells live inside the level you set."

render:
  tempo: 80
  note: [C3, G3, E4]
  velocity: 90
  pattern: "one chord held four bars; the expression controller swells from half to full across bars one and two and falls back across three and four"
  length_s: 12.0

mappings: {}
