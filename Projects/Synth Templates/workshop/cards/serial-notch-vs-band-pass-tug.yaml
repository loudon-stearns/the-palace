# Synth Templates — card 0.2 — Serial: Notch vs Band-Pass Tug
# Filter Routings, tier 3. A notch and a band-pass at the same cutoff, one pulling down, the other up. They should cancel; filters shift phase as well as
# level, so they do not, and modulating them apart makes the richness move.
schema: synth-template-card/0.2
id: serial-notch-vs-band-pass-tug
name: "Serial: Notch vs Band-Pass Tug"
family: Filter Routings
tier: 3
mode: mono
classics: ""
status: drafted
concepts:
  - "Resonance as width (Q) on band-pass and notch"
  - "Serial: notch vs band-pass tug of war"
  - "Serial routing"
  - "LFO → pitch / amplitude / pan / filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: notch,    slope: 24, resonance: little, note: "low resonance: a wide pull down of the mids"}
    filter2: {kind: filter, type: bandpass, slope: 24, resonance: high,   note: "high resonance at the same cutoff: a narrow spike of mids pulled back up inside the cut"}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: medium}, category: percussive, note: "moves the band-pass only"}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
    lfo1:    {kind: lfo, wave: triangle, rate: slow, sync: false, note: "moves the notch only"}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: filter1.cutoff, amount: little, essential: true}
    - {from: fenv, to: filter2.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw}
  - {block: filter1, param: type,      value: notch,          why: "pulls the mids down"}
  - {block: filter2, param: type,      value: bandpass,       why: "pulls them up; the two fight, and because each also shifts phase they do not cancel, the fight is the richness"}
  - {block: filter1, param: cutoff,    value: mid}
  - {block: filter2, param: cutoff,    value: same as filter1, why: "the same frequency at rest, or there is no tug"}
  - {block: filter1, param: resonance, value: little,         why: "low on the notch: a broad general cut of the mids"}
  - {block: filter2, param: resonance, value: high,           why: "high on the band-pass: a spike of resonance inside the cut, which the band-pass cutoff places wherever the mix needs it"}
  - {block: lfo1,    param: target,    value: notch cutoff,   why: "modulated differently from the band-pass, so the two drift against each other"}
  - {block: fenv,    param: target,    value: band-pass cutoff, why: "the spike leaps on each note and settles while the notch wanders"}
  - {block: mode,    param: voices,    value: mono}

taste:
  - {block: filter2, param: cutoff,    range: "dark – bright",      default: mid,    why: "where the spike sits in the mix"}
  - {block: filter2, param: resonance, range: "moderate – self-oscillating", default: high}
  - {block: filter1, param: resonance, range: "none – moderate",    default: little}
  - {block: fenv,    param: amount,    range: "little – generous",  default: moderate}
  - {block: lfo1,    param: depth,     range: "none – some",        default: little}
  - {block: lfo1,    param: rate,      range: "very slow – medium", default: slow}

listening:
  cue: "Hollow mids with a bright spike standing in the hollow. On each note the spike leaps up and falls back while the hollow slowly drifts, and the tone shimmers where the two cross: thicker than either filter alone."
  ab: "Set both resonances to little and both modulations to none: the notch and the band-pass sit on the same cutoff and nearly cancel, a flat and slightly phasey saw. Put the band-pass resonance back to high and the spike stands up out of the cut."

render:
  tempo: 100
  note: [D2, D2, F2, G2]
  velocity: 100
  pattern: "quarter notes, one bar, each held most of its beat"
  length_s: 3.0

mappings: {}
