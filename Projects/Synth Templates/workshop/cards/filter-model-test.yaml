# Synth Templates — card 0.2 — Filter Model Test
# Filter Routings, tier 2. A test, not a sound: a sine through each filter model at high resonance, and an analyzer to see what each one adds.
# The vocabulary has no filter-model words; the model row is free text.
schema: synth-template-card/0.2
id: filter-model-test
name: Filter Model Test
family: Filter Routings
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Filter models and their distortion (sine test)"
  - "Sine: no response to filtering; FM/additive building block"
  - "Resonance: boost at cutoff; self-oscillation"
  - "Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: sine, octave: 0, note: "one partial; anything above it on the analyzer, the filter put there"}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: high, note: "try every model the synth has (clean, ladder, diode, and the rest); the voice plays one clean model"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: wheel, to: filter1.cutoff, amount: moderate, essential: false}

essentials:
  - {block: osc1,    param: wave,      value: sine,           why: "a sine has nothing to filter; whatever harmonics appear are the filter's own distortion"}
  - {block: filter1, param: type,      value: lowpass 24 dB}
  - {block: filter1, param: cutoff,    value: mid,            why: "above the sine, so the sine passes and the resonant peak sits over it; sweep it toward the sine with the wheel"}
  - {block: filter1, param: resonance, value: high,           why: "the differences between models are small at low resonance and dramatic at high"}
  - {block: filter1, param: model,     value: each in turn,   why: "the test: same sine, same settings, change only the model and watch the analyzer"}
  - {block: mode,    param: voices,    value: mono,           why: "one note on the analyzer"}

taste:
  - {block: filter1, param: model,     range: "clean – ladder",         default: clean,  why: "a ladder model for the Moog thing: distortion that tames the resonance and sounds analog"}
  - {block: filter1, param: resonance, range: "moderate – self-oscillating", default: high}
  - {block: filter1, param: cutoff,    range: "dark – bright",          default: mid,    why: "bring it down onto the sine and the peak rides over it"}
  - {block: filter1, param: drive,     range: "none – heavy",           default: none,   why: "if the model has a drive, it is this distortion under direct control"}
  - {block: amp,     param: level,     range: "half – under unity",     default: half,   why: "self-oscillation is loud"}

listening:
  cue: "Watch the analyzer as much as you listen. A clean model shows one line and a peak; a ladder or diode model grows a comb of harmonics above the sine, and the resonance sounds rounder. Switch models and nothing else."
  ab: "Swap the sine for a saw: the harmonics the filter added vanish into the ones the oscillator already had, and you can no longer tell what the model did. Back to the sine and the difference reappears."

render:
  tempo: 60
  note: C3
  velocity: 100
  pattern: "one note held four seconds; the mod wheel sweeps the cutoff down onto the note and back"
  length_s: 5.0

mappings: {}
