# Synth Templates — card 0.2 — LFO → Pan
# A pad with two kinds of pan movement: a slow LFO that swings the whole sound, and a per-note random offset that only widens it.
schema: synth-template-card/0.2
id: lfo-pan
name: LFO → Pan
family: LFO Behaviours
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Per-note random pan for width"
  - "LFO → pitch / amplitude / pan / filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 2, detune: narrow}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: medium, s: held, r: long}, category: pad}
    lfo1:    {kind: lfo, wave: sine, rate: very slow, sync: false, retrigger: false, note: "autopan: the whole pad swings"}
    lfo2:    {kind: lfo, wave: s&h, rate: very slow, sync: false, retrigger: true, note: "per-note random pan: one new value at each note-on, held for the note. The voice does not yet play a retriggered sample-and-hold"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: amp.pan, amount: moderate, essential: true}
    - {from: lfo2, to: amp.pan, amount: little, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode, param: voices,    value: poly,      why: "random pan only means something with more than one note sounding"}
  - {block: lfo1, param: target,    value: pan,       why: "autopan: the same LFO that would be tremolo on level or vibrato on pitch, sent to position"}
  - {block: lfo1, param: rate,      value: very slow, why: "a swing you follow, not a flutter"}
  - {block: lfo1, param: retrigger, value: "off",     why: "the swing is one movement for the whole pad; retriggered, each note would start at centre"}
  - {block: lfo2, param: wave,      value: sample and hold, why: "one random value per note: the note sits somewhere in the field and stays there"}
  - {block: lfo2, param: retrigger, value: "on",      why: "a new value at note-on and nothing moves after; this is width without any swirl"}
  - {block: lfo2, param: depth,     value: little,    why: "a little either side of centre; the instrument gets wider, not scattered"}
  - {block: aenv, param: attack,    value: slow,      why: "a pad, so the movement has something sustained to act on"}

taste:
  - {block: lfo1,    param: rate,    range: "very slow – slow",   default: very slow}
  - {block: lfo1,    param: depth,   range: "none – generous",    default: moderate, why: "none is a still pad; generous swings wall to wall"}
  - {block: lfo2,    param: depth,   range: "none – moderate",    default: little}
  - {block: osc1,    param: detune,  range: "slight – wide",      default: narrow}
  - {block: filter1, param: cutoff,  range: "mid – bright",       default: mid}
  - {block: aenv,    param: release, range: "medium – very long", default: long}

listening:
  cue: "The chord drifts slowly left and right as one thing. Underneath, each note you add sits in its own spot in the stereo field, so the chord is wide without anything else swirling."
  ab: "Set the autopan depth to none and keep the random pan: the swing stops but the chord is still wide, each note planted. Then set the random pan depth to none too: everything collapses to the centre and the pad is narrow. Bring both back."

render:
  tempo: 80
  note: [D3, F3, A3, C4]
  velocity: 80
  pattern: "the chord played note by note across one bar, held through bar two, released; played twice so the random pans differ"
  length_s: 10.0

mappings: {}
