# Synth Templates — card 0.2 — Parallel: Dual Low-Pass
# Filter Routings, tier 1. Two low-passes side by side instead of one after the other: the second only ever adds. Note on filter 2: the slot
# grammar can only draw the filters in series, and the voice plays them that way; the parallel split is said in words.
schema: synth-template-card/0.2
id: parallel-dual-low-pass
name: "Parallel: Dual Low-Pass"
family: Filter Routings
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Parallel routing"
  - "Parallel: dual low-pass smoothness"
  - "LFO → pitch / amplitude / pan / filter"
  - "Standard sustaining envelope; strings and horns variants"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 3, detune: narrow}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little, note: "parallel with filter 2: the mix splits to both and their outputs sum before the amp"}
    filter2: {kind: filter, type: lowpass, slope: 24, resonance: little, note: "PARALLEL on the real synth. The slot grammar and the site voice run it in series after filter 1; set the synth's routing to parallel"}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [reverb]}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: medium, s: held, r: long}, category: pad}
    lfo1:    {kind: lfo, wave: triangle, rate: very slow, sync: false}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: lfo1, to: filter2.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw,            why: "the harmonics above 300 Hz are what the moving filter adds back"}
  - {block: filter1, param: type,      value: lowpass 24 dB}
  - {block: filter2, param: type,      value: lowpass 24 dB}
  - {block: filter1, param: cutoff,    value: dark,           why: "near 300 Hz; the floor the sound never drops below"}
  - {block: filter2, param: cutoff,    value: dark,           why: "the same place at rest; the LFO lifts it from here"}
  - {block: filter2, param: routing,   value: parallel,       why: "its output sums with filter 1's; it can only add. In series it would cut what filter 1 left, and the slopes would stack to 48 dB"}
  - {block: lfo1,    param: target,    value: filter 2 cutoff, why: "one filter moves, the other holds; the texture undulates and the body stays"}
  - {block: aenv,    param: attack,    value: slow,           why: "a pad"}
  - {block: mode,    param: voices,    value: poly,           why: "chords; the smoothness is for pads"}

taste:
  - {block: lfo1,    param: rate,      range: "very slow – slow",      default: very slow}
  - {block: lfo1,    param: depth,     range: "little – generous",     default: moderate, why: "how far the second filter opens above the floor"}
  - {block: filter1, param: resonance, range: "none – moderate",       default: little}
  - {block: filter2, param: resonance, range: "none – moderate",       default: little}
  - {block: osc1,    param: detune,    range: "none – wide",           default: narrow}
  - {block: aenv,    param: release,   range: "medium – very long",    default: long}
  - {block: fx,      param: reverb,    range: "small – huge",          default: large}

listening:
  cue: "A dark chord that brightens and dims in a slow swell, and never gets thinner than it started. When the moving filter closes all the way, the chord is still there, full and dark."
  ab: "Switch the routing to serial: the same two filters now cut twice. The floor drops, the chord goes muffled, and when the LFO closes filter 2 the sound nearly disappears. Back to parallel and the floor returns."

render:
  tempo: 70
  note: [C3, G3, Bb3, D4]
  velocity: 85
  pattern: "one chord held eight seconds, released, tail to silence"
  length_s: 10.0

mappings: {}
