# Synth Templates — card 0.2 — String Machine
# A plain saw with nothing happening to it until the ensemble. The effect is the timbre; everything before it is a carrier.
schema: synth-template-card/0.2
id: string-machine
name: String Machine
family: Pads
tier: 1
mode: poly
classics: Solina / ARP String Ensemble
status: drafted
concepts:
  - "Chorus: multiple delays, own LFOs, no feedback"
  - "Standard sustaining envelope; strings and horns variants"
  - "Low-pass, high-pass, band-pass, notch"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    osc2:    {kind: oscillator, wave: saw, octave: -1, note: "the cello register under the violins"}
    mix:     {kind: mixer}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "a tone control, not a voice: no envelope on it"}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [ensemble, reverb]}
    aenv:    {kind: envelope, role: amp, shape: {a: medium, d: medium, s: held, r: long}, category: string}
  audio:
    - [osc1, mix]
    - [osc2, mix]
    - [mix, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: osc2.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode,    param: voices,    value: poly,            why: "a section plays chords"}
  - {block: osc1,    param: wave,      value: saw,             why: "a bowed string is a saw; the ensemble needs every harmonic to smear"}
  - {block: filter1, param: envelope,  value: none,            why: "nothing moves in the filter; the motion all comes from the ensemble, and that is the lesson"}
  - {block: filter1, param: cutoff,    value: bright,          why: "mostly open; the machine was never dark"}
  - {block: aenv,    param: attack,    value: medium,          why: "a bow, not a hammer: the note arrives over a beat"}
  - {block: aenv,    param: sustain,   value: held,            why: "sustaining: bowed as long as the key is down"}
  - {block: aenv,    param: release,   value: long,            why: "strings ring out; the longer release smooths the line, like a reverb would"}
  - {block: fx,      param: chain,     value: ensemble then reverb, why: "the ensemble is the timbre: several delay lines, each with its own LFO, no feedback, mixed with the dry signal so one saw becomes a section"}

taste:
  - {block: osc2,    param: level,     range: "off – equal",          default: half}
  - {block: filter1, param: cutoff,    range: "mid – open",           default: bright}
  - {block: aenv,    param: attack,    range: "short – slow",         default: medium}
  - {block: aenv,    param: release,   range: "medium – very long",   default: long}
  - {block: fx,      param: ensemble,  range: "light – lush",         default: lush}
  - {block: fx,      param: reverb,    range: "small – large",        default: small}

listening:
  cue: "A shimmering, slightly out-of-focus section sound; the pitch seems to hover rather than sit. Nothing in the note changes over time except that it keeps shimmering."
  ab: "Switch the ensemble off: a thin, static saw organ, oddly dead. Switch it back on and the room fills. The oscillator never changed."

render:
  tempo: 96
  note: [D3, F3, A3, D4]
  velocity: 90
  pattern: "one minor chord held two bars, released, tail to silence"
  length_s: 7.0

mappings: {}
