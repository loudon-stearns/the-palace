# Synth Templates — Genre Classics — Jupiter Brass
# Big poly brass: two saws slightly apart, a 24 dB filter opened by an envelope with a short attack. The blat is the filter envelope.
schema: synth-template-card/0.2
id: jupiter-brass
name: Jupiter Brass
family: Genre Classics
tier: 1
mode: poly
classics: Jupiter-8
status: drafted
concepts:
  - "Standard sustaining envelope; strings and horns variants"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Small detune (≤7 cents) = chorus"
  - "Unison / unisono"
  - "Poly vs mono; max voices"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 2, detune: slight}
    osc2:    {kind: oscillator, wave: saw, octave: 0, detune: slight, note: "a second saw a few cents off the first"}
    mix:     {kind: mixer}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: short, d: medium, s: low, r: short}, category: sustaining}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, mix]
    - [osc2, mix]
    - [mix, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: osc2.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: vel,  to: fenv.amount, amount: some, essential: false}

essentials:
  - {block: mode,    param: voices,   value: poly,          why: "a brass section, not a horn: it plays chords"}
  - {block: osc1,    param: wave,     value: saw,           why: "brass is all harmonics; a square would be a clarinet"}
  - {block: osc2,    param: detune,   value: slight,        why: "a few cents apart: the section's chorus, not a beat"}
  - {block: filter1, param: type,     value: lowpass 24 dB, why: "steep, so the envelope's opening is heard as a swell of brightness"}
  - {block: filter1, param: cutoff,   value: mid,           why: "the resting brightness; the envelope opens from here"}
  - {block: fenv,    param: attack,   value: short,         why: "the blat: brightness arrives a moment after the note, like a player's air building"}
  - {block: fenv,    param: sustain,  value: low,           why: "the horn variant: the burst is brighter than the held tone"}
  - {block: aenv,    param: sustain,  value: held,          why: "sustaining: air keeps coming"}
  - {block: aenv,    param: attack,   value: fast,          why: "the note speaks at once; the filter supplies the softness"}

taste:
  - {block: osc1,    param: unison,   range: "1 – 2",               default: 2, why: "the Jupiter's unison mode doubles each voice"}
  - {block: filter1, param: cutoff,   range: "dark – bright",       default: mid}
  - {block: fenv,    param: attack,   range: "fast – medium",       default: short, why: "longer and it becomes a slow auto-wah swell"}
  - {block: fenv,    param: amount,   range: "some – generous",     default: moderate}
  - {block: fenv,    param: sustain,  range: "zero – half",         default: low}
  - {block: aenv,    param: release,  range: "short – medium",      default: short}

listening:
  cue: "Each chord speaks and then blooms: a moment of darkness and then the brightness opens, like breath catching up with the lips. The two saws make the section wide without wobbling."
  ab: "Set the filter envelope attack to instant: the bloom is gone and it is a plain saw chord. Put it back. Then set the detune to none: the section becomes a single thick horn."

render:
  tempo: 110
  note: [C3, E3, G3, C4]
  velocity: 100
  pattern: "the chord as two half notes, then once held a bar"
  length_s: 5.0

mappings: {}
