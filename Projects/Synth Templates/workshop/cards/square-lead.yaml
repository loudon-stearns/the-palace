# Synth Templates — card — Square Lead
# A hollow odd-harmonic tone with the filter all but open, and a vibrato that arrives a beat after the note does.
schema: synth-template-card/0.2
id: square-lead
name: Square Lead
family: Leads
tier: 1
mode: mono
classics: chiptune / Jan Hammer
status: drafted
concepts:
  - "Waveforms: saw, square, triangle, sine, noise"
  - "LFO attack: envelope → LFO depth"
  - "Envelope → pitch LFO depth"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: square, pw: 0.5, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    menv:    {kind: envelope, role: vibrato, shape: {a: medium, d: instant, s: full, r: short}, category: swell, note: "a ramp: the delay before the vibrato"}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: false}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pitch, amount: little, essential: true}
    - {from: menv, to: lfo1.depth, amount: full, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,     value: square,        why: "odd harmonics only: the hollow, woody tone that a saw does not have"}
  - {block: osc1,    param: pw,       value: 0.5,           why: "a true square; narrow it and it turns nasal"}
  - {block: filter1, param: cutoff,   value: open,          why: "the square is already simple; the filter only trims the fizz"}
  - {block: lfo1,    param: rate,     value: medium,        why: "about 5 Hz, a human vibrato"}
  - {block: menv,    param: target,   value: vibrato depth, why: "the note starts straight and the vibrato grows in, as a player's does"}
  - {block: menv,    param: attack,   value: medium,        why: "the delay: a few hundred milliseconds of plain tone before the wobble"}
  - {block: menv,    param: sustain,  value: full,          why: "once in, the vibrato stays for the length of the note"}
  - {block: mode,    param: voices,   value: mono,          why: "one line; a new note restarts the vibrato ramp"}

taste:
  - {block: menv,    param: attack,   range: "short – slow",        default: medium, why: "how long the note is plain before it wavers"}
  - {block: lfo1,    param: depth,    range: "little – some",       default: little}
  - {block: lfo1,    param: rate,     range: "medium – fast",       default: medium}
  - {block: filter1, param: cutoff,   range: "bright – open",       default: open}
  - {block: osc1,    param: pw,       range: "0.5 – 0.35",          default: 0.5}
  - {block: aenv,    param: release,  range: "short – medium",      default: short}

listening:
  cue: "A clean, hollow tone, like a clarinet made of wood. Each note starts dead straight, and after a moment the vibrato fades in and the note comes alive."
  ab: "Set the vibrato ramp's attack to instant: every note wobbles from its first instant and sounds cheap. Put it back to medium and the vibrato waits. Then switch the wave to saw: the hollowness is gone."

render:
  tempo: 110
  note: [G4, A4, C5, A4]
  velocity: 100
  pattern: "three eighths then the fourth note held for the rest of the bar and a bar more, long enough for the vibrato to arrive"
  length_s: 4.0

mappings: {}
