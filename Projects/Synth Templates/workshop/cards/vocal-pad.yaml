# Synth Templates — card 0.2 — Vocal Pad
# The choir pad with the vowel in motion: a slow LFO on the formant's centre, so the pad sings 'oh' to 'ah' to 'ee' and back.
schema: synth-template-card/0.2
id: vocal-pad
name: Vocal Pad
family: Pads
tier: 3
mode: poly
classics: ""
status: drafted
concepts:
  - "Narrow pulse → nasal / vocal, with formant filter"
  - "Serial: source and resonator (keytracked vs fixed)"
  - "LFO → pitch / amplitude / pan / filter"
  - "Chorus: multiple delays, own LFOs, no feedback"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 2, detune: slight}
    filter1: {kind: filter, type: bandpass, slope: 12, resonance: moderate, keytrack: none, note: "the formant: one band-pass, fixed, its centre carried by lfo1. A real formant filter is two or three peaks; the voice plays one"}
    filter2: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [chorus, reverb]}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: medium, s: held, r: long}, category: pad}
    lfo1:    {kind: lfo, wave: triangle, rate: very slow, sync: false, retrigger: false, note: "the vowel: free-running, so each note is caught mid-word"}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: lfo1, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: wheel, to: lfo1.depth, amount: some, essential: false}

essentials:
  - {block: osc1,    param: wave,      value: saw,             why: "every harmonic there for the formant to pick out, whichever vowel it is on"}
  - {block: filter1, param: type,      value: bandpass,        why: "a vowel is a peak; the LFO moves the peak and the vowel changes"}
  - {block: filter1, param: keytrack,  value: none,            why: "the resonator stays put against the key: a throat, not a filter following the note"}
  - {block: filter1, param: resonance, value: moderate,        why: "a clear peak but a wide one; the motion is heard as a vowel changing, not a whistle sweeping"}
  - {block: lfo1,    param: target,    value: formant centre,  why: "the lesson: the LFO on the filter is not brightness here, it is which vowel"}
  - {block: lfo1,    param: rate,      value: very slow,       why: "a word takes seconds; faster and it gargles"}
  - {block: lfo1,    param: amount,    value: moderate,        why: "a couple of octaves of travel: 'oh' at the bottom, 'ee' at the top, 'ah' on the way"}
  - {block: aenv,    param: attack,    value: slow,            why: "on a breath"}
  - {block: fx,      param: chain,     value: chorus then reverb, why: "the chorus makes the one voice several"}
  - {block: mode,    param: voices,    value: poly,            why: "a choir"}

taste:
  - {block: filter1, param: cutoff,    range: "dark – bright",         default: mid, why: "the resting vowel; the LFO swings around it"}
  - {block: filter1, param: resonance, range: "little – high",         default: moderate}
  - {block: lfo1,    param: rate,      range: "very slow – slow",      default: very slow}
  - {block: lfo1,    param: depth,     range: "some – generous",       default: moderate}
  - {block: aenv,    param: attack,    range: "medium – very slow",    default: slow}
  - {block: aenv,    param: release,   range: "medium – very long",    default: long}
  - {block: fx,      param: chorus,    range: "light – lush",          default: lush}

listening:
  cue: "A chord that seems to be mouthing a slow word: 'oh' opening into 'ah' and closing toward 'ee', over and over, each note somewhere different in the word. No pitch moves; only the mouth."
  ab: "Set the LFO depth to none: the pad holds one vowel and is the choir pad again, sung and still. Put it back. Then raise the resonance to high: the vowel becomes a whistle sweeping, and the voice is gone."

render:
  tempo: 66
  note: [A2, E3, C4, E4]
  velocity: 85
  pattern: "one chord held four bars, released, tail to silence"
  length_s: 16.0

mappings: {}
