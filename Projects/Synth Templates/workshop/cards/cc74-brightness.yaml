# Synth Templates — card — CC74 Brightness
# The standard brightness controller to the low-pass cutoff. The card's grammar has no CC source, so the mod wheel stands in for CC74.
schema: synth-template-card/0.2
id: cc74-brightness
name: CC74 Brightness
family: Performance Controls
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "CC74 brightness"
  - "Cutoff frequency"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little, note: "the controller is CC74 (brightness); the wheel stands in for it here"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv,  to: amp.level, essential: true}
    - {from: wheel, to: filter1.cutoff, amount: generous, essential: true}
    - {from: key,   to: osc1.pitch, essential: true}
    - {from: key,   to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,   value: saw,    why: "full harmonics, so the controller has the whole range of colour to move through"}
  - {block: filter1, param: cutoff, value: dark,   why: "the controller at zero is the dullest the sound gets; it only opens from here"}
  - {block: wheel,   param: target, value: filter cutoff, why: "CC74 is the brightness controller by convention; mapping it to cutoff means any keyboard's brightness knob works on this patch"}
  - {block: aenv,    param: sustain, value: held,  why: "a held tone, so the hand can hear the cutoff move while nothing else does"}
  - {block: mode,    param: voices, value: poly}

taste:
  - {block: filter1, param: cc74 amount, range: "moderate – full", default: generous, why: "how far the controller opens the filter at the top of its travel"}
  - {block: filter1, param: cutoff, range: "dark – mid",       default: dark}
  - {block: filter1, param: resonance, range: "none – moderate", default: little, why: "more makes the controller sweep sing"}
  - {block: aenv,    param: attack, range: "fast – slow",      default: fast}

listening:
  cue: "Hold a chord and move the controller. The tone opens from a muffled hum to a full saw and back, with no change in loudness or pitch: brightness by hand."
  ab: "Unmap the controller: the chord sits at its dull resting cutoff and the knob does nothing. Map it back and the sound opens under your hand."

render:
  tempo: 100
  note: [C3, G3, C4]
  velocity: 100
  pattern: "one chord held four bars while the controller rises from zero to full and back"
  length_s: 8.0

mappings: {}
