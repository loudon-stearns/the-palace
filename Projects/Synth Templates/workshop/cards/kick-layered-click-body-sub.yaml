# Synth Templates — card 0.2 — Kick Layered (click/body/sub)
# Three layers, one card: a noise click for the top, a pitch-bent sine for the body, a steady sine an octave down for the floor. Each owns one band.
# The lowpass gates the click as on the 909: closed, both sines pass under it; the filter envelope opens it for the first instant only.
schema: synth-template-card/0.2
id: kick-layered-click-body-sub
name: Kick Layered (click/body/sub)
family: Drums and Percussion
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Envelope → pitch (attack blip)"
  - "Noise at the attack; noise oscillator with its own envelope"
  - "Octave / semitone / fine tuning"
  - "Envelope trigger / one-shot mode"
  - "Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: sine, octave: 0, retrigger: true, note: "body: the layer that bends"}
    sub:     {kind: oscillator, wave: sine, octave: -1, retrigger: true, level: half, note: "sub: no bend; it holds the floor"}
    noise:   {kind: oscillator, wave: noise, level: half, note: "click: heard only while the filter is open"}
    mix:     {kind: mixer}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: none, note: "closed, both sines pass under it; the envelope opens it for the click"}
    amp:     {kind: amplifier, level: full}
    fx:      {kind: fx, chain: [saturation]}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: fast, s: zero, r: fast}, category: percussive, one_shot: true}
    menv:    {kind: envelope, role: pitch, shape: {a: instant, d: short, s: zero, r: short}, category: percussive, one_shot: true}
    aenv:    {kind: envelope, role: amp,   shape: {a: instant, d: long, s: zero, r: same as decay}, category: percussive, one_shot: true}
  audio:
    - [osc1, mix]
    - [sub, mix]
    - [noise, mix]
    - [mix, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: menv, to: osc1.pitch, amount: about an octave, essential: true}
    - {from: fenv, to: filter1.cutoff, amount: full, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: false}
    - {from: key,  to: sub.pitch, essential: false}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: vel,  to: amp.level, amount: some, essential: false}

essentials:
  - {block: noise,   param: level,     value: half,          why: "the click layer: the top band, the part that reads on a phone speaker"}
  - {block: osc1,    param: wave,      value: sine,          why: "the body layer: the middle band, the one that bends"}
  - {block: sub,     param: octave,    value: -1,            why: "the sub layer: the bottom band, an octave under the body"}
  - {block: sub,     param: level,     value: half,          why: "felt, not heard; louder and the body disappears into it"}
  - {block: menv,    param: amount,    value: about an octave, why: "only the body bends; a bending sub smears the floor"}
  - {block: menv,    param: decay,     value: short}
  - {block: filter1, param: cutoff,    value: dark,          why: "closed, the sines pass under it and the noise does not: the filter is the click's envelope"}
  - {block: fenv,    param: decay,     value: fast,          why: "the window the click comes through"}
  - {block: aenv,    param: decay,     value: long,          why: "the sub needs time to be felt"}
  - {block: aenv,    param: sustain,   value: zero}
  - {block: aenv,    param: mode,      value: one-shot}
  - {block: fx,      param: chain,     value: saturation,    why: "glues the three into one hit"}

taste:
  - {block: noise,   param: level,   range: "off – full",            default: half, why: "the click"}
  - {block: sub,     param: level,   range: "little – full",         default: half, why: "the floor"}
  - {block: menv,    param: amount,  range: "a fifth – two octaves", default: about an octave}
  - {block: aenv,    param: decay,   range: "medium – very long",    default: long}
  - {block: fx,      param: drive,   range: "none – heavy",          default: light}
  - {block: osc1,    param: pitch,   range: "F1 – C2",               default: A1}

listening:
  cue: "One kick with three floors: a tick on top, a punch that bends in the middle, and a steady hum under both. Mute each in your head and the other two are still a kick."
  ab: "Set the sub level to off: the punch is still there but the floor is gone; on small speakers nothing changes, on big ones the weight is missing. Put it back. Then set the noise to off: the top goes and the kick vanishes on a phone."

render:
  tempo: 124
  note: A1
  velocity: 115
  pattern: "four on the floor, one bar; the last hit left to ring"
  length_s: 3.0

mappings: {}
