# Synth Templates — card — Portamento
# Technique demonstration: the glide from note to note, how long it takes, and which notes get it.
schema: synth-template-card/0.2
id: portamento
name: Portamento
family: Technique Demonstrations
tier: 1
mode: mono legato
classics: ""
status: drafted
concepts:
  - "Glide / portamento time; legato mode as default"
  - "Poly vs mono; max voices"
  - "CC5 / CC65 / CC68 / CC84 portamento control (phantom note)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, glide: medium}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode, param: voices, value: mono,   why: "glide is from one note to the next; it needs one voice that moves"}
  - {block: osc1, param: wave,   value: saw,    why: "a clear pitch to hear sliding"}
  - {block: osc1, param: glide,  value: medium, why: "long enough to hear the slide as a slide, like a trombone, short enough to arrive before the next note"}
  - {block: mode, param: glide mode, value: legato, why: "only overlapping notes glide, so the player chooses: some notes slide, some jump. Make this the default."}

taste:
  - {block: osc1, param: glide,      range: "none – long",     default: medium, why: "none: every note jumps; short: a quick scoop; long: the pitch never quite settles"}
  - {block: mode, param: glide mode, range: "legato – always", default: legato, why: "always: every note slides, whether or not it overlaps the one before"}
  - {block: filter1, param: cutoff,  range: "mid – bright",    default: bright}

listening:
  cue: "A line where the tied notes slide into pitch and the separate notes land square. The slide takes a moment; you hear it travel."
  ab: "Set glide to none: every note is a clean jump and the line goes stiff. Put it back, then set glide mode to always: now even the separated notes scoop, and the player has lost the choice."

render:
  tempo: 110
  note: [C3, G3, C4, G3, C3]
  velocity: 90
  pattern: "quarter notes; the second and fourth tied to the note before (they glide), the others detached (they jump)"
  length_s: 4.0

mappings: {}
