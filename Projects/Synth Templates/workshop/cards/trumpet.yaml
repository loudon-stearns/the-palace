# Synth Templates — card — Trumpet
# Synth brass with one player and a scoop: the pitch comes up into the note during the attack.
schema: synth-template-card/0.2
id: trumpet
name: Trumpet
family: Brass and Winds
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Envelope → pitch (attack blip)"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Standard sustaining envelope; strings and horns variants"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"
  - "CC1 → pitch LFO depth"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: short, d: medium, s: low, r: short}, category: sustaining}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
    menv:    {kind: envelope, role: pitch,  shape: {a: instant, d: short, s: zero, r: short}, category: percussive, note: "inverted: the pitch starts under the note and rises into it. The voice has no negative pitch amount yet; it will play the blip falling"}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: false}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv,  to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv,  to: amp.level, essential: true}
    - {from: menv,  to: osc1.pitch, amount: a fifth, essential: true}
    - {from: lfo1,  to: osc1.pitch, amount: little, essential: false}
    - {from: wheel, to: lfo1.depth, amount: full, essential: false}
    - {from: vel,   to: fenv.amount, amount: some, essential: false}
    - {from: key,   to: osc1.pitch, essential: true}
    - {from: key,   to: fenv.gate, essential: true}
    - {from: key,   to: aenv.gate, essential: true}
    - {from: key,   to: menv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw,            why: "one saw, one player: every harmonic for the filter to open onto"}
  - {block: filter1, param: type,      value: lowpass 24 dB}
  - {block: fenv,    param: attack,    value: short,          why: "the brass blat: the filter opens over the first tenth of a second"}
  - {block: fenv,    param: sustain,   value: low,            why: "the burst is louder than the hold"}
  - {block: menv,    param: target,    value: "pitch, inverted", why: "the scoop: the lips find the note from below, a fraction late"}
  - {block: menv,    param: decay,     value: short,          why: "the scoop is over before the blat finishes; longer and it is a siren"}
  - {block: menv,    param: sustain,   value: zero,           why: "it must land on the note"}
  - {block: aenv,    param: attack,    value: fast,           why: "the amp is up first; the attack you hear is filter and pitch together"}
  - {block: aenv,    param: sustain,   value: held}
  - {block: mode,    param: voices,    value: mono,           why: "one horn; the scoop retriggers on each new note"}

taste:
  - {block: menv,    param: amount,    range: "a fifth – about an octave", default: a fifth, why: "how far below the note the scoop begins"}
  - {block: menv,    param: decay,     range: "fast – short",     default: short}
  - {block: filter1, param: cutoff,    range: "dark – mid",       default: dark}
  - {block: fenv,    param: amount,    range: "some – generous",  default: moderate}
  - {block: fenv,    param: attack,    range: "fast – short",     default: short}
  - {block: lfo1,    param: depth,     range: "none – some",      default: little}
  - {block: aenv,    param: release,   range: "short – medium",   default: short}

listening:
  cue: "Each note slides up into pitch while the filter opens, so the attack is a scoop and a blat at once. Held, the note is a plain bright buzz; the wheel adds the wobble."
  ab: "Set the pitch envelope amount to none: the blat stays but every note lands dead on, and the player turns into a keyboard. Put the scoop back and the horn breathes again."

render:
  tempo: 112
  note: [G3, C4, E4, G4]
  velocity: 100
  pattern: "a fanfare: three short notes a beat apart, the last held two bars with the wheel pushed up through it"
  length_s: 6.0

mappings: {}
