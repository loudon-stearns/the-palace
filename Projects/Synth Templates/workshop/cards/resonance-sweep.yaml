# Synth Templates — card — Resonance Sweep
# Technique demonstration: a slow cutoff sweep heard three times, at rising resonance, up to the filter singing on its own.
schema: synth-template-card/0.2
id: resonance-sweep
name: Resonance Sweep
family: Technique Demonstrations
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Cutoff frequency"
  - "Resonance: boost at cutoff; self-oscillation"
  - "Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: moderate}
    amp:     {kind: amplifier, level: under unity}
    lfo1:    {kind: lfo, wave: triangle, rate: very slow, sync: false, note: "the slow hand on the cutoff knob"}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: filter1.cutoff, amount: full, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,   value: saw,          why: "a harmonic at every multiple of the note, so the peak has a ladder to climb"}
  - {block: filter1, param: type,   value: lowpass 24 dB, why: "on low-pass, resonance is a boost right at the cutoff"}
  - {block: filter1, param: cutoff, value: dark,         why: "the sweep starts low and rises through the whole series"}
  - {block: lfo1,    param: rate,   value: very slow,    why: "slow enough to hear each harmonic come up and go down as the peak passes over it"}
  - {block: lfo1,    param: amount, value: full,         why: "the whole range: a short sweep crosses too few harmonics"}

taste:
  - {block: filter1, param: resonance, range: "little – self-oscillating", default: moderate, why: "the lesson: low is a brightness sweep, high is a cascade, the top is a sine oscillator of its own"}
  - {block: lfo1,    param: rate,      range: "very slow – slow",          default: very slow}
  - {block: filter1, param: drive,     range: "none – light",              default: none, why: "a little distortion tames the resonance peak and keeps it from taking the whole signal"}

listening:
  cue: "One slow rise and fall of brightness, three ways. With little resonance it is a dull-to-bright fade. With moderate, harmonics light up one after another as the peak passes. Self-oscillating, a whistle rides the sweep, a note of its own that is not in the saw."
  ab: "Drop the resonance to none: the cascade is gone and only the brightness fade remains. Then set the amount of sweep to none: the resonance is still there but it sits on one harmonic and never moves."

render:
  tempo: 100
  note: C2
  velocity: 90
  pattern: "one low note held through a full LFO cycle, three times: resonance little, moderate, self-oscillating"
  length_s: 12.0

mappings: {}
