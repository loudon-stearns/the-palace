# Synth Templates — card 0.2 — Drive by Velocity
# Filter Routings, tier 2. The filter's drive is a distortion under modulation: velocity makes hard notes brighter, an envelope bites the attack, and a
# second filter after it cleans up what the drive added. The voice reads a filter's drive word but does not modulate it.
schema: synth-template-card/0.2
id: drive-by-velocity
name: Drive by Velocity
family: Filter Routings
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Drive: by velocity, by envelope; serial filter after"
  - "Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"
  - "Serial routing"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: moderate, drive: light, note: "the drive lives here; velocity and the envelope push it. The voice plays the resting drive word only"}
    filter2: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "after the drive: it tames the harmonics the distortion added"}
    amp:     {kind: amplifier, level: under unity}
    menv:    {kind: envelope, role: drive, shape: {a: instant, d: short, s: zero, r: instant}, category: percussive}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: vel,  to: filter1.drive, amount: full, essential: true}
    - {from: menv, to: filter1.drive, amount: moderate, essential: false}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw}
  - {block: filter1, param: type,      value: lowpass 24 dB}
  - {block: filter1, param: cutoff,    value: mid}
  - {block: filter1, param: drive,     value: light,          why: "the resting drive; soft notes sit here, nearly clean"}
  - {block: vel,     param: target,    value: filter 1 drive, why: "drive is nonlinear: louder in, more distorted out. Velocity into it turns dynamics into timbre, hard notes brighter, not just louder"}
  - {block: menv,    param: target,    value: filter 1 drive, why: "the other way to move it: a short envelope adds bite to the attack of every note"}
  - {block: filter2, param: type,      value: lowpass 12 dB,  why: "in series after the drive: high drive adds harmonics on top, and this takes them back down"}
  - {block: filter2, param: cutoff,    value: bright,         why: "open; it only trims the fizz the drive added, it is not the voice"}
  - {block: mode,    param: voices,    value: mono}

taste:
  - {block: filter1, param: drive,     range: "none – heavy",       default: light,  why: "the floor the velocity rises from"}
  - {block: menv,    param: amount,    range: "none – generous",    default: moderate, why: "the bite"}
  - {block: menv,    param: decay,     range: "fast – medium",      default: short}
  - {block: filter2, param: cutoff,    range: "mid – open",         default: bright, why: "how much of the added fizz survives"}
  - {block: filter1, param: cutoff,    range: "dark – bright",      default: mid}
  - {block: filter1, param: resonance, range: "none – high",        default: moderate, why: "drive tames resonance; with more of both the peak rounds off"}

listening:
  cue: "Soft notes are clean and a little dull; hard notes snarl, with a crackle of new harmonics at the front that settles as the note holds. The loud notes are not much louder than the soft ones, only brighter."
  ab: "Set velocity to drive to none: hard and soft notes now have the same tone, and velocity only changes volume. Put it back. Then open filter 2 all the way: the snarl on the hard notes turns to fizz; bring it back to bright and the fizz is gone."

render:
  tempo: 110
  note: [E2, E2, G2, E2, A2, E2, D2, E2]
  velocity: [120, 50, 50, 120, 50, 50, 120, 50]
  pattern: "eighths, one bar; hard notes on 1, 4 and 7"
  length_s: 3.0

mappings: {}
