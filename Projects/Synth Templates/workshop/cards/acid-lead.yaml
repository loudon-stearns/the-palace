# Synth Templates — card — Acid Lead
# The acid bass card played two octaves up. Nothing on the patch changes; the register does, and the resonance sings differently.
schema: synth-template-card/0.2
id: acid-lead
name: Acid Lead
family: Leads
tier: 1
mode: mono legato
classics: TB-303
status: drafted
lineage:
  - "cards/acid-bass.yaml: the same patch, two octaves down; the lesson is what the register changes"
concepts:
  - "Resonance: boost at cutoff; self-oscillation"
  - "Glide / portamento time; legato mode as default"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, glide: legato}
    filter1: {kind: filter, type: lowpass, slope: 18, resonance: high}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: fenv.amount, amount: accent, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode,    param: voices,    value: mono legato,   why: "tied notes slide and do not retrigger: the same slide as the bass"}
  - {block: osc1,    param: wave,      value: saw,           why: "every harmonic there for the resonance to pick out"}
  - {block: osc1,    param: glide,     value: short,         why: "some notes slide, some jump; the pattern decides"}
  - {block: filter1, param: type,      value: lowpass 18 dB, why: "the 303's three-pole slope"}
  - {block: filter1, param: resonance, value: high,          why: "near the edge; up here the sweep crosses fewer harmonics, so each one it finds stands out alone"}
  - {block: filter1, param: cutoff,    value: dark,          why: "closed at rest, which on a high note is under the fundamental: the envelope brings the note itself in"}
  - {block: fenv,    param: sustain,   value: zero,          why: "every note is a sweep down to the resting cutoff"}
  - {block: vel,     param: accent,    value: velocity → envelope amount, why: "an accented note is a bigger sweep, not just a louder one"}
  - {block: aenv,    param: sustain,   value: zero,          why: "the body dies with the sweep; sixteenths stay separate"}

taste:
  - {block: filter1, param: cutoff,     range: "dark – mid",             default: dark}
  - {block: filter1, param: resonance,  range: "high – self-oscillating", default: high}
  - {block: fenv,    param: amount,     range: "moderate – generous",    default: generous}
  - {block: fenv,    param: decay,      range: "short – medium",         default: medium}
  - {block: osc1,    param: glide,      range: "short – medium",         default: short}
  - {block: osc1,    param: wave,       range: "saw – square",           default: saw}
  - {block: amp,     param: drive,      range: "none – heavy",           default: none}

listening:
  cue: "The bass card's squelch, but thin and piercing: with fewer harmonics under the cutoff, the whistle rides on top of the note instead of inside it. Accents jump open; tied notes slide."
  ab: "Play the same pattern two octaves down: the identical settings become a bass and the whistle sinks into the body. Come back up. Then drop resonance to none: a dull high saw with a sweep and no voice."

render:
  tempo: 130
  note: [C4, C4, Eb4, C4, G4, C4, Bb3, C4]
  velocity: [110, 70, 70, 110, 70, 70, 110, 70]
  pattern: "sixteenths, one bar; notes 3 and 5 tied to the one before (slide), accents on 1, 4, 7"
  length_s: 2.0

mappings: {}
