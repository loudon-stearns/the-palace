# Synth Templates — card — Modulation Matrix
# Technique demonstration: one LFO, four destinations. Same source, four different effects; the routing is the sound.
schema: synth-template-card/0.2
id: modulation-matrix
name: Modulation Matrix
family: Technique Demonstrations
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "LFO → pitch / amplitude / pan / filter"
  - "Pulse width, static and modulated"
  - "Modulation template saved as the init patch"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: pulse, pw: 0.5, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: moderate}
    amp:     {kind: amplifier, level: under unity}
    lfo1:    {kind: lfo, wave: triangle, rate: medium, sync: false, note: "one LFO; each route is switched on in turn"}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pitch, amount: little, essential: true}
    - {from: lfo1, to: filter1.cutoff, amount: generous, essential: true}
    - {from: lfo1, to: amp.level, amount: moderate, essential: true}
    - {from: lfo1, to: osc1.pw, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1, param: wave,   value: pulse,  why: "a pulse has a width to modulate; a saw would lose the fourth route"}
  - {block: lfo1, param: rate,   value: medium, why: "one rate for all four, so the only difference between them is where the motion lands"}
  - {block: lfo1, param: route 1, value: pitch, why: "vibrato"}
  - {block: lfo1, param: route 2, value: filter cutoff, why: "wah"}
  - {block: lfo1, param: route 3, value: amp level, why: "tremolo"}
  - {block: lfo1, param: route 4, value: pulse width, why: "PWM, a thickening with no filter"}

taste:
  - {block: lfo1,    param: rate,      range: "slow – fast",     default: medium}
  - {block: lfo1,    param: depth,     range: "little – full",   default: moderate, why: "pitch wants little; filter and width want more"}
  - {block: filter1, param: cutoff,    range: "dark – mid",      default: mid}
  - {block: filter1, param: resonance, range: "little – high",   default: moderate}

listening:
  cue: "The same wobble heard four times in four places: the pitch wavers, then the brightness, then the loudness, then the body thins and fills. One modulator; the destination is what you are hearing."
  ab: "Turn all four routes off: a static pulse, no motion anywhere. Turn on pitch alone: vibrato. Swap it for filter: the same LFO is now a wah."

render:
  tempo: 100
  note: C3
  velocity: 90
  pattern: "the same note four times, two seconds each, with one route on at a time: pitch, filter, amp, pulse width"
  length_s: 9.0

mappings: {}
