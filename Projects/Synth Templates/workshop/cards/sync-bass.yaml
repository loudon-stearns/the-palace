# Synth Templates — card — Sync Bass
# Osc1 resets osc2 every cycle. An envelope sweeps osc2's pitch, and what you hear is the sweep as a tearing harmonic ladder.
schema: synth-template-card/0.2
id: sync-bass
name: Sync Bass
family: Bass
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Envelope → pitch (attack blip)"
  - "Phase, free-running vs retrigger, the click"
  - "Subtractive: rich wave then filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, note: "the master: it is not heard directly; it only resets osc2 each cycle, so the pitch you hear is osc1's"}
    osc2:    {kind: oscillator, wave: saw, octave: 0, note: "the slave: hard-synced to osc1. Its own pitch sets the timbre, not the note. The voice approximates sync as FM"}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    menv:    {kind: envelope, role: pitch, shape: {a: instant, d: medium, s: zero, r: medium}, category: percussive}
    aenv:    {kind: envelope, role: amp,   shape: {a: instant, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, osc2, sync]
    - [osc2, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: menv, to: osc2.pitch, amount: about an octave, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: osc2.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: routing, value: into osc2 sync,     why: "osc1 restarts osc2's cycle at its own rate: the note is osc1's pitch whatever osc2 does"}
  - {block: osc2,    param: wave,    value: saw,                why: "a wave with a hard edge, so the reset leaves a sharp step: the sync tear"}
  - {block: menv,    param: target,  value: osc2 pitch,         why: "sweeping the slave's pitch changes how many partial cycles fit before each reset: a timbre sweep, not a pitch sweep"}
  - {block: menv,    param: amount,  value: about an octave,    why: "far enough that the sweep climbs through a run of harmonics"}
  - {block: menv,    param: decay,   value: medium,             why: "the sweep is the attack; you have to hear it travel"}
  - {block: menv,    param: sustain, value: zero,               why: "it settles to the plain synced tone"}
  - {block: filter1, param: cutoff,  value: open,               why: "wide open: the filter is not shaping this sound, the sync is"}
  - {block: aenv,    param: sustain, value: held}
  - {block: mode,    param: voices,  value: mono}

taste:
  - {block: menv,    param: amount,  range: "a fifth – two octaves", default: about an octave}
  - {block: menv,    param: decay,   range: "short – slow",          default: medium}
  - {block: osc2,    param: octave,  range: "0 – 1",                 default: 0, why: "the slave's resting pitch above the master: where the sweep lands"}
  - {block: filter1, param: cutoff,  range: "mid – open",            default: open}
  - {block: aenv,    param: release, range: "short – medium",        default: short}

listening:
  cue: "Every note starts with a tearing, rising rip, like a zipper pulled through the harmonics, and then sits on a bright, buzzy tone. The pitch itself does not move; only the colour does."
  ab: "Break the sync (feed osc2 to the filter on its own): the same envelope now bends the actual pitch and the note goes seasick. Put the sync back and the pitch is nailed down again while the timbre rips."

render:
  tempo: 120
  note: [C2, C2, G1, C2]
  velocity: 100
  pattern: "one bar: four quarters, each held nearly full length"
  length_s: 2.5

mappings: {}
