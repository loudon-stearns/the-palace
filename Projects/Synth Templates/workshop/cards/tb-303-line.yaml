# Synth Templates — Genre Classics — TB-303 Line
# The sound is the Acid Bass; this card is the line. Accent and slide live in the sequencer, and the square is the 303's other voice.
schema: synth-template-card/0.2
id: tb-303-line
name: TB-303 Line
family: Genre Classics
tier: 1
mode: mono legato
classics: TB-303
status: drafted
lineage:
  - "cards/acid-bass.yaml: the saw version; this card takes the square and the pattern"
concepts:
  - "Glide / portamento time; legato mode as default"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Velocity → amplitude; velocity → filter cutoff"
  - "Resonance: boost at cutoff; self-oscillation"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: square, octave: 0, glide: legato, note: "the 303's square; the saw is Acid Bass"}
    filter1: {kind: filter, type: lowpass, slope: 18, resonance: high}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: fenv.amount, amount: accent, essential: true}
    - {from: vel,  to: amp.level, amount: some, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode,    param: voices,    value: mono legato,   why: "a tied step glides and does not retrigger; an untied step jumps and bites: the pattern writes the articulation"}
  - {block: osc1,    param: wave,      value: square,        why: "hollow and woody; the 303's second voice"}
  - {block: osc1,    param: glide,     value: legato only,   why: "the slide is a tie in the sequencer, not a knob"}
  - {block: filter1, param: type,      value: lowpass 18 dB, why: "three poles, the 303's own slope"}
  - {block: filter1, param: resonance, value: high,          why: "a whistle rides the sweep"}
  - {block: vel,     param: accent,    value: velocity → envelope amount and level, why: "an accent is louder and sweeps higher; on the 303 it is one switch per step"}
  - {block: fenv,    param: sustain,   value: zero,          why: "every step sweeps down to the resting cutoff"}
  - {block: aenv,    param: sustain,   value: zero,          why: "steps stay separate; a tie carries the note instead"}

taste:
  - {block: filter1, param: cutoff,    range: "dark – mid",              default: dark}
  - {block: filter1, param: resonance, range: "moderate – self-oscillating", default: high}
  - {block: fenv,    param: amount,    range: "some – generous",         default: moderate, why: "the 303's env mod knob"}
  - {block: fenv,    param: decay,     range: "short – medium",          default: medium}
  - {block: osc1,    param: glide,     range: "short – medium",          default: short}
  - {block: osc1,    param: wave,      range: "square – saw",            default: square}
  - {block: amp,     param: drive,     range: "none – heavy",            default: none}

listening:
  cue: "A pattern, not a sound: some steps bite, some slide into the next, some jump out louder and brighter. The same four notes are a different line when the ties and accents move."
  ab: "Remove every tie: all the steps retrigger, nothing slides, and the line turns stiff. Put the ties back. Then remove the accents: the sweeps all become the same size and the line loses its lilt."

render:
  tempo: 132
  note: [C2, C2, C3, C2, Bb1, C2, Eb2, C2]
  velocity: [110, 70, 70, 110, 70, 110, 70, 70]
  pattern: "sixteenths, one bar; steps 3 and 7 tied to the step before (slide), accents on 1, 4, 6"
  length_s: 2.0

mappings: {}
