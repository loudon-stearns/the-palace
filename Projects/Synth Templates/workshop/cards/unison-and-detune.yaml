# Synth Templates — card — Unison and Detune
# Technique demonstration: one saw becomes a stack, and the stack is spread.
schema: synth-template-card/0.2
id: unison-and-detune
name: Unison and Detune
family: Technique Demonstrations
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Small detune (≤7 cents) = chorus"
  - "Unison / unisono"
  - "Poly vs mono; max voices"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 4, detune: narrow}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: medium}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,   value: saw,    why: "all harmonics, so the beating between voices is heard in every partial"}
  - {block: osc1,    param: unison, value: 4 voices, why: "one key plays several slightly different voices; this is a thickness, not a chord"}
  - {block: osc1,    param: detune, value: narrow, why: "a few cents apart: enough to swirl, not enough to sound out of tune"}
  - {block: filter1, param: cutoff, value: bright, why: "mostly open; the filter is only here to take the edge off"}
  - {block: mode,    param: voices, value: poly,   why: "unison multiplies the voices used: four unison voices on a four-note chord is sixteen, and the synth starts stealing when it runs out"}

taste:
  - {block: osc1, param: unison, range: "1 – 8 voices",      default: 4, why: "one is a plain saw; each doubling thickens the wall"}
  - {block: osc1, param: detune, range: "none – very wide",  default: narrow, why: "none: louder, no shimmer; slight: a chorus; wide: beating; very wide: out of tune"}
  - {block: aenv, param: release, range: "short – long",    default: medium}

listening:
  cue: "The same note growing from a single line into a shimmering wall. Listen for the slow beating inside the sound: that is the detuned voices drifting in and out of phase with each other."
  ab: "Set detune to none with the voices still stacked: louder, but flat and still, no swirl. Then set unison to 1: the plain saw you started from."

render:
  tempo: 100
  note: C3
  velocity: 90
  pattern: "the same note four times, two seconds each: 1 voice, then 2, 4, 8 with detune widening"
  length_s: 8.0

mappings: {}
