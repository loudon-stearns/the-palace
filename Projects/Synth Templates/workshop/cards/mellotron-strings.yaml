# Synth Templates — card 0.2 — Mellotron Strings
# A tape, not a string: a saw through a lowpass, a slow arrival, a note that must end when the tape runs out, and the tape's flutter.
schema: synth-template-card/0.2
id: mellotron-strings
name: Mellotron Strings
family: Keys and Mallets
tier: 2
mode: poly
classics: ""
status: drafted
concepts:
  - "Subtractive: rich wave then filter"
  - "Standard sustaining envelope; strings and horns variants"
  - "LFO → pitch / amplitude / pan / filter"
  - "Sustaining vs non-sustaining sounds"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 2, detune: slight}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "the tape's top end is gone"}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [reverb]}
    aenv:    {kind: envelope, role: amp, shape: {a: medium, d: very long, s: zero, r: medium}, category: string, note: "a sustaining instrument with sustain at zero: the tape is eight seconds long and then the note stops"}
    lfo1:    {kind: lfo, wave: random, rate: fast, sync: false, note: "flutter: the capstan's wobble, random and quick"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: lfo1, to: osc1.pitch, amount: little, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,    value: saw,           why: "bowed strings have every harmonic; the tape then dulls them"}
  - {block: filter1, param: type,    value: lowpass 12 dB, why: "the tape's roll-off, gentle but permanent"}
  - {block: filter1, param: cutoff,  value: mid,           why: "no sweep, no envelope: the tape plays what it plays"}
  - {block: aenv,    param: attack,  value: medium,        why: "the tape has to get up to speed against the head: the note arrives, it does not strike"}
  - {block: aenv,    param: decay,   value: very long,     why: "the tape is eight seconds long"}
  - {block: aenv,    param: sustain, value: zero,          why: "hold the key past the end and the note dies anyway; a sustaining sound with a time limit"}
  - {block: aenv,    param: release, value: medium,        why: "the tape rewinding as the key lifts"}
  - {block: lfo1,    param: target,  value: oscillator pitch, why: "the flutter: the pitch wobbles a little and at random, as a tape's does"}
  - {block: lfo1,    param: wave,    value: random,        why: "not a vibrato; nothing in it repeats"}
  - {block: mode,    param: voices,  value: poly,          why: "chords, each note its own tape strip"}

taste:
  - {block: filter1, param: cutoff,  range: "dark – bright",       default: mid, why: "how worn the tape is"}
  - {block: aenv,    param: attack,  range: "short – slow",        default: medium}
  - {block: aenv,    param: release, range: "short – long",        default: medium}
  - {block: lfo1,    param: depth,   range: "none – some",         default: little, why: "none is a new machine"}
  - {block: lfo1,    param: rate,    range: "medium – very fast",  default: fast}
  - {block: fx,      param: reverb,  range: "small – large",       default: large}

listening:
  cue: "Strings heard through a tape: dull on top, swelling in a little late, and never quite steady in pitch. Hold a chord long enough and it fades out on its own while your hands are still down."
  ab: "Set the LFO depth to none and the amp sustain to held: a clean, steady synth string pad with no history. Put the flutter back and the sustain back to zero, and the machine returns. Then set the attack to instant: an organ with flutter, which the Mellotron never was."

render:
  tempo: 72
  note: [D3, F3, A3, D4]
  velocity: 90
  pattern: "one chord held for twelve seconds, well past the tape's end, then released"
  length_s: 14.0

mappings: {}
