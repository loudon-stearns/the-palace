# Synth Templates — card 0.1 — Arpeggio
# Rhythmic and Sequenced, tier 1: a pluck played by the arpeggiator, with a synced delay filling the gaps.
schema: synth-template-card/0.2
id: arpeggio
name: Arpeggio
family: Rhythmic and Sequenced
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Pluck / strike: release = decay; gong vs marimba"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Delay: time, feedback, mix"
  - "Tempo sync; triplets"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, note: "played by the arpeggiator: 1/16, up then down; the voice cannot arpeggiate, the render pattern does it"}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [delay], note: "delay synced to a dotted eighth, feedback low, mix under half"}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: short, s: zero, r: same as decay}, category: plucked}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: medium, s: zero, r: same as decay}, category: plucked}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: vel,  to: fenv.amount, amount: some, essential: false}

essentials:
  - {block: mode,    param: arpeggiator, value: "1/16, up and down", why: "the arpeggiator is the player: hold a chord and it writes the line"}
  - {block: osc1,    param: wave,      value: saw,            why: "harmonics for the filter pluck to bite into"}
  - {block: fenv,    param: decay,     value: short,          why: "the pluck: open for an instant, then shut"}
  - {block: fenv,    param: sustain,   value: zero,           why: "every note is the same short bite"}
  - {block: aenv,    param: sustain,   value: zero,           why: "plucked: the note dies on its own, however long the step"}
  - {block: aenv,    param: release,   value: same as decay,  why: "sixteenths must not pile up"}
  - {block: fx,      param: chain,     value: delay at a dotted eighth, why: "the echoes land between the sixteenths and double the pattern"}
  - {block: mode,    param: voices,    value: poly,           why: "the held chord needs its voices even though the arp plays one at a time"}

taste:
  - {block: filter1, param: cutoff,   range: "dark – mid",          default: mid}
  - {block: fenv,    param: amount,   range: "some – generous",     default: moderate}
  - {block: aenv,    param: decay,    range: "short – medium",      default: medium, why: "shorter and the delay has more room"}
  - {block: fx,      param: feedback, range: "little – half",       default: little}
  - {block: fx,      param: mix,      range: "quarter – half",      default: quarter}
  - {block: mode,    param: arp range, range: "1 – 3 octaves",      default: 2 octaves}

listening:
  cue: "A line you did not play: a held chord becomes running sixteenths, and the dotted-eighth echoes answer them a beat and a half later. The pattern seems twice as busy as the notes."
  ab: "Turn the delay off: the same arpeggio, but bare and even. Put it back and the second pattern appears inside the first. Then set the amp sustain to full: the notes smear into a chord again."

render:
  tempo: 128
  note: [C3, E3, G3, C4, G3, E3]
  velocity: 100
  pattern: "sixteenths, two bars, up then down over the held C major chord; the delay rings into the last beat"
  length_s: 4.5

mappings: {}
