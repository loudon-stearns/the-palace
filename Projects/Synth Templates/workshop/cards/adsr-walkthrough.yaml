# Synth Templates — card — ADSR Walkthrough
# Technique demonstration: one envelope on the amplifier and nothing else. Each stage is a taste row with a wide range,
# so each can be exaggerated in turn.
schema: synth-template-card/0.2
id: adsr-walkthrough
name: ADSR Walkthrough
family: Technique Demonstrations
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "ADSR: three times and a level"
  - "Envelope → amplitude"
  - "Sustaining vs non-sustaining sounds"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "open; it is here so the saw is not harsh, not to shape anything"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: medium, d: medium, s: half, r: medium}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,   value: saw,    why: "a steady, obvious tone; the envelope is the only thing moving"}
  - {block: filter1, param: cutoff, value: open,   why: "no filter movement, so the loudness contour is heard alone"}
  - {block: aenv,    param: target, value: amp level, why: "the amplitude envelope: it gives every note its basic shape"}
  - {block: aenv,    param: sustain, value: half,  why: "a level, not a time: halfway, so the decay has somewhere to go and the release has somewhere to come from"}

taste:
  - {block: aenv, param: attack,  range: "instant – very slow", default: medium, why: "the time from note-on to full"}
  - {block: aenv, param: decay,   range: "instant – very long", default: medium, why: "the time from full down to the sustain level"}
  - {block: aenv, param: sustain, range: "zero – full",         default: half,   why: "where the note sits while the key is held; zero makes it a pluck"}
  - {block: aenv, param: release, range: "instant – very long", default: medium, why: "the time from key-up to silence"}

listening:
  cue: "Four moments in one note: it rises, it settles back a little, it holds there as long as the key is down, and it fades after the key is let go."
  ab: "Set sustain to zero: the note dies while the key is still held and it has become a plucked sound. Set it back to half and the hold returns. Then set attack to very slow: the note arrives late and soft, a bowed swell."

render:
  tempo: 100
  note: C3
  velocity: 90
  pattern: "one note held two seconds, then released and left to fade"
  length_s: 4.0

mappings: {}
