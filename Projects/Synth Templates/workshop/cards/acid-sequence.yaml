# Synth Templates — card 0.1 — Acid Sequence
# Rhythmic and Sequenced, tier 2: the acid bass, but the point is the sequence. Sixteen steps, each with a pitch, an accent flag and a slide flag; the sequencer is the composer.
schema: synth-template-card/0.2
id: acid-sequence
name: Acid Sequence
family: Rhythmic and Sequenced
tier: 2
mode: mono legato
classics: TB-303
status: drafted
lineage:
  - "cards/acid-bass.yaml: the voice is the same; this card adds the 16-step pattern as the instrument"
concepts:
  - "Resonance: boost at cutoff; self-oscillation"
  - "Glide / portamento time; legato mode as default"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Tempo sync; triplets"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, glide: legato, note: "played by a 16-step sequencer at 1/16: each step has a pitch, an accent flag and a slide flag. The voice cannot sequence; the render pattern spells the steps out"}
    filter1: {kind: filter, type: lowpass, slope: 18, resonance: high}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [distortion, delay], note: "delay synced to a dotted eighth, mix low"}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: fenv.amount, amount: accent, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode,    param: sequencer,  value: "16 steps at 1/16: pitch, accent, slide", why: "the pattern is the instrument; the same voice with a different pattern is a different piece"}
  - {block: mode,    param: voices,     value: mono legato,    why: "a slide step ties into the next without retriggering the envelopes; a plain step retriggers"}
  - {block: vel,     param: accent,     value: velocity → envelope amount, why: "an accent step is a bigger sweep; accents placed off the beat are what make the line move"}
  - {block: osc1,    param: glide,      value: legato only,    why: "slides happen only where the pattern says, so the line has both jumps and smears"}
  - {block: filter1, param: resonance,  value: high,           why: "the whistle that rides each sweep; the sequence is heard as much in the filter as in the pitches"}
  - {block: filter1, param: cutoff,     value: dark,           why: "closed at rest; the envelope and the accents open it"}
  - {block: fenv,    param: sustain,    value: zero,           why: "every step is a sweep down"}
  - {block: aenv,    param: sustain,    value: zero,           why: "sixteenths stay separate; the rests are part of the pattern"}
  - {block: mode,    param: rests,      value: "steps 4, 8, 12 silent", why: "a pattern is as much where it does not play; the gaps give the accents somewhere to land"}

taste:
  - {block: filter1, param: cutoff,     range: "dark – mid",              default: dark, why: "the live knob: ride it over the bars and the same pattern keeps changing"}
  - {block: filter1, param: resonance,  range: "high – self-oscillating", default: high}
  - {block: fenv,    param: decay,      range: "short – medium",          default: medium}
  - {block: osc1,    param: glide,      range: "short – medium",          default: short}
  - {block: mode,    param: accents,    range: "2 – 6 per bar",           default: 4}
  - {block: mode,    param: slides,     range: "1 – 5 per bar",           default: 3}
  - {block: fx,      param: drive,      range: "none – heavy",            default: light}

listening:
  cue: "A one-bar line that loops and never quite sits still: some steps bite, some slur into the next, some are missing. Turn the cutoff while it runs and the line seems to be improvising, though not one note has changed."
  ab: "Remove every accent and slide flag: the same sixteen pitches, flat and even, a bass line with nothing to say. Put them back and it is acid again. Then fill the rests: busier, and duller."

render:
  tempo: 132
  note: [C2, C2, C3, rest, Eb2, C2, G2, rest, C2, Bb1, C2, rest, Eb2, F2, C2, C2]
  velocity: [115, 70, 70, 0, 115, 70, 115, 0, 70, 115, 70, 0, 70, 115, 70, 70]
  pattern: "sixteen sixteenths, one bar, looped twice; rests at steps 4, 8, 12; slides into steps 3, 7, 10, 14 (tied to the step before); accents at 1, 5, 7, 10, 14"
  length_s: 4.0

mappings: {}
