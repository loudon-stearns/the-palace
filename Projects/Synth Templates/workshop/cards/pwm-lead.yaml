# Synth Templates — card — PWM Lead
# One pulse whose width an LFO keeps moving: the thickness of two detuned oscillators from a single one.
schema: synth-template-card/0.2
id: pwm-lead
name: PWM Lead
family: Leads
tier: 2
mode: mono
classics: SH-101 / Juno
status: drafted
concepts:
  - "Pulse width, static and modulated"
  - "LFO → pitch / amplitude / pan / filter"
  - "Chorus: multiple delays, own LFOs, no feedback"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: pulse, pw: 0.5, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
    lfo1:    {kind: lfo, wave: triangle, rate: slow, sync: false, note: "the voice does not yet modulate pulse width; the diagram draws it"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pw, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,     value: pulse,     why: "a square whose up and down halves can be unequal; the width is a timbre control"}
  - {block: osc1,    param: pw,       value: 0.5,       why: "centred, so the LFO sweeps it narrow on both sides of square"}
  - {block: lfo1,    param: target,   value: pulse width, why: "moving the width shifts the harmonics in and out, which the ear hears as two voices drifting against each other"}
  - {block: lfo1,    param: rate,     value: slow,      why: "a slow drift; faster and it turns into a wobble"}
  - {block: lfo1,    param: depth,    value: moderate,  why: "wide enough to travel from square toward narrow; all the way and the pulse thins to nothing at the turn"}
  - {block: filter1, param: cutoff,   value: bright,    why: "open enough that the moving harmonics are heard"}
  - {block: mode,    param: voices,   value: mono,      why: "one line; the thickness is in the oscillator, not in voices"}

taste:
  - {block: lfo1,    param: rate,     range: "very slow – medium",  default: slow}
  - {block: lfo1,    param: depth,    range: "some – generous",     default: moderate}
  - {block: osc1,    param: pw,       range: "0.5 – 0.3",           default: 0.5, why: "off-centre, the drift is uneven: nasal on one side"}
  - {block: filter1, param: cutoff,   range: "mid – open",          default: bright}
  - {block: aenv,    param: release,  range: "short – medium",      default: short}
  - {block: osc1,    param: glide,    range: "none – short",        default: none}

listening:
  cue: "One oscillator that sounds like two slightly out of tune: a slow churn inside a held note, hollow at one moment and nasal the next, never still."
  ab: "Set the LFO depth to none: a plain, static square, and the churn is gone. Put it back. Then set the LFO rate to fast: the drift becomes a rapid wobble, a different and uglier effect."

render:
  tempo: 100
  note: [D4, F4, A4, D4]
  velocity: 100
  pattern: "quarter notes, one bar; then D4 held two bars so the width drifts through a cycle"
  length_s: 6.0

mappings: {}
