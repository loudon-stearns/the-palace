# Synth Templates — card 0.2 — Aftertouch → Filter
# A sustained lead where the hand keeps working after the key is down: pressure opens the filter on the held note.
schema: synth-template-card/0.2
id: aftertouch-filter
name: Aftertouch → Filter
family: LFO Behaviours
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Aftertouch → filter cutoff"
  - "Cutoff frequency"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: moderate}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: at,   to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: at,      param: target,    value: filter cutoff, why: "the attack is already spoken for by velocity and envelopes; pressure is the modulator you still have while the note is held"}
  - {block: at,      param: amount,    value: generous,      why: "pressed hard the note should open all the way; the resting sound is the dark one"}
  - {block: filter1, param: cutoff,    value: dark,          why: "closed at rest, so there is somewhere to go"}
  - {block: filter1, param: resonance, value: moderate,      why: "a peak that moves with the pressure, so the opening is heard as a sweep"}
  - {block: aenv,    param: sustain,   value: held,          why: "aftertouch lives in the sustain stage"}
  - {block: mode,    param: voices,    value: mono,          why: "one voice under one hand; on poly synths most keyboards send one pressure for all"}

taste:
  - {block: filter1, param: at → cutoff, range: "some – full", default: generous}
  - {block: filter1, param: cutoff,    range: "dark – mid",       default: dark}
  - {block: filter1, param: resonance, range: "little – high",    default: moderate}
  - {block: aenv,    param: release,   range: "short – medium",   default: short}
  - {block: osc1,    param: glide,     range: "none – short",     default: none}

listening:
  cue: "The note arrives dark and stays dark until you lean on the key. Then it opens, as far as you press, and closes again when you ease off, with no new attack."
  ab: "Route the same amount from velocity instead: the brightness is decided at the strike and nothing you do afterwards changes it. Back to aftertouch and the held note is alive again."

render:
  tempo: 90
  note: C3
  velocity: 100
  pattern: "one note held two bars; pressure rises from none to full over bar one and falls back over bar two"
  length_s: 6.0

mappings: {}
