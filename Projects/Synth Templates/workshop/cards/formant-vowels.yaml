# Synth Templates — card — Formant Vowels
# Technique demonstration: a saw as the voice's buzz, band-passes as the mouth. Move the peaks and the vowel changes.
schema: synth-template-card/0.2
id: formant-vowels
name: Formant Vowels
family: Technique Demonstrations
tier: 3
mode: mono
classics: ""
status: drafted
concepts:
  - "Parallel: twin peaks, keytracking amount, vocal formants"
  - "Parallel routing"
  - "Resonance as width (Q) on band-pass and notch"
  - "Narrow pulse → nasal / vocal, with formant filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: bandpass, slope: 12, resonance: high, note: "the first formant, the lowest peak. The three formants are in parallel, each fed the saw and summed; the slots can only draw two, in series. Read the chain as side by side"}
    filter2: {kind: filter, type: bandpass, slope: 12, resonance: high, note: "the second formant; a third band-pass, higher again, sharpens the vowel"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw, why: "the glottal buzz: every harmonic, for the peaks to pick from. A narrow pulse is the other classic vocal source"}
  - {block: filter1, param: type,      value: bandpass, why: "a formant is a peak, not a cut: a band-pass each"}
  - {block: filter2, param: type,      value: bandpass}
  - {block: filter1, param: resonance, value: high, why: "on a band-pass, resonance is width: narrow peaks make a vowel, wide ones make a mush"}
  - {block: filter1, param: routing,   value: parallel, why: "summed, not chained: in series the second peak would cut what the first let through"}
  - {block: filter1, param: keytrack,  value: none, why: "the mouth does not change size with the note: formants stay put while the pitch moves under them"}

taste:
  - {block: filter1, param: cutoff,    range: "dark – mid",    default: dark, why: "the first formant: low for 'oo' and 'ee', higher for 'ah'"}
  - {block: filter2, param: cutoff,    range: "mid – bright",  default: bright, why: "the second: high for 'ee', low for 'oo'; the pair together is the vowel"}
  - {block: filter1, param: resonance, range: "moderate – self-oscillating", default: high, why: "the sharpness of the vowel"}
  - {block: osc1,    param: wave,      range: "saw – pulse",   default: saw}

listening:
  cue: "A buzz that says a vowel: 'ah', then 'ee', then 'oo', as the two peaks move, while the note itself does not change. Play a different note and the vowel stays the same, because the peaks did not move with the key."
  ab: "Open both band-passes wide (resonance to none): the vowel blurs into an ordinary filtered saw. Narrow them again and the mouth comes back. Then keytrack the formants at full: now every note is a different vowel, and it stops sounding like a voice."

render:
  tempo: 100
  note: C3
  velocity: 90
  pattern: "one note held eight seconds while the peaks move a - e - i - o - u"
  length_s: 9.0

mappings: {}
