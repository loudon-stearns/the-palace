# Synth Templates — card 0.2 — Filter Thunk
# Filter Routings, tier 2. A very low resonant low-pass beside the main voice rings sympathetically at every attack, the way a piano's or guitar's body does.
# The slot grammar draws the filters in series; the parallel split is said in the notes. No cutoff word sits under 100 Hz; dark is the lowest.
schema: synth-template-card/0.2
id: filter-thunk
name: Filter Thunk
family: Filter Routings
tier: 2
mode: poly
classics: ""
status: drafted
concepts:
  - "Filter thunk (resonance = delay feedback)"
  - "Parallel routing"
  - "Resonance: boost at cutoff; self-oscillation"
  - "Velocity → amplitude; velocity → filter cutoff"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little, note: "PARALLEL with filter 2: the main voice"}
    filter2: {kind: filter, type: lowpass, slope: 24, resonance: high, note: "PARALLEL on the real synth; the voice runs it in series after filter 1. The thunk: cutoff under 100 Hz, below the lowest cutoff word; a little keytracking, a lot of velocity"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: long, s: half, r: medium}, category: plucked}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: key,  to: filter2.cutoff, amount: little, essential: true}
    - {from: vel,  to: filter2.level, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw,            why: "the attack has energy at every frequency, including the one the thunk filter rings at"}
  - {block: filter1, param: type,      value: lowpass 24 dB,  why: "the main voice; the thunk is beside it, not in it"}
  - {block: filter1, param: cutoff,    value: mid}
  - {block: filter2, param: type,      value: lowpass 24 dB}
  - {block: filter2, param: routing,   value: parallel,       why: "the thunk adds to the voice; in series it would swallow it"}
  - {block: filter2, param: cutoff,    value: dark,           why: "under 100 Hz on the synth (dark is the lowest word here): the attack excites it and it rings at that pitch"}
  - {block: filter2, param: resonance, value: high,           why: "resonance is how long it rings, because filter resonance is delay feedback; more resonance, longer thunk"}
  - {block: filter2, param: keytrack,  value: little,         why: "the thunk shifts a little across the keyboard, not all the way; a body does not retune per note"}
  - {block: vel,     param: target,    value: filter 2 level, why: "a lot: hard hits carry the thunk, light ones barely any"}
  - {block: filter2, param: level,     value: little,         why: "subtle; pushed, it muddies the bottom of the mix"}
  - {block: mode,    param: voices,    value: poly,           why: "piano and guitar, the instruments that have one, are polyphonic"}

taste:
  - {block: filter2, param: resonance, range: "moderate – self-oscillating", default: high, why: "the length of the thunk"}
  - {block: filter2, param: level,     range: "off – quarter",      default: little}
  - {block: filter2, param: keytrack,  range: "none – some",        default: little}
  - {block: filter1, param: cutoff,    range: "dark – bright",      default: mid}
  - {block: aenv,    param: decay,     range: "medium – very long", default: long}

listening:
  cue: "Listen under the notes: on hard hits a low knock lands with the attack and hums away under the tone, like a string's energy going into a body. On soft notes it is nearly gone."
  ab: "Turn filter 2's level to off: the notes are the same but weightless, the knock is gone. Bring it back to little. Then drop its resonance to none: the knock turns into a dull bump that stops at once; the ring was the resonance."

render:
  tempo: 90
  note: [C3, E3, G3, C3, E3, G3]
  velocity: [115, 115, 115, 55, 55, 55]
  pattern: "a triad arpeggiated hard, then the same soft; quarter notes"
  length_s: 5.0

mappings: {}
