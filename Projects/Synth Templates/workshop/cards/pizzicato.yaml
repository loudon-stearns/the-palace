# Synth Templates — card — Pizzicato
# Plucked Strings, tier 1. The shortest pluck that still reads as a note: one saw, a closed filter, and a decay you can barely hear end.
schema: synth-template-card/0.2
id: pizzicato
name: Pizzicato
family: Plucked Strings
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Pluck / strike: release = decay; gong vs marimba"
  - "Cutoff frequency"
  - "Subtractive: rich wave then filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: fast, s: zero, r: fast}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: short, s: zero, r: same as decay}, category: plucked}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate,  essential: true}
    - {from: key,  to: aenv.gate,  essential: true}
    - {from: vel,  to: amp.level, amount: some, essential: false}

essentials:
  - {block: osc1,    param: wave,      value: saw,            why: "a plucked string has every harmonic; the filter decides how many you hear"}
  - {block: filter1, param: type,      value: lowpass 24 dB,  why: "steep, so the tone is round and the bright pick is the only high end"}
  - {block: filter1, param: cutoff,    value: dark,           why: "a finger on gut: almost no top. Open it and it is a guitar"}
  - {block: fenv,    param: decay,     value: fast,           why: "the pick is a flash, shorter than the note itself"}
  - {block: fenv,    param: sustain,   value: zero}
  - {block: aenv,    param: attack,    value: instant,        why: "plucked: the loudest moment is the first"}
  - {block: aenv,    param: decay,     value: short,          why: "the shortest decay that still has a pitch in it; shorter is a wood block"}
  - {block: aenv,    param: sustain,   value: zero,           why: "non-sustaining; the key length does not matter"}
  - {block: aenv,    param: release,   value: same as decay,  why: "a staccato key must not cut the pluck shorter than it already is"}

taste:
  - {block: aenv,    param: decay,     range: "fast – medium",     default: short, why: "fast is a tick; medium is a cello pizz"}
  - {block: filter1, param: cutoff,    range: "dark – mid",        default: dark}
  - {block: fenv,    param: amount,    range: "some – generous",   default: moderate}
  - {block: filter1, param: resonance, range: "none – moderate",   default: little, why: "a little gives the pluck its thunk"}
  - {block: amp,     param: level,     range: "half – full",       default: under unity}

listening:
  cue: "A dot, not a line: a dull round thump with a pitch in it, gone before you can decide what the timbre was. Repeated notes stay separate at any speed."
  ab: "Lengthen the amp decay to slow: it becomes a guitar pluck and the notes smear into each other. Put it back to short. Then open the cutoff to bright: the same note is a plucked saw with its pizzicato softness gone."

render:
  tempo: 120
  note: [G2, G2, D3, G2, Bb2, G2, D3, F3]
  velocity: [100, 80, 90, 80, 100, 80, 90, 100]
  pattern: "eighths, one bar, each key a 16th long; the last note left to ring"
  length_s: 2.5

mappings: {}
