# Synth Templates — card — Layered Sub + Tone
# Two layers that own different bands: a sine for the low end, a filtered saw high-passed above it for the character.
# The slots draw one chain, so the sheet shows the sub through the filters; the notes say it bypasses them.
schema: synth-template-card/0.2
id: layered-sub-tone
name: Layered Sub + Tone
family: Bass
tier: 2
mode: mono
classics: deep house
status: drafted
concepts:
  - "Low-pass, high-pass, band-pass, notch"
  - "Sine: no response to filtering; FM/additive building block"
  - "Serial routing"
  - "Subtractive: rich wave then filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, note: "layer B, the tone: it goes through both filters"}
    sub:     {kind: oscillator, wave: sine, octave: -1, note: "layer A, the sub: in truth it bypasses both filters and meets the tone at the amplifier; the slots cannot draw a second path"}
    mix:     {kind: mixer}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little, note: "the tone's character"}
    filter2: {kind: filter, type: highpass, slope: 12, resonance: none, note: "cuts the tone layer below about 80 Hz so it never fights the sub"}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, mix]
    - [sub, mix]
    - [mix, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: sub.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: sub,     param: wave,    value: sine,           why: "the low layer is one partial: all weight, no character, and nothing for a filter to do"}
  - {block: sub,     param: octave,  value: -1,             why: "an octave under the tone: the two never share a band"}
  - {block: sub,     param: routing, value: bypasses the filters, why: "a filter would only lose weight; the sub goes straight to the amp"}
  - {block: osc1,    param: wave,    value: saw,            why: "the tone layer needs harmonics to shape"}
  - {block: filter1, param: type,    value: lowpass 24 dB,  why: "the character of the tone layer"}
  - {block: filter2, param: type,    value: highpass 12 dB, why: "on the tone layer only: it hands the bottom octave to the sub, so each layer owns a band"}
  - {block: filter2, param: cutoff,  value: dark,           why: "about 80 Hz: just under the tone's fundamental, well above the sub's"}
  - {block: fenv,    param: decay,   value: medium,         why: "a soft pluck on the tone; the sub does not move"}
  - {block: mode,    param: voices,  value: mono}

taste:
  - {block: sub,     param: level,   range: "half – full",       default: full, why: "the balance between the layers is the whole mix decision"}
  - {block: osc1,    param: level,   range: "quarter – equal",   default: half}
  - {block: filter1, param: cutoff,  range: "dark – mid",        default: dark}
  - {block: fenv,    param: amount,  range: "some – generous",   default: moderate}
  - {block: aenv,    param: release, range: "short – medium",    default: short}

listening:
  cue: "Two things at once that read as one: a pure weight you feel under a plucked saw tone you hear. Mute the sub and the bass is all mid; mute the tone and it is all floor."
  ab: "Take the high-pass off the tone layer: its low end now piles on the sub and the bottom goes muddy and uneven from note to note. Put it back and the floor is clean again."

render:
  tempo: 122
  note: [C2, C2, Eb2, G1]
  velocity: 100
  pattern: "one bar: two eighths, an eighth rest, an eighth, then a half note"
  length_s: 2.5

mappings: {}
