# Synth Templates — card — Whistle
# A sine high up with a quick vibrato and nothing under it: the highpass takes whatever body the patch would have had.
schema: synth-template-card/0.2
id: whistle
name: Whistle
family: Leads
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Sine: no response to filtering; FM/additive building block"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"
  - "Low-pass, high-pass, band-pass, notch"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: sine, octave: 1}
    filter1: {kind: filter, type: highpass, slope: 12, resonance: none, note: "takes the thump off the attack and any low leakage; the sine itself passes"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: short, d: short, s: held, r: short}, category: sustaining}
    lfo1:    {kind: lfo, wave: sine, rate: fast, sync: false}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1,  to: osc1.pitch, amount: little, essential: true}
    - {from: aenv,  to: amp.level, essential: true}
    - {from: wheel, to: lfo1.depth, amount: some, essential: false}
    - {from: key,   to: osc1.pitch, essential: true}
    - {from: key,   to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,     value: sine,      why: "a whistle is nearly one partial; nothing else to hear"}
  - {block: osc1,    param: octave,   value: +1,        why: "whistles live above the voice; play it where a whistle is"}
  - {block: lfo1,    param: rate,     value: fast,      why: "quicker than a sung vibrato, the way a whistled note wavers"}
  - {block: lfo1,    param: depth,    value: little,    why: "under a semitone; more and it is a siren"}
  - {block: aenv,    param: attack,   value: short,     why: "the breath starts the note; no click"}
  - {block: filter1, param: type,     value: highpass,  why: "removes the body: the attack thump and anything below the tone, so only the whistle is left"}
  - {block: mode,    param: voices,   value: mono,      why: "one mouth"}

taste:
  - {block: lfo1,    param: rate,     range: "medium – very fast",  default: fast}
  - {block: lfo1,    param: depth,    range: "little – some",       default: little}
  - {block: aenv,    param: attack,   range: "fast – medium",       default: short}
  - {block: filter1, param: cutoff,   range: "dark – mid",          default: dark}
  - {block: aenv,    param: release,  range: "short – medium",      default: short}

listening:
  cue: "A thin, pure, high tone that wavers quickly, the way a whistled note never quite holds still. There is nothing underneath it: no body, no attack thump."
  ab: "Set the vibrato depth to none: a flat test tone, not a whistle. Put it back. Then drop the octave to 0 and set attack to instant: the same sine turns into a soft organ note."

render:
  tempo: 96
  note: [C5, E5, G5, E5, C5]
  velocity: 90
  pattern: "quarter notes, one bar and a beat; the last held"
  length_s: 4.0

mappings: {}
