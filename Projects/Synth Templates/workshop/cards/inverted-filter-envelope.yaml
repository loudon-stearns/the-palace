# Synth Templates — card 0.2 — Inverted Filter Envelope
# Envelope Shapes family. The filter envelope turned upside down: at the strike the cutoff is pushed down, and over
# the decay it recovers to where it rests. A note that opens up as it is held instead of biting and closing. Loudon's
# notes put this on a high-pass in a parallel notch; the card teaches the move on the family's single filter.
schema: synth-template-card/0.2
id: inverted-filter-envelope
name: Inverted Filter Envelope
family: Envelope Shapes
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Parallel: flexible notch with horns, inverted HP envelope, mix balance"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Envelope → amplitude"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: little, note: "fenv → cutoff is negative: the voice does not yet play an inverted envelope; the diagram draws it"}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: zero, r: medium}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, polarity: negative, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: fenv, param: polarity, value: negative, why: "the whole lesson: the same envelope, subtracted instead of added. The cutoff dips at the strike and climbs back during the decay"}
  - {block: fenv, param: attack,  value: instant,  why: "the dip is at once"}
  - {block: fenv, param: decay,   value: medium,   why: "the recovery; long enough to hear the note open as it is held"}
  - {block: fenv, param: sustain, value: zero,     why: "zero here means the envelope ends where it started, so the cutoff returns all the way to its resting place"}
  - {block: filter1, param: cutoff, value: bright, why: "rests high so there is somewhere to dip from; an envelope that pushes down from a closed filter does nothing"}
  - {block: aenv, param: sustain, value: held,     why: "a sustaining amp shape; the only movement is the filter's"}
  - {block: mode, param: voices,  value: mono,     why: "a lead; hear one note open at a time"}

taste:
  - {block: fenv,    param: amount,    range: "some – generous",     default: moderate, why: "how deep the dip"}
  - {block: fenv,    param: decay,     range: "short – slow",        default: medium}
  - {block: filter1, param: cutoff,    range: "mid – open",          default: bright}
  - {block: filter1, param: type,      range: "lowpass – highpass",  default: lowpass, why: "on a high-pass, as in the notes, the dip lets the lows through at the attack and the note thins as it is held"}
  - {block: filter1, param: resonance, range: "none – moderate",     default: little, why: "a little makes the recovery audible as a sweep"}

listening:
  cue: "Each note starts dull and brightens as you hold it, the opposite of the usual filter pluck. The strike is the darkest moment and the sustain the brightest."
  ab: "Flip the filter envelope back to positive: now the note bites bright and closes down, the ordinary filter envelope. Flip it negative again and the note opens instead. The amount, the shape and the filter are unchanged; only the sign."

render:
  tempo: 100
  note: [C3, Eb3, G3, Bb3]
  velocity: 100
  pattern: "four half notes up the chord, each held full length"
  length_s: 5.0

mappings: {}
