# Synth Templates — card 0.2 — Serial: Flexible Band-Pass
# Filter Routings, tier 1. Two filters in series make one band-pass whose edges you can move apart; resonance puts a horn on each edge.
schema: synth-template-card/0.2
id: serial-flexible-band-pass
name: "Serial: Flexible Band-Pass"
family: Filter Routings
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Serial routing"
  - "Serial: flexible band-pass (HP + LP) with horns"
  - "Low-pass, high-pass, band-pass, notch"
  - "Resonance: boost at cutoff; self-oscillation"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: highpass, slope: 24, resonance: moderate, note: "the low edge of the band"}
    filter2: {kind: filter, type: lowpass,  slope: 24, resonance: moderate, note: "the high edge of the band"}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: medium}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter2.cutoff, amount: moderate, essential: false}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: wheel, to: filter1.cutoff, amount: moderate, essential: false}

essentials:
  - {block: osc1,    param: wave,      value: saw,            why: "harmonics everywhere, so both edges have something to cut and something to boost"}
  - {block: filter1, param: type,      value: highpass 24 dB, why: "the first filter sets the bottom of the band"}
  - {block: filter1, param: cutoff,    value: dark,           why: "low, so the band starts wide; raise it to narrow from below"}
  - {block: filter2, param: type,      value: lowpass 24 dB,  why: "the second sets the top; one after the other is the band-pass"}
  - {block: filter2, param: cutoff,    value: bright,         why: "high, so the band starts wide; lower it to narrow from above"}
  - {block: filter1, param: resonance, value: moderate,       why: "a horn at the low edge"}
  - {block: filter2, param: resonance, value: moderate,       why: "a horn at the high edge; two horns, one at each wall"}
  - {block: mode,    param: voices,    value: mono,           why: "one line, so the band is heard moving on one note"}

taste:
  - {block: filter1, param: cutoff,    range: "dark – mid",          default: dark,     why: "the low wall; bring it up and the band narrows"}
  - {block: filter2, param: cutoff,    range: "mid – open",          default: bright,   why: "the high wall; bring it down and the band narrows"}
  - {block: filter1, param: resonance, range: "none – high",         default: moderate}
  - {block: filter2, param: resonance, range: "none – high",         default: moderate}
  - {block: fenv,    param: amount,    range: "none – generous",     default: moderate, why: "the top wall moving on every note"}
  - {block: fenv,    param: decay,     range: "short – long",        default: medium}

listening:
  cue: "A saw with its bottom and top sliced off, and a ring at each cut. Move either wall and the band changes width; the two horns stay on the edges."
  ab: "Turn both resonances to none: the walls go soft and the horns vanish, a plain thin saw. Put them back and both edges ring again. Then raise the high-pass cutoff up to the low-pass: the band closes to nothing."

render:
  tempo: 110
  note: [C3, C3, G3, C3]
  velocity: 100
  pattern: "quarter notes, one bar, each held most of its beat; the mod wheel rises through the bar"
  length_s: 3.0

mappings: {}
