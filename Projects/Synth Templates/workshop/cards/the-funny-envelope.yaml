# Synth Templates — card 0.2 — The Funny Envelope
# Envelope Shapes family. Short decay, zero sustain, long release. Hold a note and the decay runs out: a short pluck.
# Tap a note so the key comes up inside the decay and the long release takes over: a long note. Backwards from how
# a keyboard usually behaves.
schema: synth-template-card/0.2
id: the-funny-envelope
name: The Funny Envelope
family: Envelope Shapes
tier: 2
mode: poly
classics: ""
status: drafted
concepts:
  - "The funny envelope: long notes short, short notes long"
  - "Envelope → amplitude"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "open; the family's fixed chain"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: instant, d: short, s: zero, r: long}, category: percussive}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: aenv, param: attack,  value: instant, why: "a strike"}
  - {block: aenv, param: decay,   value: short,   why: "held notes run this out and are over: the short half of the trick"}
  - {block: aenv, param: sustain, value: zero,    why: "so a held note really does end; with any sustain the trick fails"}
  - {block: aenv, param: release, value: long,    why: "a note-off that lands inside the decay hands the level to the release, which falls slowly: the long half of the trick"}
  - {block: filter1, param: cutoff, value: open,  why: "the filter stays out of the way"}
  - {block: mode, param: voices,  value: poly,    why: "the long tails of tapped notes stack up"}

taste:
  - {block: aenv,    param: decay,   range: "fast – medium",     default: short, why: "the window: a note-off inside it gets the long tail"}
  - {block: aenv,    param: release, range: "slow – very long",  default: long, why: "the tail a tapped note gets"}
  - {block: osc1,    param: wave,    range: "saw – triangle",    default: saw}
  - {block: filter1, param: cutoff,  range: "mid – open",        default: open}

listening:
  cue: "Hold a key and you get a short pluck that is over while you are still holding it. Tap the same key and the note rings on for seconds. The faster you play, the longer the notes get."
  ab: "Set the release to same as decay: now tapped and held notes are the same short pluck, the ordinary strike shape. Put the long release back and tapped notes grow their tails again."

render:
  tempo: 100
  note: C3
  velocity: 100
  pattern: "one note held a bar; then the same note tapped as four 32nd-long eighths, left to ring"
  length_s: 7.0

mappings: {}
