# Synth Templates — card 0.2 — Switch (Organ)
# Envelope Shapes family: one amp envelope per shape, on a plain saw through an open filter. This is the first shape:
# a switch. On at note-on, off at note-off, nothing in between.
schema: synth-template-card/0.2
id: switch-organ
name: Switch (Organ)
family: Envelope Shapes
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Switch envelope (organ); percussive organ"
  - "Envelope → amplitude"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "open; it is here so every card in the family has the same chain"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: instant, d: short, s: full, r: instant}, category: organ}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: aenv, param: attack,  value: instant, why: "a switch takes no time to go from off to on"}
  - {block: aenv, param: sustain, value: full,    why: "the sustain is the top, so there is no lower level for the decay to reach"}
  - {block: aenv, param: decay,   value: short,   why: "does nothing at all: with sustain at full it has nowhere to go; set it anywhere"}
  - {block: aenv, param: release, value: instant, why: "off at note-off, as suddenly as it came on"}
  - {block: filter1, param: cutoff, value: open,  why: "the filter is out of the way so you hear only the envelope"}
  - {block: mode, param: voices,  value: poly,    why: "an organ plays chords; every key is its own switch"}

taste:
  - {block: aenv,    param: decay,   range: "instant – very long", default: short, why: "move it and hear that nothing changes"}
  - {block: osc1,    param: wave,    range: "saw – square",        default: saw}
  - {block: filter1, param: cutoff,  range: "mid – open",          default: open}
  - {block: amp,     param: level,   range: "half – under unity",  default: under unity}

listening:
  cue: "The note is a rectangle: full the instant the key goes down, gone the instant it comes up, and flat in between. No swell, no fade, no tail. Expect a small click at both ends."
  ab: "Turn the release up to medium: the note now trails off after the key, and it stops being a switch. Back to instant and the rectangle returns. Now turn the decay anywhere you like: nothing changes, because sustain is already at the top."

render:
  tempo: 100
  note: [C3, E3, G3]
  velocity: 100
  pattern: "the chord as four staccato eighths, then held one bar and released dead"
  length_s: 4.0

mappings: {}
