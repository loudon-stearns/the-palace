# Synth Templates — card 0.2 — Velocity → LFO Rate
# The keytracked card's twin: the vibrato speed comes from how hard the note was struck, so even one repeated key never wobbles the same way twice.
schema: synth-template-card/0.2
id: velocity-lfo-rate
name: Velocity → LFO Rate
family: LFO Behaviours
tier: 2
mode: poly
classics: ""
status: drafted
concepts:
  - "Keytracking or velocity → LFO rate"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: medium, d: medium, s: held, r: medium}, category: sustaining}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: false, retrigger: true, note: "one LFO per voice; the rate follows the strike. The voice does not yet play velocity → rate"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pitch, amount: little, essential: true}
    - {from: vel,  to: lfo1.rate, amount: some, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode, param: voices,    value: poly,     why: "voices that must not line up"}
  - {block: vel,  param: target,    value: LFO rate, why: "a harder note wobbles faster: no two strikes are exactly equal, so no two vibratos are"}
  - {block: vel,  param: amount,    value: some,     why: "a nudge across the velocity range, not a switch from slow to fast"}
  - {block: lfo1, param: retrigger, value: "on",     why: "one LFO per voice, or there is nothing for velocity to spread"}
  - {block: lfo1, param: rate,      value: medium,   why: "the human rate at a middling velocity"}
  - {block: lfo1, param: depth,     value: little,   why: "under a semitone"}
  - {block: aenv, param: attack,    value: medium,   why: "a pad or choir"}

taste:
  - {block: lfo1,    param: vel → rate, range: "little – some", default: some}
  - {block: lfo1,    param: rate,    range: "slow – fast",        default: medium}
  - {block: lfo1,    param: depth,   range: "none – some",        default: little}
  - {block: filter1, param: cutoff,  range: "mid – bright",       default: mid}
  - {block: aenv,    param: release, range: "medium – long",      default: medium}

listening:
  cue: "Four notes with four touches, and four vibrato speeds: the soft note breathes slowly, the hard one hurries. Even the same chord struck again comes out a little different."
  ab: "Set the velocity amount to none: every voice settles on the one rate and the chord wobbles as a block. Put it back and the voices separate."

render:
  tempo: 80
  note: [C3, G3, E4, C5]
  velocity: [60, 85, 105, 125]
  pattern: "the chord struck together at four velocities, held two bars, released"
  length_s: 7.0

mappings: {}
