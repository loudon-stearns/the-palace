# Synth Templates — card — Wobble Bass
# An LFO in time with the song opens and closes a resonant filter; distortion after it. The LFO is the rhythm.
schema: synth-template-card/0.2
id: wobble-bass
name: Wobble Bass
family: Bass
tier: 2
mode: mono
classics: dubstep
status: drafted
concepts:
  - "Tempo sync; triplets"
  - "LFO → pitch / amplitude / pan / filter"
  - "Resonance: boost at cutoff; self-oscillation"
  - "Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: high}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [distortion]}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: true, note: "synced: one cycle per eighth at the render tempo; the rate word stands in for the division"}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: lfo1, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: wheel, to: lfo1.rate, amount: full, essential: false}

essentials:
  - {block: osc1,    param: wave,      value: saw,            why: "all harmonics, so the filter has a full ladder to climb and descend"}
  - {block: filter1, param: type,      value: lowpass 24 dB,  why: "steep, so the sweep is a clear open and shut"}
  - {block: filter1, param: resonance, value: high,           why: "the boost at the cutoff is what rides the sweep: the 'wow' in the wobble"}
  - {block: filter1, param: cutoff,    value: dark,           why: "closed at rest; the LFO opens it from there"}
  - {block: lfo1,    param: target,    value: filter cutoff,  why: "the LFO is not vibrato or tremolo; it is the whole rhythm of the sound"}
  - {block: lfo1,    param: sync,      value: "on",           why: "the rate is a note division of the song tempo, so every wobble lands on the grid"}
  - {block: lfo1,    param: amount,    value: generous,       why: "the sweep must cross most of the harmonics, not shimmer"}
  - {block: fx,      param: chain,     value: distortion,     why: "after the filter: fills in harmonics and squashes the resonant peak so it does not jump out"}
  - {block: aenv,    param: sustain,   value: held,           why: "the note holds and the LFO does the moving"}
  - {block: mode,    param: voices,    value: mono}

taste:
  - {block: lfo1,    param: rate,      range: "slow – fast",           default: medium, why: "a quarter, an eighth, a sixteenth: change it mid-phrase, or by the wheel"}
  - {block: lfo1,    param: depth,     range: "moderate – full",       default: generous}
  - {block: filter1, param: resonance, range: "moderate – self-oscillating", default: high}
  - {block: filter1, param: cutoff,    range: "dark – mid",            default: dark}
  - {block: fx,      param: drive,     range: "light – heavy",         default: heavy}
  - {block: lfo1,    param: wave,      range: "sine – square",         default: sine, why: "square turns the wobble into a gate"}

listening:
  cue: "One long note that says 'wow-wow-wow' in time with the beat. The vowel is the resonance riding up and down the harmonics; the grit under it is the distortion."
  ab: "Turn sync off and nudge the rate: the wobble drifts off the grid and the groove falls apart. Then set resonance to none: the sweep is still there but it says 'wuh', not 'wow'."

render:
  tempo: 140
  note: [E1, E1]
  velocity: 110
  pattern: "two bars: a whole note, a whole note; the LFO at eighths"
  length_s: 4.0

mappings: {}
