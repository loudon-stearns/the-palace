# Synth Templates — card — Wavetable Position Sweep
# Technique demonstration: one oscillator whose waveform is a position in a table, and that position in motion.
schema: synth-template-card/0.2
id: wavetable-position-sweep
name: Wavetable Position Sweep
family: Technique Demonstrations
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Waveforms: saw, square, triangle, sine, noise"
  - "LFO → pitch / amplitude / pan / filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, note: "a wavetable oscillator: the table runs sine → triangle → square → saw; position picks the frame. The voice plays a saw and cannot yet sweep a table."}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    lfo1:    {kind: lfo, wave: triangle, rate: slow, sync: false}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.shape, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1, param: table,    value: sine to saw, why: "a table whose frames run from the simplest wave to the richest, so the sweep is a brightness you can hear"}
  - {block: osc1, param: position, value: start,       why: "a single frame is a static waveform: wavetable with no motion is just an oscillator"}
  - {block: lfo1, param: target,   value: table position, why: "the sweep is the point: the waveform itself changes, not the filter on it"}
  - {block: filter1, param: cutoff, value: open,       why: "no filter movement, so what you hear changing is the wave"}

taste:
  - {block: osc1, param: position, range: "start – end",    default: start, why: "the hand sweep: a sine thickens through triangle and square into a saw"}
  - {block: lfo1, param: depth,    range: "none – full",    default: generous}
  - {block: lfo1, param: rate,     range: "very slow – medium", default: slow}

listening:
  cue: "The note keeps its pitch and loudness while its waveform turns into a different one: pure, then hollow, then buzzing, and back. Unlike a filter sweep, the harmonics do not simply fade in from the top; the whole spectrum changes shape."
  ab: "Set the LFO depth to none: one frozen frame, a static tone. Put it back: the wave is moving again."

render:
  tempo: 100
  note: C3
  velocity: 90
  pattern: "one note held eight seconds: four swept by hand from start to end, four by the LFO"
  length_s: 9.0

mappings: {}
