# Synth Templates — card — Velocity → Filter
# Technique demonstration: how hard you hit chooses how far the filter opens, not only how loud the note is.
schema: synth-template-card/0.2
id: velocity-filter
name: Velocity → Filter
family: Technique Demonstrations
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Velocity → amplitude; velocity → filter cutoff"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: some, essential: true}
    - {from: vel,  to: fenv.amount, amount: generous, essential: true}
    - {from: vel,  to: amp.level, amount: little, essential: false}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,    value: saw,  why: "harmonics for the filter to reveal when it opens"}
  - {block: filter1, param: cutoff,  value: dark, why: "closed at rest: a soft note stays dark"}
  - {block: fenv,    param: decay,   value: medium, why: "the bite: the filter opens at the strike and settles while the note holds"}
  - {block: vel,     param: target,  value: filter envelope amount, why: "harder notes get a bigger filter movement; the attack gets brighter while the sustain stays the same"}
  - {block: fenv,    param: amount,  value: some, why: "small on its own, so the velocity is what opens it"}

taste:
  - {block: fenv,    param: velocity, range: "none – full",    default: generous, why: "none: every note the same colour; full: a whisper is dull and a hit is wide open"}
  - {block: fenv,    param: decay,   range: "short – long",   default: medium}
  - {block: filter1, param: cutoff,  range: "dark – mid",     default: dark}
  - {block: amp,     param: velocity, range: "none – some",    default: little, why: "velocity to loudness too, as a real instrument does, but kept small so the brightness carries the dynamics"}

listening:
  cue: "Soft notes are dark and round; hard notes open with a bright bite that fades back to the same dark sustain. The loudness barely changes; the colour does."
  ab: "Set velocity-to-envelope-amount to none: soft and hard notes are now the same colour, and only slightly different in loudness. Put it back and the hits open up again."

render:
  tempo: 110
  note: [C3, C3, C3, C3]
  velocity: [40, 70, 100, 127]
  pattern: "the same note four times, quarter notes, each harder than the last"
  length_s: 4.0

mappings: {}
