# Synth Templates — card — Velocity → Pitch Envelope Amount
# A pitch blip on the attack, and velocity sets how big it is. Soft notes barely bend; accents swoop in.
schema: synth-template-card/0.2
id: velocity-pitch-envelope-amount
name: Velocity → Pitch Envelope Amount
family: Performance Controls
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Envelope → pitch (attack blip)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    menv:    {kind: envelope, role: pitch, shape: {a: instant, d: short, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: menv, to: osc1.pitch, amount: a fifth, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: menv.amount, amount: generous, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: menv, param: target,  value: osc1 pitch,     why: "the attack blip: the note starts above the pitch and settles into it quickly"}
  - {block: menv, param: decay,   value: short,          why: "fast enough that it reads as an attack, not a bend"}
  - {block: menv, param: sustain, value: zero,           why: "it must land on the note"}
  - {block: vel,  param: target,  value: pitch envelope amount, why: "an accented note gets the bigger swoop; a soft one almost none, so the blip is a dynamic, not a tic"}
  - {block: osc1, param: wave,    value: saw,            why: "a brass-like tone, where the swoop belongs"}
  - {block: aenv, param: sustain, value: held,           why: "the body is steady, so the only thing velocity changes is the entrance"}
  - {block: mode, param: voices,  value: mono,           why: "a single line; every attack is heard on its own"}

taste:
  - {block: menv,    param: amount, range: "a fifth – two octaves", default: a fifth, why: "the blip at full velocity"}
  - {block: menv,    param: vel amount, range: "some – full",    default: generous, why: "how much of that blip a soft note loses"}
  - {block: menv,    param: decay,  range: "instant – medium",  default: short}
  - {block: filter1, param: cutoff, range: "mid – bright",      default: mid}
  - {block: aenv,    param: attack, range: "fast – short",      default: fast}

listening:
  cue: "Soft notes start nearly on pitch. Hard notes swoop down into the note from above, like a brass player leaning into an accent. The body of every note is the same once it settles."
  ab: "Take velocity off the envelope amount: every note gets the same swoop, and the line sounds mechanical. Put it back and the swoops follow the accents."

render:
  tempo: 110
  note: [C3, C3, G3, C3, Eb3, C3, G3, C3]
  velocity: [120, 60, 60, 120, 60, 60, 120, 60]
  pattern: "eighths, one bar; accents on 1, 4 and 7"
  length_s: 3.0

mappings: {}
