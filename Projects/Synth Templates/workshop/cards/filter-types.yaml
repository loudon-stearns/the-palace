# Synth Templates — card — Filter Types
# Technique demonstration: the same saw, the same cutoff, the filter's type switched between the four shapes.
schema: synth-template-card/0.2
id: filter-types
name: Filter Types
family: Technique Demonstrations
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Low-pass, high-pass, band-pass, notch"
  - "Cutoff frequency"
  - "Resonance as width (Q) on band-pass and notch"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,   value: saw,  why: "all the harmonics, so every type of cut has something to remove"}
  - {block: filter1, param: cutoff, value: mid,  why: "held the same for every type: a filter is a frequency-specific volume control, and this is the frequency where the cut starts"}
  - {block: filter1, param: slope,  value: 12 dB, why: "gentle, so the shape of each type is heard, not its steepness"}
  - {block: filter1, param: resonance, value: little, why: "enough to mark the cutoff; on band-pass and notch it is the width"}

taste:
  - {block: filter1, param: type,      range: "lowpass – highpass – bandpass – notch", default: lowpass, why: "named for what passes: lows, highs, a band; the notch names what it removes"}
  - {block: filter1, param: cutoff,    range: "dark – bright", default: mid}
  - {block: filter1, param: resonance, range: "none – high",   default: little}

listening:
  cue: "Four cuts of the same saw at the same place: low-pass keeps the body and loses the buzz; high-pass keeps the buzz and loses the body; band-pass keeps only a slice; notch takes a slice out and leaves the rest."
  ab: "Open the cutoff all the way with low-pass: the filter is cutting only what you cannot hear and the saw is back whole. Then bring the cutoff down to dark: the note goes dull, then nearly silent, as the cut takes everything."

render:
  tempo: 100
  note: C3
  velocity: 90
  pattern: "the same note four times, one per type: lowpass, highpass, bandpass, notch"
  length_s: 8.0

mappings: {}
