# Synth Templates — card — Screech Lead
# A filter turned up until it is nearly an oscillator itself, then swept by an envelope: the resonance sings a note of its own.
schema: synth-template-card/0.2
id: screech-lead
name: Screech Lead
family: Leads
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Resonance: boost at cutoff; self-oscillation"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Pitch bend range"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: square, pw: 0.5, octave: 0, note: "pitch bend, an octave wide, is the performance; the voice has no bend input"}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: high}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: filter1.cutoff, amount: some, essential: false}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: filter1, param: resonance, value: high,       why: "just under the edge: the boost at the cutoff is loud enough to be heard as a second voice, but still follows the harmonics instead of singing on its own"}
  - {block: fenv,    param: amount,    value: generous,   why: "the sweep drags the peak across the harmonics and each one rings as it passes: the screech"}
  - {block: filter1, param: cutoff,    value: dark,       why: "closed at rest, so the sweep has the whole spectrum to cross"}
  - {block: fenv,    param: sustain,   value: low,        why: "it comes back down, but not all the way; the peak rests on a low harmonic"}
  - {block: osc1,    param: wave,      value: square,     why: "odd harmonics only, so the peak finds them one at a time with gaps between; a saw is smoother"}
  - {block: amp,     param: level,     value: under unity, why: "a resonant peak is loud; leave room"}
  - {block: mode,    param: voices,    value: mono,       why: "a line; the resonance of two notes at once is a mess"}

taste:
  - {block: filter1, param: resonance, range: "high – self-oscillating", default: high, why: "at the top the filter becomes a sine oscillator and plays a note the key did not"}
  - {block: fenv,    param: decay,     range: "short – long",            default: medium}
  - {block: fenv,    param: amount,    range: "moderate – full",         default: generous}
  - {block: filter1, param: cutoff,    range: "dark – mid",              default: dark}
  - {block: amp,     param: drive,     range: "none – light",            default: none, why: "distortion after the filter compresses the peak and tames it; use it when the screech is too much"}
  - {block: osc1,    param: glide,     range: "none – short",            default: none}

listening:
  cue: "Each note is a squeal falling through the harmonics: the filter's own note sliding over the played one. Bend the pitch and the squeal bends too, a half-step behind."
  ab: "Drop resonance to none: a dull square with an ordinary sweep, no squeal. Put it back. Then push resonance to self-oscillating: the filter now plays its own sine, and holds it even with the oscillator muted."

render:
  tempo: 120
  note: [A4, C5, A4, E4]
  velocity: 110
  pattern: "quarter notes, one bar; the last note held with a pitch bend up an octave and back"
  length_s: 4.0

mappings: {}
