# Synth Templates — card 0.2 — Simple Delay
# Delay-family card 1: the three controls every delay has. A plain pluck so the echoes are the whole lesson.
schema: synth-template-card/0.2
id: simple-delay
name: Simple Delay
family: Delay-Family Effects
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Delay: time, feedback, mix"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: square, pw: 0.5, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [delay], note: "stereo delay synced to the tempo; the voice plays one delay line with time, feedback and mix"}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: short, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: medium, s: zero, r: short}, category: plucked}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,     value: square,        why: "a plain tone; nothing in the source should compete with the echoes"}
  - {block: fenv,    param: sustain,  value: zero,          why: "a pluck: a short event, so each echo is heard as its own event"}
  - {block: aenv,    param: sustain,  value: zero,          why: "the note stops; the space after it is where the delay lives"}
  - {block: fx,      param: chain,    value: delay,         why: "the effect is the lesson; the synth before it is only a source"}
  - {block: fx,      param: time,     value: synced to tempo, why: "time is the gap between the note and its first echo; synced, the echoes land on the grid"}
  - {block: fx,      param: feedback, value: a few repeats, why: "feedback is how much of the echo goes back in, so it is the repeat count"}
  - {block: fx,      param: mix,      value: under the dry, why: "mix blends dry and delayed; the note must still lead and the echoes follow"}
  - {block: mode,    param: voices,   value: mono,          why: "one line, so the echoes of one note are not covered by the next"}

taste:
  - {block: fx,      param: time,     range: "a 16th – a dotted eighth",  default: a dotted eighth, why: "the dotted eighth is the classic rhythmic delay"}
  - {block: fx,      param: feedback, range: "one echo – many repeats",   default: a few repeats}
  - {block: fx,      param: mix,      range: "a whisper – equal",         default: under the dry}
  - {block: filter1, param: cutoff,   range: "dark – bright",             default: mid}
  - {block: fenv,    param: decay,    range: "short – medium",            default: short}
  - {block: aenv,    param: decay,    range: "short – medium",            default: medium}

listening:
  cue: "One note, then a row of smaller copies of it, each quieter than the last, landing in time with the beat. Three things decide the row: how far apart the copies are, how many there are, how loud they are next to the note."
  ab: "Turn feedback to zero: one echo, then nothing. Turn mix to zero: the delay is still running and you hear none of it. Put both back and the row returns."

render:
  tempo: 120
  note: [C3, Eb3, G3]
  velocity: 100
  pattern: "three notes on beats 1, 2 and 3 of one bar, each a 16th long, then a bar of rest for the echoes"
  length_s: 4.0

mappings: {}
