# Synth Templates — card 0.2 — Acid Bass
# Fourth card: the resonance lesson. One saw, one filter at the edge, and two performance moves: accent and slide.
schema: synth-template-card/0.2
id: acid-bass
name: Acid Bass
family: Bass
tier: 2
mode: mono legato
classics: TB-303
status: drafted
concepts:
  - "Resonance: boost at cutoff; self-oscillation"
  - "Glide / portamento time; legato mode as default"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Filter slope: 12 vs 24 dB/oct, poles"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, glide: legato}
    filter1: {kind: filter, type: lowpass, slope: 18, resonance: high}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: medium, s: zero, r: short}, category: percussive}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: fenv.amount, amount: accent, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode,    param: voices,    value: mono legato,   why: "tied notes glide and do not retrigger the envelopes: that is the slide"}
  - {block: osc1,    param: wave,      value: saw,           why: "every harmonic there for the resonance to pick out (square is the other 303 voice)"}
  - {block: osc1,    param: glide,     value: legato only,   why: "some notes slide, some jump; the pattern decides"}
  - {block: filter1, param: type,      value: lowpass 18 dB, why: "the 303's three-pole slope: steeper than 12, softer than 24"}
  - {block: filter1, param: resonance, value: high,          why: "near the edge, so the envelope sweep sings a partial at a time"}
  - {block: filter1, param: cutoff,    value: dark,          why: "closed at rest; the envelope and the accent open it"}
  - {block: fenv,    param: sustain,   value: zero,          why: "every note is a sweep down to the resting cutoff"}
  - {block: fenv,    param: decay,     value: medium,        why: "long enough to hear the sweep, short enough to hear the next note"}
  - {block: vel,     param: accent,    value: velocity → envelope amount, why: "an accented note is a bigger sweep, not just a louder one"}
  - {block: aenv,    param: sustain,   value: zero,          why: "the body dies with the sweep; sixteenths stay separate"}

taste:
  - {block: filter1, param: cutoff,     range: "dark – mid",          default: dark}
  - {block: filter1, param: resonance,  range: "high – self-oscillating", default: high}
  - {block: fenv,    param: amount,     range: "moderate – generous",  default: generous}
  - {block: fenv,    param: decay,      range: "short – medium",       default: medium}
  - {block: osc1,    param: glide,      range: "short – medium",       default: short}
  - {block: osc1,    param: wave,       range: "saw – square",         default: saw}
  - {block: amp,     param: drive,      range: "none – heavy",         default: none, why: "distortion after the filter is the other half of the acid sound"}

listening:
  cue: "A squelch: each note is a filter sweep downward with a whistle riding on it. Accented notes jump open; tied notes slide into pitch without a new attack."
  ab: "Drop resonance to none: the sweep is still there but the whistle is gone and it is just a dull bass. Then set glide to always: every note slurs and the pattern loses its shape."

render:
  tempo: 130
  note: [C2, C2, Eb2, C2, G2, C2, Bb1, C2]
  velocity: [110, 70, 70, 110, 70, 70, 110, 70]
  pattern: "sixteenths, one bar; notes 3 and 5 tied to the one before (slide), accents on 1, 4, 7"
  length_s: 2.0

mappings: {}
