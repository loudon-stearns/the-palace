# Synth Templates — card 0.2 — Strings (Long Sustaining)
# Envelope Shapes family. The standard sustaining shape, stretched: longer attack, decay and release, as a bowed
# section articulates it. Same four stages, same sustain; only the times change.
schema: synth-template-card/0.2
id: strings-long-sustaining
name: Strings (Long Sustaining)
family: Envelope Shapes
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Standard sustaining envelope; strings and horns variants"
  - "Sustaining vs non-sustaining sounds"
  - "Envelope → amplitude"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "open; the family's fixed chain"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: medium, s: held, r: slow}, category: string}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: aenv, param: attack,  value: slow,   why: "the bow takes time to get the string moving; the note arrives rather than starts"}
  - {block: aenv, param: decay,   value: medium, why: "the settle is slow too, so the transient is softened almost away"}
  - {block: aenv, param: sustain, value: held,   why: "unchanged from the standard shape: still a sustaining instrument"}
  - {block: aenv, param: release, value: slow,   why: "the section keeps ringing after the bow lifts; notes overlap and smooth into one another"}
  - {block: filter1, param: cutoff, value: open, why: "the filter stays out of the way"}
  - {block: mode, param: voices,  value: poly,   why: "a section; the long release needs overlapping voices"}

taste:
  - {block: aenv,    param: attack,  range: "medium – very slow", default: slow, why: "the articulation: shorter is a marcato bow, longer a swell"}
  - {block: aenv,    param: decay,   range: "short – slow",       default: medium}
  - {block: aenv,    param: release, range: "medium – long",      default: slow}
  - {block: aenv,    param: sustain, range: "half – under unity",  default: held}
  - {block: filter1, param: cutoff,  range: "mid – open",         default: open}

listening:
  cue: "The same shape as Standard Sustaining but everything happens slowly: the note fades up, settles without a bump, holds, and hangs on after the key. Play a line and the notes blur into each other at the joins."
  ab: "Set attack, decay and release back to the standard shape's fast, short, short: it is a horn section now, every note with a front edge. Stretch them again and the strings return. The sustain never moved."

render:
  tempo: 72
  note: [C3, G3, E4]
  velocity: 90
  pattern: "the chord held two bars, released, tail to silence"
  length_s: 8.0

mappings: {}
