# Synth Templates — card — CC73 / CC72 Attack and Release
# The amp envelope's two outer times put under the hands: attack for legato vs staccato, release for the density of a part. The wheel stands in for both CCs.
schema: synth-template-card/0.2
id: cc73-cc72-attack-and-release
name: CC73 / CC72 Attack and Release
family: Performance Controls
tier: 2
mode: poly
classics: ""
status: drafted
concepts:
  - "CC7 volume, CC11 expression, CC72 release, CC73 attack"
  - "CC73 / CC72 → attack / release; CC → decay"
  - "Standard sustaining envelope; strings and horns variants"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 3, detune: slight}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining, note: "CC73 to attack and CC72 to release are two knobs; the wheel stands in for both"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv,  to: amp.level, essential: true}
    - {from: wheel, to: aenv.attack, amount: full, essential: true}
    - {from: wheel, to: aenv.release, amount: full, essential: true}
    - {from: key,   to: osc1.pitch, essential: true}
    - {from: key,   to: aenv.gate, essential: true}

essentials:
  - {block: wheel, param: target, value: amp attack,  why: "CC73: attack time by hand. Short, the sound is staccato and spoken; long, the same sound is legato and bowed, without changing patch"}
  - {block: wheel, param: target, value: amp release, why: "CC72: release time by hand. It works like a reverb amount; less leaves space between notes, more fills it"}
  - {block: aenv,  param: sustain, value: held,       why: "a sustaining shape: attack and release are the only times that matter on it"}
  - {block: osc1,  param: wave,   value: saw,         why: "a string-like tone that can play both ways"}
  - {block: mode,  param: voices, value: poly,        why: "with a long release the notes overlap; they need voices to do it"}

taste:
  - {block: aenv,  param: attack,  range: "fast – very slow",  default: fast, why: "where the attack knob rests: the staccato end"}
  - {block: aenv,  param: release, range: "short – very long", default: short, why: "where the release knob rests: the dry end"}
  - {block: aenv,  param: cc amount, range: "moderate – full",  default: full, why: "the reach of both knobs"}
  - {block: filter1, param: cutoff, range: "mid – bright",     default: mid}

listening:
  cue: "The same phrase twice. First, both knobs down: every note speaks at once and stops dead; a staccato part with air between the notes. Then both up: the notes bloom in and hang over each other, the same patch now a legato pad."
  ab: "Fix the times in the patch and unmap the controllers: you need two patches to play the two passages. Map them back and one sound does both, under the hands, mid-phrase."

render:
  tempo: 100
  note: [C3, E3, G3, E3, C3, E3, G3, E3]
  velocity: 100
  pattern: "eighths for two bars; bar one with attack and release short, bar two with both long"
  length_s: 7.0

mappings: {}
