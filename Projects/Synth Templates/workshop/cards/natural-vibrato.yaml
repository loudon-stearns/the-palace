# Synth Templates — card 0.2 — Natural Vibrato
# LFO Behaviours, first card: the vibrato defaults. One saw, a gentle filter, and a dedicated LFO on pitch at the human rate.
schema: synth-template-card/0.2
id: natural-vibrato
name: Natural Vibrato
family: LFO Behaviours
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"
  - "LFO → pitch / amplitude / pan / filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: medium}, category: sustaining}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: false, note: "the dedicated vibrato LFO: sine or triangle, pitch only"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pitch, amount: little, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: lfo1, param: wave,   value: sine,   why: "a smooth wobble; a square would step between two pitches, a trill"}
  - {block: lfo1, param: rate,   value: medium, why: "about 5 Hz, the rate a singer or a string player lands on"}
  - {block: lfo1, param: depth,  value: little, why: "under a semitone; any more and the note no longer reads as one pitch"}
  - {block: lfo1, param: target, value: oscillator pitch, why: "vibrato is pitch; depth on the filter or the amp is a different lesson"}
  - {block: aenv, param: sustain, value: held, why: "vibrato lives in the sustain; a note that dies has nothing to wobble"}
  - {block: mode, param: voices, value: mono,  why: "one voice, so you hear one vibrato"}

taste:
  - {block: lfo1,    param: rate,   range: "slow – fast",       default: medium, why: "slower turns seasick, faster turns nervous"}
  - {block: lfo1,    param: depth,  range: "none – some",       default: little}
  - {block: filter1, param: cutoff, range: "mid – bright",      default: bright}
  - {block: aenv,    param: attack, range: "fast – short",      default: fast}
  - {block: aenv,    param: release, range: "short – medium",   default: medium}

listening:
  cue: "One pitch, gently breathing about five times a second. It never sounds like two notes; it sounds like a voice holding one."
  ab: "Raise the depth to moderate: the note turns into a siren and the pitch is gone. Back to little and it is a voice again. Then set the rate to very slow: the same depth reads as a slow bend, not vibrato."

render:
  tempo: 100
  note: A3
  velocity: 100
  pattern: "one note held two bars, then released"
  length_s: 5.0

mappings: {}
