# Synth Templates — card — Wavetable Scan Lead
# The oscillator holds a row of waves; an envelope moves which one is playing. Timbre without a filter, then a filter as well.
schema: synth-template-card/0.2
id: wavetable-scan-lead
name: Wavetable Scan Lead
family: Leads
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Waveforms: saw, square, triangle, sine, noise"
  - "Subtractive: rich wave then filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, note: "a wavetable oscillator; the table runs from a dull frame to a bright one, and 'shape' is the position in it. The voice plays a saw and does not scan"}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    menv:    {kind: envelope, role: scan, shape: {a: instant, d: medium, s: low, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
    lfo1:    {kind: lfo, wave: triangle, rate: slow, sync: false}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: menv, to: osc1.shape, amount: generous, essential: true}
    - {from: lfo1, to: osc1.shape, amount: little, essential: false}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: table,    value: dull to bright across the table, why: "the table must be ordered so a position is a brightness; a random table makes the scan a flicker, not a sweep"}
  - {block: menv,    param: target,   value: table position, why: "the envelope moves through the waves the way a filter envelope moves the cutoff, but each step is a new wave, not a dimmer one"}
  - {block: menv,    param: amount,   value: generous,       why: "far enough along the table to cross several frames"}
  - {block: menv,    param: decay,    value: medium,         why: "slow enough to hear the frames go by"}
  - {block: menv,    param: sustain,  value: low,            why: "rests near the dull end; the scan is the attack"}
  - {block: filter1, param: cutoff,   value: bright,         why: "mostly open; the table does the timbre work and the filter only smooths the brightest frames"}
  - {block: mode,    param: voices,   value: mono,           why: "a line"}

taste:
  - {block: menv,    param: amount,   range: "moderate – full",     default: generous, why: "how far along the table the note starts"}
  - {block: menv,    param: decay,    range: "short – long",        default: medium}
  - {block: lfo1,    param: depth,    range: "none – some",         default: little, why: "a slow wander in the held note"}
  - {block: lfo1,    param: rate,     range: "very slow – slow",    default: slow}
  - {block: filter1, param: cutoff,   range: "mid – open",          default: bright}
  - {block: osc1,    param: glide,    range: "none – short",        default: none}

listening:
  cue: "The tone of each note changes as it plays, but not the way a filter closes: it steps through different characters, bright and hard at the front, duller and rounder by the end, with small catches on the way where one wave gives way to the next."
  ab: "Set the envelope amount to none: the note sits on one frame and is a static wave. Put it back. Then take the scan off the oscillator and put the same envelope on the filter cutoff instead: the brightness falls the same way, but smoothly, and the catches are gone."

render:
  tempo: 110
  note: [C4, Eb4, G4, Bb4]
  velocity: 100
  pattern: "quarter notes, one bar; the last held a bar"
  length_s: 4.0

mappings: {}
