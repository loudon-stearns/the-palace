# Synth Templates — card — Saw Lead
# The default lead: one saw, a filter mostly open, a modest filter envelope, and vibrato the player adds with the wheel.
schema: synth-template-card/0.2
id: saw-lead
name: Saw Lead
family: Leads
tier: 1
mode: mono legato
classics: ""
status: drafted
concepts:
  - "Subtractive: rich wave then filter"
  - "Glide / portamento time; legato mode as default"
  - "CC1 → pitch LFO depth"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, glide: legato}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: short}, category: sustaining}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: short, s: held, r: short}, category: sustaining}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: false, note: "the vibrato LFO; silent until the wheel"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv,  to: filter1.cutoff, amount: some, essential: true}
    - {from: aenv,  to: amp.level, essential: true}
    - {from: lfo1,  to: osc1.pitch, amount: little, essential: true}
    - {from: wheel, to: lfo1.depth, amount: full, essential: true}
    - {from: key,   to: osc1.pitch, essential: true}
    - {from: key,   to: fenv.gate, essential: true}
    - {from: key,   to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,     value: saw,            why: "every harmonic present; the filter has something to take away"}
  - {block: filter1, param: cutoff,   value: bright,         why: "mostly open: a lead has to cut, so the saw keeps most of its edge"}
  - {block: fenv,    param: amount,   value: some,           why: "a little extra brightness at the start of each note, not a sweep"}
  - {block: fenv,    param: sustain,  value: low,            why: "the bite settles back toward the resting cutoff"}
  - {block: lfo1,    param: rate,     value: medium,         why: "about 5 Hz, a human vibrato"}
  - {block: wheel,   param: target,   value: vibrato depth,  why: "no vibrato until the player asks; the wheel is the expression"}
  - {block: osc1,    param: glide,    value: short,          why: "tied notes slide; separate notes jump"}
  - {block: mode,    param: voices,   value: mono legato,    why: "one line, and overlapping notes glide without retriggering"}
  - {block: aenv,    param: sustain,  value: held,           why: "sustaining: the line holds while the key is down"}

taste:
  - {block: filter1, param: cutoff,    range: "mid – open",        default: bright}
  - {block: fenv,    param: amount,    range: "little – moderate", default: some}
  - {block: lfo1,    param: depth,     range: "little – moderate", default: little, why: "under a semitone unless you want a wobble"}
  - {block: lfo1,    param: rate,      range: "medium – fast",     default: medium}
  - {block: osc1,    param: glide,     range: "none – medium",     default: short}
  - {block: aenv,    param: release,   range: "short – medium",    default: short}

listening:
  cue: "A plain, bright line with a small bite on each note. Nothing moves until the wheel comes up, then the pitch wavers about five times a second and the line starts to sing."
  ab: "Set the wheel's vibrato depth to none: the line goes flat and mechanical. Back on, it breathes. Then set glide to none: tied notes step instead of sliding."

render:
  tempo: 120
  note: [C4, D4, E4, G4, E4, D4, C4]
  velocity: 100
  pattern: "eighths, legato, one bar; the last note held a bar with the wheel pushed up over it"
  length_s: 4.0

mappings: {}
