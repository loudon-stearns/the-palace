# Synth Templates — card — Envelope Curves
# Technique demonstration: the same four stage times, two shapes of travel between them.
schema: synth-template-card/0.2
id: envelope-curves
name: Envelope Curves
family: Technique Demonstrations
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "ADSR: three times and a level"
  - "Envelope → amplitude"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: slow, s: half, r: long}, category: sustaining, curve: exponential, note: "the curve: how each stage travels. Exponential is the analog RC shape, fast at first and slowing as it arrives; linear is a straight line. The voice plays the Moog curve, with linear as its second test"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1, param: wave,    value: saw,  why: "a steady tone; the loudness contour is the whole lesson"}
  - {block: aenv, param: attack,  value: slow, why: "long enough that the shape of the rise can be heard, not only its length"}
  - {block: aenv, param: release, value: long, why: "the same for the fall"}
  - {block: aenv, param: curve,   value: exponential, why: "the Moog standard: the ear hears level in ratios, so an exponential stage sounds even and a linear one sounds late then sudden"}

taste:
  - {block: aenv, param: curve,   range: "linear – exponential", default: exponential, why: "the switch: same times, different feel. Linear attacks sound slower; linear releases seem to cut off"}
  - {block: aenv, param: attack,  range: "medium – very slow",   default: slow}
  - {block: aenv, param: release, range: "medium – very long",   default: long}

listening:
  cue: "Two notes with the same attack and release times. The exponential one arrives quickly and eases into full, then fades in a way that seems to go on evenly to silence. The linear one creeps in, then its tail seems to hang and drop."
  ab: "Switch exponential to linear without touching the times: the attack sounds slower and the release ends with a step. Switch back and both ends sound natural again. Same numbers, different sound."

render:
  tempo: 100
  note: C3
  velocity: 90
  pattern: "the same note twice, each held two seconds and released: exponential, then linear"
  length_s: 10.0

mappings: {}
