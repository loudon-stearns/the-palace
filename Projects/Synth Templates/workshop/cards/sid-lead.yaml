# Synth Templates — card 0.2 — SID Lead
# Chiptune, tier 2: the Commodore 64's chip was a real synth. A pulse with pulse-width modulation, through the SID's own filter,
# with a proper ADSR; the ring-mod option is the third oscillator multiplied in.
schema: synth-template-card/0.2
id: sid-lead
name: SID Lead
family: Chiptune
tier: 2
mode: mono
classics: C64
status: drafted
concepts:
  - "Pulse width, static and modulated"
  - "Subtractive: rich wave then filter"
  - "Low-pass, high-pass, band-pass, notch"
  - "Standard sustaining envelope; strings and horns variants"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"
  - "LFO → pitch / amplitude / pan / filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: pulse, pw: 0.5, octave: 0, note: "SID voice 1; its pulse width is a 12-bit register, swept by the player's code"}
    osc2:    {kind: oscillator, wave: triangle, octave: 0, level: "off", note: "ring mod option: SID voice 3's triangle multiplied by voice 1's, for bells; drawn as a jack, the voice approximates it as FM"}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: moderate, note: "the SID's one multimode filter, 12 dB; low-pass here, band-pass and high-pass are the other switches"}
    amp:     {kind: amplifier, level: full}
    aenv:    {kind: envelope, role: amp, shape: {a: instant, d: short, s: held, r: short}, category: sustaining, note: "a real ADSR per voice: the first chip with one"}
    lfo1:    {kind: lfo, wave: triangle, rate: slow, sync: false, note: "PWM: the player's code sweeping the width register"}
    lfo2:    {kind: lfo, wave: triangle, rate: medium, sync: false, note: "vibrato"}
  audio:
    - [osc2, osc1, ring]
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pw, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: lfo2, to: osc1.pitch, amount: little, essential: false}
    - {from: wheel, to: lfo2.depth, amount: little, essential: false}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: osc2.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: pulse,        why: "the only SID wave with a movable width; the SID lead is the width moving"}
  - {block: lfo1,    param: target,    value: osc1 pulse width, why: "PWM: the harmonics come and go as the width sweeps, a chorus from one oscillator"}
  - {block: lfo1,    param: rate,      value: slow,         why: "a slow sweep reads as motion; fast reads as a buzz"}
  - {block: filter1, param: type,      value: lowpass 12 dB, why: "the SID has a filter, which the NES and Game Boy do not: a gentle two-pole one"}
  - {block: filter1, param: cutoff,    value: bright,       why: "mostly open; the filter rounds the pulse rather than closing on it"}
  - {block: aenv,    param: attack,    value: instant}
  - {block: aenv,    param: decay,     value: short,        why: "the standard sustaining shape: a burst, then the held level"}
  - {block: aenv,    param: sustain,   value: held,         why: "the lead holds; the chip's ADSR makes that a setting, not a trick"}
  - {block: osc2,    param: routing,   value: ring into osc1, why: "the option: voice 3's triangle multiplied into voice 1 gives sum and difference tones, the SID bell"}
  - {block: mode,    param: voices,    value: mono,         why: "voice 1 is one voice; three on the whole chip"}

taste:
  - {block: lfo1,    param: rate,      range: "very slow – medium",  default: slow}
  - {block: lfo1,    param: depth,     range: "little – generous",   default: moderate, why: "how far the width swings; too far and it thins to nothing at the ends"}
  - {block: filter1, param: cutoff,    range: "mid – open",          default: bright}
  - {block: filter1, param: resonance, range: "none – high",         default: moderate}
  - {block: osc2,    param: level,     range: "off – half",          default: "off", why: "bring in the ring mod for a bell; the pulse lead has it off"}
  - {block: lfo2,    param: depth,     range: "none – little",       default: none}
  - {block: aenv,    param: release,   range: "instant – medium",    default: short}

listening:
  cue: "A pulse lead that breathes: the tone swells from hollow to thin and back as the width sweeps, like a slow chorus on a single voice. Behind it the filter rounds the edge the NES never could."
  ab: "Set the PWM depth to none: the same lead goes flat and static, a plain square. Back to moderate and it breathes again. Then open the filter all the way and raise the resonance: a different chip entirely."

render:
  tempo: 140
  note: [E4, G4, A4, B4, A4, G4, E4, E4]
  velocity: 100
  pattern: "eighths, one bar; the last note tied, held a beat so the width sweep is heard"
  length_s: 3.0

mappings: {}
