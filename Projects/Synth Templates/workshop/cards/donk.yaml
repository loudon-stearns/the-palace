# Synth Templates — card — Donk
# A fast pitch drop on a sine, over in an instant, plus a resonant filter struck like a bell. Hard and short.
schema: synth-template-card/0.2
id: donk
name: Donk
family: Bass
tier: 2
mode: mono
classics: UK bounce
status: drafted
concepts:
  - "Envelope → pitch (attack blip)"
  - "Pluck / strike: release = decay; gong vs marimba"
  - "Resonance: boost at cutoff; self-oscillation"
  - "Filter thunk (resonance = delay feedback)"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: sine, octave: 0, retrigger: true}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: high, note: "the ping: a resonant filter struck by the envelope rings at its cutoff"}
    amp:     {kind: amplifier, level: full}
    fx:      {kind: fx, chain: [saturation]}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: fast, s: zero, r: fast}, category: percussive}
    menv:    {kind: envelope, role: pitch,  shape: {a: instant, d: fast, s: zero, r: fast}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: short, s: zero, r: same as decay}, category: percussive}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: menv, to: osc1.pitch, amount: two octaves, essential: true}
    - {from: fenv, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: sine,          why: "a clean partial, so the pitch drop is heard as a drop and not a buzz"}
  - {block: osc1,    param: retrigger, value: "on",          why: "the same donk every hit"}
  - {block: menv,    param: amount,    value: two octaves,   why: "a big drop, started high"}
  - {block: menv,    param: decay,     value: fast,          why: "the drop is over in tens of milliseconds: that is the 'd' of the donk"}
  - {block: aenv,    param: decay,     value: short,         why: "the 'onk': a short body, then nothing"}
  - {block: aenv,    param: sustain,   value: zero,          why: "struck, not held"}
  - {block: aenv,    param: release,   value: same as decay, why: "the hit plays out whatever the key does"}
  - {block: filter1, param: resonance, value: high,          why: "a resonant filter hit by a fast envelope rings like a struck object: the ping on top of the drop"}
  - {block: fenv,    param: decay,     value: fast,          why: "a strike, so the filter rings rather than sweeps"}
  - {block: fx,      param: chain,     value: saturation,    why: "hard: the sine needs edges to cut"}
  - {block: mode,    param: voices,    value: mono}

taste:
  - {block: menv,    param: amount,    range: "about an octave – two octaves", default: two octaves}
  - {block: menv,    param: decay,     range: "instant – short",  default: fast, why: "shorter is a click, longer is a laser"}
  - {block: aenv,    param: decay,     range: "fast – medium",    default: short, why: "the length of the 'onk'"}
  - {block: filter1, param: cutoff,    range: "dark – mid",       default: mid, why: "the pitch of the ping"}
  - {block: filter1, param: resonance, range: "moderate – self-oscillating", default: high, why: "how long the ping rings"}
  - {block: fx,      param: drive,     range: "light – heavy",    default: heavy}

listening:
  cue: "'Donk': a pitched knock, a fast fall from high to the note, with a hollow ping ringing on top of it, and then it is gone. Bouncy, hard and almost comic."
  ab: "Set the pitch envelope amount to none: the donk is a dull filter pop. Put it back and set the filter resonance to none: the drop is there but the ping is gone and it is a plain 808."

render:
  tempo: 150
  note: [C2, C2, C2, C2]
  velocity: 110
  pattern: "offbeat eighths, one bar: rest donk rest donk rest donk rest donk"
  length_s: 2.0

mappings: {}
