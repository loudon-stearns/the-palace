# Synth Templates — card 0.2 — Reverb as Long Release
# Delay-family card 8: two ways to make a note hang. The same pad with a short release and a reverb, against a long
# release and no reverb. Both leave a tail; the tails are not the same.
schema: synth-template-card/0.2
id: reverb-as-long-release
name: Reverb as Long Release
family: Delay-Family Effects
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "Standard sustaining envelope; strings and horns variants"
  - "Delay: time, feedback, mix"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 3, detune: narrow}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [reverb], note: "a reverb is a great many delays summed; its decay is the hang, and it is not the note's"}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: medium, s: held, r: short}, category: pad}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: mode,    param: voices,   value: poly,          why: "chords, so overlapping tails can be heard"}
  - {block: aenv,    param: attack,   value: slow,          why: "a pad: it arrives"}
  - {block: aenv,    param: sustain,  value: held}
  - {block: aenv,    param: release,  value: short,         why: "the note itself stops almost at once; everything after the key is the room"}
  - {block: fx,      param: chain,    value: reverb}
  - {block: fx,      param: reverb,   value: large,         why: "the room's decay plays the part a long release would: the tail after the key"}
  - {block: fx,      param: mix,      value: half,          why: "enough room that the tail is heard as a tail, not an edge"}

taste:
  - {block: aenv,    param: release,  range: "short – very long",   default: short, why: "the A/B knob: long here with the reverb off is the other way to hang"}
  - {block: fx,      param: reverb,   range: "small – huge",        default: large}
  - {block: fx,      param: mix,      range: "a whisper – equal",   default: half}
  - {block: filter1, param: cutoff,   range: "dark – bright",       default: mid}
  - {block: osc1,    param: detune,   range: "none – wide",         default: narrow}

listening:
  cue: "The chord swells in, holds, and when the key lifts the room keeps it: a wash that blurs and softens as it fades, the pitch smeared into the space. Compare it with the other tail: a long release is the same note, still in focus, simply getting quieter."
  ab: "Turn the reverb mix to zero and the release to very long: the chord still hangs, but it is the dry chord fading, clear and in the centre. Put the release back to short and the reverb back: the hang is diffuse and wide, and the next chord does not pile on the last one's note."

render:
  tempo: 90
  note: [C3, E3, G3, B3]
  velocity: 90
  pattern: "the chord held two bars, released, three bars of tail"
  length_s: 8.0

mappings: {}
