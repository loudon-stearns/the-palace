# Synth Templates — card 0.1 — Auto-Pan Pad
# Rhythmic and Sequenced, tier 1: a pad that drifts slowly left and right. The LFO goes to the pan jack, not the level.
schema: synth-template-card/0.2
id: auto-pan-pad
name: Auto-Pan Pad
family: Rhythmic and Sequenced
tier: 1
mode: poly
classics: ""
status: drafted
concepts:
  - "LFO → pitch / amplitude / pan / filter"
  - "Key → pan"
  - "Retrigger vs free; chords with staggered attacks"
  - "Standard sustaining envelope; strings and horns variants"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0, unison: 3, detune: narrow}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [reverb]}
    aenv:    {kind: envelope, role: amp, shape: {a: slow, d: medium, s: held, r: long}, category: pad}
    lfo1:    {kind: lfo, wave: sine, rate: very slow, sync: false, retrigger: true, note: "per voice, restarted on each note: notes played at different times sit at different places in the stereo field"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: lfo1, to: amp.pan, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: key,  to: amp.pan, amount: little, essential: false}

essentials:
  - {block: mode,    param: voices,    value: poly,            why: "a chord; with per-voice LFOs the notes drift past each other"}
  - {block: lfo1,    param: target,    value: amp pan,         why: "the level does not change, only where it comes from; on pan the LFO is motion without rhythm"}
  - {block: lfo1,    param: wave,      value: sine,            why: "the smoothest crossing; triangle lingers at the sides, square jumps"}
  - {block: lfo1,    param: rate,      value: very slow,       why: "one slow crossing every several seconds; faster and it is a tremolo split across the speakers"}
  - {block: lfo1,    param: retrigger, value: "on",            why: "each voice has its own LFO, so a chord played in stages spreads itself out"}
  - {block: lfo1,    param: depth,     value: generous,        why: "wide enough to hear the crossing; full is hard left to hard right and leaves a hole in the middle"}
  - {block: aenv,    param: attack,    value: slow,            why: "a pad: it fades in, and by the time it is up the pan has already moved"}
  - {block: aenv,    param: release,   value: long,            why: "the tail keeps drifting after the key"}

taste:
  - {block: lfo1,    param: rate,      range: "very slow – slow",    default: very slow}
  - {block: lfo1,    param: depth,     range: "some – full",         default: generous}
  - {block: filter1, param: cutoff,    range: "dark – bright",       default: mid}
  - {block: osc1,    param: detune,    range: "slight – wide",       default: narrow}
  - {block: aenv,    param: attack,    range: "medium – very slow",  default: slow}
  - {block: fx,      param: reverb,    range: "small – huge",        default: large}

listening:
  cue: "On headphones the chord slides from one ear toward the other and back, taking seconds to cross. Play the notes one at a time and each one crosses on its own schedule, so the chord keeps rearranging itself."
  ab: "Set the pan depth to none: the same chord, nailed to the centre, and it sounds smaller. Put it back. Then move the LFO to amp level at the same rate: a slow fade in and out, no width at all."

render:
  tempo: 80
  note: [E3, G3, B3, D4]
  velocity: 85
  pattern: "the four notes entering one per beat, then the chord held through bar two"
  length_s: 7.0

mappings: {}
