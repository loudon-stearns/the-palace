# Synth Templates — Genre Classics — Eurorack West-Coast Bongo
# A sine folded into harmonics, then a low-pass gate that opens level and brightness together and lets them ring down. No filter sweep, no amp envelope as such: one strike.
schema: synth-template-card/0.2
id: eurorack-west-coast-bongo
name: Eurorack West-Coast Bongo
family: Genre Classics
tier: 3
mode: mono
classics: Buchla
status: drafted
concepts:
  - "Sine: no response to filtering; FM/additive building block"
  - "Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"
  - "Pluck / strike: release = decay; gong vs marimba"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Envelope → filter cutoff (bite; auto-wah with long attack)"
  - "Envelope trigger / one-shot mode"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: sine, octave: 0, retrigger: true, note: "a sine into a wavefolder: the fold is drawn as drive on the gate below, since the slots have no folder block"}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none, drive: heavy, note: "the low-pass gate: a vactrol, so cutoff and level fall together and the fall is its own shape. The drive here is the folder; the voice plays it as a waveshaper, not a fold."}
    amp:     {kind: amplifier, level: full}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: short, s: zero, r: same as decay}, category: struck, one_shot: true}
    aenv:    {kind: envelope, role: amp,    shape: {a: instant, d: short, s: zero, r: same as decay}, category: struck, one_shot: true, note: "the same strike as the filter envelope: on a real LPG they are one control"}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: generous, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: vel,  to: fenv.amount, amount: generous, essential: true}
    - {from: vel,  to: amp.level, amount: some, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: sine,            why: "the folder needs a clean curve to fold: a saw folded is just noise"}
  - {block: filter1, param: drive,     value: heavy,           why: "the fold: the sine's peaks are turned back on themselves and become harmonics, more of them the harder it is driven. This is the west coast's filter in reverse: add, do not subtract"}
  - {block: filter1, param: type,      value: lowpass 12 dB,   why: "the gate's own slope; gentle, a shutter not a wall"}
  - {block: filter1, param: cutoff,    value: dark,            why: "closed at rest: an LPG is silent until struck"}
  - {block: fenv,    param: target,    value: cutoff and level together, why: "the gate: one strike opens both and both fall together, so the sound gets darker as it gets quieter, like a drum"}
  - {block: fenv,    param: attack,    value: instant,         why: "a strike"}
  - {block: fenv,    param: decay,     value: short,           why: "the ring: the vactrol's own fall, fast at first, then a tail"}
  - {block: fenv,    param: sustain,   value: zero,            why: "struck and left"}
  - {block: vel,     param: target,    value: strike amount,   why: "hit harder and it opens further: brighter and louder at once, never one without the other"}
  - {block: mode,    param: voices,    value: mono,            why: "one drum"}

taste:
  - {block: filter1, param: drive,     range: "light – heavy",       default: heavy, why: "how many folds: light is a soft tom, heavy is a metal bongo"}
  - {block: fenv,    param: decay,     range: "fast – medium",       default: short, why: "the ring"}
  - {block: fenv,    param: amount,    range: "moderate – full",     default: generous}
  - {block: osc1,    param: pitch,     range: "G2 – G3",             default: D3}
  - {block: amp,     param: level,     range: "half – full",         default: full}

listening:
  cue: "A wooden 'pong' that is bright for an instant and dark by the time it is quiet. Hit it softly and it is a dull tap; hit it hard and it opens into a metallic ring. No two hits are the same colour."
  ab: "Replace the gate with a plain amp envelope at the same shape and leave the filter open: the hit is the same loudness and stays bright as it dies, and the drum becomes a blip. Put it back. Then set the drive to none: a pure sine ping, a marimba with no wood."

render:
  tempo: 110
  note: [D3, D3, A2, D3, G3, D3, A2, A2]
  velocity: [120, 60, 90, 110, 70, 120, 60, 90]
  pattern: "eighth notes, one bar, a hand-drum pattern with hard and soft hits"
  length_s: 3.0

mappings: {}
