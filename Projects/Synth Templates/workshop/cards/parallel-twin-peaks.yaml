# Synth Templates — card 0.2 — Parallel: Twin Peaks
# Filter Routings, tier 2. Two band-passes side by side: one on the fundamental, fully keytracked; one higher, partly keytracked, so every note
# has its own character. The slot grammar draws the filters in series; the parallel split is said in the notes. The voice ignores key → cutoff.
schema: synth-template-card/0.2
id: parallel-twin-peaks
name: "Parallel: Twin Peaks"
family: Filter Routings
tier: 2
mode: poly
classics: ""
status: drafted
concepts:
  - "Parallel routing"
  - "Parallel: twin peaks, keytracking amount, vocal formants"
  - "Key → filter cutoff"
  - "Narrow pulse → nasal / vocal, with formant filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: bandpass, slope: 24, resonance: moderate, note: "PARALLEL with filter 2. The low peak: on the fundamental, full keytracking"}
    filter2: {kind: filter, type: bandpass, slope: 24, resonance: high, note: "PARALLEL on the real synth; the voice runs it in series after filter 1. The high peak: partial keytracking, so it lands on a different harmonic for each note"}
    amp:     {kind: amplifier, level: under unity}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: medium}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: key,  to: filter1.cutoff, amount: full, essential: true}
    - {from: key,  to: filter2.cutoff, amount: some, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: aenv.gate, essential: true}
    - {from: wheel, to: filter2.cutoff, amount: moderate, essential: false}

essentials:
  - {block: osc1,    param: wave,      value: saw,            why: "a full harmonic series for the two peaks to pick from"}
  - {block: filter1, param: type,      value: bandpass 24 dB}
  - {block: filter1, param: cutoff,    value: dark,           why: "centred on the fundamental at middle C"}
  - {block: filter1, param: keytrack,  value: full,           why: "it stays on the fundamental for every note, so the timbre is the same up and down the keyboard"}
  - {block: filter1, param: resonance, value: moderate,       why: "how many low harmonics get through; high and the fundamental dominates"}
  - {block: filter2, param: type,      value: bandpass 24 dB}
  - {block: filter2, param: routing,   value: parallel,       why: "two peaks summed; in series the second would only keep what the first let through"}
  - {block: filter2, param: cutoff,    value: bright,         why: "the upper peak, well above the first"}
  - {block: filter2, param: keytrack,  value: partial,        why: "it moves with the note but not all the way, so it sits on a different harmonic for each note: notes that land on one jump out, each note has its own consistent character"}
  - {block: filter2, param: resonance, value: high,           why: "narrow, so the jump is heard; low is the broader upper-harmonic version"}
  - {block: mode,    param: voices,    value: poly,           why: "the per-note character is heard between the notes of a chord"}

taste:
  - {block: filter2, param: keytrack,  range: "none – full",         default: partial,  why: "the lesson: at full every note sounds alike, at none the peak is a fixed formant"}
  - {block: filter2, param: cutoff,    range: "mid – open",          default: bright,   why: "with high resonance, careful placement makes a vowel"}
  - {block: filter2, param: resonance, range: "little – high",       default: high}
  - {block: filter1, param: resonance, range: "little – high",       default: moderate}
  - {block: aenv,    param: release,   range: "short – long",        default: medium}

listening:
  cue: "Play a scale: the body is the same on every note, but the upper peak catches a different harmonic each time, so some notes ring out and their neighbours sit back. Hold a chord and it leans toward a vowel."
  ab: "Set filter 2's keytracking to full: every note has the same ring in the same place and the scale goes flat and uniform. Back to partial and the notes get their characters back. Then to none: the peak is a formant that never moves, a vowel sung on every pitch."

render:
  tempo: 100
  note: [C3, D3, E3, F3, G3, A3, B3, C4]
  velocity: 95
  pattern: "a scale up, eighths, then the last held"
  length_s: 4.0

mappings: {}
