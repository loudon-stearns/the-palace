# Synth Templates — card 0.2 — Vibrato Fade-In (LFO Attack)
# The vibrato card with one addition: a ramp on the LFO's depth, so the note starts straight and the wobble arrives.
schema: synth-template-card/0.2
id: vibrato-fade-in-lfo-attack
name: Vibrato Fade-In (LFO Attack)
family: LFO Behaviours
tier: 1
mode: mono
classics: ""
status: drafted
concepts:
  - "LFO attack: envelope → LFO depth"
  - "Envelope → pitch LFO depth"
  - "Vibrato: ~5 Hz, under a semitone; dedicated vibrato LFO"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 12, resonance: none}
    amp:     {kind: amplifier, level: under unity}
    menv:    {kind: envelope, role: lfo depth, shape: {a: medium, d: instant, s: full, r: short}, category: swell, note: "a ramp to full and stay; on many synths this is the LFO's own attack knob. The voice does not yet play envelope → LFO depth"}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: medium}, category: sustaining}
    lfo1:    {kind: lfo, wave: sine, rate: medium, sync: false, retrigger: true}
  audio:
    - [osc1, filter1]
    - [filter1, amp]
    - [amp, out]
  modulation:
    - {from: lfo1, to: osc1.pitch, amount: little, essential: true}
    - {from: menv, to: lfo1.depth, amount: full, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: lfo1, param: rate,    value: medium, why: "the natural vibrato, as on the Natural Vibrato card"}
  - {block: lfo1, param: depth,   value: little, why: "under a semitone once it has arrived"}
  - {block: menv, param: target,  value: LFO depth, why: "the envelope scales the wobble, not the pitch: that is the LFO attack"}
  - {block: menv, param: attack,  value: medium, why: "roughly half a second: the note speaks straight, then the vibrato grows in, as a player does it"}
  - {block: menv, param: sustain, value: full,   why: "once in, the vibrato stays for the rest of the note; it is a ramp, not an ADSR"}
  - {block: aenv, param: sustain, value: held,   why: "there must be a sustain for the vibrato to arrive into"}
  - {block: mode, param: voices,  value: mono}

taste:
  - {block: menv,    param: attack, range: "short – slow",   default: medium, why: "short is a quick settle, slow is a long straight note before any wobble"}
  - {block: lfo1,    param: rate,   range: "slow – fast",    default: medium}
  - {block: lfo1,    param: depth,  range: "little – some",  default: little}
  - {block: filter1, param: cutoff, range: "mid – bright",   default: bright}
  - {block: aenv,    param: release, range: "short – medium", default: medium}

listening:
  cue: "The note lands dead straight. Over the first half second the wobble fades up from nothing until the pitch breathes the way the Natural Vibrato card does."
  ab: "Set the depth envelope's attack to instant: the vibrato is there from the first sample and the note sounds mechanical. Put it back to medium and it sings its way in."

render:
  tempo: 100
  note: A3
  velocity: 100
  pattern: "one note held two bars, then released; the fade-in is in the first half second"
  length_s: 5.0

mappings: {}
