# Synth Templates — card 0.2 — Serial: Source and Resonator
# Filter Routings, tier 2. The first filter follows the key and is the string; the second stays put and is the body. Key → filter cutoff is the lesson;
# the site voice applies its own fixed half keytracking to every filter and does not read these routes yet.
schema: synth-template-card/0.2
id: serial-source-and-resonator
name: "Serial: Source and Resonator"
family: Filter Routings
tier: 2
mode: poly
classics: ""
status: drafted
concepts:
  - "Serial: source and resonator (keytracked vs fixed)"
  - "Serial routing"
  - "Key → filter cutoff"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little, note: "the source: full keytracking, the timbre rides up and down with the note"}
    filter2: {kind: filter, type: lowpass, slope: 12, resonance: moderate, note: "the resonator: no keytracking, a body that stays where it is; band-pass is the other voicing. The voice applies fixed half keytracking to both filters and ignores the key routes"}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: medium}, category: plucked}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: long, s: half, r: medium}, category: plucked}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: key,  to: filter1.cutoff, amount: full, essential: true}
    - {from: fenv, to: filter1.cutoff, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw}
  - {block: filter1, param: type,      value: lowpass 24 dB}
  - {block: filter1, param: keytrack,  value: full,          why: "the cutoff moves with the note, so every note has the same harmonic shape: the source"}
  - {block: filter1, param: cutoff,    value: mid,           why: "at middle C; it is the string's own brightness"}
  - {block: filter2, param: type,      value: lowpass 12 dB, why: "a gentle fixed ceiling; band-pass makes a stronger formant"}
  - {block: filter2, param: keytrack,  value: none,          why: "it does not move: the body of the instrument, the same for every note"}
  - {block: filter2, param: cutoff,    value: bright,        why: "the resonator's region; notes that climb into it get quieter, as on a real instrument"}
  - {block: filter2, param: resonance, value: moderate,      why: "a formant: a bump the fixed body puts on every note that passes it"}
  - {block: mode,    param: voices,    value: poly,          why: "the fixed body is heard best across a chord: low notes dark, high notes thinner"}

taste:
  - {block: filter2, param: cutoff,    range: "mid – open",          default: bright,   why: "where the body sits; lower, and the top notes die sooner"}
  - {block: filter2, param: resonance, range: "little – high",       default: moderate, why: "how strong the formant is"}
  - {block: filter2, param: type,      range: "lowpass – bandpass",  default: lowpass,  why: "band-pass turns the body into a vowel"}
  - {block: filter1, param: cutoff,    range: "dark – bright",       default: mid}
  - {block: fenv,    param: amount,    range: "little – generous",   default: moderate}
  - {block: aenv,    param: decay,     range: "medium – very long",  default: long}

listening:
  cue: "Play low and high: the pluck keeps the same shape on every note, but the high notes lose weight as they climb into the fixed filter, and one region of the keyboard glows where the body's bump sits."
  ab: "Set filter 2 to full keytracking too: now both filters ride with the note and the keyboard sounds the same everywhere, like a synth. Put it back to none and the body returns: some notes bloom, the top ones thin out."

render:
  tempo: 100
  note: [C2, G2, C3, G3, C4, G4]
  velocity: 95
  pattern: "an ascending line of six notes, eighths, then the last held"
  length_s: 4.0

mappings: {}
