# Synth Templates — card — Saturated Bass
# A saw through a driven filter, then a second filter to tame what the drive made. Distortion as the harmonic generator.
schema: synth-template-card/0.2
id: saturated-bass
name: Saturated Bass
family: Bass
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Drive: by velocity, by envelope; serial filter after"
  - "Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"
  - "Serial routing"
  - "Subtractive: rich wave then filter"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass, slope: 24, resonance: little, drive: heavy, note: "the drive lives in this filter"}
    filter2: {kind: filter, type: lowpass, slope: 12, resonance: none, note: "serial, after the drive: takes the fizz off what the distortion added"}
    amp:     {kind: amplifier, level: under unity}
    fenv:    {kind: envelope, role: filter, shape: {a: instant, d: medium, s: low, r: short}, category: percussive}
    aenv:    {kind: envelope, role: amp,    shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, out]
  modulation:
    - {from: fenv, to: filter1.cutoff, amount: some, essential: true}
    - {from: vel,  to: filter1.drive, amount: moderate, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: fenv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,    value: saw,            why: "a rich wave, so the filter has something to close on before the drive opens it again"}
  - {block: filter1, param: type,    value: lowpass 24 dB}
  - {block: filter1, param: cutoff,  value: dark,           why: "the low-passed saw is dull; the drive puts the mids back as new harmonics"}
  - {block: filter1, param: drive,   value: heavy,          why: "distortion makes harmonics of what goes in: a dull bass comes out with a filled-in midrange"}
  - {block: vel,     param: target,  value: filter drive,   why: "a hard note is a dirtier note, not only a louder one: distortion turns volume into timbre"}
  - {block: fenv,    param: amount,  value: some,           why: "mild: a little bite, so the drive, not the sweep, is the character"}
  - {block: filter2, param: type,    value: lowpass 12 dB,  why: "a second filter after the drive, in series: heavy drive needs filtering again, and a gentle slope keeps the grit"}
  - {block: filter2, param: cutoff,  value: mid,            why: "where the fizz stops and the growl stays"}
  - {block: aenv,    param: sustain, value: held}
  - {block: mode,    param: voices,  value: mono,           why: "distortion of two notes at once is intermodulation, not bass"}

taste:
  - {block: filter1, param: drive,   range: "light – heavy",    default: heavy}
  - {block: filter1, param: cutoff,  range: "dark – mid",       default: dark}
  - {block: fenv,    param: amount,  range: "little – moderate", default: some}
  - {block: filter2, param: cutoff,  range: "mid – bright",     default: mid, why: "lower is warmer, higher is fizzier"}
  - {block: aenv,    param: release, range: "short – medium",   default: short}

listening:
  cue: "A thick, mid-heavy growl: the bass sits low but you can hear it on a phone, because the drive has made harmonics the filter took away. Hard notes snarl; soft notes stay smooth."
  ab: "Set the drive to none: the same patch is a soft, dull low-pass bass, and vanishes on small speakers. Put the drive back, then open filter 2 to bright: the growl turns to fizz."

render:
  tempo: 95
  note: [E1, E1, G1, A1, E1]
  velocity: [110, 70, 110, 90, 120]
  pattern: "one bar: quarter, eighth, eighth, quarter, quarter; hard on 1, 3 and the last"
  length_s: 3.0

mappings: {}
