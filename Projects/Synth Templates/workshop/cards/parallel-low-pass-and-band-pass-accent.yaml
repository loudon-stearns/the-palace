# Synth Templates — card 0.2 — Parallel: Low-Pass and Band-Pass Accent
# Filter Routings, tier 2. The low-pass is the voice; the band-pass sits still in one place in the mix and its resonance jumps on every hard note.
# The slot grammar draws the filters in series; the parallel split is said in the notes. The voice does not play an envelope on resonance.
schema: synth-template-card/0.2
id: parallel-low-pass-and-band-pass-accent
name: "Parallel: Low-Pass and Band-Pass Accent"
family: Filter Routings
tier: 2
mode: mono
classics: ""
status: drafted
concepts:
  - "Parallel: low-pass + band-pass accent (env → resonance, velocity)"
  - "Envelope → filter resonance"
  - "Parallel routing"
  - "Velocity → filter envelope amount; → pitch envelope amount"
  - "Key → filter cutoff"

graph:
  blocks:
    osc1:    {kind: oscillator, wave: saw, octave: 0}
    filter1: {kind: filter, type: lowpass,  slope: 24, resonance: little, note: "PARALLEL with filter 2. The voice: keytracked near the fundamental. Gets most of the signal"}
    filter2: {kind: filter, type: bandpass, slope: 24, resonance: little, note: "PARALLEL on the real synth; the voice runs it in series after filter 1. The accent band: no keytracking, placed in the mix; the envelope drives its resonance, which the voice does not play yet"}
    amp:     {kind: amplifier, level: under unity}
    fx:      {kind: fx, chain: [drive]}
    menv:    {kind: envelope, role: resonance, shape: {a: instant, d: short, s: zero, r: instant}, category: percussive, note: "no attack, no sustain, no release: only the decay"}
    aenv:    {kind: envelope, role: amp, shape: {a: fast, d: medium, s: held, r: short}, category: sustaining}
  audio:
    - [osc1, filter1]
    - [filter1, filter2]
    - [filter2, amp]
    - [amp, fx]
    - [fx, out]
  modulation:
    - {from: key,  to: filter1.cutoff, amount: full, essential: true}
    - {from: menv, to: filter2.resonance, amount: generous, essential: true}
    - {from: vel,  to: menv.amount, amount: full, essential: true}
    - {from: aenv, to: amp.level, essential: true}
    - {from: key,  to: osc1.pitch, essential: true}
    - {from: key,  to: menv.gate, essential: true}
    - {from: key,  to: aenv.gate, essential: true}

essentials:
  - {block: osc1,    param: wave,      value: saw}
  - {block: filter1, param: type,      value: lowpass 24 dB,  why: "the basic timbre"}
  - {block: filter1, param: keytrack,  value: full,           why: "it follows the note, so the tone is the same everywhere"}
  - {block: filter1, param: cutoff,    value: mid}
  - {block: filter2, param: type,      value: bandpass 24 dB}
  - {block: filter2, param: routing,   value: parallel,       why: "the band adds to the voice; in series it would narrow it"}
  - {block: filter2, param: keytrack,  value: none,           why: "the accent lives at one frequency whatever the note: stationary in the mix, easy to place and easy to control"}
  - {block: filter2, param: cutoff,    value: bright,         why: "upper mids, just above where a vocal sits; set it with the whole mix playing"}
  - {block: filter2, param: level,     value: low,            why: "less to the higher filter; it is an accent, not the voice"}
  - {block: menv,    param: target,    value: filter 2 resonance, why: "resonance, not cutoff: the band sharpens for an instant then relaxes, a bite at the front of every note"}
  - {block: menv,    param: decay,     value: short,          why: "only the decay is set; the bite is the start of the note"}
  - {block: vel,     param: target,    value: envelope amount, why: "hard notes bite, soft notes do not: the accents play themselves"}
  - {block: fx,      param: chain,     value: drive,          why: "a hint of overdrive after brings the accents forward"}
  - {block: mode,    param: voices,    value: mono}

taste:
  - {block: filter2, param: cutoff,    range: "mid – open",        default: bright, why: "the hole in the mix the accent fills"}
  - {block: filter2, param: level,     range: "little – half",     default: low}
  - {block: menv,    param: decay,     range: "fast – medium",     default: short,  why: "how long the bite lasts"}
  - {block: menv,    param: amount,    range: "moderate – full",   default: generous}
  - {block: filter1, param: cutoff,    range: "dark – bright",     default: mid}
  - {block: fx,      param: drive,     range: "none – light",      default: light}

listening:
  cue: "A steady low-pass voice with a sharp glint at the front of the hard notes, always at the same place in the spectrum whatever the pitch. Soft notes have no glint."
  ab: "Set velocity to envelope amount to none: every note bites the same and the line loses its accents. Put it back. Then give filter 2 full keytracking: the glint slides around with the pitch and no longer sits in its place in the mix."

render:
  tempo: 120
  note: [A1, A1, C2, A1, D2, A1, G1, A1]
  velocity: [115, 60, 60, 115, 60, 60, 115, 60]
  pattern: "eighths, one bar; accents on 1, 4 and 7"
  length_s: 3.0

mappings: {}
