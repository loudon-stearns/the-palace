<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synth Templates</title>
<style>
:root{--ground-000:#f0eee5;--ground-100:#e6e3d7;--ground-200:#dcd9ca;--ink:#1a1916;--ink-2:#3a3a35;--ink-3:#6a6862;--ink-bright:#000;--rule:#b8b09a;--rule-soft:#cfc9b6;--slab-face:#d8d4c6;--slab-light:#ebe8dd;--slab-shade:#b9b4a3;--accent:#c8261a;--on-accent:#f0eee5;--datasheet:#2b5fb0;--assumed:#a8730a;--ok:#3a7d2c}
*{box-sizing:border-box}
body{margin:0;background:var(--ground-000);color:var(--ink);font:15px/22px 'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace}
a{color:var(--datasheet);text-decoration:none}
.sheet{max-width:1200px;margin:24px auto;padding:0 16px}
.frame{border:2px solid var(--rule);background:var(--ground-000)}
.titleblock{display:grid;grid-template-columns:1fr auto;border-bottom:2px solid var(--rule)}
.titleblock>div{padding:12px}
.titleblock .cell{border-left:1px solid var(--rule);font-size:11px;line-height:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;text-align:right}
h1{font-size:22px;line-height:26px;font-weight:600;letter-spacing:.04em;margin:0;text-transform:uppercase}
h2{font-size:18px;line-height:24px;font-weight:600;letter-spacing:.04em;margin:0;text-transform:uppercase}
h3{font-size:11px;line-height:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px;font-weight:500}
.sub{font-size:13px;line-height:18px;color:var(--ink-2);margin-top:4px}
.btn{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--ink);background:var(--slab-face);color:var(--ink);border-radius:0;cursor:pointer;box-shadow:inset 0 1px 0 var(--slab-light),0 1px 0 var(--slab-shade)}
.btn:active{box-shadow:none;transform:translateY(1px)}
.btn.primary{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--ink);color:var(--on-accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--rule)}
.toolbar input[type=search]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--rule);background:var(--ground-100);color:var(--ink);border-radius:0;min-width:220px}
.count{margin-left:auto;font-size:12px;color:var(--ink-2)}
/* catalog */
.fam{border-bottom:1px solid var(--rule)}
.famhead{display:flex;gap:12px;align-items:baseline;padding:10px 12px;background:var(--ground-100);border-bottom:1px solid var(--rule-soft)}
.famhead .note{font-size:13px;color:var(--ink-2);flex:1}
.famhead .n{font-size:12px;color:var(--ink-3);white-space:nowrap}
table{width:100%;border-collapse:collapse}
tr.item{border-top:1px solid var(--rule-soft)}
tr.item.hide{display:none}
tr.item.has{cursor:pointer}
tr.item.has:hover{background:var(--ground-100)}
td{padding:6px 10px;vertical-align:top;font-size:13px;line-height:18px}
td.name{width:240px;font-weight:600;color:var(--ink-bright)}
tr.item:not(.has) td.name{color:var(--ink-3);font-weight:500}
td.name small{display:block;font-weight:400;color:var(--datasheet);font-size:11px}
td.mode{width:100px;color:var(--ink-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td.ess{color:var(--ink)}
tr.item:not(.has) td.ess{color:var(--ink-3)}
td.ess i{display:block;font-style:normal;color:var(--ink-2);font-size:12px}
td.tier{width:40px;text-align:center;color:var(--assumed);font-weight:600}
td.badge{width:70px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
td.badge span{border:1px solid var(--ok);color:var(--ok);padding:1px 5px}
/* card page */
.cardhead{display:grid;grid-template-columns:1fr auto;border-bottom:2px solid var(--rule)}
.cardhead>div{padding:12px}
.crumb{font-size:12px;color:var(--ink-2);margin-bottom:4px}
.play{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--rule);background:var(--ground-100)}
.play .hint{font-size:12px;color:var(--ink-2)}
.keys{display:flex;gap:2px;padding:12px;border-bottom:1px solid var(--rule);align-items:flex-end}
.key{width:34px;height:70px;border:1px solid var(--ink);background:var(--slab-face);box-shadow:inset 0 1px 0 var(--slab-light),0 1px 0 var(--slab-shade);cursor:pointer;font-size:10px;color:var(--ink-2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;user-select:none}
.key.black{background:var(--ink);color:var(--ground-100);height:48px;width:28px;margin:0 -15px;z-index:1;position:relative}
.key.down{background:var(--accent);color:var(--on-accent)}
.diagram{padding:12px;border-bottom:1px solid var(--rule);background:#f0eee5}
.sheet-svg{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0}
.two>div{padding:12px}
.two>div+div{border-left:1px solid var(--rule)}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{padding:4px 6px;border-top:1px solid var(--rule-soft);vertical-align:top}
.kv td.k{color:var(--ink-2);width:150px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:6px}
.kv td.v{font-weight:600;color:var(--ink-bright);width:170px}
.kv.taste td.v{color:var(--assumed)}
.kv td.w{color:var(--ink-2)}
.listen{padding:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.listen p{margin:4px 0 10px}
.listen textarea{width:100%;min-height:90px;font:13px/18px inherit;font-family:inherit;background:var(--ground-100);color:var(--ink);border:1px solid var(--rule);border-radius:0;padding:8px}
.meta{padding:12px;font-size:12px;color:var(--ink-2)}
.meta b{color:var(--ink)}
.foot{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--rule);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.foot div{padding:8px 12px;border-left:1px solid var(--rule)}
.foot div:first-child{border-left:0}
.assumed{color:var(--assumed)}
@media(max-width:760px){.two{grid-template-columns:1fr}.two>div+div{border-left:0;border-top:1px solid var(--rule)}td.mode,td.tier{display:none}.foot{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sheet"><div class="frame" id="app"></div></div>
<script>
const CATALOG = {"title": "Synth Templates \u2014 catalog of candidates", "born": "2026-10-29", "families": [{"name": "Bass", "note": "The low end. Mono almost always; the filter envelope and the decay shape are the whole character.", "items": [{"id": "sub-bass", "name": "Sub Bass", "mode": "mono", "essentials": "Sine (or triangle), no filter, instant attack, held sustain, short release. One octave down.", "teaches": "Pure fundamental; why sub needs no harmonics", "tier": 1, "classics": "any 808 sub", "concepts": ["Sine: no response to filtering; FM/additive building block"]}, {"id": "808-bass", "name": "808 Bass", "mode": "mono", "essentials": "Sine, pitch envelope drops ~1 octave in 20\u201360 ms, long amp decay (1\u20133 s), light saturation for upper harmonics.", "teaches": "Pitch envelope as punch; decay as length", "tier": 1, "classics": "TR-808 kick-as-bass", "concepts": []}, {"id": "house-bass", "name": "House Bass", "mode": "mono", "essentials": "Square (or pulse) + sub, resonant LPF, filter env: instant attack, short decay, zero sustain. Amp: fast attack, medium decay.", "teaches": "Percussive filter envelope; the pluck is in the filter not the amp", "tier": 1, "classics": "classic Chicago / French house", "concepts": ["Subtractive: rich wave then filter", "Envelope \u2192 filter cutoff (bite; auto-wah with long attack)"]}, {"id": "acid-bass", "name": "Acid Bass", "mode": "mono legato", "essentials": "Saw or square, high-resonance LPF (~18 dB/oct), filter env decay 100\u2013300 ms, env amount high, accent = more env, slide = glide on tied notes.", "teaches": "Resonance + envelope depth; accent and slide as performance", "tier": 2, "classics": "TB-303", "concepts": []}, {"id": "moog-bass", "name": "Moog Bass", "mode": "mono", "essentials": "Saw + square an octave apart, 24 dB ladder LPF, cutoff lowish, filter env short decay, slight drive.", "teaches": "Two-osc stacking; ladder filter slope; drive", "tier": 1, "classics": "Minimoog", "concepts": ["Combining waveforms: square + saw octave up (zipper)", "Filter models and their distortion (sine test)"]}, {"id": "reese-bass", "name": "Reese Bass", "mode": "mono", "essentials": "Two saws detuned 10\u201330 cents, little or no filter movement, the beat frequency is the sound. Often chorus or phaser later.", "teaches": "Detune as motion; beating", "tier": 1, "classics": "Reese Project / jungle, DnB", "concepts": ["Small detune (\u22647 cents) = chorus"]}, {"id": "wobble-bass", "name": "Wobble Bass", "mode": "mono", "essentials": "Saw or square, LPF with LFO on cutoff synced to tempo (1/4\u20131/16), high resonance, distortion after.", "teaches": "LFO as rhythmic modulation; tempo sync", "tier": 2, "classics": "dubstep", "concepts": ["Tempo sync; triplets"]}, {"id": "neuro-bass", "name": "Neuro Bass", "mode": "mono", "essentials": "FM or wavetable with heavy saturation, resampled and re-filtered; movement from several slow LFOs on different targets.", "teaches": "Layered modulation; resampling as a technique", "tier": 3, "classics": "neurofunk DnB", "concepts": []}, {"id": "fm-bass", "name": "FM Bass", "mode": "mono", "essentials": "Two operators 1:1, modulator index with a short envelope, carrier sine, no filter.", "teaches": "FM index envelope as timbral pluck", "tier": 2, "classics": "DX7 'Bass 1'", "concepts": []}, {"id": "pluck-bass", "name": "Pluck Bass", "mode": "mono", "essentials": "Saw, LPF, filter env very short decay, amp env short too; velocity \u2192 filter.", "teaches": "Shortest envelopes; velocity routing", "tier": 1, "classics": "", "concepts": []}, {"id": "synthwave-bass", "name": "Synthwave Bass", "mode": "mono", "essentials": "Square, LPF closed-ish, amp env short decay no sustain, sequenced 16ths, slight chorus.", "teaches": "Gated sequences; pulse body", "tier": 1, "classics": "outrun", "concepts": []}, {"id": "pwm-bass", "name": "PWM Bass", "mode": "mono", "essentials": "Pulse with LFO on width (slow), LPF, held notes.", "teaches": "Pulse-width modulation", "tier": 2, "classics": "SH-101", "concepts": ["Pulse width, static and modulated"]}, {"id": "sync-bass", "name": "Sync Bass", "mode": "mono", "essentials": "Osc2 hard-synced to osc1, env sweeps osc2 pitch, LPF open.", "teaches": "Hard sync; the sync sweep", "tier": 2, "classics": "", "concepts": []}, {"id": "growl-bass", "name": "Growl Bass", "mode": "mono", "essentials": "Saw into a formant or band-pass with LFO/env on vowel position, drive.", "teaches": "Formant filtering; vowel movement", "tier": 3, "classics": "", "concepts": []}, {"id": "donk", "name": "Donk", "mode": "mono", "essentials": "Sine or triangle with a pitch env (fast drop), very short decay, hard; plus a filter ping.", "teaches": "Pitch env + decay = 'donk'", "tier": 2, "classics": "UK bounce", "concepts": []}, {"id": "hoover-bass", "name": "Hoover Bass", "mode": "mono", "essentials": "Detuned saws with pitch sweep down into the note, PWM-ish, chorus. The hoover in the bass register.", "teaches": "Pitch sweep; detune stack", "tier": 2, "classics": "Mentasm / Alpha Juno", "concepts": []}, {"id": "organ-bass", "name": "Organ Bass", "mode": "mono", "essentials": "Sine + 1 octave up + 1 fifth up (3 drawbars), no filter, instant envelopes.", "teaches": "Additive stacking by partials", "tier": 2, "classics": "Hammond pedals", "concepts": []}, {"id": "saturated-bass", "name": "Saturated Bass", "mode": "mono", "essentials": "Saw, LPF, mild filter env, then distortion/overdrive to fill the mid.", "teaches": "Saturation as harmonic generator", "tier": 2, "classics": "", "concepts": ["Drive: by velocity, by envelope; serial filter after"]}, {"id": "layered-sub-tone", "name": "Layered Sub + Tone", "mode": "mono", "essentials": "Layer A: sub sine. Layer B: saw/square LPF with the character, high-passed at ~80 Hz.", "teaches": "Layering; splitting a sound by frequency band", "tier": 2, "classics": "deep house", "concepts": []}, {"id": "portamento-bass", "name": "Portamento Bass", "mode": "mono legato", "essentials": "Saw, LPF, glide 50\u2013150 ms on legato notes only.", "teaches": "Legato glide; mono voice priority", "tier": 1, "classics": "", "concepts": ["Glide / portamento time; legato mode as default"]}, {"id": "triangle-chip-bass", "name": "Triangle Chip Bass", "mode": "mono", "essentials": "Triangle wave, no filter, instant envelopes.", "teaches": "Chiptune constraints", "tier": 1, "classics": "NES", "concepts": ["Triangle as a filtered square"]}, {"id": "square-sub-techno-bass", "name": "Square-Sub Techno Bass", "mode": "mono", "essentials": "Square, LPF low cutoff, short amp decay, sidechained; the sound is the hole the kick leaves.", "teaches": "Sidechain as envelope", "tier": 2, "classics": "techno", "concepts": []}]}, {"name": "Leads", "note": "A single voice meant to be heard as a line. Mono with glide, or poly for stacks.", "items": [{"id": "saw-lead", "name": "Saw Lead", "mode": "mono legato", "essentials": "Saw, LPF mostly open, modest filter env, vibrato by mod wheel, glide short.", "teaches": "The default lead; mod-wheel vibrato", "tier": 1, "classics": "", "concepts": ["Subtractive: rich wave then filter"]}, {"id": "square-lead", "name": "Square Lead", "mode": "mono", "essentials": "Square, no or light LPF, vibrato LFO delayed by ~300 ms.", "teaches": "Delayed vibrato; hollow odd-harmonic timbre", "tier": 1, "classics": "chiptune / Jan Hammer", "concepts": []}, {"id": "pwm-lead", "name": "PWM Lead", "mode": "mono", "essentials": "Pulse with slow LFO on width, LPF, chorus-like thickness from one osc.", "teaches": "PWM", "tier": 2, "classics": "SH-101 / Juno", "concepts": ["Pulse width, static and modulated"]}, {"id": "sync-lead", "name": "Sync Lead", "mode": "mono", "essentials": "Hard sync, osc2 pitch swept by env or wheel; aggressive, formant-like.", "teaches": "Hard sync as a timbral control", "tier": 2, "classics": "Cars 'Let's Go', Prophet-5", "concepts": []}, {"id": "supersaw-lead", "name": "Supersaw Lead", "mode": "poly", "essentials": "7 saws detuned \u00b120\u201340 cents, LPF, mild filter env, big reverb.", "teaches": "Unison and detune spread", "tier": 1, "classics": "JP-8000 trance", "concepts": ["Unison / unisono"]}, {"id": "hoover", "name": "Hoover", "mode": "poly or mono", "essentials": "Detuned saws + PWM, pitch envelope sweeps down into the note, chorus.", "teaches": "Pitch env sweep + detune", "tier": 2, "classics": "Alpha Juno 'What the'", "concepts": []}, {"id": "trance-pluck", "name": "Trance Pluck", "mode": "poly", "essentials": "Saw, LPF, filter env fast decay, delay + reverb; sequenced.", "teaches": "Pluck + delay as rhythm", "tier": 1, "classics": "", "concepts": []}, {"id": "fm-bright-lead", "name": "FM Bright Lead", "mode": "mono", "essentials": "Carrier sine, modulator 2:1 or 3:1, high index with slow decay.", "teaches": "FM ratio and index", "tier": 2, "classics": "DX7", "concepts": []}, {"id": "sine-lead", "name": "Sine Lead", "mode": "mono legato", "essentials": "Sine with vibrato and glide; theremin-like.", "teaches": "Expression with no timbre: pitch and amp only", "tier": 1, "classics": "theremin / 'Flim'", "concepts": ["Sine: no response to filtering; FM/additive building block"]}, {"id": "flute-lead", "name": "Flute Lead", "mode": "mono", "essentials": "Sine or triangle + breath noise on attack, slow vibrato, soft attack ~30 ms.", "teaches": "Noise as attack transient", "tier": 2, "classics": "", "concepts": []}, {"id": "brass-lead", "name": "Brass Lead", "mode": "mono", "essentials": "Saw, LPF, filter env with attack ~50 ms (the 'blat'), slight detune.", "teaches": "Filter attack as brass", "tier": 1, "classics": "Prophet / Oberheim", "concepts": ["Envelope \u2192 filter cutoff (bite; auto-wah with long attack)"]}, {"id": "distorted-lead", "name": "Distorted Lead", "mode": "mono", "essentials": "Saw or square, LPF, drive/distortion, feedback delay.", "teaches": "Distortion in the signal chain", "tier": 2, "classics": "", "concepts": ["Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"]}, {"id": "acid-lead", "name": "Acid Lead", "mode": "mono legato", "essentials": "The acid bass played high: saw, high res, env mod, slide.", "teaches": "Same patch, different register", "tier": 1, "classics": "TB-303", "concepts": []}, {"id": "screech-lead", "name": "Screech Lead", "mode": "mono", "essentials": "Square or saw, high resonance near self-oscillation, filter env, pitch bend.", "teaches": "Filter at the edge of self-oscillation", "tier": 2, "classics": "", "concepts": ["Resonance: boost at cutoff; self-oscillation"]}, {"id": "whistle", "name": "Whistle", "mode": "mono", "essentials": "Sine, fast vibrato, soft attack, HPF removes body.", "teaches": "Pure tone with vibrato", "tier": 1, "classics": "", "concepts": []}, {"id": "ring-mod-lead", "name": "Ring-Mod Lead", "mode": "mono", "essentials": "Two oscs through a ring modulator, inharmonic; env on osc2 pitch.", "teaches": "Ring modulation", "tier": 3, "classics": "", "concepts": []}, {"id": "vocal-formant-lead", "name": "Vocal / Formant Lead", "mode": "mono", "essentials": "Saw into 2\u20133 band-passes at vowel formants; wheel moves the vowel.", "teaches": "Formants", "tier": 3, "classics": "", "concepts": ["Narrow pulse \u2192 nasal / vocal, with formant filter"]}, {"id": "dub-siren", "name": "Dub Siren", "mode": "mono", "essentials": "Square or saw, LFO on pitch (fast-ish), spring reverb and delay.", "teaches": "LFO \u2192 pitch at audio-adjacent rate", "tier": 1, "classics": "", "concepts": []}, {"id": "chip-arp-lead", "name": "Chip Arp Lead", "mode": "mono", "essentials": "Pulse 25%, arpeggiator at 1/32 across a chord, no filter.", "teaches": "Arpeggiators; pulse widths", "tier": 1, "classics": "C64 SID", "concepts": []}, {"id": "soft-lead", "name": "Soft Lead", "mode": "poly", "essentials": "Triangle + sine, LPF, slow attack, chorus.", "teaches": "Gentle timbres; triangle as a soft saw", "tier": 1, "classics": "", "concepts": ["Triangle as a filtered square"]}, {"id": "wavetable-scan-lead", "name": "Wavetable Scan Lead", "mode": "mono", "essentials": "Wavetable osc, env or LFO scans table position, LPF.", "teaches": "Wavetable position as a timbre axis", "tier": 2, "classics": "", "concepts": []}, {"id": "phase-distortion-lead", "name": "Phase-Distortion Lead", "mode": "mono", "essentials": "PD osc (CZ-style), env on distortion amount.", "teaches": "Phase distortion as a filter substitute", "tier": 3, "classics": "Casio CZ", "concepts": []}]}, {"name": "Pads", "note": "Slow attack, long release, movement. Poly; the modulation is the sound.", "items": [{"id": "supersaw-pad", "name": "Supersaw Pad", "mode": "poly", "essentials": "Detuned saw stack, LPF half open, attack ~500 ms, release ~1.5 s, reverb.", "teaches": "Unison + slow envelopes", "tier": 1, "classics": "trance", "concepts": []}, {"id": "warm-analog-pad", "name": "Warm Analog Pad", "mode": "poly", "essentials": "Two saws slightly detuned, LPF ~1 kHz, slow filter env, chorus.", "teaches": "Slow filter envelope; chorus", "tier": 1, "classics": "Juno-106", "concepts": []}, {"id": "string-machine", "name": "String Machine", "mode": "poly", "essentials": "Saw, no filter envelope, ensemble/chorus heavy, medium attack.", "teaches": "Ensemble effect as the timbre", "tier": 1, "classics": "Solina / ARP String Ensemble", "concepts": ["Chorus: multiple delays, own LFOs, no feedback"]}, {"id": "evolving-pad", "name": "Evolving Pad", "mode": "poly", "essentials": "Wavetable with slow LFO on position, second LFO on filter, long attack.", "teaches": "Slow multi-LFO movement", "tier": 2, "classics": "", "concepts": []}, {"id": "choir-pad", "name": "Choir Pad", "mode": "poly", "essentials": "Saw/pulse into formant 'ah', chorus, slow attack.", "teaches": "Formants on a pad", "tier": 3, "classics": "", "concepts": []}, {"id": "glass-bell-pad", "name": "Glass / Bell Pad", "mode": "poly", "essentials": "FM 1:3.5 or additive with soft attack, long release, reverb.", "teaches": "Inharmonic const NCARDS = Object.keys(CARDS).length;

// ---------- reviews (per card, in this browser) ----------
const RKEY = 'synth-templates-reviews-v1'; let reviews = {}; try { reviews = JSON.parse(localStorage.getItem(RKEY) || '{}'); } catch(e){}
function saveReviews(){ try { localStorage.setItem(RKEY, JSON.stringify(reviews)); } catch(e){} }
function exportReviews(){ const ids = Object.keys(reviews).filter(k => reviews[k].trim()); let md = '## Synth Templates — card reviews ' + new Date().toISOString().slice(0,10) + '\n'; ids.forEach(id => md += '\n### ' + (CARDS[id]?.name || id) + ' (' + id + ')\n' + reviews[id].trim() + '\n'); if (!ids.length) md += '\n(no reviews yet)\n'; navigator.clipboard?.writeText(md).then(() => { const el = document.getElementById('revmsg'); if (el) el.textContent = ids.length + ' review' + (ids.length===1?'':'s') + ' copied — paste to Claude'; }); }
// ---------- routing ----------
const app = document.getElementById('app');
function route(){ const h = location.hash.replace(/^#\/?/, ''); const m = h.match(/^card\/(.+)$/); if (m && CARDS[m[1]]) renderCard(m[1]); else renderCatalog(); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);

// ---------- catalog ----------
let q = '', onlyCards = false;
function renderCatalog(){
  stopAll();
  const fams = CATALOG.families.map((f, fi) => `
    <div class="fam"><div class="famhead"><h2>${f.name}</h2><span class="note">${f.note}</span><span class="n">${f.items.filter(i=>CARDS[i.id]).length}/${f.items.length} cards</span></div>
    <table>${f.items.map(it => `<tr class="item ${CARDS[it.id]?'has':''}" data-id="${it.id}" data-text="${(it.name+' '+it.essentials+' '+it.teaches+' '+it.classics+' '+f.name).toLowerCase().replace(/"/g,'')}">
      <td class="name">${it.name}${it.classics?`<small>${it.classics}</small>`:''}</td><td class="mode">${it.mode}</td>
      <td class="ess">${it.essentials}<i>teaches: ${it.teaches}</i></td><td class="tier">${it.tier}</td>
      <td class="badge">${CARDS[it.id]?'<span>card</span>':''}</td></tr>`).join('')}</table></div>`).join('');
  app.innerHTML = `
    <div class="titleblock"><div><h1>Synth Templates</h1><div class="sub">A catalog of base presets that teach synthesis. Pick one that has a card to see its sheet and play it at its default settings.</div></div>
    <div class="cell">STUDY · 2026-11-02<br>${CATALOG.families.reduce((n,f)=>n+f.items.length,0)} TEMPLATES · ${NCARDS} CARDS</div></div>
    <div class="toolbar"><input type="search" id="q" placeholder="search" value="${q}"><button class="btn ${onlyCards?'on':''}" id="onlycards">With cards</button><button class="btn" id="exportrev">Export reviews</button><span id="revmsg" style="font-size:12px;color:var(--ok)"></span><span class="count" id="count"></span></div>
    ${fams}
    <div class="foot"><div>Synth Templates · workshop</div><div>Drafting Table · Paper</div><div>built from cards/*.yaml</div></div>`;
  document.getElementById('q').addEventListener('input', e => { q = e.target.value.toLowerCase(); filter(); });
  document.getElementById('exportrev').addEventListener('click', exportReviews);
  document.getElementById('onlycards').addEventListener('click', e => { onlyCards = !onlyCards; e.target.classList.toggle('on', onlyCards); filter(); });
  document.querySelectorAll('tr.item.has').forEach(tr => tr.addEventListener('click', () => location.hash = '#/card/' + tr.dataset.id));

  if (!mono && notes.length > 1){                 // chord: once soft and once hard if two velocity sets, else once
    const passes = vels.length > notes.length ? 2 : 1;
    for (let p = 0; p < passes; p++){ const t = t0 + p * 2 * beat * 2; notes.forEach((n, i) => { noteOn(c, n, vels[p * notes.length + i] ?? vels[0], 'd' + p + '-' + i, t); noteOff('d' + p + '-' + i, t + beat * 3.5); }); }
  } else if (drum || notes.length === 1){        // one note: four hits on the beat
    for (let i = 0; i < 4; i++){ const t = t0 + i * beat; noteOn(c, notes[0], vels[i % vels.length], 'd' + i, t); noteOff('d' + i, t + beat * 0.5); }
  } else {                                        // mono line: sixteenths, a note that repeats its predecessor's pitch is tied (slide)
    const step = beat / 4; let prev = null;
    notes.forEach((n, i) => { const t = t0 + i * step; const tied = /tied|slide/.test(r.pattern || '') && i > 0 && (i === 2 || i === 4);
      if (!tied) { if (prev) noteOff(prev, t - 0.01); noteOn(c, n, vels[i % vels.length], 'd' + i, t); prev = 'd' + i; }
      else { const v = voices.get(prev); if (v){ const B = c.graph.blocks; const glide = word('glide', (c.taste||[]).find(x=>x.block==='osc1'&&x.param==='glide')?.default || 'short', 0.06); for (const [slot, s] of Object.entries(v.sources)) for (const o of s.freqParams){ const hz = noteToHz(n) * Math.pow(2, B[slot].octave || 0) * (s.ratio || 1); o.frequency.setValueAtTime(o.frequency.value, t); o.frequency.exponentialRampToValueAtTime(hz, t + glide); } } } });
    if (prev) noteOff(prev, t0 + notes.length * step);
  }
}
route();
</script>
