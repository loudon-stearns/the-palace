<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synth Templates</title>
<style>
:root{--ground-000:#f0eee5;--ground-100:#e6e3d7;--ground-200:#dcd9ca;--ink:#1a1916;--ink-2:#3a3a35;--ink-3:#6a6862;--ink-bright:#000;--rule:#b8b09a;--rule-soft:#cfc9b6;--slab-face:#d8d4c6;--slab-light:#ebe8dd;--slab-shade:#b9b4a3;--accent:#c8261a;--on-accent:#f0eee5;--datasheet:#2b5fb0;--assumed:#a8730a;--ok:#3a7d2c}
*{box-sizing:border-box}
body{margin:0;background:var(--ground-000);color:var(--ink);font:15px/22px 'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,Consolas,monospace}
a{color:var(--datasheet);text-decoration:none}
.sheet{max-width:1200px;margin:24px auto;padding:0 16px}
.frame{border:2px solid var(--rule);background:var(--ground-000)}
.titleblock{display:grid;grid-template-columns:1fr auto;border-bottom:2px solid var(--rule)}
.titleblock>div{padding:12px}
.titleblock .cell{border-left:1px solid var(--rule);font-size:11px;line-height:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;text-align:right}
h1{font-size:22px;line-height:26px;font-weight:600;letter-spacing:.04em;margin:0;text-transform:uppercase}
h2{font-size:18px;line-height:24px;font-weight:600;letter-spacing:.04em;margin:0;text-transform:uppercase}
h3{font-size:11px;line-height:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px;font-weight:500}
.sub{font-size:13px;line-height:18px;color:var(--ink-2);margin-top:4px}
.btn{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--ink);background:var(--slab-face);color:var(--ink);border-radius:0;cursor:pointer;box-shadow:inset 0 1px 0 var(--slab-light),0 1px 0 var(--slab-shade)}
.btn:active{box-shadow:none;transform:translateY(1px)}
.btn.primary{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--ink);color:var(--on-accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--rule)}
.toolbar input[type=search]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--rule);background:var(--ground-100);color:var(--ink);border-radius:0;min-width:220px}
.count{margin-left:auto;font-size:12px;color:var(--ink-2)}
/* catalog */
.fam{border-bottom:1px solid var(--rule)}
.famhead{display:flex;gap:12px;align-items:baseline;padding:10px 12px;background:var(--ground-100);border-bottom:1px solid var(--rule-soft)}
.famhead .note{font-size:13px;color:var(--ink-2);flex:1}
.famhead .n{font-size:12px;color:var(--ink-3);white-space:nowrap}
table{width:100%;border-collapse:collapse}
tr.item{border-top:1px solid var(--rule-soft)}
tr.item.hide{display:none}
tr.item.has{cursor:pointer}
tr.item.has:hover{background:var(--ground-100)}
td{padding:6px 10px;vertical-align:top;font-size:13px;line-height:18px}
td.name{width:240px;font-weight:600;color:var(--ink-bright)}
tr.item:not(.has) td.name{color:var(--ink-3);font-weight:500}
td.name small{display:block;font-weight:400;color:var(--datasheet);font-size:11px}
td.mode{width:100px;color:var(--ink-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td.ess{color:var(--ink)}
tr.item:not(.has) td.ess{color:var(--ink-3)}
td.ess i{display:block;font-style:normal;color:var(--ink-2);font-size:12px}
td.tier{width:40px;text-align:center;color:var(--assumed);font-weight:600}
td.badge{width:70px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
td.badge span{border:1px solid var(--ok);color:var(--ok);padding:1px 5px}
/* card page */
.cardhead{display:grid;grid-template-columns:1fr auto;border-bottom:2px solid var(--rule)}
.cardhead>div{padding:12px}
.crumb{font-size:12px;color:var(--ink-2);margin-bottom:4px}
.play{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--rule);background:var(--ground-100)}
.play .hint{font-size:12px;color:var(--ink-2)}
.keys{display:flex;gap:2px;padding:12px;border-bottom:1px solid var(--rule);align-items:flex-end}
.key{width:34px;height:70px;border:1px solid var(--ink);background:var(--slab-face);box-shadow:inset 0 1px 0 var(--slab-light),0 1px 0 var(--slab-shade);cursor:pointer;font-size:10px;color:var(--ink-2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;user-select:none}
.key.black{background:var(--ink);color:var(--ground-100);height:48px;width:28px;margin:0 -15px;z-index:1;position:relative}
.key.down{background:var(--accent);color:var(--on-accent)}
.diagram{padding:12px;border-bottom:1px solid var(--rule);background:#f0eee5}
.sheet-svg{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0}
.two>div{padding:12px}
.two>div+div{border-left:1px solid var(--rule)}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{padding:4px 6px;border-top:1px solid var(--rule-soft);vertical-align:top}
.kv td.k{color:var(--ink-2);width:150px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:6px}
.kv td.v{font-weight:600;color:var(--ink-bright);width:170px}
.kv.taste td.v{color:var(--assumed)}
.kv td.w{color:var(--ink-2)}
.listen{padding:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.listen p{margin:4px 0 10px}
.listen textarea{width:100%;min-height:90px;font:13px/18px inherit;font-family:inherit;background:var(--ground-100);color:var(--ink);border:1px solid var(--rule);border-radius:0;padding:8px}
.meta{padding:12px;font-size:12px;color:var(--ink-2)}
.meta b{color:var(--ink)}
.foot{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--rule);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.foot div{padding:8px 12px;border-left:1px solid var(--rule)}
.foot div:first-child{border-left:0}
.assumed{color:var(--assumed)}
.btn.assumedtab{border-color:var(--assumed);color:var(--assumed)}
.vtable td{padding:6px 10px;border-top:1px solid var(--rule-soft);vertical-align:middle;font-size:13px}
.vtable td.vw{width:180px;font-weight:600;color:var(--ink-bright)}
.vtable td.vs input{width:100%;accent-color:var(--accent)}
.vtable td.vv{width:110px;text-align:right;color:var(--ink-2);font-size:12px;white-space:nowrap}
.vtable td.vp{width:90px;text-align:right}
.export textarea{width:100%;height:120px;font:12px/16px inherit;font-family:inherit;background:var(--ground-100);color:var(--ink);border:1px solid var(--rule);border-radius:0;padding:8px}
@media(max-width:760px){.two{grid-template-columns:1fr}.two>div+div{border-left:0;border-top:1px solid var(--rule)}td.mode,td.tier{display:none}.foot{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sheet"><div class="frame" id="app"></div></div>
<script>
const CATALOG = {"title": "Synth Templates \u2014 catalog of candidates", "born": "2026-10-29", "families": [{"name": "Bass", "note": "The low end. Mono almost always; the filter envelope and the decay shape are the whole character.", "items": [{"id": "sub-bass", "name": "Sub Bass", "mode": "mono", "essentials": "Sine (or triangle), no filter, instant attack, held sustain, short release. One octave down.", "teaches": "Pure fundamental; why sub needs no harmonics", "tier": 1, "classics": "any 808 sub", "concepts": ["Sine: no response to filtering; FM/additive building block"]}, {"id": "808-bass", "name": "808 Bass", "mode": "mono", "essentials": "Sine, pitch envelope drops ~1 octave in 20\u201360 ms, long amp decay (1\u20133 s), light saturation for upper harmonics.", "teaches": "Pitch envelope as punch; decay as length", "tier": 1, "classics": "TR-808 kick-as-bass", "concepts": []}, {"id": "house-bass", "name": "House Bass", "mode": "mono", "essentials": "Square (or pulse) + sub, resonant LPF, filter env: instant attack, short decay, zero sustain. Amp: fast attack, medium decay.", "teaches": "Percussive filter envelope; the pluck is in the filter not the amp", "tier": 1, "classics": "classic Chicago / French house", "concepts": ["Subtractive: rich wave then filter", "Envelope \u2192 filter cutoff (bite; auto-wah with long attack)"]}, {"id": "acid-bass", "name": "Acid Bass", "mode": "mono legato", "essentials": "Saw or square, high-resonance LPF (~18 dB/oct), filter env decay 100\u2013300 ms, env amount high, accent = more env, slide = glide on tied notes.", "teaches": "Resonance + envelope depth; accent and slide as performance", "tier": 2, "classics": "TB-303", "concepts": []}, {"id": "moog-bass", "name": "Moog Bass", "mode": "mono", "essentials": "Saw + square an octave apart, 24 dB ladder LPF, cutoff lowish, filter env short decay, slight drive.", "teaches": "Two-osc stacking; ladder filter slope; drive", "tier": 1, "classics": "Minimoog", "concepts": ["Combining waveforms: square + saw octave up (zipper)", "Filter models and their distortion (sine test)"]}, {"id": "reese-bass", "name": "Reese Bass", "mode": "mono", "essentials": "Two saws detuned 10\u201330 cents, little or no filter movement, the beat frequency is the sound. Often chorus or phaser later.", "teaches": "Detune as motion; beating", "tier": 1, "classics": "Reese Project / jungle, DnB", "concepts": ["Small detune (\u22647 cents) = chorus"]}, {"id": "wobble-bass", "name": "Wobble Bass", "mode": "mono", "essentials": "Saw or square, LPF with LFO on cutoff synced to tempo (1/4\u20131/16), high resonance, distortion after.", "teaches": "LFO as rhythmic modulation; tempo sync", "tier": 2, "classics": "dubstep", "concepts": ["Tempo sync; triplets"]}, {"id": "neuro-bass", "name": "Neuro Bass", "mode": "mono", "essentials": "FM or wavetable with heavy saturation, resampled and re-filtered; movement from several slow LFOs on different targets.", "teaches": "Layered modulation; resampling as a technique", "tier": 3, "classics": "neurofunk DnB", "concepts": []}, {"id": "fm-bass", "name": "FM Bass", "mode": "mono", "essentials": "Two operators 1:1, modulator index with a short envelope, carrier sine, no filter.", "teaches": "FM index envelope as timbral pluck", "tier": 2, "classics": "DX7 'Bass 1'", "concepts": []}, {"id": "pluck-bass", "name": "Pluck Bass", "mode": "mono", "essentials": "Saw, LPF, filter env very short decay, amp env short too; velocity \u2192 filter.", "teaches": "Shortest envelopes; velocity routing", "tier": 1, "classics": "", "concepts": []}, {"id": "synthwave-bass", "name": "Synthwave Bass", "mode": "mono", "essentials": "Square, LPF closed-ish, amp env short decay no sustain, sequenced 16ths, slight chorus.", "teaches": "Gated sequences; pulse body", "tier": 1, "classics": "outrun", "concepts": []}, {"id": "pwm-bass", "name": "PWM Bass", "mode": "mono", "essentials": "Pulse with LFO on width (slow), LPF, held notes.", "teaches": "Pulse-width modulation", "tier": 2, "classics": "SH-101", "concepts": ["Pulse width, static and modulated"]}, {"id": "sync-bass", "name": "Sync Bass", "mode": "mono", "essentials": "Osc2 hard-synced to osc1, env sweeps osc2 pitch, LPF open.", "teaches": "Hard sync; the sync sweep", "tier": 2, "classics": "", "concepts": []}, {"id": "growl-bass", "name": "Growl Bass", "mode": "mono", "essentials": "Saw into a formant or band-pass with LFO/env on vowel position, drive.", "teaches": "Formant filtering; vowel movement", "tier": 3, "classics": "", "concepts": []}, {"id": "donk", "name": "Donk", "mode": "mono", "essentials": "Sine or triangle with a pitch env (fast drop), very short decay, hard; plus a filter ping.", "teaches": "Pitch env + decay = 'donk'", "tier": 2, "classics": "UK bounce", "concepts": []}, {"id": "hoover-bass", "name": "Hoover Bass", "mode": "mono", "essentials": "Detuned saws with pitch sweep down into the note, PWM-ish, chorus. The hoover in the bass register.", "teaches": "Pitch sweep; detune stack", "tier": 2, "classics": "Mentasm / Alpha Juno", "concepts": []}, {"id": "organ-bass", "name": "Organ Bass", "mode": "mono", "essentials": "Sine + 1 octave up + 1 fifth up (3 drawbars), no filter, instant envelopes.", "teaches": "Additive stacking by partials", "tier": 2, "classics": "Hammond pedals", "concepts": []}, {"id": "saturated-bass", "name": "Saturated Bass", "mode": "mono", "essentials": "Saw, LPF, mild filter env, then distortion/overdrive to fill the mid.", "teaches": "Saturation as harmonic generator", "tier": 2, "classics": "", "concepts": ["Drive: by velocity, by envelope; serial filter after"]}, {"id": "layered-sub-tone", "name": "Layered Sub + Tone", "mode": "mono", "essentials": "Layer A: sub sine. Layer B: saw/square LPF with the character, high-passed at ~80 Hz.", "teaches": "Layering; splitting a sound by frequency band", "tier": 2, "classics": "deep house", "concepts": []}, {"id": "portamento-bass", "name": "Portamento Bass", "mode": "mono legato", "essentials": "Saw, LPF, glide 50\u2013150 ms on legato notes only.", "teaches": "Legato glide; mono voice priority", "tier": 1, "classics": "", "concepts": ["Glide / portamento time; legato mode as default"]}, {"id": "triangle-chip-bass", "name": "Triangle Chip Bass", "mode": "mono", "essentials": "Triangle wave, no filter, instant envelopes.", "teaches": "Chiptune constraints", "tier": 1, "classics": "NES", "concepts": ["Triangle as a filtered square"]}, {"id": "square-sub-techno-bass", "name": "Square-Sub Techno Bass", "mode": "mono", "essentials": "Square, LPF low cutoff, short amp decay, sidechained; the sound is the hole the kick leaves.", "teaches": "Sidechain as envelope", "tier": 2, "classics": "techno", "concepts": []}]}, {"name": "Leads", "note": "A single voice meant to be heard as a line. Mono with glide, or poly for stacks.", "items": [{"id": "saw-lead", "name": "Saw Lead", "mode": "mono legato", "essentials": "Saw, LPF mostly open, modest filter env, vibrato by mod wheel, glide short.", "teaches": "The default lead; mod-wheel vibrato", "tier": 1, "classics": "", "concepts": ["Subtractive: rich wave then filter"]}, {"id": "square-lead", "name": "Square Lead", "mode": "mono", "essentials": "Square, no or light LPF, vibrato LFO delayed by ~300 ms.", "teaches": "Delayed vibrato; hollow odd-harmonic timbre", "tier": 1, "classics": "chiptune / Jan Hammer", "concepts": []}, {"id": "pwm-lead", "name": "PWM Lead", "mode": "mono", "essentials": "Pulse with slow LFO on width, LPF, chorus-like thickness from one osc.", "teaches": "PWM", "tier": 2, "classics": "SH-101 / Juno", "concepts": ["Pulse width, static and modulated"]}, {"id": "sync-lead", "name": "Sync Lead", "mode": "mono", "essentials": "Hard sync, osc2 pitch swept by env or wheel; aggressive, formant-like.", "teaches": "Hard sync as a timbral control", "tier": 2, "classics": "Cars 'Let's Go', Prophet-5", "concepts": []}, {"id": "supersaw-lead", "name": "Supersaw Lead", "mode": "poly", "essentials": "7 saws detuned \u00b120\u201340 cents, LPF, mild filter env, big reverb.", "teaches": "Unison and detune spread", "tier": 1, "classics": "JP-8000 trance", "concepts": ["Unison / unisono"]}, {"id": "hoover", "name": "Hoover", "mode": "poly or mono", "essentials": "Detuned saws + PWM, pitch envelope sweeps down into the note, chorus.", "teaches": "Pitch env sweep + detune", "tier": 2, "classics": "Alpha Juno 'What the'", "concepts": []}, {"id": "trance-pluck", "name": "Trance Pluck", "mode": "poly", "essentials": "Saw, LPF, filter env fast decay, delay + reverb; sequenced.", "teaches": "Pluck + delay as rhythm", "tier": 1, "classics": "", "concepts": []}, {"id": "fm-bright-lead", "name": "FM Bright Lead", "mode": "mono", "essentials": "Carrier sine, modulator 2:1 or 3:1, high index with slow decay.", "teaches": "FM ratio and index", "tier": 2, "classics": "DX7", "concepts": []}, {"id": "sine-lead", "name": "Sine Lead", "mode": "mono legato", "essentials": "Sine with vibrato and glide; theremin-like.", "teaches": "Expression with no timbre: pitch and amp only", "tier": 1, "classics": "theremin / 'Flim'", "concepts": ["Sine: no response to filtering; FM/additive building block"]}, {"id": "flute-lead", "name": "Flute Lead", "mode": "mono", "essentials": "Sine or triangle + breath noise on attack, slow vibrato, soft attack ~30 ms.", "teaches": "Noise as attack transient", "tier": 2, "classics": "", "concepts": []}, {"id": "brass-lead", "name": "Brass Lead", "mode": "mono", "essentials": "Saw, LPF, filter env with attack ~50 ms (the 'blat'), slight detune.", "teaches": "Filter attack as brass", "tier": 1, "classics": "Prophet / Oberheim", "concepts": ["Envelope \u2192 filter cutoff (bite; auto-wah with long attack)"]}, {"id": "distorted-lead", "name": "Distorted Lead", "mode": "mono", "essentials": "Saw or square, LPF, drive/distortion, feedback delay.", "teaches": "Distortion in the signal chain", "tier": 2, "classics": "", "concepts": ["Distortion: nonlinear, harmonic, compresses dynamics, tames resonance"]}, {"id": "acid-lead", "name": "Acid Lead", "mode": "mono legato", "essentials": "The acid bass played high: saw, high res, env mod, slide.", "teaches": "Same patch, different register", "tier": 1, "classics": "TB-303", "concepts": []}, {"id": "screech-lead", "name": "Screech Lead", "mode": "mono", "essentials": "Square or saw, high resonance near self-oscillation, filter env, pitch bend.", "teaches": "Filter at the edge of self-oscillation", "tier": 2, "classics": "", "concepts": ["Resonance: boost at cutoff; self-oscillation"]}, {"id": "whistle", "name": "Whistle", "mode": "mono", "essentials": "Sine, fast vibrato, soft attack, HPF removes body.", "teaches": "Pure tone with vibrato", "tier": 1, "classics": "", "concepts": []}, {"id": "ring-mod-lead", "name": "Ring-Mod Lead", "mode": "mono", "essentials": "Two oscs through a ring modulator, inharmonic; env on osc2 pitch.", "teaches": "Ring modulation", "tier": 3, "classics": "", "concepts": []}, {"id": "vocal-formant-lead", "name": "Vocal / Formant Lead", "mode": "mono", "essentials": "Saw into 2\u20133 band-passes at vowel formants; wheel moves the vowel.", "teaches": "Formants", "tier": 3, "classics": "", "concepts": ["Narrow pulse \u2192 nasal / vocal, with formant filter"]}, {"id": "dub-siren", "name": "Dub Siren", "mode": "mono", "essentials": "Square or saw, LFO on pitch (fast-ish), spring reverb and delay.", "teaches": "LFO \u2192 pitch at audio-adjacent rate", "tier": 1, "classics": "", "concepts": []}, {"id": "chip-arp-lead", "name": "Chip Arp Lead", "mode": "mono", "essentials": "Pulse 25%, arpeggiator at 1/32 across a chord, no filter.", "teaches": "Arpeggiators; pulse widths", "tier": 1, "classics": "C64 SID", "concepts": []}, {"id": "soft-lead", "name": "Soft Lead", "mode": "poly", "essentials": "Triangle + sine, LPF, slow attack, chorus.", "teaches": "Gentle timbres; triangle as a soft saw", "tier": 1, "classics": "", "concepts": ["Triangle as a filtered square"]}, {"id": "wavetable-scan-lead", "name": "Wavetable Scan Lead", "mode": "mono", "essentials": "Wavetable osc, env or LFO scans table position, LPF.", "teaches": "Wavetable position as a timbre axis", "tier": 2, "classics": "", "concepts": []}, {"id": "phase-distortion-lead", "name": "Phase-Distortion Lead", "mode": "mono", "essentials": "PD osc (CZ-style), env on distortion amount.", "teaches": "Phase distortion as a filter substitute", "tier": 3, "classics": "Casio CZ", "concepts": []}]}, {"name": "Pads", "note": "Slow attack, long release, movement. Poly; the modulation is the sound.", "items": [{"id": "supersaw-pad", "name": "Supersaw Pad", "mode": "poly", "essentials": "Detuned saw stack, LPF half open, attack ~500 ms, release ~1.5 s, reverb.", "teaches": "Unison + slow envelopes", "tier": 1, "classics": "trance", "concepts": []}, {"id": "warm-analog-pad", "name": "Warm Analog Pad", "mode": "poly", "essentials": "Two saws slightly detuned, LPF ~1 kHz, slow filter env, chorus.", "teaches": "Slow filter envelope; chorus", "tier": 1, "classics": "Juno-106", "concepts": []}, {"id": "string-machine", "name": "String Machine", "mode": "poly", "essentials": "Saw, no filter envelope, ensemble/chorus heavy, medium attack.", "teaches": "Ensemble effect as the timbre", "tier": 1, "classics": "Solina / ARP String Ensemble", "concepts": ["Chorus: multiple delays, own LFOs, no feedback"]}, {"id": "evolving-pad", "name": "Evolving Pad", "mode": "poly", "essentials": "Wavetable with slow LFO on position, second LFO on filter, long attack.", "teaches": "Slow multi-LFO movement", "tier": 2, "classics": "", "concepts": []}, {"id": "choir-pad", "name": "Choir Pad", "mode": "poly", "essentials": "Saw/pulse into formant 'ah', chorus, slow attack.", "teaches": "Formants on a pad", "tier": 3, "classics": "", "concepts": []}, {"id": "glass-bell-pad", "name": "Glass / Bell Pad", "mode": "poly", "essentials": "FM 1:3.5 or additive with soft attack, long release, reverb.", "teaches": "Inharmonic FM in a pad", "tier": 2, "classics": "", "concepts": []}, {"id": "dark-pad", "name": "Dark Pad", "mode": "poly", "essentials": "Square, LPF low, no filter env, slow attack.", "teaches": "Hollow low timbre", "tier": 1, "classics": "", "concepts": []}, {"id": "pwm-pad", "name": "PWM Pad", "mode": "poly", "essentials": "Pulse with LFO on width, chorus, slow envelopes.", "teaches": "PWM on a pad", "tier": 2, "classics": "Juno", "concepts": ["Pulse width, static and modulated"]}, {"id": "sweep-pad", "name": "Sweep Pad", "mode": "poly", "essentials": "Saw, LPF with very slow filter env (attack 3\u20138 s), resonance moderate.", "teaches": "Filter envelope as the arc of a note", "tier": 1, "classics": "", "concepts": []}, {"id": "drone", "name": "Drone", "mode": "poly or mono", "essentials": "Several detuned oscs, no envelope (gate held), slow random modulation.", "teaches": "Sustained sound; S&H / random mod", "tier": 2, "classics": "", "concepts": []}, {"id": "granular-pad", "name": "Granular Pad", "mode": "poly", "essentials": "Granular engine on a sample, long grains, random position.", "teaches": "Granular basics", "tier": 3, "classics": "", "concepts": []}, {"id": "shimmer-pad", "name": "Shimmer Pad", "mode": "poly", "essentials": "Simple pad into pitch-shifted (+12) feedback reverb.", "teaches": "Effects as synthesis", "tier": 2, "classics": "Eno / Lanois", "concepts": []}, {"id": "brass-pad", "name": "Brass Pad", "mode": "poly", "essentials": "Saws, LPF, filter env attack ~100 ms, release medium.", "teaches": "Brass-style filter attack, polyphonic", "tier": 1, "classics": "Jupiter-8", "concepts": []}, {"id": "noise-wash", "name": "Noise Wash", "mode": "poly", "essentials": "White/pink noise, band-pass with LFO on center, slow envelopes.", "teaches": "Noise as a pad; band-pass sweep", "tier": 1, "classics": "", "concepts": ["Noise colors: white vs pink"]}, {"id": "vocal-pad", "name": "Vocal Pad", "mode": "poly", "essentials": "Formant-filtered saw, chorus, LFO on v const VTABLES = {

  time_linear: { title: 'Time · envelope stages · LINEAR curve (the second test)', what: 'The same words on straight-line ramps, kept beside the Moog table so the two can be sat and compared. Your attack sitting of 2026-11-02 lives here, since the voice was linear then.', range: [0.001, 5], log: true, unit: 's', modes: { attack: 'As attack: a straight rise to full over this time while you hold; quick stop on release.', decay: 'As decay: instant attack, then a straight fall to silence over this time.', release: 'As release: instant attack, full while you hold, then a straight fade over this time when you let go.' } },

  cutoff:      { title: 'Cutoff frequency · resting low-pass', what: 'Where the low-pass sits at rest, in hertz at middle C (half keytracking elsewhere). The demo holds a saw at C3 through a 24 dB low-pass at this frequency.', range: [40, 16000], log: true, unit: 'Hz' },
  resonance:   { title: 'Resonance · filter Q', what: 'The boost at the cutoff. The demo sweeps a 24 dB low-pass slowly down through a saw at this Q.', range: [0.5, 40], log: true, unit: 'Q' },
  amount:      { title: 'Envelope amount · octaves of filter sweep', what: 'How far the filter envelope opens the cutoff above its resting point, in octaves. The demo plucks a saw: cutoff dark, instant attack, medium decay, this amount.', range: [0, 7], log: false, unit: 'oct' },
  pitch_amount:{ title: 'Pitch envelope amount · cents', what: 'How far a pitch envelope starts above the note. The demo is a kick-shaped sine: this many cents, falling over a short decay.', range: [0, 3600], log: false, unit: 'c' },
  detune:      { title: 'Detune · unison spread in cents', what: 'The total spread of a seven-voice saw stack. The demo holds the stack at C3.', range: [0, 120], log: false, unit: 'c' },
  rate:        { title: 'Rate · LFO speed', what: 'LFO frequency in hertz. The demo puts a triangle LFO at this rate on the cutoff of a held saw.', range: [0.03, 30], log: true, unit: 'Hz' },
  glide:       { title: 'Glide time · portamento', what: 'Seconds to slide from one note to the next. The demo plays C2 then slides to G2 in this time.', range: [0, 1.5], log: false, unit: 's' },
  drive:       { title: 'Drive · saturation amount', what: '0 to 1 into a soft clipper. The demo holds a saw through it.', range: [0, 1], log: false, unit: '' },
  fm_index:    { title: 'FM index · modulator level', what: 'Modulation depth as a multiple of the modulator frequency (1:1 ratio). The demo plays a sine carrier at C3 with this index.', range: [0, 15], log: false, unit: '' },
  reverb:      { title: 'Reverb · decay seconds', what: 'The tail length. The demo plucks a saw into a reverb of this size.', range: [0.2, 10], log: true, unit: 's' },

let vtab = 'time'; let vmode = { time: 'attack', time_linear: 'attack' };
function fmtNum(v, t){ if (v === null || v === undefined) return '—'; const r = VTABLES[t]; if (!r) return v; if (r.unit === 'Hz') return v >= 1000 ? (v/1000).toFixed(2)+' kHz' : (v < 1 ? v.toFixed(2) : Math.round(v)) + ' Hz'; if (r.unit === 's') return v < 0.1 ? Math.round(v*1000)+' ms' : v.toFixed(2)+' s'; if (r.unit === 'c') return Math.round(v)+' c'; return (+v).toFixed(2); }
function toSlider(v, r){ const [a,b] = r.range; if (r.log) return (Math.log(Math.max(v, a)) - Math.log(a)) / (Math.log(b) - Math.log(a)) * 1000; return (v - a) / (b - a) * 1000; }
function fromSlider(x, r){ const [a,b] = r.range; if (r.log) return Math.exp(Math.log(a) + x/1000 * (Math.log(b) - Math.log(a))); return a + x/1000 * (b - a); }

function vocabYaml(){
  const today = new Date().toISOString().slice(0,10);
  let y = `# Synth Templates — range vocabulary, exported from the site ${today}\n# A table marked HEARD was sat by ear on the site's reference voice; a table marked ASSUMED still carries numbers set by reasoning.\n`;

  return y;
}
// ---------- rung demos: a plain patch that exposes one word, played like a key ----------
// hearOn(table, word) starts the note (attack phase) and returns a handle; handle.off() lifts the key (release phase).
let demoNodes = [];      // nodes of the demo being built
let activeDemos = [];    // every demo still sounding, released or not; Stop reaches them all
function demoGraph(){ const ac = audio(); const g = ac.createGain(); g.gain.value = 0.5; g.connect(master); demoNodes.push(g); return { ac, out: g }; }
function saw(ac, hz, t, type){ const o = ac.createOscillator(); o.type = type || 'sawtooth'; o.frequency.value = hz; o.start(t); demoNodes.push(o); return o; }
function lp(ac, hz, q, poles){ const stages = []; for (let i = 0; i < (poles||2); i++){ const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = hz; f.Q.value = i ? 0.7 : q; stages.push(f); demoNodes.push(f); } for (let i = 1; i < stages.length; i++) stages[i-1].connect(stages[i]); return { input: stages[0], output: stages[stages.length-1], stages }; }
// two curves: 'moog' — each stage an exponential approach, time = 95% point (tau = T/3); 'linear' — straight ramps
function gateOn(param, t, a, d, s, peak, curve){ param.setValueAtTime(0, t);
  if (curve === 'linear'){ param.linearRampToValueAtTime(peak, t + a); param.linearRampToValueAtTime(peak * s, t + a + d); }
  else { param.setTargetAtTime(peak, t, Math.max(a, 0.0015) / 3); param.setTargetAtTime(peak * s, t + a, Math.max(d, 0.0015) / 3); } }
function gateOff(param, t, r, curve){ if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t); else param.cancelScheduledValues(t);
  if (curve === 'linear'){ param.linearRampToValueAtTime(0, t + Math.max(r, 0.005)); } else { param.setTargetAtTime(0, t, Math.max(r, 0.01) / 3); } }
function finishDemo(d, t){ for (const n of d.nodes){ try { if (n.stop) n.stop(t); } catch(e){} } setTimeout(() => { for (const n of d.nodes){ try { n.disconnect(); } catch(e){} } activeDemos = activeDemos.filter(x => x !== d); }, Math.max(0, (t - ctx.currentTime) * 1000) + 300); }
function stopDemosNow(){ if (!ctx) return; const now = ctx.currentTime; for (const d of activeDemos){ for (const n of d.nodes){ try { if (n.stop) n.stop(now); } catch(e){} } } const gone = activeDemos; activeDemos = []; setTimeout(() => { for (const d of gone) for (const n of d.nodes){ try { n.disconnect(); } catch(e){} } }, 50); for (const n of demoNodes){ try { if (n.stop) n.stop(now); n.disconnect(); } catch(e){} } demoNodes = []; }
function hearOn(table, w, when){
  const v = VOCAB[table][w]; if (v === null) return null;
  const { ac, out } = demoGraph(); const t = when ?? ac.currentTime + 0.02; const C3 = noteToHz(48), C2 = noteToHz(36);
  const g = ac.createGain(); g.connect(out); demoNodes.push(g);
  let a = 0.005, d = 0.001, s = 1, r = 0.08, peak = 0.6, tail = 0;   // the plain shape; each table changes one thing
  const curve = table === 'time_linear' ? 'linear' : 'moog';
  if (table === 'time' || table === 'time_linear'){ const o = saw(ac, C3, t); const f = lp(ac, 2500, 0.7); o.connect(f.input); f.output.connect(g); const m = vmode[table] || 'attack';
    if (m === 'attack') a = v; else if (m === 'decay') { a = 0.002; d = v; s = 0; } else { a = 0.002; r = v; } }
  else if (table === 'level'){ const o = saw(ac, C3, t); const f = lp(ac, 1500, 0.7); o.connect(f.input); f.output.connect(g); peak = 0.6 * v; }
  else if (table === 'cutoff'){ const o = saw(ac, C3, t); const f = lp(ac, v, 1.0); o.connect(f.input); f.output.connect(g); }
  else if (table === 'resonance'){ const o = saw(ac, C2, t); const f = lp(ac, 4000, v); o.connect(f.input); f.output.connect(g); peak = 0.4 / Math.sqrt(Math.max(v, 1));
    f.stages.forEach(st => { st.frequency.setValueAtTime(4000, t); st.frequency.exponentialRampToValueAtTime(150, t + 2.5); }); }
  else if (table === 'amount'){ const o = saw(ac, C2, t); const f = lp(ac, 300, 3); o.connect(f.input); f.output.connect(g); a = 0.003; s = 0.6; d = 0.4;
    f.stages.forEach(st => { st.frequency.setValueAtTime(300, t); st.frequency.exponentialRampToValueAtTime(Math.min(300 * Math.pow(2, v), 18000), t + 0.005); st.frequency.exponentialRampToValueAtTime(300, t + 0.4); }); }
  else if (table === 'pitch_amount'){ const o = saw(ac, noteToHz(33), t, 'sine'); o.connect(g); o.detune.setValueAtTime(v, t); o.detune.linearRampToValueAtTime(0, t + 0.12); a = 0.002; d = 0.6; s = 0; r = 0.3; peak = 0.8; }

function stopAll(){ demoTimers.forEach(clearTimeout); demoTimers = []; if (!ctx) return; stopDemosNow(); const t = ctx.currentTime; for (const v of new Set(voices.values())) voiceOff(v, t); monoVoice = null; heldMono = []; }
function playDemo(c){
  stopAll(); const ac = audio(); const r = c.render || {}; const bpm = r.tempo || 120; const beat = 60 / bpm; const t0 = ac.currentTime + 0.05;
  const notes = (Array.isArray(r.note) ? r.note : [r.note || 'C3']).map(nameToMidi);
  const vels = Array.isArray(r.velocity) ? r.velocity : [r.velocity || 100];
  const mono = /mono/.test(c.mode); const drum = c.family === 'Drums and Percussion';
  if (!mono && notes.length > 1){                 // chord: once soft and once hard if two velocity sets, else once
    const passes = vels.length > notes.length ? 2 : 1;
    for (let p = 0; p < passes; p++){ const t = t0 + p * 2 * beat * 2; notes.forEach((n, i) => { noteOn(c, n, vels[p * notes.length + i] ?? vels[0], 'd' + p + '-' + i, t); noteOff('d' + p + '-' + i, t + beat * 3.5); }); }
  } else if (drum || notes.length === 1){        // one note: four hits on the beat
    for (let i = 0; i < 4; i++){ const t = t0 + i * beat; noteOn(c, notes[0], vels[i % vels.length], 'd' + i, t); noteOff('d' + i, t + beat * 0.5); }
  } else {                                        // mono line: sixteenths, a note that repeats its predecessor's pitch is tied (slide)
    const step = beat / 4; let prev = null;
    notes.forEach((n, i) => { const t = t0 + i * step; const tied = /tied|slide/.test(r.pattern || '') && i > 0 && (i === 2 || i === 4);
      if (!tied) { if (prev) noteOff(prev, t - 0.01); noteOn(c, n, vels[i % vels.length], 'd' + i, t); prev = 'd' + i; }
      else { const v = voices.get(prev); if (v){ const B = c.graph.blocks; const glide = word('glide', (c.taste||[]).find(x=>x.block==='osc1'&&x.param==='glide')?.default || 'short', 0.06); for (const [slot, s] of Object.entries(v.sources)) for (const o of s.freqParams){ const hz = noteToHz(n) * Math.pow(2, B[slot].octave || 0) * (s.ratio || 1); o.frequency.setValueAtTime(o.frequency.value, t); o.frequency.exponentialRampToValueAtTime(hz, t + glide); } } } });
    if (prev) noteOff(prev, t0 + notes.length * step);
  }
}
route();
