# Synth Templates — range vocabulary, draft 0.4. A table marked HEARD was sat by Loudon by ear on the site's vocabulary page; the rest are ASSUMED (numbers set by reasoning). Move 1 of the plan earns them table by table.
# The cards speak in these words. This file says what each word means to the reference voice. One word, one meaning, everywhere.
# Sources for the word list: the archetype registry's perceptual regions (Generative Audio Devices) and Loudon's synthesis notes.
#
# ENVELOPE CURVES — part of the definition of every time word (Loudon, 2026-11-02: "match a classic Moog amp envelope curve").
#   The standard is the Minimoog contour generator's RC shape: the attack is an exponential approach toward the peak (fast at first,
#   slowing as it nears full level), the decay an exponential approach toward the sustain level, the release an exponential approach
#   toward silence. A stage's time T is the time to reach 95% of the way (three time constants: tau = T/3), since an RC charge
#   never quite arrives. A linear curve is kept beside it as a second test, so the same words can be sat on both and compared.
#   Sources: the Minimoog Model D service manual (contour generator, Board 2: RC envelope with variable attack, decay, sustain);
#   AJH MiniMod DH-ADSR manual (circuit identical to the Model D contour generator): the attack "rises in an exponential manner,
#   i.e. more quickly at first and then more slowly as it gets towards maximum level … the DECAY … again follows an exponential curve".
time:            # envelope stages, seconds, on the MOOG curve (the standard) — HEARD as attack 2026-11-02 (Loudon, on the site's Moog-curve voice; time = the 95% point); decay and release roles not yet sat
  instant: 0.001
  fast: 0.00531
  short: 0.0236
  medium: 0.127
  slow: 0.717
  long: 1.23
  very slow: 2.28
  very long: 3.5        # not moved
  gated: 0.05           # not moved
  same as decay: null   # resolved to the decay value
time_linear:     # the same words on a LINEAR curve, the second test — HEARD as attack 2026-11-02 (Loudon; sat when the voice's attack was linear); decay and release roles not yet sat
  instant: 0.00167
  fast: 0.0108
  short: 0.037
  medium: 0.11
  slow: 0.256
  long: 0.974
  very slow: 2.3
  very long: 3.5        # not moved
  gated: 0.05           # not moved
  same as decay: null
level:           # 0–1 linear gain, also sustain levels
  zero: 0.0
  'off': 0.0            # quoted: bare off/on/yes/no are booleans to YAML
  little: 0.2
  quarter: 0.25
  low: 0.3
  half: 0.5
  held: 0.7
  under unity: 0.8
  headroom: 0.8
  equal: 1.0
  equal to osc1: 1.0
  full: 1.0
  unity: 1.0
cutoff:          # low-pass resting cutoff, Hz, at middle C; keytracking not yet modelled
  dark: 300
  mid: 1200
  bright: 5000
  open: 12000
resonance:       # biquad Q
  none: 0.7
  clean: 0.7
  little: 1.5
  moderate: 4
  high: 10
  self-oscillating: 25
amount:          # filter-envelope depth in octaves above the resting cutoff; also generic depth 0–1
  none: 0
  little: 0.5
  some: 1
  moderate: 2
  generous: 3.5
  full: 5
  accent: 1.5           # extra octaves an accented note adds
pitch_amount:    # pitch-envelope depth
  a fifth: 700
  about an octave: 1200
  two octaves: 2400
detune:          # unison spread in cents, total across the stack
  none: 0
  slight: 7
  narrow: 12
  wide: 30
  very wide: 50
rate:            # LFO Hz
  very slow: 0.1
  slow: 0.3
  medium: 4.5
  fast: 7
  very fast: 12
glide:           # portamento seconds
  none: 0
  short: 0.06
  medium: 0.15
  long: 0.4
drive:           # waveshaper amount 0–1
  none: 0
  light: 0.25
  heavy: 0.7
fm_index:        # modulator level as index (modulation depth in Hz = index × modulator frequency)
  little: 1
  half: 3
  full: 6
reverb:          # decay seconds
  small: 0.8
  large: 2.5
  huge: 5
