<title>Murmuration — the voice ceiling, in your browser</title>
<!--
  MURMURATION · CEILING TEST. Open this one file in Chrome, Firefox and Safari, press Start,
  and listen. It climbs the flock from 60 birds to 720, holding each size for six seconds
  with the startle on and a strike every rung (the worst case: every bird scans every bird,
  every grain voice sounds). Built by build_ceiling_test.js, which inlines
  engine/murmur_engine.js unchanged, so the grains measured here are the grains the renders
  came from.

  What it measures, per rung:
    audio load   — time spent inside the worklet's process() over the time the block
                   represents (mean and worst block). Over 100% the audio thread cannot
                   keep up and you hear clicks. Timed with performance.now() where the
                   worklet scope has it, else Date.now(): ms ticks, but the mean over
                   hundreds of blocks is still honest; the worst block is then coarse.
    flock        — ms per frame for one flock step + mapping on the page's thread.
    frames       — share of animation frames that came late (> 1.5x the median).
    underruns    — Chrome's AudioContext.playbackStats where it exists; "n/a" elsewhere.
    your ear     — "I heard a click" marks the rung. The ear outranks every number here.
  A rung is clean when mean audio load < 60%, no reported underrun, no click heard, and (on a
  fine clock only) the worst block < 90%. Late frames flag a stuttering picture, not a sound.
  The ceiling is the last clean rung.

  The view: the flock at the current size over the terrain, seen from the air; behind it a
  row of glass columns, one per rung, rising with that rung's audio load toward the red
  ceiling at 100%. No library, no storage, no fetch: it runs sandboxed in the board.
-->

<script type="text/plain" id="engineSrc">const E = (() => { const module = { exports: {} };
// Murmuration — headless twin of Murmuration.html.
//
// The flock (stepFlock / polarization), the boid→grain mapping (pushFlock) and the
// grain voice (the AudioWorklet's process loop) are copied from the page line for line.
// Two deliberate differences, both for repeatability:
//   1. the worklet's Math.random() (grain re-phase "shimmer", initial phases) is a
//      seeded mulberry32 stream separate from the flock's, so the flock's random
//      sequence stays exactly the page's;
//   2. no DynamicsCompressor — renders are level-matched offline instead.
//
// It also holds the AUTHORED cloud: the same 60 grain voices, the same mapping, the
// same per-frame centre and spread as the flock — but each voice wanders on its own
// (independent smooth random jitter) instead of steering by its neighbours. It is the
// hard version of the wager's control: everything a hand-dialed granular synth could
// copy from the flock is copied; only the social coordination is taken away.
"use strict";

const SEED = 7;
const WIDTH = 920, HEIGHT = 520;

const MAX_SPEED = 3, MAX_FORCE = 0.05;

      // the boid sees the predator, or catches it from its most alarmed neighbour (one step
      // weaker per hop, a few frames' reaction time per hop), and fades over about a second.
      // Contagion is topological, as measured in real starlings (Ballerini et al. 2008): a boid
      // watches its 7 nearest flockmates however far away they are, not everyone within a radius.
      // Alarmed boids fly faster, push apart harder, hold the group less, and dodge away from
      // where the alarm is coming from — so the startle travels through the flock as a wave
      // several times faster than any boid, and the regathering afterwards is plain flocking.

      if (aliN > 0) { const [dx, dy] = setMag(aliX / aliN, aliY / aliN, MAX_SPEED); const [sx, sy] = limit(dx - b.vx, dy - b.vy, MAX_FORCE); fx += kAli * w.ali * sx; fy += kAli * w.ali * sy; }

// Circular mean of x/y on the torus + covariance of the wrapped deviations from it,
// plus the speed and radial-velocity statistics the mapping reads.
function cloudStats(boids) {
  let cx = 0, sx = 0, cy = 0, sy = 0;
  for (const b of boids) { const ax = b.x / WIDTH * 2 * Math.PI, ay = b.y / HEIGHT * 2 * Math.PI; cx += Math.cos(ax); sx += Math.sin(ax); cy += Math.cos(ay); sy += Math.sin(ay); }

// standardised space, mapped onto the flock's own centre and covariance every frame.

// = pushFlock() in Murmuration.html, plus the "listening" mapping (P.mapping === "order"):
//   pitch  — the heading circle is the pitch circle (one octave around), so heading
//            agreement (φ) is heard as pitch agreement: aligned → unison, scattered → cluster;
//   grain  — grain length follows each boid's heading persistence (how steady its course
//            has been over the last ~¼ s): a boid held on course by its neighbours plays

  const order = P.mapping === "order";
  if (order && mem && mem.hx === undefined) { mem.hx = new Float64Array(N); mem.hy = new Float64Array(N); for (let i = 0; i < N; i++) { const b = boids[i], m = Math.hypot(b.vx, b.vy) || 1; mem.hx[i] = b.vx / m; mem.hy[i] = b.vy / m; } }
  for (let i = 0; i < N; i++) {
