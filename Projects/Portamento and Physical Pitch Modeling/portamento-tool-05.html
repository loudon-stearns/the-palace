<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PD Portamento - DEBUG MODE</title>
    <meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="Portamento%20and%20Physical%20Pitch%20Modeling%20%E2%80%94%20icon.png">
<style data-furniture="_ops/loudon-live/design-system/controls.css 2026-11-03">
/* The browser's furniture, re-dressed: inlined from _ops/loudon-live/design-system/controls.css on 2026-11-03 (_ops/furniture-fanout/furnish.py).
   In a layer, so every rule this page writes wins. Left out, because the page dresses it: button, field, range. */
@layer furniture {
:where(*) { --fx-bg: #0a0a0f; --fx-bg-elev-1: #12121a; --fx-bg-elev-2: #1a1a28; --fx-bg-elev-3: #22222e; --fx-fg-1: #e8e8f0; --fx-fg-2: #c8c8d8; --fx-fg-3: #8a8aa0; --fx-fg-4: #4a4a5a; --fx-fg-on-accent: #0a0a0f; --fx-border: #4a4a5e; --fx-border-soft: rgba(255,255,255,0.06); --fx-border-hover: rgba(232,184,74,0.55); --fx-accent: #e8b84a; --fx-accent-soft: rgba(232,184,74,0.10); --fx-accent-line: rgba(232,184,74,0.50); --fx-danger: #ff2a2a; --fx-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; --fx-r-xs: 1px; --fx-r-sm: 2px; --fx-r-md: 4px; --fx-r-pill: 999px; --fx-s-1: 4px; --fx-s-2: 8px; --fx-s-3: 12px; --fx-s-4: 16px; --fx-s-5: 20px; --fx-s-6: 24px; --fx-t-fast: 120ms; --fx-ease: cubic-bezier(.4, 0, .2, 1); --fx-lh-normal: 1.5; --fx-t-eyebrow: 11px; --fx-tr-eyebrow: 0.18em; --fx-t-caption: 13px; --fx-shadow-2: inset 0 1px 0 rgba(255,255,255,0.07), 0 6px 16px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.50); --fx-shadow-3: inset 0 1px 0 rgba(255,255,255,0.10), 0 18px 40px -8px rgba(0,0,0,0.70), 0 4px 10px rgba(0,0,0,0.45); }
:root { color-scheme: dark; }
::-webkit-scrollbar {width: 11px; height: 11px;}
::-webkit-scrollbar-track {background: linear-gradient(to right, transparent calc(50% - .5px), var(--fx-border-soft) calc(50% - .5px), var(--fx-border-soft) calc(50% + .5px), transparent calc(50% + .5px));}
::-webkit-scrollbar-track:horizontal {background: linear-gradient(to bottom, transparent calc(50% - .5px), var(--fx-border-soft) calc(50% - .5px), var(--fx-border-soft) calc(50% + .5px), transparent calc(50% + .5px));}
::-webkit-scrollbar-thumb {background: var(--fx-fg-4); border: 0 solid transparent; border-width: 0 2.5px; background-clip: padding-box; border-radius: 0;}
::-webkit-scrollbar-thumb:horizontal {border-width: 2.5px 0;}
::-webkit-scrollbar-thumb:hover {background-color: var(--fx-fg-3);}
::-webkit-scrollbar-thumb:active {background-color: var(--fx-accent);}
::-webkit-scrollbar-corner {background: transparent;}
::-webkit-scrollbar-button {display: none; width: 0; height: 0;}
@supports not selector(::-webkit-scrollbar) {* {scrollbar-width: thin; scrollbar-color: var(--fx-fg-4) transparent;}
*:hover {scrollbar-color: var(--fx-fg-3) transparent;}}
::selection {background: var(--fx-accent); color: var(--fx-fg-on-accent); text-shadow: none;}
:focus {outline: none;}
:focus-visible {outline: 1px solid var(--fx-accent); outline-offset: 2px; border-radius: var(--fx-r-xs);}

* {-webkit-tap-highlight-color: transparent;}
label {user-select: none; -webkit-user-select: none;}
@media (prefers-reduced-motion: reduce) {*, *::before, *::after {animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important;}}
}

<style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            display: flex;
            gap: 20px;
            min-height: 100vh;
        }
        
        .controls {
            width: 250px;
            background: #1a1a1a;
            padding: 20px;
            border: 2px solid #00ff00;
            border-radius: 8px;
            height: fit-content;
        }
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            text-align: center;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        
        h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
        }
        
        .note-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        button {
            background: #1a1a1a;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 12px 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.1s;
        }
        
        button:hover {
            background: #00ff00;
            color: #0a0a0a;
            box-shadow: 0 0 15px #00ff00;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .reset-button {
            background: #1a1a1a;
            color: #ff6600;
            border: 2px solid #ff6600;
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 16px;
        }
        
        .reset-button:hover {
            background: #ff6600;
            color: #0a0a0a;
            box-shadow: 0 0 15px #ff6600;
        }
        
        .pause-button {
            background: #1a1a1a;
            color: #ffff00;
            border: 2px solid #ffff00;
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 16px;
        }
        
        .pause-button:hover {
            background: #ffff00;
            color: #0a0a0a;
            box-shadow: 0 0 15px #ffff00;
        }
        
        .slider-group {
            margin-bottom: 20px;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }
        
        .slider-value {
            color: #00ff00;
            font-weight: bold;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #0a0a0a;
            outline: none;
            border: 1px solid #00ff00;
            border-radius: 3px;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00ff00;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff00;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #00ff00;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 5px #00ff00;
        }
        
        #canvas {
            background: #0a0a0a;
            border: 2px solid #00ff00;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .stats {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat {
            font-size: 12px;
        }
        
        .stat-label {
            color: #00aa00;
            margin-bottom: 3px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
        }
        
        .stat-value.warning {
            color: #ff6600;
        }
        
        .preset-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 20px;
        }
        
        .preset-button {
            padding: 8px;
            font-size: 12px;
        }
        
        .info {
            font-size: 11px;
            color: #00aa00;
            line-height: 1.4;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #003300;
        }
        
        .debug {
            background: #1a1a3a;
            border: 2px solid #6666ff;
            border-radius: 8px;
            padding: 10px;
            font-size: 10px;
            color: #aaaaff;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .debug-line {
            margin: 2px 0;
            font-family: 'Courier New', monospace;
        }
        
        .debug-line.error {
            color: #ff6666;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="reset-button" onclick="resetSystem()">⟲ RESET</button>
        <button class="pause-button" onclick="togglePause()">⏸ PAUSE</button>
        
        <h2>NOTES</h2>
        <div class="note-buttons">
            <button onclick="playNote(36)">C2<br>65Hz</button>
            <button onclick="playNote(40)">E2<br>82Hz</button>
            <button onclick="playNote(43)">G2<br>98Hz</button>
            <button onclick="playNote(48)">C3<br>131Hz</button>
            <button onclick="playNote(52)">E3<br>165Hz</button>
            <button onclick="playNote(55)">G3<br>196Hz</button>
            <button onclick="playNote(60)">C4<br>262Hz</button>
            <button onclick="playNote(64)">E4<br>330Hz</button>
            <button onclick="playNote(67)">G4<br>392Hz</button>
            <button onclick="playNote(72)">C5<br>523Hz</button>
            <button onclick="playNote(76)">E5<br>659Hz</button>
            <button onclick="playNote(79)">G5<br>784Hz</button>
        </div>
        
        <h2>PD CONTROL</h2>
        <div class="slider-group">
            <div class="slider-label">
                <span>Kp (Speed)</span>
                <span class="slider-value" id="kp-value">5.0</span>
            </div>
            <input type="range" id="kp" min="0.5" max="15" step="0.1" value="5" oninput="updateGains()">
            <div class="info">Drive toward target</div>
        </div>
        
        <div class="slider-group">
            <div class="slider-label">
                <span>Kd (Damping)</span>
                <span class="slider-value" id="kd-value">1.5</span>
            </div>
            <input type="range" id="kd" min="0" max="4" step="0.05" value="1.5" oninput="updateGains()">
            <div class="info">Braking force</div>
        </div>
        
        <h2>PRESETS</h2>
        <div class="preset-buttons">
            <button class="preset-button" onclick="loadPreset('smooth')">Smooth</button>
            <button class="preset-button" onclick="loadPreset('vocal')">Vocal</button>
            <button class="preset-button" onclick="loadPreset('slow')">Slow</button>
            <button class="preset-button" onclick="loadPreset('fast')">Fast</button>
        </div>
    </div>
    
    <div class="main">
        <h1>◆ PD PORTAMENTO - DEBUG MODE ◆</h1>
        <canvas id="canvas"></canvas>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">CURRENT PITCH</div>
                <div class="stat-value" id="current-pitch">C4 (262Hz)</div>
            </div>
            <div class="stat">
                <div class="stat-label">TARGET PITCH</div>
                <div class="stat-value" id="target-pitch">C4 (262Hz)</div>
            </div>
            <div class="stat">
                <div class="stat-label">ERROR</div>
                <div class="stat-value" id="error">0.000</div>
            </div>
            <div class="stat">
                <div class="stat-label">VELOCITY</div>
                <div class="stat-value" id="velocity">0.00</div>
            </div>
            <div class="stat">
                <div class="stat-label">P TERM</div>
                <div class="stat-value" id="p-term">0.000</div>
            </div>
            <div class="stat">
                <div class="stat-label">D TERM</div>
                <div class="stat-value" id="d-term">0.000</div>
            </div>
            <div class="stat">
                <div class="stat-label">CORRECTION</div>
                <div class="stat-value" id="correction">0.000</div>
            </div>
            <div class="stat">
                <div class="stat-label">DAMPING RATIO (ζ)</div>
                <div class="stat-value" id="damping-ratio">---</div>
            </div>
        </div>
        
        <div class="debug" id="debug-log">
            <div class="debug-line">Debug log initialized...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = 600;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // State
        let currentPitchSemitones = 60;
        let targetPitchSemitones = 60;
        let previousError = 0;
        
        // Gains
        let Kp = 5.0;
        let Kd = 1.5;
        
        // History
        const history = [];
        const maxHistory = 300;
        
        // Animation control
        let isPaused = false;
        const fps = 60;
        const dt = 1.0 / fps;
        
        // Debug
        const debugLog = [];
        const maxDebugLines = 20;
        let frameCount = 0;
        let previousTargetPitch = 60;
        
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        
        function logDebug(message, isError = false) {
            debugLog.push({ message, isError, frame: frameCount });
            if (debugLog.length > maxDebugLines) {
                debugLog.shift();
            }
            
            const debugEl = document.getElementById('debug-log');
            debugEl.innerHTML = debugLog.map(log => 
                `<div class="debug-line ${log.isError ? 'error' : ''}">Frame ${log.frame}: ${log.message}</div>`
            ).join('');
            debugEl.scrollTop = debugEl.scrollHeight;
        }
        
        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }
        
        function midiToNoteName(midi) {
            const rounded = Math.round(midi);
            const octave = Math.floor(rounded / 12) - 1;
            const note = noteNames[rounded % 12];
            const cents = Math.round((midi - rounded) * 100);
            const centsStr = cents !== 0 ? ` ${cents > 0 ? '+' : ''}${cents}¢` : '';
            return `${note}${octave}${centsStr}`;
        }
        
        function playNote(midi) {
            logDebug(`User clicked note: ${midiToNoteName(midi)} (${midi})`, false);
            targetPitchSemitones = midi;
            previousTargetPitch = midi;
        }
        
        function resetSystem() {
            logDebug('SYSTEM RESET', false);
            currentPitchSemitones = 60;
            targetPitchSemitones = 60;
            previousTargetPitch = 60;
            previousError = 0;
            history.length = 0;
            frameCount = 0;
        }
        
        function togglePause() {
            isPaused = !isPaused;
            document.querySelector('.pause-button').textContent = isPaused ? '▶ RESUME' : '⏸ PAUSE';
            logDebug(isPaused ? 'PAUSED' : 'RESUMED', false);
        }
        
        function updateGains() {
            Kp = parseFloat(document.getElementById('kp').value);
            Kd = parseFloat(document.getElementById('kd').value);
            
            document.getElementById('kp-value').textContent = Kp.toFixed(1);
            document.getElementById('kd-value').textContent = Kd.toFixed(2);
            
            const zeta = Kd / (2 * Math.sqrt(Kp));
            let dampingText = zeta.toFixed(3);
            if (zeta < 0.7) {
                dampingText += ' underdamped';
            } else if (zeta < 1.2) {
                dampingText += ' critical';
            } else {
                dampingText += ' overdamped';
            }
            document.getElementById('damping-ratio').textContent = dampingText;
        }
        
        function loadPreset(name) {
            const presets = {
                smooth: { kp: 6, kd: 2.5 },
                vocal: { kp: 8, kd: 1.2 },
                slow: { kp: 2, kd: 1.5 },
                fast: { kp: 12, kd: 2.0 }
            };
            
            const preset = presets[name];
            document.getElementById('kp').value = preset.kp;
            document.getElementById('kd').value = preset.kd;
            updateGains();
            logDebug(`Preset loaded: ${name}`, false);
        }
        
        function processPD() {
            // CRITICAL: Check if target changed unexpectedly
            if (targetPitchSemitones !== previousTargetPitch) {
                logDebug(`⚠ TARGET CHANGED: ${previousTargetPitch.toFixed(2)} → ${targetPitchSemitones.toFixed(2)}`, true);
                previousTargetPitch = targetPitchSemitones;
            }
            
            // Calculate error
            const error = targetPitchSemitones - currentPitchSemitones;
            
            // Check for instability
            if (Math.abs(error) > 48) {
                logDebug(`⚠ HUGE ERROR: ${error.toFixed(2)} semitones!`, true);
            }
            
            // P term
            const pTerm = Kp * error;
            
            // D term
            const errorRate = (error - previousError) / dt;
            const dTerm = Kd * errorRate;
            previousError = error;
            
            // Correction
            const correction = pTerm + dTerm;
            
            // Check for extreme correction
            if (Math.abs(correction) > 100) {
                logDebug(`⚠ EXTREME CORRECTION: ${correction.toFixed(2)}`, true);
            }
            
            // Apply
            const previousPitch = currentPitchSemitones;
            const semitonesChange = correction * dt;
            currentPitchSemitones += semitonesChange;
            
            // Check for NaN
            if (isNaN(currentPitchSemitones)) {
                logDebug('⚠ NaN DETECTED IN PITCH!', true);
                currentPitchSemitones = 60;
            }
            
            const actualVelocity = (currentPitchSemitones - previousPitch) / dt;
            
            // Store history
            history.push({
                current: currentPitchSemitones,
                target: targetPitchSemitones,
                error: error,
                velocity: actualVelocity,
                pTerm: pTerm,
                dTerm: dTerm,
                correction: correction
            });
            
            if (history.length > maxHistory) {
                history.shift();
            }
            
            // Update display
            const currentFreq = midiToFreq(currentPitchSemitones);
            const targetFreq = midiToFreq(targetPitchSemitones);
            
            document.getElementById('current-pitch').textContent = 
                `${midiToNoteName(currentPitchSemitones)} (${currentFreq.toFixed(1)}Hz)`;
            document.getElementById('target-pitch').textContent = 
                `${midiToNoteName(targetPitchSemitones)} (${targetFreq.toFixed(1)}Hz)`;
            
            const errorEl = document.getElementById('error');
            errorEl.textContent = error.toFixed(3);
            errorEl.className = 'stat-value' + (Math.abs(error) > 2 ? ' warning' : '');
            
            document.getElementById('velocity').textContent = actualVelocity.toFixed(2);
            document.getElementById('p-term').textContent = pTerm.toFixed(3);
            document.getElementById('d-term').textContent = dTerm.toFixed(3);
            document.getElementById('correction').textContent = correction.toFixed(3);
        }
        
        function draw() {
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);
            
            const minNote = 30;
            const maxNote = 84;
            const noteRange = maxNote - minNote;
            
            // Grid
            ctx.strokeStyle = '#003300';
            ctx.lineWidth = 1;
            ctx.font = '10px Courier New';
            ctx.fillStyle = '#00aa00';
            
            for (let note = minNote; note <= maxNote; note += 12) {
                const y = height - ((note - minNote) / noteRange) * height;
                ctx.beginPath();
                ctx.moveTo(50, y);
                ctx.lineTo(width, y);
                ctx.stroke();
                
                const noteName = midiToNoteName(note);
                const freq = midiToFreq(note);
                ctx.fillText(`${noteName}`, 5, y + 3);
                ctx.fillText(`${freq.toFixed(0)}Hz`, 5, y + 15);
            }
            
            // Target line
            if (history.length > 0) {
                const targetY = height - ((targetPitchSemitones - minNote) / noteRange) * height;
                ctx.strokeStyle = '#00ff0040';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(50, targetY);
                ctx.lineTo(width, targetY);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.fillStyle = '#00ff00';
                ctx.fillText('TARGET', width - 60, targetY - 5);
            }
            
            // Pitch trace
            if (history.length > 1) {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ff00';
                
                ctx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const x = 50 + ((i / maxHistory) * (width - 50));
                    const pitch = history[i].current;
                    const clampedPitch = Math.max(minNote, Math.min(maxNote, pitch));
                    const y = height - ((clampedPitch - minNote) / noteRange) * height;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Current position
                if (history.length > 0) {
                    const lastPoint = history[history.length - 1];
                    const x = width - 5;
                    const clampedPitch = Math.max(minNote, Math.min(maxNote, lastPoint.current));
                    const y = height - ((clampedPitch - minNote) / noteRange) * height;
                    
                    ctx.fillStyle = '#00ff00';
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, 10, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }
        
        function animate() {
            if (!isPaused) {
                processPD();
                frameCount++;
            }
            draw();
            requestAnimationFrame(animate);
        }
        
        updateGains();
        logDebug('System initialized', false);
        animate();
    </script>
</body>
</html>
