<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" font-family="Andale Mono, monospace"><rect width="1040" height="490" fill="#0a0a0f"/><text x="20" y="34" fill="#e8e6df" font-size="17">Frets: how far off pitch the knob lands after you let go (cents)</text><text x="20" y="56" fill="#8a8a96" font-size="12">240 let-gos at random angles · pretend motor, brake on (middle guess) · bar = median, whisker = 95th %, dot = worst</text><text x="20" y="106" fill="#c9c6bd" font-size="13">no bumps (an ideal motor)</text><rect x="340" y="90" width="16.34734949286343" height="20" fill="#e8b84a"/><line x1="340" y1="100" x2="838.7506257606218" y2="100" stroke="#b08a3a" stroke-width="3"/><circle cx="860" cy="100" r="5" fill="#c8261a"/><text x="870" y="105" fill="#8a8a96" font-size="12">1.6 / 47.9 / 49.9</text><text x="20" y="176" fill="#c9c6bd" font-size="13">the motor's bumps, raw</text><rect x="340" y="160" width="16.33710878555968" height="20" fill="#e8b84a"/><line x1="340" y1="170" x2="404.24983263888" y2="170" stroke="#b08a3a" stroke-width="3"/><circle cx="845.1906063784078" cy="170" r="5" fill="#c8261a"/><text x="855.1906063784078" y="175" fill="#8a8a96" font-size="12">1.6 / 6.2 / 48.5</text><text x="20" y="246" fill="#c9c6bd" font-size="13">bumps cancelled by the firmware</text><rect x="340" y="230" width="16.315319567887116" height="20" fill="#e8b84a"/><line x1="340" y1="240" x2="838.7506257606218" y2="240" stroke="#b08a3a" stroke-width="3"/><circle cx="860" cy="240" r="5" fill="#c8261a"/><text x="870" y="245" fill="#8a8a96" font-size="12">1.6 / 47.9 / 49.9</text><text x="20" y="316" fill="#c9c6bd" font-size="13">bumps cancelled, plus a ridge kick</text><rect x="340" y="300" width="18.92498656243174" height="20" fill="#e8b84a"/><line x1="340" y1="310" x2="363.9581614500154" y2="310" stroke="#b08a3a" stroke-width="3"/><circle cx="364.86484136978123" cy="310" r="5" fill="#c8261a"/><text x="374.86484136978123" y="315" fill="#8a8a96" font-size="12">1.8 / 2.3 / 2.4</text><text x="20" y="400" fill="#e8e6df" font-size="15">Struck spring: wobbles you hear before it dies to a tenth</text><text x="20" y="434" fill="#c9c6bd" font-size="12">brake cancelled</text><text x="20" y="464" fill="#e8b84a" font-size="24">3</text><text x="235" y="434" fill="#c9c6bd" font-size="12">brake on · low guess</text><text x="235" y="464" fill="#e8b84a" font-size="24">2</text><text x="450" y="434" fill="#c9c6bd" font-size="12">brake on · middle guess</text><text x="450" y="464" fill="#e8b84a" font-size="24">1</text><text x="665" y="434" fill="#c9c6bd" font-size="12">brake on · high guess</text><text x="665" y="464" fill="#e8b84a" font-size="24">1</text></svg>