<text x="630.0" y="390.0" font-size="15" fill="#3a3a35" text-anchor="middle" font-weight="normal" font-style="normal">When the words were put</text>
<text x="630.0" y="409.0" font-size="15" fill="#3a3a35" text-anchor="middle" font-weight="normal" font-style="normal">in front of their reader</text>
<text x="630.0" y="428.0" font-size="15" fill="#3a3a35" text-anchor="middle" font-weight="normal" font-style="normal">is not in the record.</text>
