<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" width="1000" height="575" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace">
<rect width="1000" height="575" fill="#f0eee5"/>
<text x="40.0" y="44.0" font-size="15" fill="#6a6862" text-anchor="start" font-weight="bold" font-style="normal">ONE DEPOSIT, FROM ITS COMMITS</text>
<text x="40.0" y="72.0" font-size="21" fill="#1a1916" text-anchor="start" font-weight="bold" font-style="normal">Placed before they were read, the words waited on a branch, outside canon</text>
<text x="40.0" y="104.0" font-size="16" fill="#3a3a35" text-anchor="start" font-weight="normal" font-style="normal">Of the 6 deposits under v2.8 and v2.9, this is the exception: 1 placed on a branch</text>
<text x="40.0" y="126.0" font-size="16" fill="#3a3a35" text-anchor="start" font-weight="normal" font-style="normal">before its read. By their commits, 4 were read first. By the ledger's correction,</text>
<text x="40.0" y="148.0" font-size="16" fill="#3a3a35" text-anchor="start" font-weight="normal" font-style="normal">1 landed on main before its words were read.</text>
<text x="40.0" y="305.0" font-size="15" fill="#6a6862" text-anchor="start" font-weight="normal" font-style="normal">branch</text>
<text x="40.0" y="435.0" font-size="15" fill="#6a6862" text-anchor="start" font-weight="normal" font-style="normal">main</text>
<text x="40.0" y="455.0" font-size="13" fill="#6a6862" text-anchor="start" font-weight="normal" font-style="normal">(canon)</text>
