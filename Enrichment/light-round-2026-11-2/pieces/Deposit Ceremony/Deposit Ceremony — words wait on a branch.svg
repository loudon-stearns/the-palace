<text x="970.0" y="403.0" font-size="14" fill="#1a1916" text-anchor="end" font-weight="normal" font-style="normal">merged, 8 Nov 07:52, verify state: verified</text>
<text x="970.0" y="431.0" font-size="14" fill="#c8261a" text-anchor="end" font-weight="normal" font-style="normal">the merge's message:</text>
<text x="970.0" y="449.0" font-size="14" fill="#c8261a" text-anchor="end" font-weight="normal" font-style="normal">“read every word … (‘Read it, land it’)”</text>
<text x="40.0" y="482.0" font-size="13" fill="#6a6862" text-anchor="start" font-weight="normal" font-style="normal">Source: git, merge f91572e2 and its five branch commits. Times are commit times, not when a read began.</text>
