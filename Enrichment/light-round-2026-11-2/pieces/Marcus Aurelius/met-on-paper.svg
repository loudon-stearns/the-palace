anchor="start" font-weight="600" letter-spacing="1.5" font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">EPICTETUS, ON PAPER</text><text x="70.0" y="62.0" font-size="12.5" fill="#6a6862" text-anchor="start" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">Epictetus died around 135. Marcus turned to philosophy at twenty-five, in 146 or 147,</text><text x="70.0" y="80.0" font-size="12.5" fill="#6a6862" text-anchor="start" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">and came to know Epictetus through notes of his lectures.</text><rect x="500.9" y="170.0" width="85.0" height="160.0" fill="#dcd9ca" fill-opacity="0.55"/><text x="543.4" y="222.0" font-size="11" fill="#6a6862" text-anchor="middle" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">121–135: Marcus a boy in Rome,</text><text x="543.4" y="236.0" font-size="11" fill="#6a6862" text-anchor="middle" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">Epictetus teaching in Greece</text><text x="70.0" y="128.0" font-size="13" fill="#1a1916" text-anchor="start" font-weight="600" letter-spacing="1" font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">EPICTETUS</text><rect x="70.0" y="168.8" width="546.2" height="2.4" fill="url(#g1)"/><text x="70.0" y="194.0" font-size="11.5" fill="#3a3a35" text-anchor="start" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">born c. 50s, Hierapolis · a slave, later freed</text><rect x="306.7" y="166.0" width="36.4" height="8" fill="#6a6862" fill-opacity="0.8"/><text x="302.7" y="152.0" font-size="11.5" fill="#3a3a35" text-anchor="start" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">c. 89 · banished from Italy; teaches at Nicopolis, Greece</text><rect x="397.7" y="166.0" width="24.3" height="8" fill="#6a6862" fill-opacity="0.8"/><text x="428.0" y="194.0" font-size="11.5" fill="#3a3a35" text-anchor="start" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">c. 104–108 · Arrian writes down his lectures</text><text x="624.2" y="174.0" font-size="11.5" fill="#3a3a35" text-anchor="start" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">dies c. 135, Nicopolis</text><line x1="409.9" y1="176.0" x2="409.9" y2="292.0" stroke="#6a6862" stroke-width="1.1" stroke-opacity="1.0" stroke-dasharray="2 3"/><line x1="409.9" y1="292.0" x2="419.9" y2="292.0" stroke="#6a6862" stroke-width="1.1" stroke-opacity="1.0" stroke-dasharray="2 3"/><text x="423.9" y="296.0" font-size="11.5" fill="#1a1916" text-anchor="start" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">Epictetus's lectures reach Marcus on paper, via Rusticus · year unknown</text><line x1="585.9" y1="262.0" x2="652.6" y2="262.0" stroke="#6a6862" stroke-width="1" stroke-opacity="1.0"/><line x1="585.9" y1="258.0" x2="585.9" y2="266.0" stroke="#6a6862" stroke-width="1" stroke-opacity="1.0"/><line x1="652.6" y1="258.0" x2="652.6" y2="266.0" stroke="#6a6862" stroke-width="1" stroke-opacity="1.0"/><text x="619.2" y="256.0" font-size="10.5" fill="#6a6862" text-anchor="middle" font-weight="400"  font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">c. 11 yrs</text><text x="70.0" y="334.0" font-size="13" fill="#1a1916" text-anchor="start" font-weight="600" letter-spacing="1" font-family="'JetBrains Mono','IBM Plex Mono','SF Mono',Menlo,monospace">MARCUS AURELIUS</text><line x1="500.9" y1="330.0" x2="859.0" y2="330.0" stroke="#1a1916" stroke-width="3.2" stroke-opacity="1.0"/><circle cx="500.9" cy="330.0" r="3.6" fill="#1a1916"/><circle cx="604.1" cy="330.0" r="3.6" fill="#1a1916"/><circle cx="743.7" cy="330.0" r="3.6" fill="#1a1916"/><circle cx="840.8" cy="330.0" r="3.6" fill="#1a