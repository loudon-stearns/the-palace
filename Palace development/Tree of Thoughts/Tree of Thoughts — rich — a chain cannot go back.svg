<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 390" width="920" height="390" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">A CHAIN CANNOT GO BACK</text><text x="60.0" y="96.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">CHAIN OF THOUGHT</text><text x="60.0" y="114.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >one path, each step built on the last</text><line x1="100.0" y1="200.0" x2="140.0" y2="200.0" stroke="#1a1916" stroke-width="1.4" /><polygon points="149.0,200.0 140.0,204.0 140.0,196.0" fill="#1a1916"/><line x1="170.0" y1="200.0" x2="210.0" y2="200.0" stroke="#1a1916" stroke-width="1.4" /><polygon points="219.0,200.0 210.0,204.0 210.0,196.0" fill="#1a1916"/><line x1="240.0" y1="200.0" x2="280.0" y2="200.0" stroke="#1a1916" stroke-width="1.4" /><polygon points="289.0,200.0 280.0,204.0 280.0,196.0" fill="#1a1916"/><line x1="310.0" y1="200.0" x2="350.0" y2="200.0" stroke="#1a1916" stroke-width="1.4" /><polygon points="359.0,200.0 350.0,204.0 350.0,196.0" fill="#1a1916"/><circle cx="90" cy="200" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="160" cy="200" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="230" cy="200" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="300" cy="200" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="370" cy="200" r="9" fill="#f0eee5" stroke="#6a6862" stroke-width="1.8"/><path d="M366,196 L374,204 M374,196 L366,204" stroke="#6a6862" stroke-width="1.6"/><text x="370.0" y="232.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >wrong,</text><text x="370.0" y="246.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >and no way back</text><text x="160.0" y="176.0" font-size="10" fill="#c8261a" text-anchor="middle" font-weight="400" >the slip was here</text><line x1="160" y1="181" x2="160" y2="189" stroke="#c8261a"/><text x="490.0" y="96.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">TREE OF THOUGHTS</text><text x="490.0" y="114.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >several continuations, scored, and the weak ones dropped</text><line x1="519" y1="220" x2="591" y2="150" stroke="#6a6862" stroke-width="1.2"/><line x1="519" y1="220" x2="591" y2="220" stroke="#6a6862" stroke-width="1.2"/><line x1="519" y1="220" x2="591" y2="290" stroke="#c8261a" stroke-width="2.2"/><line x1="609" y1="150" x2="681" y2="120" stroke="#6a6862" stroke-width="1.2"/><line x1="609" y1="150" x2="681" y2="180" stroke="#6a6862" stroke-width="1.2"/><line x1="609" y1="290" x2="681" y2="260" stroke="#c8261a" stroke-width="2.2"/><line x1="609" y1="290" x2="681" y2="320" stroke="#6a6862" stroke-width="1.2"/><line x1="699" y1="260" x2="771" y2="230" stroke="#c8261a" stroke-width="2.2"/><line x1="699" y1="260" x2="771" y2="290" stroke="#6a6862" stroke-width="1.2"/><line x1="789" y1="230" x2="861" y2="230" stroke="#c8261a" stroke-width="2.2"/><circle cx="510" cy="220" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="600" cy="150" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="600" cy="220" r="9" fill="#f0eee5" stroke="#6a6862" stroke-width="1.8"/><path d="M596,216 L604,224 M604,216 L596,224" stroke="#6a6862" stroke-width="1.6"/><circle cx="600" cy="290" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="690" cy="120" r="9" fill="#f0eee5" stroke="#6a6862" stroke-width="1.8"/><path d="M686,116 L694,124 M694,116 L686,124" stroke="#6a6862" stroke-width="1.6"/><circle cx="690" cy="180" r="9" fill="#f0eee5" stroke="#6a6862" stroke-width="1.8"/><path d="M686,176 L694,184 M694,176 L686,184" stroke="#6a6862" stroke-width="1.6"/><circle cx="690" cy="260" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="690" cy="320" r="9" fill="#f0eee5" stroke="#6a6862" stroke-width="1.8"/><path d="M686,316 L694,324 M694,316 L686,324" stroke="#6a6862" stroke-width="1.6"/><circle cx="780" cy="230" r="9" fill="#f0eee5" stroke="#1a1916" stroke-width="1.8"/><circle cx="780" cy="290" r="9" fill="#f0eee5" stroke="#6a6862" stroke-width="1.8"/><path d="M776,286 L784,294 M784,286 L776,294" stroke="#6a6862" stroke-width="1.6"/><circle cx="870" cy="230" r="9" fill="#c8261a" stroke="#c8261a" stroke-width="1.8"/><path d="M682,126 C640,138 540,140 514,206" fill="none" stroke="#1a1916" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="517.0" y1="196.0" x2="515.6" y2="200.4" stroke="#1a1916" stroke-width="1.4" /><polygon points="513.0,209.0 511.8,199.2 519.5,201.6" fill="#1a1916"/><text x="542.0" y="150.0" font-size="10" fill="#3a3a35" text-anchor="middle" font-weight="400" >backtrack</text><text x="870.0" y="258.0" font-size="10" fill="#c8261a" text-anchor="middle" font-weight="400" >found</text><line x1="440" y1="84" x2="440" y2="340" stroke="#b8b09a"/><text x="40.0" y="372.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >Same problem, same first step. The chain cannot revisit its second thought; the tree can, and does.</text></svg>