<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 434" width="920" height="434" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">FOUR GATES</text><circle cx="70" cy="210" r="9" fill="#c8261a"/><text x="70.0" y="244.0" font-size="10" fill="#3a3a35" text-anchor="middle" font-weight="400" >a choice</text><rect x="150" y="130" width="14" height="160" fill="#1a1916"/><rect x="236" y="130" width="14" height="160" fill="#1a1916"/><rect x="150" y="118" width="100" height="14" fill="#1a1916"/><text x="200.0" y="106.0" font-size="11" fill="#1a1916" text-anchor="middle" font-weight="700" >WISDOM</text><text x="200.0" y="312.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >see what it</text><text x="200.0" y="326.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >actually requires</text><rect x="300" y="130" width="14" height="160" fill="#1a1916"/><rect x="386" y="130" width="14" height="160" fill="#1a1916"/><rect x="300" y="118" width="100" height="14" fill="#1a1916"/><text x="350.0" y="106.0" font-size="11" fill="#1a1916" text-anchor="middle" font-weight="700" >JUSTICE</text><text x="350.0" y="312.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >give each</text><text x="350.0" y="326.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >their due</text><rect x="450" y="130" width="14" height="160" fill="#1a1916"/><rect x="536" y="130" width="14" height="160" fill="#1a1916"/><rect x="450" y="118" width="100" height="14" fill="#1a1916"/><text x="500.0" y="106.0" font-size="11" fill="#1a1916" text-anchor="middle" font-weight="700" >COURAGE</text><text x="500.0" y="312.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >say the</text><text x="500.0" y="326.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >hard thing</text><rect x="600" y="130" width="14" height="160" fill="#1a1916"/><rect x="686" y="130" width="14" height="160" fill="#1a1916"/><rect x="600" y="118" width="100" height="14" fill="#1a1916"/><text x="650.0" y="106.0" font-size="11" fill="#1a1916" text-anchor="middle" font-weight="700" >TEMPERANCE</text><text x="650.0" y="312.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >know when</text><text x="650.0" y="326.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >it is enough</text><image x="330.0" y="150.0" width="40" height="40" href="data:image/png;base64," /><rect x="330" y="150" width="40" height="40" fill="none" stroke="#6a6862" stroke-width="1.2"/><line x1="84.0" y1="210.0" x2="721.0" y2="210.0" stroke="#c8261a" stroke-width="2" /><polygon points="730.0,210.0 721.0,214.0 721.0,206.0" fill="#c8261a"/><line x1="750" y1="110" x2="750" y2="330" stroke="#b8b09a" stroke-dasharray="4 4"/><rect x="780" y="170" width="90" height="80" fill="none" stroke="#b8b09a" stroke-dasharray="3 4"/><text x="825.0" y="206.0" font-size="11" fill="#6a6862" text-anchor="middle" font-weight="400" >how it</text><text x="825.0" y="222.0" font-size="11" fill="#6a6862" text-anchor="middle" font-weight="400" >turns out</text><text x="825.0" y="270.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >not yours</text><text x="750.0" y="348.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >the edge of what is up to you</text><text x="40.0" y="376.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >A choice that passes all four is a good one whatever happens next; the outcome is drawn past the line because it is past</text><text x="40.0" y="393.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >your reach.</text><text x="40.0" y="410.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >The gloss under each gate is mine, shortened from the page. The small avatar on Justice is Closing Well: the honest handoff.</text></svg>