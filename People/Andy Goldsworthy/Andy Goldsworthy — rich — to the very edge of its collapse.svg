0" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">TO THE VERY EDGE OF ITS COLLAPSE</text><line x1="60" y1="392" x2="900" y2="392" stroke="#1a1916" stroke-width="1.5"/><ellipse class="s0" cx="403" cy="376" rx="60" ry="15" fill="#8d8a80" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s1" cx="409" cy="344" rx="56" ry="14" fill="#a09c90" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s2" cx="417" cy="313" rx="51" ry="14" fill="#77746b" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s3" cx="428" cy="281" rx="46" ry="13" fill="#8d8a80" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s4" cx="441" cy="250" rx="42" ry="13" fill="#a09c90" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s5" cx="457" cy="218" rx="38" ry="12" fill="#77746b" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s6" cx="476" cy="186" rx="33" ry="11" fill="#8d8a80" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s7" cx="497" cy="155" rx="28" ry="11" fill="#a09c90" stroke="#1a1916" stroke-width="1.3"/><ellipse class="s8" cx="521" cy="123" rx="24" ry="10" fill="#77746b" stroke="#1a1916" stroke-width="1.3"/><text x="690.0" y="150.0" font-size="17" fill="#c8261a" text-anchor="middle" font-weight="700" class="lab">the balance point</text><text x="690.0" y="174.0" font-size="17" fill="#c8261a" text-anchor="middle" font-weight="700" class="lab">is the piece</text><text x="40.0" y="424.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >Nine stones go up, each a little further out than the last. The stack holds at the point where one more would</text><text x="40.0" y="442.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >bring it down. Then it comes down.</text><text x="40.0" y="465.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >The page: “the real work is the change”. A drawing of that arc, from made to gone, moved by hand and not</text><text x="40.0" y="483.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >simulated. Not one of his works.</text></svg>