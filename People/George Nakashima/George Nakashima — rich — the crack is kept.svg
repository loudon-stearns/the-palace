4.9" fill="none" stroke="#1a1916" stroke-width="2"/><rect x="515" y="137" width="293" height="18" fill="#d8c9a3"/><text x="520.0" y="150.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="400" >keys set across the split, left showing</text><rect x="241" y="217.5303715007521" width="220" height="18" fill="#d8c9a3"/><text x="456.0" y="230.5" font-size="12" fill="#1a1916" text-anchor="end" font-weight="400" >the split runs with the grain</text><rect x="199" y="164.99272267602106" width="162" height="18" fill="#d8c9a3"/><text x="204.0" y="178.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="400" >this split got no key</text><text x="40.0" y="380.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >When a board split, Nakashima “didn't hide the crack”. He cut a bowtie-shaped inlay across it and left it</text><text x="40.0" y="398.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >visible: “proof of the repair, not a cover for it”.</text><text x="40.0" y="421.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >Further down, the page says who “decided which split earned a butterfly joint and exactly where it sat”. He did.</text><text x="40.0" y="444.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >A drawing, not one of his tables. The slab, both splits and the places of the keys are mine.</text></svg>