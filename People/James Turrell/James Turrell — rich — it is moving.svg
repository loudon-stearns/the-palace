<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 492" width="920" height="492" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style>@keyframes sky{0%{fill:#f2b28a}100%{fill:#3b4f8c}}.sky{animation:sky 600s linear infinite alternate}</style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">IT IS MOVING</text><rect class="sky" x="200" y="90" width="520" height="330" fill="#f2b28a"/><rect x="200" y="90" width="520" height="330" fill="none" stroke="#1a1916" stroke-width="1.5"/><rect x="60" y="90" width="90" height="150" fill="#f2b28a" stroke="#1a1916"/><text x="105.0" y="258.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >where it began</text><rect x="770" y="90" width="90" height="150" fill="#3b4f8c" stroke="#1a1916"/><text x="815.0" y="258.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >where it is going</text><text x="40.0" y="456.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >The window takes ten minutes to cross from the left swatch to the right, and ten to come back. Watch it and nothing happens.</text><text x="40.0" y="474.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >Read the page, look again, and it has changed. Nothing in the picture tells you how far along it is.</text></svg>