<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 434" width="920" height="434" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><rect width="920" height="434" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">FEW, THEN MANY</text><line x1="110" y1="322" x2="880" y2="322" stroke="#b8b09a"/><line x1="110.0" y1="322" x2="110.0" y2="327" stroke="#b8b09a"/><text x="110.0" y="340.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >0s</text><line x1="250.0" y1="322" x2="250.0" y2="327" stroke="#b8b09a"/><text x="250.0" y="340.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >4s</text><line x1="390.0" y1="322" x2="390.0" y2="327" stroke="#b8b09a"/><text x="390.0" y="340.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >8s</text><line x1="530.0" y1="322" x2="530.0" y2="327" stroke="#b8b09a"/><text x="530.0" y="340.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >12s</text><line x1="670.0" y1="322" x2="670.0" y2="327" stroke="#b8b09a"/><text x="670.0" y="340.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >16s</text><line x1="810.0" y1="322" x2="810.0" y2="327" stroke="#b8b09a"/><text x="810.0" y="340.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >20s</text><line x1="120.5" y1="260.0" x2="403.0" y2="260.0" stroke="#1a1916" stroke-width="5.0" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="304.0" x2="750.5" y2="304.0" stroke="#c8261a" stroke-width="3.0" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="260.0" x2="683.0" y2="260.0" stroke="#c8261a" stroke-width="5.0" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="249.3" x2="664.3" y2="249.3" stroke="#c8261a" stroke-width="4.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="234.0" x2="636.8" y2="234.0" stroke="#c8261a" stroke-width="3.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="216.0" x2="604.3" y2="216.0" stroke="#c8261a" stroke-width="3.8" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="201.5" x2="578.8" y2="201.5" stroke="#c8261a" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="197.8" x2="572.6" y2="197.8" stroke="#c8261a" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="190.0" x2="559.5" y2="190.0" stroke="#c8261a" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="169.4" x2="527.6" y2="169.4" stroke="#c8261a" stroke-width="2.0" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="152.6" x2="504.7" y2="152.6" stroke="#c8261a" stroke-width="1.7" stroke-linecap="round" stroke-opacity="0.85"/><line x1="400.5" y1="138.4" x2="487.8" y2="138.4" stroke="#c8261a" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.85"/><text x="232.5" y="84.0" font-size="12" fill="#1a1916" text-anchor="middle" font-weight="700" letter-spacing="2">THE EXPERT'S MIND</text><text x="232.5" y="100.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >one partial: the note, and nothing else</text><text x="617.5" y="84.0" font-size="12" fill="#c8261a" text-anchor="middle" font-weight="700" letter-spacing="2">THE BEGINNER'S MIND</text><text x="617.5" y="100.0" font-size="10" fill="#6a6862" text-anchor="middle" font-weight="400" >the same strike, with all eleven left in</text><text x="100.0" y="264.0" font-size="10" fill="#6a6862" text-anchor="end" font-weight="400" >the note</text><text x="40.0" y="364.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >One bell, struck twice. Each line is one partial and how long it rings; the higher ones die first. Nothing was added the</text><text x="40.0" y="381.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >second time.</text><text x="40.0" y="398.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >The first strike is what was left after someone decided which partial was the note. The partial ratios are a typical bell's,</text><text x="40.0" y="415.0" font-size="11" fill="#6a6862" text-anchor="start" font-weight="400" >not a measured one.</text></svg>