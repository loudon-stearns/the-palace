<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 432" width="920" height="432" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace"><style></style><rect x="-5000" y="-5000" width="20000" height="20000" fill="#f0eee5"/><text x="40.0" y="40.0" font-size="14" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="3">YOU DO NOT SEE THE HAMMER</text><text x="60.0" y="100.0" font-size="12" fill="#1a1916" text-anchor="start" font-weight="700" letter-spacing="2">WORKING</text><text x="60.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >ready-to-hand: you notice the nail going in</text><rect x="60" y="300" width="340" height="26" fill="#dcd9ca" stroke="#1a1916" stroke-opacity="1.0"/><rect x="207.5" y="262" width="5" height="40" fill="#1a1916" fill-opacity="1.0"/><rect x="199.5" y="258" width="21" height="5" fill="#1a1916" fill-opacity="1.0"/><g opacity="0.13"><rect x="193" y="194" width="34" height="62" fill="#1a1916"/><rect x="225" y="212" width="170" height="14" fill="#1a1916" transform="rotate(-9 225 219)"/></g><text x="520.0" y="100.0" font-size="12" fill="#c8261a" text-anchor="start" font-weight="700" letter-spacing="2">BROKEN</text><text x="520.0" y="120.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >present-at-hand: an object staring back</text><rect x="520" y="300" width="340" height="26" fill="#dcd9ca" stroke="#1a1916" stroke-opacity="0.35"/><rect x="807.5" y="262" width="5" height="40" fill="#1a1916" fill-opacity="0.18"/><rect x="799.5" y="258" width="21" height="5" fill="#1a1916" fill-opacity="0.18"/><g opacity="1.0"><rect x="563" y="238" width="34" height="62" fill="#1a1916"/><rect x="595" y="256" width="84" height="14" fill="#1a1916"/><rect x="677" y="256" width="92" height="14" fill="#1a1916" transform="rotate(20 677 263)"/><path d="M671,250 l5,9 l-7,5 l8,5 l-5,9" fill="none" stroke="#c8261a" stroke-width="2.6"/></g><text x="676.0" y="238.0" font-size="12" fill="#c8261a" text-anchor="middle" font-weight="400" >snapped</text><text x="210.0" y="348.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >the nail</text><text x="580.0" y="348.0" font-size="12" fill="#3a3a35" text-anchor="middle" font-weight="400" >the hammer</text><line x1="460" y1="84" x2="460" y2="352" stroke="#b8b09a"/><text x="40.0" y="384.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >In use “you don't notice the hammer, you notice the nail going in”; it becomes an object “only when it breaks”.</text><text x="40.0" y="407.0" font-size="12" fill="#6a6862" text-anchor="start" font-weight="400" >The fading is my way of drawing it. The page's claim is about two ways a tool can be, not about eyesight.</text></svg>