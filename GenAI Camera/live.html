<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>GenAI Camera — live</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="GenAI%20Camera%20%E2%80%94%20icon.png">
<style data-furniture="_ops/loudon-live/design-system/controls.css 2026-11-03">

@layer furniture {
:where(*) { --fx-bg: var(--bg, #0a0a0f); --fx-bg-elev-1: #12121a; --fx-bg-elev-2: #1a1a28; --fx-bg-elev-3: #22222e; --fx-fg-1: var(--fg, #e8e8f0); --fx-fg-2: #c8c8d8; --fx-fg-3: var(--fg3, #8a8aa0); --fx-fg-4: #4a4a5a; --fx-fg-on-accent: #0a0a0f; --fx-border: #4a4a5e; --fx-border-soft: rgba(255,255,255,0.06); --fx-border-hover: rgba(232,184,74,0.55); --fx-accent: var(--accent, #e8b84a); --fx-accent-soft: rgba(232,184,74,0.10); --fx-accent-line: rgba(232,184,74,0.50); --fx-danger: #ff2a2a; --fx-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; --fx-r-xs: 1px; --fx-r-sm: 2px; --fx-r-md: 4px; --fx-r-pill: 999px; --fx-s-1: 4px; --fx-s-2: 8px; --fx-s-3: 12px; --fx-s-4: 16px; --fx-s-5: 20px; --fx-s-6: 24px; --fx-t-fast: 120ms; --fx-ease: cubic-bezier(.4, 0, .2, 1); --fx-lh-normal: 1.5; --fx-t-eyebrow: 11px; --fx-tr-eyebrow: 0.18em; --fx-t-caption: 13px; --fx-shadow-2: inset 0 1px 0 rgba(255,255,255,0.07), 0 6px 16px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.50); --fx-shadow-3: inset 0 1px 0 rgba(255,255,255,0.10), 0 18px 40px -8px rgba(0,0,0,0.70), 0 4px 10px rgba(0,0,0,0.45); }
:root { color-scheme: dark; }
::-webkit-scrollbar {width: 11px; height: 11px;}
::-webkit-scrollbar-track {background: linear-gradient(to right, transparent calc(50% - .5px), var(--fx-border-soft) calc(50% - .5px), var(--fx-border-soft) calc(50% + .5px), transparent calc(50% + .5px));}
::-webkit-scrollbar-track:horizontal {background: linear-gradient(to bottom, transparent calc(50% - .5px), var(--fx-border-soft) calc(50% - .5px), var(--fx-border-soft) calc(50% + .5px), transparent calc(50% + .5px));}
::-webkit-scrollbar-thumb {background: var(--fx-fg-4); border: 0 solid transparent; border-width: 0 2.5px; background-clip: padding-box; border-radius: 0;}
::-webkit-scrollbar-thumb:horizontal {border-width: 2.5px 0;}
::-webkit-scrollbar-thumb:hover {background-color: var(--fx-fg-3);}
::-webkit-scrollbar-thumb:active {background-color: var(--fx-accent);}
::-webkit-scrollbar-corner {background: transparent;}
::-webkit-scrollbar-button {display: none; width: 0; height: 0;}
@supports not selector(::-webkit-scrollbar) {* {scrollbar-width: thin; scrollbar-color: var(--fx-fg-4) transparent;}
*:hover {scrollbar-color: var(--fx-fg-3) transparent;}}
::selection {background: var(--fx-accent); color: var(--fx-fg-on-accent); text-shadow: none;}
:focus {outline: none;}
:focus-visible {outline: 1px solid var(--fx-accent); outline-offset: 2px; border-radius: var(--fx-r-xs);}
[style*="overflow"], .scroll, .scroller {overscroll-behavior: contain; scrollbar-gutter: stable;}
* {-webkit-tap-highlight-color: transparent;}
label {user-select: none; -webkit-user-select: none;}
@media (prefers-reduced-motion: reduce) {*, *::before, *::after {animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important;}}
}
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#0a0a0f;--fg:#e8e8f0;--fg3:#8a8aa0;--accent:#e8b84a;--ok:#00ff66}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;display:flex;gap:14px;align-items:center;padding:8px 14px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);
  background:linear-gradient(180deg,var(--bg),rgba(10,10,15,0))}
.live{display:inline-flex;gap:7px;align-items:center;color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.wrap{max-width:96vw;max-height:92vh;display:flex;align-items:center;justify-content:center}
img{max-width:96vw;max-height:88vh;object-fit:contain;border:1px solid #2a2a3a;background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.title{font-family:'Anton',sans-serif;letter-spacing:.06em;color:var(--fg);font-size:13px}
</style>
<div class="bar">
  <span class="title">GENAI CAMERA</span>
  <span class="live"><span class="dot"></span>live</span>
  <span id="ts"></span>
  <span style="margin-left:auto;color:var(--accent)">latest only · Save in Blender to keep</span>
</div>
<div class="wrap"><img id="frame" alt="waiting for the first frame…"></div>
<script>
const img = document.getElementById('frame'), ts = document.getElementById('ts');
function tick(){ img.src = 'latest.png?t=' + Date.now(); }
img.addEventListener('load', ()=>{ ts.textContent = new Date().toLocaleTimeString(); });
tick(); setInterval(tick, 1500);
</script>
