<!doctype html>
<html lang="en" class="skin-graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rich Face</title>
<link rel="stylesheet" href="_ops/loudon-live/design-system/colors_and_type.css">
<style>
  :root {
    --bg: #0a0a0f; --bg-elev-1: #12121a; --bg-elev-2: #1a1a28; --border: #4a4a5e; --border-soft: rgba(255,255,255,0.06);
    --fg-1: #e8e8f0; --fg-2: #c8c8d8; --fg-3: #8a8aa0; --fg-4: #4a4a5a; --accent: #e8b84a; --accent-dim: #7a6030;
    --accent-soft: rgba(232,184,74,0.10); --accent-line: rgba(232,184,74,0.50); --warn: #ff9b4a;
    --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Manrope', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  [hidden] { display: none !important; }
  body { color: var(--fg-2); font-family: var(--sans); font-weight: 300; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  a:hover { border-bottom-color: var(--accent); }

  /* ── top strip ── */
  .top { position: sticky; top: 0; z-index: 20; display: flex; gap: 18px; align-items: center; justify-content: space-between;
    padding: 10px 24px; background: rgba(10,10,15,0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border-soft);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); }
  .top .left, .top .right { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .top button, .top a.btn { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--fg-2); background: none;
    border: 1px solid var(--border); border-radius: 2px; padding: 3px 9px; cursor: pointer; }
  .top button:hover, .top a.btn:hover { border-color: var(--border-hover, var(--accent-line)); color: var(--fg-1); }
  .top button[aria-pressed="true"] { border-color: var(--accent-line); color: var(--accent); }
  .sync { color: var(--fg-3); }
  /* the face switch — the same switch as the reader's: this entry's faces, this one lit */
  .faces { display: flex; gap: 6px; align-items: center; }
  .faces .lbl { color: var(--fg-3); margin-right: 2px; }
  .top .faces a.btn { border-style: dashed; color: var(--fg-3); }
  .top .faces a.btn[aria-current="page"] { border-style: solid; border-color: var(--accent-line); color: var(--accent); cursor: default; }
  .top a.obs { color: var(--fg-3); border-bottom-color: var(--border); }
  .sync b { color: #6bd45a; font-weight: 500; }

  /* ── page ── */
  .page { max-width: 1180px; margin: 0 auto; padding: 0 24px 140px; }
  .head { padding: 48px 0 36px; border-bottom: 1.5px solid var(--border); margin-bottom: 56px; }
  .head .hero { width: 100%; max-height: 440px; object-fit: cover; display: block; border-radius: 2px; margin-bottom: 36px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }
  .head h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2.5rem, 6vw, 4.25rem); line-height: 1.05; letter-spacing: -0.02em; color: var(--fg-1); margin: 0 0 22px; }
  .head .fv { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 22px; line-height: 1.4; color: var(--fg-2); max-width: 760px; margin: 0 0 26px; }
  .head .fv::before { content: 'in its own voice'; display: block; font-family: var(--mono); font-style: normal; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
  .head .meta { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-3); }
  .head .ledger { margin-top: 14px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--fg-3); }
  .head .ledger span + span::before { content: ' · '; color: var(--fg-4); }

  /* ── sections ── */
  section.sec { margin-bottom: 84px; }
  .sec-label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-3);
    padding-bottom: 12px; border-bottom: 1.5px solid var(--border); margin-bottom: 26px; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .sec-label .flags { display: flex; gap: 14px; align-items: baseline; }
  .sec h2 { font-family: var(--serif); font-weight: 300; font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; color: var(--fg-1); margin: 0 0 22px; }
  .row { display: grid; grid-template-columns: minmax(0, 68ch) minmax(240px, 1fr); column-gap: 48px; align-items: start; }
  .row + .row { margin-top: 2px; }
  .prose { font-family: var(--serif); font-size: 17px; line-height: 1.75; color: var(--fg-1); font-weight: 400; letter-spacing: 0.005em; }
  .prose p { margin: 0 0 1em; }
  .prose strong { font-weight: 600; color: #f3f3f8; }
  .prose em { font-style: italic; }
  .prose ul, .prose ol { margin: 0 0 1em; padding-left: 1.3em; }
  .prose li { margin: 0 0 .5em; }
  .prose li::marker { color: var(--accent-dim); }
  .prose code { font-family: var(--mono); font-size: .82em; color: var(--fg-2); background: var(--bg-elev-1); padding: 1px 5px; border-radius: 2px; }
  .prose blockquote { margin: 0 0 1em; padding-left: 16px; border-left: 1.5px solid var(--border); color: var(--fg-2); font-style: italic; }
  .prose a.wl { border-bottom: 1px dotted var(--accent-dim); }
  .margin { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
  .band { margin: 12px 0 40px; display: flex; flex-direction: column; gap: 28px; }
  .band figure.fig:has(.aud) { max-width: 560px; }
  .band figure.fig:has(video) { max-width: 880px; }

  /* ── figures ── */
  figure.fig { margin: 0; }
  .fig .media { border: 1px solid var(--border-soft); border-radius: 2px; background: var(--bg-elev-1); overflow: hidden; }
  .fig video, .fig img { display: block; width: 100%; height: auto; }
  .fig iframe { display: block; width: 100%; border: 0; background: var(--bg); min-height: 360px; }
  .fig .diagram { padding: 28px 16px; display: flex; justify-content: center; background: var(--bg); }
  .fig .diagram svg { max-width: 100%; height: auto; }
  .fig .textpiece { padding: 18px 20px; font-family: var(--serif); font-size: 17px; line-height: 1.65; color: var(--fg-1); background: var(--bg-elev-1); }
  .fig .textpiece p { margin: 0 0 .7em; }
  .fig .textpiece p:last-child { margin-bottom: 0; }
  .fig .textpiece .eq { font-family: var(--serif); font-size: 21px; color: #f3f3f8; }
  .fig .textpiece .words { font-family: var(--sans); font-weight: 300; font-size: 13.5px; line-height: 1.55; color: var(--fg-2); }
  .fig figcaption { margin-top: 10px; font-family: var(--sans); font-weight: 300; font-size: 13.5px; line-height: 1.55; color: var(--fg-2); }
  .fig figcaption p { margin: 0 0 .5em; }
  .fig figcaption strong { color: var(--fg-1); font-weight: 500; }
  .fig .tag { margin-top: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-4); display: flex; flex-wrap: wrap; gap: 10px; }
  .fig .tag .made { color: var(--accent-dim); }
  .fig .also { margin-top: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--fg-3); }
  .fig .also button { font: inherit; color: var(--accent); background: none; border: 0; border-bottom: 1px solid var(--accent-dim); padding: 0; cursor: pointer; }
  .rf-drift { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--warn); margin: 0 0 8px; line-height: 1.5; }
  .rf-drift::before { content: '◐ '; }
  .rf-error { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--warn); margin: 8px 0 0; line-height: 1.5; }
  .rf-error::before { content: '✕ '; }
  /* A file the resolver could not find, in the figure's place: named, never blank. */
  .rf-missing { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--warn); border: 1px dashed var(--warn); border-radius: 2px; padding: 14px 16px; line-height: 1.6; overflow-wrap: anywhere; }
  .rf-missing b { display: block; color: var(--fg-1); font-weight: 500; margin-bottom: 4px; }
  /* A piece's figure: its mark (introduced, pre-contract, errored), the chips
     that say what it uses, and any cap its frame holds it to, named. */
  .rf-chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; }
  .rf-chip { border: 1px solid var(--border); border-radius: 2px; padding: 1px 7px; color: var(--fg-3); }
  .rf-chip[data-state="warn"] { border-color: rgba(255,155,74,0.6); color: var(--warn); }
  .rf-chip[data-state="note"] { border-style: dashed; }
  .rf-mark { color: var(--fg-3); }
  .rf-mark[data-mark="introduced"] { color: var(--accent-dim); }
  .rf-mark[data-mark="errored"] { color: var(--warn); }
  .rf-cap { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--fg-3); padding: 6px 10px; border-top: 1px solid var(--border-soft); line-height: 1.5; }
  .head .rf-local { margin-top: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--warn); }
  .head .rf-local summary { cursor: pointer; }
  .head .rf-local p, .head .rf-local ul { color: var(--fg-3); margin: 8px 0 0; line-height: 1.6; }
  .head .rf-local code { color: var(--fg-2); }
  .rf-tab { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--fg-2); padding: 14px 16px; line-height: 1.6; }
  .rf-tab b { display: block; color: var(--fg-1); font-weight: 500; margin-bottom: 4px; }

  /* ── audio strip (no browser chrome) ── */
  .aud { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; }
  .aud button { width: 34px; height: 34px; border-radius: 2px; border: 1px solid var(--border); background: var(--bg); color: var(--accent); font-size: 13px; cursor: pointer; }
  .aud button:hover { border-color: var(--accent-line); }
  .aud .bar { height: 3px; background: var(--fg-4); position: relative; cursor: pointer; }
  .aud .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
  .aud .lbl { grid-column: 2 / 4; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--fg-3); margin-top: -4px; }
  .aud .t { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }

  /* ── lost, banner, review ── */
  #lost { border-top: 1.5px dashed var(--warn); padding-top: 18px; }
  #lost .sec-label { color: var(--warn); border-bottom-color: rgba(255,155,74,0.35); }
  .banner { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 30; background: var(--bg-elev-2); border: 1px solid var(--warn);
    color: var(--fg-1); font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; padding: 10px 16px; border-radius: 2px; display: flex; gap: 14px; align-items: center; }
  .banner button { font: inherit; color: var(--warn); background: none; border: 1px solid var(--warn); border-radius: 2px; padding: 2px 8px; cursor: pointer; }
  .pin { font-family: var(--mono); font-size: 12px; color: var(--fg-3); background: none; border: 0; cursor: pointer; letter-spacing: 0.1em; padding: 0; }
  .pin.has { color: var(--accent); }
  .rf-note { display: none; margin: -12px 0 24px; }
  .rf-note.open { display: block; }
  .rf-note textarea, #dock textarea { width: 100%; min-height: 72px; resize: vertical; background: var(--bg-elev-1); color: var(--fg-1); border: 1px solid var(--border);
    border-radius: 2px; padding: 10px 12px; font-family: var(--sans); font-weight: 300; font-size: 14px; line-height: 1.5; }
  .rf-note textarea:focus, #dock textarea:focus { outline: none; border-color: var(--accent-line); }
  #dock { position: fixed; right: 18px; bottom: 18px; z-index: 25; width: min(360px, calc(100vw - 36px)); background: var(--bg-elev-2); border: 1px solid var(--border);
    border-radius: 2px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--fg-3); }
  #dock header { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; cursor: pointer; text-transform: uppercase; }
  #dock .body { display: none; padding: 0 12px 12px; }
  #dock.open .body { display: block; }
  #dock .actions { display: flex; gap: 8px; margin-top: 10px; }
  #dock .actions button { flex: 1; font: inherit; text-transform: uppercase; letter-spacing: 0.12em; background: var(--bg); color: var(--fg-2); border: 1px solid var(--border); border-radius: 2px; padding: 7px 8px; cursor: pointer; }
  #dock .actions button.send { color: var(--accent); border-color: var(--accent-line); }
  #dock .msg { margin-top: 8px; letter-spacing: 0.06em; line-height: 1.5; text-transform: none; }

  footer.sig { margin-top: 100px; padding-top: 22px; border-top: 1.5px solid var(--border); display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); }
  footer.sig .wm { font-family: var(--serif); font-size: 18px; letter-spacing: 0.02em; text-transform: none; color: var(--fg-1); }
  footer.sig .wm i { font-weight: 300; }
  .err { font-family: var(--mono); color: var(--warn); padding: 60px 0; }

  @media (max-width: 920px) {
    .row { grid-template-columns: minmax(0, 1fr); }
    .margin { padding-top: 0; margin-bottom: 18px; }
    .top { padding: 10px 16px; }
    .page { padding: 0 16px 140px; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="left"><span>Rich face</span><span class="sync" id="sync">reading the text…</span></div>
  <div class="right">
    <button id="bed" hidden aria-pressed="false" title="the page's room tone, low and looped">room tone ▸</button>
    <a class="obs" id="obs" hidden title="open the entry in Obsidian">obsidian ↗</a>
    <span class="faces" id="faces" hidden><span class="lbl" title="this entry's faces — F cycles">face</span></span>
  </div>
</div>
<div class="page">
  <div class="head" id="head"></div>
  <main id="sections"></main>
  <section class="sec" id="lost" hidden>
    <div class="sec-label"><span>Lost its place</span><span>pieces whose heading is gone</span></div>
    <div class="band" id="lost-body"></div>
  </section>
  <footer class="sig" id="sig"></footer>
</div>
<div class="banner" id="banner" hidden><span>The text's shape changed — sections or figures moved.</span><button id="relay">re-lay the page</button></div>
<div id="dock" hidden>
  <header id="dock-head"><span>◇ Review</span><span id="dock-count">0 notes</span></header>
  <div class="body">
    <div style="margin-bottom:6px;text-transform:uppercase">The whole page</div>
    <textarea id="overall" placeholder="How does the page land as a whole?"></textarea>
    <div class="actions"><button class="send" id="send">Send to STIGMERGY</button><button id="copy">Copy</button></div>
    <div class="msg" id="dock-msg">Leave a note on any section with its ◇. Notes save as you type.</div>
  </div>
</div>

<script type="module" src="_rich/rich.js"></script>
</body>
</html>
