<title>Loud’n Live · Night Signal</title>
<!--
  Loud'n Live · look: NIGHT SIGNAL  (the third complete look; Loudon, 2026-10-25)

  Cyberpunk and electronic music, layered and dirty: Worn Broadcast's bones (Anton, the
  colour fringe, scanlines, grain, the glitch, the sigil, the old board) pushed into a
  city at night and onto a dance floor. Everything that moves keeps one tempo.

  Layers, deepest first
    a night plate (rain on dark glass, neon city bokeh; generated, see below) drifting;
    a shade behind the words; haze; the old circuit board (LL-03 REV C 2049);
    the instruments with a two-radius bloom pass: a TB-303 resonant lowpass sweeping,
    a spectrum analyser kicking with the low end, the sigil in three colours (magenta
    and cyan as a stereo pair, amber behind); a synth panel tilted toward the player,
    six 303 knobs (tuning, cutoff, resonance, env mod, decay, accent) over two octaves
    of keys playing the 303 line; the neon wordmark (LOUD'N magenta, LIVE cyan, one
    tube failing); rain in front at two depths with splashes, drops on the lens;
    dust, scratches, light leaks, a VHS tracking band, heavy grain, hard scanlines.
  Palette
    ground #03030a · magenta #ff2bd6 · cyan #00e5ff · acid #c6ff00 · amber #ffb000 ·
    on air #ff2a2a · label red #b3241c
  Type
    Anton (the neon wordmark, outlined) · Chakra Petch (HUD, chips, knob labels) ·
    IBM Plex Mono (title, label strip) · VT323 (readouts, info strip)
  Motion, on one clock (?bpm=, default 128)
    sidechain pump on every kick (wordmark, bloom, plate, on-air dot, env mod knob);
    a 16-step sequencer and the 303 line on the keys; cutoff knob follows the filter;
    bar.beat counter; the track's waveform with a drop countdown; every eight bars the
    drop: a big inverted tear, datamosh blocks, a shake. Between drops: small tears,
    scrambles, block hits, a stuttering tube.
  The plate
    night-n01: generated with GenAI (Stable Diffusion XL base 1.0, local ComfyUI),
    text to image only, seed 2026102591, no reference image. Prompt and recipe:
    Palace development/Loudon Live Design System/workshop/plates/make_night_plates.py
    and PROVENANCE.md beside it.

  Fill it from the URL (OBS browser source):
    ?bpm=128&session=SESSION%2001&chip=NOW%20PLAYING&topic=WAVETABLE%20SCANNER
    &handle=@ldn&title=live%20build%20·%20scanning%20a%20wavetable%20by%20hand
-->

// neon letters
const wm = card.querySelector('.neonword');
wm.innerHTML = [...'LOUD’N '].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('') + '<span class="live">' + [...'LIVE'].map(c => `<span>${c}</span>`).join('') + '</span>';
const letters = [...wm.querySelectorAll('span:not(.live)')].filter(s => s.textContent.trim());
// one tube is going: it stays dim and buzzes
const sick = letters[2];

// the 303's six knobs: label, colour, and how each one moves
const KNOBS = [['TUNING', '#9ff3ff'], ['CUTOFF', '#c6ff00'], ['RESONANCE', '#c6ff00'], ['ENV MOD', '#ff2bd6'], ['DECAY', '#00e5ff'], ['ACCENT', '#ff2bd6']];
const knobEls = [];
(() => {
  const n = KNOBS.length, gap = 100 / n, R = 6, cy = 8;
  const arc = (cx, a0, a1) => { const p = a => [cx + R * Math.cos(a), cy + R * Math.sin(a)], [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  let svg = '<svg viewBox="0 0 100 19" preserveAspectRatio="xMidYMid meet">';
  KNOBS.forEach(([label, col], i) => {
    const cx = gap * (i + .5);
    svg += `<path class="track" d="${arc(cx, Math.PI * .75, Math.PI * 2.25)}"/><path class="val" stroke="${col}" style="filter:drop-shadow(0 0 .8px ${col})" data-k="${i}"/>` +
           `<circle class="cap" cx="${cx}" cy="${cy}" r="${R * .62}"/><line class="ptr" data-p="${i}" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R * .55}"/>` +
           `<text x="${cx}" y="${cy + R + 3.2}">${label}</text>`;
  });
  card.querySelector('.knobs').innerHTML = svg + '</svg>';
  KNOBS.forEach((_, i) => knobEls[i] = { val: card.querySelector(`.knobs [data-k="${i}"]`), ptr: card.querySelector(`.knobs [data-p="${i}"]`), cx: gap * (i + .5) });
  window.setKnob = (i, v) => {
    const k = knobEls[i], a0 = Math.PI * .75, a = a0 + Math.max(.001, Math.min(1, v)) * Math.PI * 1.5;
    k.val.setAttribute('d', arc(k.cx, a0, a));
    k.ptr.setAttribute('x2', (k.cx + R * .55 * Math.cos(a)).toFixed(2)); k.ptr.setAttribute('y2', (cy + R * .55 * Math.sin(a)).toFixed(2));
  };
})();
// two octaves of keys, C to C; semitone -> key element
const KEYS = card.querySelector('.keys'), WHITE = [0, 2, 4, 5, 7, 9, 11], keyEls = [];
(() => {
  const nW = 15, kw = 100 / nW; let svg = `<svg viewBox="0 0 100 30" preserveAspectRatio="none">`;
  for (let i = 0; i < nW; i++) svg += `<rect class="w" data-s="${Math.floor(i / 7) * 12 + WHITE[i % 7]}" x="${i * kw + .15}" y="0" width="${kw - .3}" height="30" rx=".4"/>`;
  for (let i = 0; i < nW - 1; i++) { const n = WHITE[i % 7]; if (n === 4 || n === 11) continue; svg += `<rect class="b" data-s="${Math.floor(i / 7) * 12 + n + 1}" x="${(i + 1) * kw - kw * .3}" y="0" width="${kw * .6}" height="18" rx=".3"/>`; }
  KEYS.innerHTML = svg + '</svg>';
  KEYS.querySelectorAll('rect').forEach(r => keyEls[+r.dataset.s] = r);
})();
card.querySelector('.steps').innerHTML = Array.from({ length: 16 }, (_, i) => `<i class="${i % 4 === 0 ? 'k' : ''}"></i>`).join('');

// canvases
const C = n => { const cv = card.querySelector('canvas.' + n); return { cv, ctx: cv.getContext('2d') }; };
const fx = C('fx'), bloom = C('bloom'), rain = C('rain'), dirt = C('dirt'), haze = C('haze'), grainC = C('grain');
let W, H;
function size() {
  const r = card.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 1.5);
  W = Math.round(r.width * d); H = Math.round(r.height * d);
  for (const c of [fx, rain, dirt]) { c.cv.width = W; c.cv.height = H; }
  bloom.cv.width = W / 2; bloom.cv.height = H / 2;
  paintDirt(); paintHaze();
}
function paintHaze() {
  const { ctx } = haze, img = ctx.createImageData(64, 36);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random(); const m = Math.random() < .5; img.data[i] = m ? 120 * v : 20; img.data[i + 1] = 20 * v; img.data[i + 2] = m ? 160 * v : 120 * v; img.data[i + 3] = 255 * v * v; }
  ctx.putImageData(img, 0, 0);
}
function paintDirt() {
  const { ctx } = dirt; ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < 900; i++) { ctx.fillStyle = `rgba(255,255,255,${.15 + Math.random() * .6})`; const s = Math.random() < .9 ? 1 : 2.5; ctx.fillRect(Math.random() * W, Math.random() * H, s, s); }
  ctx.lineWidth = 1;
  for (let i = 0; i < 40; i++) { const x = Math.random() * W, y = Math.random() * H, l = (.1 + Math.random() * .5) * H; ctx.strokeStyle = `rgba(255,255,255,${.05 + Math.random() * .12})`; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + (Math.random() - .5) * 30, y + l / 2, x + (Math.random() - .5) * 20, y + l); ctx.stroke(); }
  for (let i = 0; i < 14; i++) { const x = Math.random() * W, y = Math.random() * H, r = (.05 + Math.random() * .15) * W; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,240,220,.07)'); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
}
size(); addEventListener('resize', size);

// rain: far, near, splashes; lens droplets
const far = Array.from({ length: 320 }, () => ({ x: Math.random(), y: Math.random(), l: .03 + Math.random() * .05, s: .9 + Math.random() * .6 }));
const near = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random(), l: .12 + Math.random() * .2, s: 1.6 + Math.random(), w: 1.6 + Math.random() * 2.4 }));
const lens = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), r: .004 + Math.random() * .016, vy: Math.random() < .3 ? .01 + Math.random() * .03 : 0, hue: Math.random() < .5 ? '255,43,214' : '0,229,255' }));
const splashes = [];

const ACID = [[0,1,0],[0,0,0],[12,0,1],[0,0,0],[3,1,0],[0,0,1],[7,0,0],[0,0,0],[0,1,0],[10,0,1],[0,0,0],[5,0,0],[0,1,0],[12,0,1],[3,0,0],[0,0,0]];
const ARR = Array.from({ length: 256 }, (_, i) => { const bar = i / 8; const sec = bar < 8 ? .35 : bar < 16 ? .35 + .5 * (bar - 8) / 8 : bar < 24 ? 1 : .3; return sec * (.55 + .45 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .37))); });

function liss(ctx, cx, cy, R, ph, col, alpha, lw, a = 3, b = 5, n = 700) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const s = i / n * Math.PI * 2; const x = cx + R * Math.sin(a * s + ph), y = cy + R * Math.sin(b * s); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.strokeStyle = col; ctx.globalAlpha = alpha; ctx.lineWidth = lw; ctx.stroke(); ctx.globalAlpha = 1;
}

function drawFx(t, pump, step, beat) {
  const ctx = fx.ctx; ctx.clearRect(0, 0, W, H);
  // spectrum, low bins kicking
  const n = 44, x0 = W * .5, bw = W * .44 / n, base = H * .8;
  for (let i = 0; i < n; i++) {
    const low = Math.max(0, 1 - i / 9), v = .12 + .45 * Math.abs(Math.sin(t * (1.2 + i * .23) + i)) * (1 - i / n * .6) + low * .6 * pump;
    ctx.fillStyle = i < 10 ? 'rgba(255,43,214,.32)' : 'rgba(0,229,255,.22)';
    ctx.fillRect(x0 + i * bw, base - v * H * .32, bw * .6, v * H * .32);
  }
  // the 303 filter, wide and faint behind the sigil
  const acc = ACID[step][1], fc = 180 * Math.pow(2, 3.4 + 1.6 * Math.sin(t * .35) + acc * .9 * pump), Q = 7;
  window.FC = fc;
  ctx.beginPath();
  for (let i = 0; i <= 260; i++) {
    const fr = 20 * Math.pow(1000, i / 260), r = fr / fc, mag = 1 / Math.sqrt((1 - r * r) ** 2 + (r / Q) ** 2);
    const db = Math.max(-36, Math.min(18, 20 * Math.log10(mag)));
    const x = W * .46 + W * .5 * i / 260, y = H * .62 - (db + 36) / 54 * H * .42;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.strokeStyle = 'rgba(198,255,0,.75)'; ctx.lineWidth = W / 520; ctx.stroke();
  card.querySelector('.cut').textContent = Math.round(fc);
  // the sigil: amber behind, magenta and cyan as a stereo pair, swelling on the kick
  const R = H * (.24 + .03 * pump), cx = W * .69, cy = H * .38, ph = t * .45;
  liss(ctx, cx + W * .008, cy + H * .01, R * 1.04, ph - .2, '#ffb000', .55, W / 700);
  liss(ctx, cx, cy, R, ph, '#ff2bd6', .95, W / 420);
  liss(ctx, cx + W * .005, cy, R, ph + .09, '#00e5ff', .85, W / 560);
  // the track along the bottom
  const X0 = W * .06, X1 = W * .94, Y = H * .925, A = H * .04, bars = 32, pos = (beat / 4) % bars, head = X0 + (X1 - X0) * pos / bars;
  for (let i = 0; i < ARR.length; i++) { const x = X0 + (X1 - X0) * i / ARR.length, a = ARR[i] * A; ctx.fillStyle = x < head ? 'rgba(0,229,255,.9)' : 'rgba(0,229,255,.25)'; ctx.fillRect(x, Y - a, (X1 - X0) / ARR.length * .7, a * 2); }
  const xd = X0 + (X1 - X0) * 16 / bars; ctx.fillStyle = '#ffb000'; ctx.fillRect(xd, Y - A * 1.6, Math.max(1, W / 1100), A * 3.2);
  ctx.font = `${Math.round(W / 110)}px "Chakra Petch", sans-serif`; ctx.fillText('DROP', xd + 5, Y - A * 1.7);
  ctx.fillStyle = '#fff'; ctx.fillRect(head, Y - A * 1.6, Math.max(2, W / 650), A * 3.2);
  card.querySelector('.drop').textContent = Math.ceil((16 - pos + bars) % bars) + ' BARS';
  // bloom: a blurred copy, screened over
  const b = bloom.ctx; b.clearRect(0, 0, bloom.cv.width, bloom.cv.height);
  b.filter = `blur(${Math.round(W / 140)}px)`; b.drawImage(fx.cv, 0, 0, bloom.cv.width, bloom.cv.height);
  b.filter = `blur(${Math.round(W / 50)}px)`; b.globalAlpha = .8; b.drawImage(fx.cv, 0, 0, bloom.cv.width, bloom.cv.height); b.globalAlpha = 1; b.filter = 'none';
}

function drawRain(t, dt) {
  const ctx = rain.ctx; ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(190,225,255,.28)'; ctx.lineWidth = Math.max(1, W / 1500);
  for (const d of far) { d.y += dt * d.s * 1.6; if (d.y > 1.05) { d.y = -.08; d.x = Math.random(); } const x = (d.x + d.y * .08) * W, y = d.y * H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + d.l * .08 * W * .3, y + d.l * H); ctx.stroke(); }
  for (const d of near) {
    d.y += dt * d.s * 1.7; if (d.y > 1.1) { d.y = -.3; d.x = Math.random(); if (Math.random() < .7) splashes.push({ x: d.x + .1 * .08, t: 0 }); }
    const x = (d.x + d.y * .1) * W, y = d.y * H, g = ctx.createLinearGradient(x, y, x, y + d.l * H);
    g.addColorStop(0, 'rgba(220,240,255,0)'); g.addColorStop(1, 'rgba(220,240,255,.55)');
    ctx.strokeStyle = g; ctx.lineWidth = d.w * W / 1600; ctx.shadowColor = 'rgba(0,229,255,.6)'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + d.l * .1 * W * .3, y + d.l * H); ctx.stroke(); ctx.shadowBlur = 0;
  }
  for (let i = splashes.length - 1; i >= 0; i--) { const s = splashes[i]; s.t += dt * 4; if (s.t > 1) { splashes.splice(i, 1); continue; } ctx.strokeStyle = `rgba(220,240,255,${.5 * (1 - s.t)})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(s.x * W, H * .985, s.t * W * .012, s.t * H * .006, 0, Math.PI, 0); ctx.stroke(); }
  // lens drops: dark rim, a neon tint, a highlight; some slide and leave a trail
  for (const d of lens) {
    if (d.vy) { d.y += dt * d.vy; if (d.y > 1.05) { d.y = -.05; d.x = Math.random(); } ctx.strokeStyle = 'rgba(200,230,255,.08)'; ctx.lineWidth = d.r * W * .5; ctx.beginPath(); ctx.moveTo(d.x * W, d.y * H); ctx.lineTo(d.x * W, (d.y - .12) * H); ctx.stroke(); }
    const x = d.x * W, y = d.y * H, r = d.r * W, g = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(.25, `rgba(${d.hue},.22)`); g.addColorStop(.8, 'rgba(10,10,20,.25)'); g.addColorStop(1, 'rgba(255,255,255,.2)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  // a fresh film scratch or two
  if (Math.random() < .35) { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; const x = Math.random() * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (Math.random() - .5) * 6, H); ctx.stroke(); }
}

const gimg = grainC.ctx.createImageData(400, 225);
function grain() { const d = gimg.data; for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = v; d[i + 1] = v * .92; d[i + 2] = v; d[i + 3] = 255; } grainC.ctx.putImageData(gimg, 0, 0); }

// glitches
const layer = card.querySelector('.layer'), tearEl = card.querySelector('.tear');
const GLYPHS = '▓▒░█▌▐#%&@$';
function tear(big) {
  tearEl.innerHTML = layer.innerHTML;
  const top = Math.random() * 85, h = 2 + Math.random() * (big ? 16 : 7), dx = (Math.random() - .5) * (big ? 9 : 4);
  tearEl.style.clipPath = `inset(${top}% 0 ${Math.max(0, 100 - top - h)}% 0)`;
  tearEl.style.transform = `translateX(${dx}cqw)`;
  tearEl.style.filter = big ? 'invert(1) hue-rotate(180deg)' : 'hue-rotate(90deg) brightness(1.4)';
  tearEl.classList.add('on'); card.style.setProperty('--split', big ? '1.6cqw' : '.8cqw');
  setTimeout(() => { tearEl.classList.remove('on'); card.style.setProperty('--split', '.35cqw'); }, big ? 200 : 90);
}
function blocks() {
  for (let i = 0; i < 7; i++) {
    const b = document.createElement('div'); b.className = 'block';
    Object.assign(b.style, { left: Math.random() * 90 + '%', top: Math.random() * 90 + '%', width: 4 + Math.random() * 18 + '%', height: 2 + Math.random() * 8 + '%' });
    card.appendChild(b); setTimeout(() => b.remove(), 90 + Math.random() * 140);
  }
}
function shake() { let n = 0; const iv = setInterval(() => { card.style.transform = `translate(${(Math.random() - .5) * 10}px, ${(Math.random() - .5) * 6}px)`; if (++n > 6) { clearInterval(iv); card.style.transform = ''; } }, 30); }
function scramble() {
  const el = layer.querySelector('.scramble'), orig = el.dataset.o || (el.dataset.o = el.textContent); let n = 0;
  const iv = setInterval(() => { el.textContent = [...orig].map(ch => ch !== ' ' && Math.random() < .25 ? GLYPHS[Math.random() * GLYPHS.length | 0] : ch).join(''); if (++n > 6) { clearInterval(iv); el.textContent = orig; } }, 45);
}

let last = performance.now() / 1000, lastBeat = -1, lastBar = -1, fno = 0;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(.05, now - last); last = now;
  const t = now - T0, beat = t / SPB, ph = beat % 1, bar = Math.floor(beat / 4), step = Math.floor(beat * 4) % 16;
  const pump = reduce ? 0 : Math.exp(-ph * 5);
  card.style.setProperty('--pump', pump.toFixed(3));
  card.querySelector('.pos').textContent = `${String(bar % 999 + 1).padStart(3, '0')}.${Math.floor(beat % 4) + 1}`;
  card.querySelectorAll('.steps i').forEach((e, i) => e.classList.toggle('on', i === step));
  keyEls.forEach(k => k && k.classList.remove('lit', 'acc', 'kick'));
  const [note, acc] = ACID[step], held = (beat * 4) % 1 < .7;
  if (held && keyEls[note]) { keyEls[note].classList.add('lit'); if (acc) keyEls[note].classList.add('acc'); }
  if (pump > .5 && keyEls[24]) keyEls[24].classList.add('kick');
  drawFx(t, pump, step, beat);
  setKnob(0, .5);
  setKnob(1, Math.log2((window.FC || 800) / 180) / 6.5);
  setKnob(2, .86);
  setKnob(3, .45 + .45 * pump);
  setKnob(4, .5 + .3 * Math.sin(t * .2));
  setKnob(5, ACID[step][1] ? .85 : .35);
  if (!reduce) drawRain(t, dt);
  // the sick tube buzzes every frame; the rest stutter now and then
  sick.classList.toggle('dim', Math.random() < .55);
  sick.classList.toggle('off', Math.random() < .12);
  if (!reduce && Math.floor(beat) !== lastBeat) {
    lastBeat = Math.floor(beat);
    if (bar !== lastBar) { lastBar = bar; if (bar % 8 === 0 && bar > 0) { tear(true); blocks(); shake(); } }
    const r = Math.random();
    if (r < .18) tear(false); else if (r < .26) scramble(); else if (r < .32) blocks();
    if (Math.random() < .3) { const s = letters[Math.random() * letters.length | 0]; if (s !== sick) { s.classList.add('off'); setTimeout(() => s.classList.remove('off'), 80 + Math.random() * 150); } }
  }
  if (fno++ % 2 === 0) grain();
  requestAnimationFrame(frame);
}
frame();

</script>
</body>
</html>
