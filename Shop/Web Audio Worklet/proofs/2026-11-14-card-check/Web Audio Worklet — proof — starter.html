<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Audio Worklet — starter</title>
<meta name="piece:needs" content="">
<link rel="stylesheet" href="../../../../_ops/loudon-live/design-system/colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--fg-2); font-family: var(--mono); }
  main { padding: var(--s-5) var(--s-5) var(--s-6); display: grid; gap: var(--s-4); max-width: 40rem; }
  h1 { margin: 0; font-size: 1rem; font-weight: 500; color: var(--fg-1); }
  button { justify-self: start; font: inherit; color: var(--fg-1); background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--s-2) var(--s-4); cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  label { display: flex; gap: var(--s-3); align-items: center; color: var(--fg-3); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Web Audio Worklet starter — one sine, my own process()</h1>
  <button id="sound" aria-pressed="false">Sound: off</button>
  <label>pitch <input id="pitch" type="range" min="110" max="440" step="1" value="220"> <output id="hz">220 Hz</output></label>
</main>
<script>
// The DSP. Inside the worklet scope sampleRate is a bare global; cache 1/sampleRate once.
const WORKLET = `
class StarterSine extends AudioWorkletProcessor {
  constructor() {
    super();
    this.phase = 0; this.hz = 220; this.target = 220; this.inv = 1 / sampleRate;
    this.port.onmessage = (e) => { if (typeof e.data.hz === 'number') this.target = e.data.hz; };
  }
  process(inputs, outputs) {
    const out = outputs[0], L = out[0], R = out[1] || out[0];   // a mono host gets one channel; no throw
    for (let i = 0; i < L.length; i++) {
      this.hz += (this.target - this.hz) * 0.002;                // glide, so a pitch move never clicks
      this.phase += this.hz * this.inv; if (this.phase >= 1) this.phase -= 1;
      const s = 0.2 * Math.sin(2 * Math.PI * this.phase);
      L[i] = s; R[i] = s;
    }
    return true;
  }
}
registerProcessor('starter-sine', StarterSine);
`;

const btn = document.getElementById('sound');
const pitch = document.getElementById('pitch');
const hz = document.getElementById('hz');
let ctx = null, node = null;

async function build() {
  ctx = new AudioContext();                                       // made on the click, never before
  const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  node = new AudioWorkletNode(ctx, 'starter-sine', { numberOfInputs: 0, outputChannelCount: [2] });   // stereo, place one
  const comp = ctx.createDynamicsCompressor();                     // cheap insurance when voices swell
  node.connect(comp).connect(ctx.destination);
  node.port.postMessage({ hz: +pitch.value });
}

btn.addEventListener('click', async () => {
  const on = btn.getAttribute('aria-pressed') !== 'true';
  if (on) { if (!ctx) await build(); await ctx.resume(); }
  else if (ctx) await ctx.suspend();
  btn.setAttribute('aria-pressed', String(on));
  btn.textContent = on ? 'Sound: on' : 'Sound: off';
});

pitch.addEventListener('input', () => {
  hz.textContent = pitch.value + ' Hz';
  if (node) node.port.postMessage({ hz: +pitch.value });
});
</script>
</body>
</html>
