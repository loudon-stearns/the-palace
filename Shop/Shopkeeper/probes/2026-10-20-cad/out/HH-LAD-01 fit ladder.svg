  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" id="text">
    <rect x="55.95" y="-141.925" width="12.1" height="3.85" fill="#f0eee5" transform="rotate(-35.0 62.0 -140.0)"/>
    <text x="62.0" y="-140.0" font-size="3.5" fill="#1a1916" text-anchor="middle" dominant-baseline="central" transform="rotate(-35.0 62.0 -140.0)">Ø63.2</text>
    <text x="36" y="-96" font-size="2.5" fill="#1a1916" text-anchor="start">ring 1: 1 notch · 0.1 a side</text>
    <rect x="141.95" y="-141.925" width="12.1" height="3.85" fill="#f0eee5" transform="rotate(-35.0 148.0 -140.0)"/>
    <text x="148.0" y="-140.0" font-size="3.5" fill="#1a1916" text-anchor="middle" dominant-baseline="central" transform="rotate(-35.0 148.0 -140.0)">Ø63.4</text>
    <text x="122" y="-96" font-size="2.5" fill="#1a1916" text-anchor="start">ring 2: 2 notches · 0.2 a side</text>
    <rect x="227.95" y="-141.925" width="12.1" height="3.85" fill="#f0eee5" transform="rotate(-35.0 234.0 -140.0)"/>
    <text x="234.0" y="-140.0" font-size="3.5" fill="#1a1916" text-anchor="middle" dominant-baseline="central" transform="rotate(-35.0 234.0 -140.0)">Ø63.6</text>
    <text x="208" y="-96" font-size="2.5" fill="#1a1916" text-anchor="start">ring 3: 3 notches · 0.3 a side</text>
    <text x="17" y="-186" font-size="3.0" fill="#1a1916" text-anchor="start">FROM ABOVE   1:1     each ring is 4 tall, 2 wall; the notches are 1 deep</text>
    <text x="17" y="-78.0" font-size="2.5" fill="#1a1916" text-anchor="start">ring  notches  a side  bore     outside</text>
    <text x="17" y="-74.125" font-size="2.5" fill="#1a1916" text-anchor="start">1  1 notch    0.1   Ø63.2   Ø67.2</text>
    <text x="17" y="-70.25" font-size="2.5" fill="#1a1916" text-anchor="start">2  2 notches  0.2   Ø63.4   Ø67.4</text>
    <text x="17" y="-66.375" font-size="2.5" fill="#1a1916" text-anchor="start">3  3 notches  0.3   Ø63.6   Ø67.6</text>
    <text x="17" y="-59.5" font-size="2.5" fill="#1a1916" text-anchor="start">Push each ring onto the motor's rotor by hand. Keep the tightest</text>
    <text x="17" y="-55.625" font-size="2.5" fill="#1a1916" text-anchor="start">that still slides on and does not rock; write its clearance into</text>
    <text x="17" y="-51.75" font-size="2.5" fill="#1a1916" text-anchor="start">CAP reg_clear in handwheel_dims.py, and the cap redraws.</text>
    <text x="17" y="-47.875" font-size="2.5" fill="#1a1916" text-anchor="start">The bore rests on Ø63 ±0.05 from the page; printers shrink holes,</text>
    <text x="17" y="-44.0" font-size="2.5" fill="#1a1916" text-anchor="start">which is why this is three rings and not one number.</text>
    <text x="25" y="-24.0" font-size="2.5" fill="#2b5fb0" text-anchor="start">DATASHEET</text>
    <text x="49" y="-24.0" font-size="2.5" fill="#1a1916" text-anchor="start">read from the maker's page</text>
    <text x="25" y="-19.8" font-size="2.5" fill="#1a1916" text-anchor="start">DESIGN</text>
    <text x="49" y="-19.8" font-size="2.5" fill="#1a1916" text-anchor="start">chosen for this probe; change it in the source</text>
    <text x="25" y="-15.6" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">MEASURE</text>
    <text x="49" y="-15.6" font-size="2.5" fill="#1a1916" text-anchor="start">not known: calipers, then the source</text>
    <text x="159.5" y="-39.5" font-size="4.2" fill="#1a1916" text-anchor="start">HAPTIC HANDWHEEL · FIT LADDER</text>
    <text x="159.5" y="-35.6" font-size="2.5" fill="#1a1916" text-anchor="start">three register rings: the calipers' question, asked of the printer</text>
    <text x="159.5" y="-27.5" font-size="2.5" fill="#1a1916" text-anchor="start">No. HH-LAD-01   ·   scale 1:1   ·   mm</text>
    <text x="159.5" y="-23.6" font-size="2.5" fill="#1a1916" text-anchor="start">SKETCH · printable</text>
    <text x="159.5" y="-16.5" font-size="2.2" fill="#1a1916" text-anchor="start">source  handwheel_dims.py LADDER</text>
    <text x="159.5" y="-12.5" font-size="2.2" fill="#1a1916" text-anchor="start">drawn   2026-10-20</text>
    <text x="224.5" y="-16.5" font-size="2.2" fill="#1a1916" text-anchor="start">Shopkeeper probe · Sketch</text>
    <text x="224.5" y="-12.5" font-size="2.2" fill="#1a1916" text-anchor="start">build123d 0.13 · OCCT</text>
  </g>
