    <text x="17" y="-78.0" font-size="2.5" fill="#1a1916" text-anchor="start">THE PAGE GIVES</text>
    <text x="17" y="-74.125" font-size="2.5" fill="#1a1916" text-anchor="start">mass 209 g ±0.5 · runout ≤ 0.1</text>
    <text x="17" y="-70.25" font-size="2.5" fill="#1a1916" text-anchor="start">read 2026-10-20, iFlight GM5208-12 page</text>
    <text x="17" y="-63.375" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">THE PAGE DOES NOT GIVE  (MEASURE)</text>
    <text x="17" y="-59.5" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">· rotor-top bolt pattern: count, thread, circle</text>
    <text x="17" y="-55.625" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">· base bolt pattern: count, thread, circle</text>
    <text x="17" y="-51.75" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">· how much of the 30.7 turns (the rotor bell)</text>
    <text x="17" y="-47.875" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">· how far the hollow shaft stands above the rotor</text>
    <text x="17" y="-44.0" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">· the rotor's top edge: square, chamfer or round</text>
    <text x="17" y="-37.125" font-size="2.5" fill="#1a1916" text-anchor="start">An envelope for fitting parts to, not the motor: where the rotor</text>
    <text x="17" y="-33.25" font-size="2.5" fill="#1a1916" text-anchor="start">ends, the bolt holes and the shaft's ends are not drawn because</text>
    <text x="17" y="-29.375" font-size="2.5" fill="#1a1916" text-anchor="start">nobody has measured them.</text>
    <text x="25" y="-24.0" font-size="2.5" fill="#2b5fb0" text-anchor="start">DATASHEET</text>
