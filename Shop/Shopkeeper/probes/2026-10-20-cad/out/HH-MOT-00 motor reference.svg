    <text x="49" y="-19.8" font-size="2.5" fill="#1a1916" text-anchor="start">chosen for this probe; change it in the source</text>
    <text x="25" y="-15.6" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">MEASURE</text>
    <text x="49" y="-15.6" font-size="2.5" fill="#1a1916" text-anchor="start">not known: calipers, then the source</text>
