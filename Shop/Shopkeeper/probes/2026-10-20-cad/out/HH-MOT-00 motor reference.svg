    <text x="52" y="-88" font-size="3.0" fill="#1a1916" text-anchor="start">SIDE  (shaft hidden, drawn flush and through)   2:1</text>
    <text x="214" y="-108" font-size="3.0" fill="#1a1916" text-anchor="start">FROM ABOVE   1:1</text>
