    <text x="32.0" y="-179.0" font-size="3.0" fill="#1a1916" text-anchor="start">FROM ABOVE   1:1</text>
    <text x="253.0" y="-165.5" font-size="3.5" fill="#1a1916" text-anchor="start" dominant-baseline="central" transform="rotate(-90.0 253.0 -165.5)">8</text>
    <text x="165" y="-140" font-size="3.0" fill="#1a1916" text-anchor="start">SECTION ON THE AXIS   1:1</text>
    <text x="17" y="-70.0" font-size="2.5" fill="#1a1916" text-anchor="start">1  A flat plate under the GM5208-12. Every number here is DESIGN,</text>
    <text x="17" y="-66.125" font-size="2.5" fill="#1a1916" text-anchor="start">   chosen for this test; change it in build_mount.py and it redraws.</text>
    <text x="17" y="-62.25" font-size="2.5" fill="#1a1916" text-anchor="start">2  The bore passes the Ø15 hollow shaft (DATASHEET) with 0.5 a side.</text>
    <text x="17" y="-58.375" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">3  HOLD: the motor's base bolt pattern is not on the iFlight page</text>
    <text x="17" y="-54.5" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">   (read 2026-10-20). No motor holes, no STL, until it is measured.</text>
    <text x="17" y="-50.625" font-size="2.5" fill="#1a1916" text-anchor="start">4  The four Ø4.5 holes fix the plate to the bench; M4 clearance.</text>
    <text x="25" y="-24.0" font-size="2.5" fill="#2b5fb0" text-anchor="start">DATASHEET</text>
    <text x="49" y="-24.0" font-size="2.5" fill="#1a1916" text-anchor="start">read from the maker's page</text>
    <text x="25" y="-19.8" font-size="2.5" fill="#1a1916" text-anchor="start">DESIGN</text>
    <text x="49" y="-19.8" font-size="2.5" fill="#1a1916" text-anchor="start">chosen for this probe; change it in the source</text>
    <text x="25" y="-15.6" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">MEASURE</text>
    <text x="49" y="-15.6" font-size="2.5" fill="#1a1916" text-anchor="start">not known: calipers, then the source</text>
    <text x="159.5" y="-39.5" font-size="4.2" fill="#1a1916" text-anchor="start">HAPTIC HANDWHEEL · MOUNT BLOCK</text>
    <text x="159.5" y="-35.6" font-size="2.5" fill="#1a1916" text-anchor="start">a flat plate: bore, four bench holes, motor holes on HOLD</text>
    <text x="159.5" y="-27.5" font-size="2.5" fill="#1a1916" text-anchor="start">No. HH-MNT-01   ·   scale 1:1   ·   mm</text>
    <text x="159.5" y="-23.6" font-size="2.5" fill="#c8261a" text-anchor="start" font-weight="700">SKETCH · HOLD: base bolt pattern unmeasured</text>
    <text x="159.5" y="-16.5" font-size="2.2" fill="#1a1916" text-anchor="start">source  build_mount.py MOUNT</text>
